# `po fuel watch --country togo`. Schema and checks: src/fuel/watch.py.
# Triage lane 2026-10-16: manual+alerta. levels: the hand-curated table in configs/_manual/.
# gpp.products names the product in OUR table for each GPP product (REFERENCE ONLY).
country: togo
currency: XOF
levels:
  paths:
  - src/fuel/configs/_manual/togo_levels.yaml
  stale_months: 6
broken_after: 3
lookback_days: 10
gpp:
  slug: Togo
  name: Togo
  products:
    gasoline: Super sans plomb
    diesel: Gas-oil
  move_pct: 3
  diverge_pct: 5
  diverge_runs: 3
  max_age_days: 45
pages:
- id: commerce_wp_petrol
  url: https://commerce.gouv.tg/wp-json/wp/v2/posts?search=produits%20p%C3%A9troliers
  mode: urls
  match: petrol|carburant|prix
news:
- q: prix carburant Togo
  hl: fr
  gl: TG
- q: Togo arrêté interministériel prix produits pétroliers
  hl: fr
  gl: TG
must:
- togo
- lome
- togolais
keywords:
- prix du carburant
- prix des carburants
- prix carburant
- prix a la pompe
- prix du super
- prix du gasoil
- prix de l'essence
- produits petroliers
- supercarburant
- gasoil
- hausse du prix
- baisse du prix
- carburant
