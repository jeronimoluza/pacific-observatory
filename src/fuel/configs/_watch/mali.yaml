# `po fuel watch --country mali`. Schema and checks: src/fuel/watch.py.
# Triage lane 2026-10-16: manual+alerta. levels: the hand-curated table in configs/_manual/.
# gpp.products names the product in OUR table for each GPP product (REFERENCE ONLY).
country: mali
currency: XOF
levels:
  paths:
  - src/fuel/configs/_manual/mali_levels.yaml
  stale_months: 6
broken_after: 3
lookback_days: 10
gpp:
  slug: Mali
  name: Mali
  products:
    gasoline: Supercarburant sans plomb
    diesel: Gasoil
  move_pct: 3
  diverge_pct: 5
  diverge_runs: 3
  max_age_days: 45
pages:
- id: amap_home
  allow_empty: true
  url: https://amap.ml/
  mode: links
  match: carburant|hydrocarbure|prix|gasoil|omap
news:
- q: prix carburant Mali
  hl: fr
  gl: ML
- q: OMAP prix plafond carburant
  hl: fr
  gl: ML
must:
- mali
- bamako
- omap
- onap
keywords:
- prix du carburant
- prix des carburants
- prix carburant
- prix a la pompe
- prix du super
- prix du gasoil
- prix de l'essence
- produits petroliers
- supercarburant
- gasoil
- hausse du prix
- baisse du prix
- carburant
