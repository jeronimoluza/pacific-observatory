    hl: ar
    gl: SD
  - q: 'Sudan fuel prices gallon'
    hl: en
    gl: SD
must: ['sudan', 'السودان', 'khartoum', 'port sudan']
keywords: [fuel, petrol, diesel, gasoline, gallon, الوقود, البنزين, الجازولين]
