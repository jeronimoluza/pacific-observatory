# `po fuel watch --country burkina_faso`. Schema and checks: src/fuel/watch.py.
# Triage lane 2026-10-16: manual+alerta. levels: the hand-curated table in configs/_manual/.
# gpp.products names the product in OUR table for each GPP product (REFERENCE ONLY).
country: burkina_faso
currency: XOF
levels:
  paths:
  - src/fuel/configs/_manual/burkina_faso_levels.yaml
  stale_months: 6
broken_after: 3
lookback_days: 10
gpp:
  slug: Burkina-Faso
  name: Burkina Faso
  products:
    gasoline: Super 91
    diesel: Gasoil
  move_pct: 3
  diverge_pct: 5
  diverge_runs: 3
  max_age_days: 45
pages:
- id: sidwaya_feed
  allow_empty: true
  url: https://www.sidwaya.info/feed/
  mode: urls
  match: carburant|hydrocarbure|gasoil|prix-du-super|sonabhy
- id: sonabhy_tarif
  url: https://www.sonabhy.bf/tarif-hydrocarbures/
  mode: text
