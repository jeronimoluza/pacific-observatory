- {iso3: IND, product: Diesel, regime: dual, adjust_freq: adhoc, subsidy_note: 'No fiscal consumer subsidy on petrol/diesel; state-run OMCs absorbed under-recoveries (Rs 2.18 lakh crore cumulative, July 2026) and are now recovering them by holding prices.', evidence_url: 'https://www.freepressjournal.in/business/petrol-diesel-price-cut-not-feasible-now-amid-218-lakh-crore-omc-under-recoveries-union-petroleum-minister-hardeep-singh-puri-video', evidence_sha256: 4b252e9c3767528a09ae5a3f84369728dff6a4296b6c29c85bf91b66eb14b308, evidence_quote: 'Consumers expecting a reduction in petrol and diesel prices may have to wait longer, as Union Petroleum and Natural Gas Minister Hardeep Singh Puri on Thursday said there is no justification for lowering retail fuel prices at this stage.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Formally deregulated (2010/2014) but state-owned OMCs hold retail prices under government guidance; only ad hoc moves (e.g. Rs 3/l hike May 2026) and 8-9 changes/365d, so not Market. Evidence is a July 2026 news report of the minister''s statement; no October 2026 statement found, but daily price pages show unchanged Delhi prices through mid-October. | replaces override row: market subsidy=False'}
