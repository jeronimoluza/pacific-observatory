- {iso3: SRB, product: Diesel, regime: ceiling, adjust_freq: weekly, subsidy_note: '20% excise reduction (tax measure); farmer diesel tier at NIS stations at a decree-set 184 din/L (borne by NIS, not fiscal).', evidence_url: 'https://biznis.rs/vesti/srbija/bez-promena-cena-goriva/', evidence_sha256: 96d5582c681002b6bdcc4e5c016de0236238717ec5f861abaa47aa3d55ee7d37, evidence_quote: 'U narednih sedam dana maksimalna maloprodajna cena evrodizela biće 236 dinara za litar, a benzina 207 dinara za litar.', confidence: medium, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'Under the Uredba o ograničenju visine cena derivata nafte (amended through Sl. glasnik 60/26), Serbia still publishes a maximum retail price for eurodiesel every Friday for the next 7 days; this cap ran to 16 Oct 2026. The regime stays ceiling, but adjust_freq changes from weekly_biweekly to weekly. That the decree was extended beyond mid-October is not confirmed. | replaces wb2024 row: ceiling subsidy=False'}
