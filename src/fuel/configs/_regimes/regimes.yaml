- {iso3: GHA, product: Diesel, regime: floor, adjust_freq: biweekly, subsidy_note: 'No fiscal subsidy found for the Oct-16 window. Diesel had a GH¢2/l regulatory-margin cut (Aug 4 to end-Sep 2026); Oct measures were a TOR/Sentuo refinery price hold and a D-Levy suspension (tax cut), neither a fiscal subsidy.', price_basis: floor, evidence_url: 'https://www.myjoyonline.com/petrol-diesel-prices-set-to-fall-from-oct-16-as-lpg-faces-18-5-hike/', evidence_sha256: d78131622ed466c9002a72947471661a6ec824bf5164e2dc0197f80ef57c0be2, evidence_quote: The diesel price floor has also been reduced from GH¢17.97 to GH¢17.09 per litre., confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Same fortnightly NPA ex-pump floor as petrol. Subsidy set false but borderline: the GH¢2/l margin cut (called a subsidy in the press) expired end-Sep; the October relief came from a state-refinery price hold plus D-Levy suspension for Oct-Nov, which are a quasi-fiscal hold and a tax cut. | replaces override row: market subsidy=False'}
- {iso3: GHA, product: Gasoline, regime: floor, adjust_freq: biweekly, subsidy_note: 'No fiscal subsidy found for the Oct-16 window. Diesel had a GH¢2/l regulatory-margin cut (Aug 4 to end-Sep 2026); Oct measures were a TOR/Sentuo refinery price hold and a D-Levy suspension (tax cut), neither a fiscal subsidy.', price_basis: floor, evidence_url: 'https://www.myjoyonline.com/petrol-diesel-prices-set-to-fall-from-oct-16-as-lpg-faces-18-5-hike/', evidence_sha256: d78131622ed466c9002a72947471661a6ec824bf5164e2dc0197f80ef57c0be2, evidence_quote: The National Petroleum Authority (NPA) has also reduced the minimum prices for petrol and diesel for the October 16 pricing window., confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'NPA sets an ex-pump price floor every pricing window (1st and 16th); OMCs set pump prices above it, adding IOTC premiums, BIDEC and OMC margins. The regime applies to the floor, not the pump. Evidence is Joy Business news, not an NPA notice; floor policy reportedly dates to April 2024 but no decree date found, so valid_from is null. | replaces override row: market subsidy=False'}
- {iso3: GHA, product: Kerosene, regime: floor, adjust_freq: biweekly, subsidy_note: 'No kerosene subsidy found (premix, a separate product, stays subsidised).', price_basis: floor, evidence_url: 'https://www.myjoyonline.com/npa-revises-fuel-price-floors-for-august-4-15-pricing-window/', evidence_sha256: 472bf56a9b2b40fb9a6ef6f6fb680eed786871ed05f4c908a3ed9fb14bac2916, evidence_quote: 'Marine Gas Oil (MGO Local) has been set at GH¢16.08 per litre, while kerosene will sell at a minimum of GH¢14.46 per litre.', confidence: low, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Kerosene was in the NPA floor notice for the Aug 4-15, 2026 window (and May 2026 per GBC), but Oct-16 window reports mention only petrol, diesel and LPG. So it is likely, but not confirmed, that the floor still covers kerosene now. | replaces override row: market subsidy=False'}
- {iso3: GHA, product: LPG, regime: floor, adjust_freq: biweekly, subsidy_note: 'No LPG subsidy found; LPG floor rose 25% for the Oct-16 window, with pump prices forecast up 18.5%.', price_basis: floor, evidence_url: 'https://www.myjoyonline.com/petrol-diesel-prices-set-to-fall-from-oct-16-as-lpg-faces-18-5-hike/', evidence_sha256: d78131622ed466c9002a72947471661a6ec824bf5164e2dc0197f80ef57c0be2, evidence_quote: 'The LPG price floor, however, has increased from GH¢11.10 to GH¢13.87 per kilogram.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The NPA floor covers LPG (per kg) in the Oct-16 window; LPG marketing companies set prices above it. Evidence is news, not an NPA notice. | replaces override row: market subsidy=False'}
