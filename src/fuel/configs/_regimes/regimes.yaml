- {iso3: RUS, product: Diesel, regime: dual, adjust_freq: free, subsidy: true, subsidy_note: Damper payments cover diesel as well as gasoline., evidence_url: 'https://www.themoscowtimes.com/2026/08/06/russia-weighs-new-gasoline-export-ban-to-tame-rising-domestic-prices-izvestia', evidence_sha256: d9f67603b4c88ea7dd7d091f8fba1426e781083275bafe1cd14dcc9518e672dc, evidence_quote: 'These subsidies, known as damper payments, are designed to offset losses when domestic fuel prices are lower than export prices.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Same mechanism as gasoline: freely set retail prices (45 changes/yr) steered by the damper and state pressure, so dual rather than Price Control. The article is about gasoline; that the damper also covers diesel is background knowledge, not stated in the quote. | replaces override row: dual subsidy=True'}
- {iso3: RUS, product: Gasoline, regime: dual, adjust_freq: free, subsidy: true, subsidy_note: Damper (reverse-excise) payments to refiners offset the gap between domestic and export prices; repeated export bans in 2026., evidence_url: 'https://www.themoscowtimes.com/2026/08/06/russia-weighs-new-gasoline-export-ban-to-tame-rising-domestic-prices-izvestia', evidence_sha256: d9f67603b4c88ea7dd7d091f8fba1426e781083275bafe1cd14dcc9518e672dc, evidence_quote: 'These subsidies, known as damper payments, are designed to offset losses when domestic fuel prices are lower than export prices.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Retail prices are formally free and change often (60-101 times/yr) but the state steers them via damper subsidies, export bans and pressure on station margins (Novak, Aug 2026): WB pseudo-regulated = dual, not an administered price. No legal retail cap found; the ''planned regional ceiling'' workbook signal could not be confirmed. Export-ban status for Oct 2026 not confirmed. | replaces override row: dual subsidy=True'}
