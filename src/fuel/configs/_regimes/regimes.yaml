- {iso3: CRI, product: Gasoline, regime: formula, adjust_freq: monthly, subsidy: true, subsidy_note: 'No consumer subsidy on gasoline; ARESEP passes import costs through (only sector cross-subsidies, e.g. fishing fleet, exist)', evidence_url: 'https://delfino.cr/2026/10/aresep-aprueba-aumentos-en-combustibles-diesel-subira-97-y-gasolina-super-38', evidence_sha256: dd1890d14c6e69130020940271e79c93b4b0639c969fa47f35abd98be4fd25eb, evidence_quote: 'Aresep recordó que la metodología tarifaria considera variables como los precios internacionales, el tipo de cambio, los impuestos y otros componentes establecidos en la normativa', confidence: low, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'ARESEP sets prices by formula (methodology RE-0024-JD-2022) through monthly extraordinary resolutions. 15-16 observed changes per year fits monthly better than weekly_biweekly. The quote supports the formula but does not itself say ''monthly''; that comes from the monthly resolution series. subsidy=true looks wrong for gasoline, but the cross-subsidy claim is from background knowledge, not a fetched page. | editor: confidence lowered; the quote supports the ARESEP formula only, not the monthly cycle. subsidy kept as in WB 2024 (true): the proposal to set it false had no fetched source | replaces wb2024 row: formula subsidy=True'}
