- {iso3: GEO, product: Diesel, regime: market, adjust_freq: free, subsidy_note: No regulation or subsidy., evidence_url: 'https://data.autobridge.ge/en/reports/july-fuel-reversal', evidence_sha256: 5d3672062fe5570508f363b3f8565c67d0e0cbf8099d0fe0783f35f9ab256a18, evidence_quote: Wissol raised all listed grades by 5 tetri the same day; Gulf raised its diesel grades by 10 tetri, confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Diesel price changes are chain-specific in size and timing, which points to market pricing. The low observed change count (6/yr) is weak evidence against this. | replaces wb2024 row: market subsidy=False'}
- {iso3: GEO, product: Gasoline, regime: market, adjust_freq: free, subsidy_note: No regulation or subsidy; chains set their own board prices (cartel fine history)., evidence_url: 'https://data.autobridge.ge/en/reports/july-fuel-reversal', evidence_sha256: 5d3672062fe5570508f363b3f8565c67d0e0cbf8099d0fe0783f35f9ab256a18, evidence_quote: 'Instead, pump prices at major branded chains rose through July, with a further 5–10 tetri increase reported on 31 July — at Gulf it was the third change of the month.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Branded chains (Wissol, Gulf, SOCAR, Rompetrol, Lukoil) change prices on their own at different times and amounts, so this is market pricing. Few observed changes (7-8/yr) probably reflect the scraped chain or the sampling, plus oligopolistic price-following. The source is an analytics blog, not an official page. | replaces wb2024 row: market subsidy=False'}
