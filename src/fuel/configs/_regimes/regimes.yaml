- {iso3: MDA, product: Diesel, regime: ceiling, adjust_freq: daily, subsidy_note: No subsidy; ANRE maximum retail prices computed by methodology from import quotations., evidence_url: 'https://www.bnm.md/ro/print/content/produsele-petroliere-republica-moldova-formarea-si-evolutia-preturilor-maxime-de', evidence_sha256: 47c4d37e92d3093d30415b14e93304e5d2bd82f4fa9a62d2d5edf41ab3f39023, evidence_quote: 'Prețurile maxime de comercializare cu amănuntul a produselor petroliere principale de tip standard (benzină 95 și motorină) sunt calculate și publicate în fiecare zi lucrătoare (până la ora 12:00)', confidence: high, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'A National Bank of Moldova note (13 Feb 2026) says ANRE computes and publishes binding maximum retail prices for diesel every working day, and logos-pres reports ANRE caps still being published in Aug 2026. The regime stays ceiling, but adjust_freq changes from weekly_biweekly to daily. 50 observed changes/yr fits retailers moving below a daily cap. | replaces wb2024 row: ceiling subsidy=False'}
