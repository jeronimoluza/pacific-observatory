- {iso3: VNM, product: Kerosene, valid_from: '2026-04-29', regime: market, adjust_freq: free, subsidy_note: No base price or stabilisation-fund use for kerosene since 29 Apr 2026., evidence_url: 'https://moit.gov.vn/tin-tuc/thong-bao/mot-so-thong-tin-ve-viec-dieu-hanh-gia-xang-dau-ngay-10-9.html', evidence_sha256: b1852b89f7a57ca14fe9dd111897c37e98222fc5b0731e421021e66773f791fc, evidence_quote: dầu hỏa không còn là mặt hàng nhà nước công bố giá cơ sở, confidence: high, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'MOIT Circular 21/2026/TT-BCT removed kerosene from the products for which the state announces a base price, effective 29 Apr 2026, so the Market badge is correct. The carry_forward=true flag on the source is inconsistent with this and should probably be turned off. The observed weekly changes are retailers following the market. | valid_from per https://moit.gov.vn/tin-tuc/thong-bao/mot-so-thong-tin-ve-viec-dieu-hanh-gia-xang-dau-ngay-10-9.html (sha256 b1852b89f7a5): "Thông tư số 21/2026/TT-BCT ngày 28/4/2026 (có hiệu lực thi hành từ ngày 29/4/2026)"'}
- {iso3: VNM, product: LPG, regime: market, adjust_freq: free, subsidy_note: No consumer LPG subsidy found., evidence_url: 'https://thoibaotaichinhvietnam.vn/gia-gas-ban-le-thang-10-2026-tang-manh-204655.html', evidence_sha256: 7005593ffec340dcb394675db0e94dcfd583ead7f9fa7bd377b085c9d8d12a53, evidence_quote: 'Đây là một trong những cơ sở để các đơn vị nhập khẩu, kinh doanh LPG tính toán chi phí đầu vào và xây dựng giá bán trong nước.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Importers and distributors set LPG prices themselves from the monthly Saudi CP, and brands moved by different amounts in Oct 2026 (Pacific Petro left its price unchanged). That fits market pricing. The evidence is a news article; the quote describes companies building their own prices but does not cite a regulation. | replaces override row: market subsidy=False'}
