- {iso3: KOR, product: Diesel, valid_from: '2026-03-13', regime: ceiling, adjust_freq: monthly, subsidy: true, subsidy_note: 'Government compensates refiners'' losses under the cap from the budget (KRW5tn purpose reserve; settlement committee launched Jul 2026). Fuel-tax cuts (gasoline 15%, diesel 25%) run in parallel to end-Nov 2026.', price_basis: wholesale, evidence_url: 'https://news.mtn.co.kr/news-detail/2026091815501079238', evidence_sha256: e7b61c30bd016d308402775c4faae5bd7f126df3a2ec064afe0c6172cc54d688, evidence_quote: '휘발유는 리터당 1784원, 경유 1773원, 등유 1380원으로 9차 최고가격과 같다.', confidence: medium, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'Diesel wholesale maximum price is KRW1,773/L (10th cap, frozen). The cap applies to refiners'' supply (wholesale) price, not station prices (Newsis 27 Jul 2026: ''정유사의 도매가에 상한을 두는 최고가격제''), so stations price freely below it. That fits ''ceiling enforced at wholesale with fiscal compensation''. The cap is reset every 4 weeks; the 10th cap ran from 19 Sep 2026 for 4 weeks, so the 11th decision was due around 16-17 Oct 2026 and was not found. | editor: the cap binds the refiners'' supply price, not the pump; valid_from day is from the article (''13일부터''), year/month from its March-2026 date | valid_from per https://m.seoul.co.kr/news/2026/03/12/20260312500275 (sha256 4f987d47c5a2): "1997년 유가 자유화 이후 처음으로 ‘석유 최고가격제’를 13일부터 전격 시행한다."'}
