- {iso3: MEX, product: Gasoline, valid_from: '2025-02-27', regime: dual, adjust_freq: adhoc, subsidy_note: 'Weekly IEPS excise stimulus (about 64% for regular in 10-16 Oct 2026) is tax relief, not a below-cost subsidy', evidence_url: 'https://www.elimparcial.com/dinero/2026/08/31/sheinbaum-extiende-seis-meses-el-acuerdo-con-gasolineros-para-contener-precios-de-magna-y-diesel-y-reducir-presion-sobre-el-gasto-familiar', evidence_sha256: 495613a32b1e4a3f3d36611adc7b83127319b3b0a67f9dab5979561538aa2241, evidence_quote: El compromiso establece que la gasolina regular o Magna se mantenga en un precio menor a 24 pesos por litro en las estaciones participantes, confidence: medium, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'A voluntary government-retailer pact, renewed 31-Aug-2026 for six months, keeps regular gasoline under MXN 24/L. The same article says it is not a legally binding maximum, so this is state steering (dual), not a ceiling. Pick ''ceiling'' only if the dashboard treats a voluntary cap as binding. 2-4 observed changes per year fits ad hoc steering. | valid_from per https://www.elimparcial.com/dinero/2026/08/31/sheinbaum-extiende-seis-meses-el-acuerdo-con-gasolineros-para-contener-precios-de-magna-y-diesel-y-reducir-presion-sobre-el-gasto-familiar (sha256 495613a32b1e): "La Estrategia Nacional para Promover la Estabilización del Precio de la Gasolina comenzó el 27 de febrero de 2025"'}
