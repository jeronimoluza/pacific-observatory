- {iso3: VNM, product: Diesel, regime: ceiling, adjust_freq: weekly, subsidy_note: 'The stabilisation fund exists, but it drew 0 VND/L on diesel in the 10 Sep 2026 cycle (it varies cycle by cycle; diesel got VND4,000/L in Mar 2026). Tax cuts alone are not counted.', evidence_url: 'https://moit.gov.vn/tin-tuc/thong-bao/mot-so-thong-tin-ve-viec-dieu-hanh-gia-xang-dau-ngay-10-9.html', evidence_sha256: b1852b89f7a57ca14fe9dd111897c37e98222fc5b0731e421021e66773f791fc, evidence_quote: 'Dầu điêzen 0.05S: không cao hơn 28.485 đồng/lít (tăng 742 đồng/lít so với giá bán tối đa hiện hành)', confidence: high, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'Diesel is under the same weekly MOIT-MOF maximum-retail-price regime. The 56-57 changes a year reflect weekly cycles, so this is not market behaviour. Subsidy is set false because the latest official cycle found (10 Sep 2026) shows zero fund disbursement for diesel. That could flip in later cycles; no October notice was found. | replaces override row: ceiling subsidy=True'}
- {iso3: VNM, product: Gasoline, regime: ceiling, adjust_freq: weekly, subsidy: true, subsidy_note: Petroleum Price Stabilisation Fund (advanced from the state budget) disbursed VND500/L on biofuel gasoline in the 10 Sep 2026 cycle; environmental-protection-tax cuts run in parallel (tax only)., evidence_url: 'https://moit.gov.vn/tin-tuc/thong-bao/mot-so-thong-tin-ve-viec-dieu-hanh-gia-xang-dau-ngay-10-9.html', evidence_sha256: b1852b89f7a57ca14fe9dd111897c37e98222fc5b0731e421021e66773f791fc, evidence_quote: 'Xăng E10RON95-III: không cao hơn 24.239 đồng/lít (tăng 965 đồng/lít so với giá bán tối đa hiện hành)', confidence: high, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The MOIT-MOF joint notice sets a maximum retail price (''không cao hơn''), and traders set prices at or below it. Cycles run weekly (3 Sep to 10 Sep 2026). The regime stays ceiling; only adjust_freq is refined from weekly_biweekly to weekly. The fund drew VND500/L on gasoline in that cycle. | replaces override row: ceiling subsidy=True'}
