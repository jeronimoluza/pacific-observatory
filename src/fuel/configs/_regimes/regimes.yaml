- {iso3: GTM, product: Diesel, regime: market, adjust_freq: free, subsidy_note: Decreto 22-2026 suspends IVA and IDP on fuels from 1-Oct to 31-Dec-2026 (tax exemption only); Decreto 21-2026 price-cap/subsidy law was vetoed, evidence_url: 'https://emisorasunidas.com/nacional/2026/09/30/publican-ley-exonera-impuestos-combustibles/', evidence_sha256: baca201f0cf12fdcd9d752ab4d02e56e43bddd797030170ea366c19a975bdd38, evidence_quote: 'Combustibles: Arévalo sanciona ley que exonera impuestos y veta la que fijaba precios tope', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Same as gasoline: the Decreto 21-2026 price cap was vetoed, and only a temporary IVA/IDP exemption is in force, so diesel stays market. | replaces wb2024 row: market subsidy=False'}
- {iso3: GTM, product: Gasoline, regime: market, adjust_freq: free, subsidy_note: Decreto 22-2026 suspends IVA and IDP on fuels from 1-Oct to 31-Dec-2026 (tax exemption only); Decreto 21-2026 price-cap/subsidy law was vetoed, evidence_url: 'https://emisorasunidas.com/nacional/2026/09/30/publican-ley-exonera-impuestos-combustibles/', evidence_sha256: baca201f0cf12fdcd9d752ab4d02e56e43bddd797030170ea366c19a975bdd38, evidence_quote: 'Combustibles: Arévalo sanciona ley que exonera impuestos y veta la que fijaba precios tope', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The workbook''s Decreto 21-2026 price cap (Q39/Q41 per gallon) never took effect: President Arévalo vetoed it, and the veto was published 30-Sep-2026. What is in force is a temporary tax exemption, which does not make the regime non-market. The earlier Decreto 11-2026 subsidy is marked inactive. Mark the Decreto 21-2026 workbook row as vetoed. | replaces wb2024 row: market subsidy=False'}
