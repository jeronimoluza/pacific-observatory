- {iso3: BOL, product: LPG, valid_from: '2026-01-13', regime: administered, adjust_freq: frozen, subsidy: true, subsidy_note: 'DS 5534 (31-Jan-2026) builds a -1,18 Bs/kg discount into the GLPR chain and pays YPFB 0,70 Bs/kg via NOCRES for 10 kg garrafas for up to 6 months; DS 5652 (Jul-2026) is reported to keep the GLP price and fund YPFB''s differential.', price_basis: 'GLP 2,25 Bs/kg (22,50 Bs per 10 kg garrafa), unchanged since 2005', evidence_url: 'https://www.infobae.com/america/2026/07/13/bolivia-congela-el-precio-del-combustible-por-seis-meses-en-medio-de-la-crisis-de-abastecimiento-y-calidad/', evidence_sha256: 30af6818d9c5963ed6a79753feaf9e1f6911bdb3512b6c8c395b1e9dec3c680c, evidence_quote: 'El Decreto Supremo 5652 establece que los precios del diésel, la gasolina, el gas natural vehicular (GNV), el gas licuado de petróleo (GLP) y las gasolinas de aviación se mantendrán por un periodo de seis meses', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'DS 5516 Art. 2 II h) states GLP 2,25 Bs/Kg ''conserva su precio'' and excludes LPG from the stabilisation. DS 5534 (https://estaticos.unitel.bo/binrepository/ds55341999ncpp-1_101-14373606_20260203014853.pdf) subsidises it for up to 6 months, which would have lapsed around Jul-2026; that DS 5652 continued it comes from news coverage, not the decree text. The price itself has been frozen since 2005; valid_from marks the current instrument (DS 5516). | valid_from per https://s1.boliviaimpuestos.com/img/2026/01/24154524/Decreto_Supremo_5516.pdf (sha256 5d3b90c87f1f): "Es dado en el Palacio de Gobierno, a los trece días del mes de enero del año dos mil veintiséis."'}
