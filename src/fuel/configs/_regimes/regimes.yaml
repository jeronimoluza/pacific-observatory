- {iso3: THA, product: Diesel, regime: dual, adjust_freq: adhoc, subsidy: true, subsidy_note: Oil Fuel Fund subsidy on diesel cut from 5-6 baht/L at the peak to about 2-3 baht/L (Oct 2026); fund deficit >100bn baht; diesel excise cut under consideration., evidence_url: 'https://www.nationthailand.com/business/40071947', evidence_sha256: 8e1c3859f0e49738adaad4bde9f0e052c1787211db9bba3f754917af69e530a0, evidence_quote: Thailand’s Oil Fuel Fund has begun scaling back diesel support as its deficit has passed 100 billion baht, confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Diesel is now 42.94 baht/L (9 Oct 2026), far above the earlier 30-35 baht cap, so no binding ceiling is in force. Prices move in Fund-committee-driven steps via state-controlled PTT OR and Bangchak while the Fund still subsidises about 2-3 baht/L. That makes it dual (pseudo-regulated) with ad hoc changes rather than ceiling/monthly. | replaces override row: ceiling subsidy=True'}
- {iso3: THA, product: Gasoline, regime: dual, adjust_freq: adhoc, subsidy: true, subsidy_note: Oil Fuel Fund subsidises oil products (daily payouts cut from ~700m to ~375m baht by Oct 2026; deficit >100bn baht); its precise per-litre support on gasoline/gasohol was not confirmed., evidence_url: 'https://www.nationthailand.com/business/40071947', evidence_sha256: 8e1c3859f0e49738adaad4bde9f0e052c1787211db9bba3f754917af69e530a0, evidence_quote: 'The Fuel Fund Executive Committee’s latest increase of 0.75 baht a litre in all fuel prices reduced the fund’s daily subsidy burden by 100–200 million baht, the ministry source said.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Pump prices are formally set by PTT OR (state-controlled) and Bangchak, but the moves are steered by Oil Fuel Fund committee decisions (+0.75 baht on 2 Oct and 9 Oct 2026). That is WB-style pseudo-regulation, not a binding retail cap. Gasoline subsidy is weakly evidenced: the source says the increase on ''all fuel prices'' cut the subsidy burden, but it gives no per-litre gasoline figure. | replaces override row: ceiling subsidy=True'}
