- {iso3: TUR, product: Gasoline, valid_from: '2026-10-01', regime: market, adjust_freq: free, subsidy_note: 'Eşel mobil (SCT buffer) ended 1 Oct 2026; ÖTV is being restored in monthly steps (Oct 7.90, Nov 11.36, Dec 14.8277 TL/L), which is a temporary tax reduction, not a subsidy.', evidence_url: 'https://www.ekonomigazetesi.com/sektor-haberleri/esel-mobil-uygulanmasi-sona-erdi-88737', evidence_sha256: 300158c2c8b6f7dc2d90314d3932f00759519b3e73f6e93b26c81bc926fb7561, evidence_quote: Akaryakıt fiyatlarındaki küresel dalgalanmaları ve kur hareketlerini tüketiciye yansıtmamak amacıyla uygulanan eşel mobil sistemi 1 Ekim itibarıyla sona erdi., confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The FPSM/eşel mobil that justified the Price Control override was ended by a Presidential Decree published in the Resmi Gazete, effective 1 Oct 2026. Türkiye goes back to its free pricing system (distributors follow refinery prices), which fits about 40 changes/yr. Source is news reporting the decree, not the gazette itself.'}
