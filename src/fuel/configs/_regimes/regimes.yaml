- {iso3: PRY, product: LPG, regime: market, adjust_freq: free, subsidy_note: 'No fiscal LPG subsidy; state-owned Petropar (about 10% LPG share) delayed passing through the May-2026 rise, which is not a fiscal subsidy.', evidence_url: 'https://www.abc.com.py/economia/2026/05/12/suba-del-gas-asi-se-distribuye-el-mercado-del-glp-en-paraguay/', evidence_sha256: ea6aec7456b9a4347ea2d773d85b08fb6a0cb09b4d3837f68c4b45f8b413d079, evidence_quote: 'Tras estos ajustes, la garrafa de 10 kilos aumentó alrededor de G. 5.000, ubicándose actualmente entre G. 110.000 y G. 125.000, dependiendo de la marca y la distancia de distribución.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'ABC Color (12-May-2026) says private bottlers (Capagas) set LPG prices that vary by brand. Petropar holds only 10.03% of LPG sales, behind Copesa, Petrobras and Gas Corona, so its state price is not dominant enough to call this dual. Petropar''s own site has no 2026 LPG price posts. No newer (Jun-Oct 2026) properly dated source was found. | replaces wb2024 row: market subsidy=False'}
