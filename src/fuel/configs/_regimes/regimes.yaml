- {iso3: BRA, product: Diesel, valid_from: '2026-09-27', regime: dual, adjust_freq: free, subsidy: true, subsidy_note: 'Federal road-diesel subvention to producers/importers of R$2.12/L (R$1.12 from May + R$1 from Sep), extended 30 days from 27-Sep-2026 by Ministry of Finance portaria', evidence_url: 'https://www.dgabc.com.br/Noticia/4349240/governo-prorroga-subvencao-ao-diesel-em-rs-2-12-por-litro-por-30-dias', evidence_sha256: a1495a1b2db2737d0351d209fd5dda710237e410a79b973aedfa3358f906eba0, evidence_quote: 'O governo federal prorrogou por 30 dias a subvenção ao óleo diesel em R$ 2,12 por litro.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Regime stays dual (formally free retail, Petrobras-steered), but the subsidy flag is wrong: a per-litre diesel subvention is in force now. It runs 30 days, so roughly to 26-Oct-2026 (Gazeta do Povo, not fetched), and may be extended again; valid_from is the start date of this extension, not of the first subsidy (Mar-2026). | valid_from per https://www.dgabc.com.br/Noticia/4349240/governo-prorroga-subvencao-ao-diesel-em-rs-2-12-por-litro-por-30-dias (sha256 a1495a1b2db2): "A portaria entra em vigor neste domingo, 27 de setembro."'}
