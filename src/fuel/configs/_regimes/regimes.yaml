- {iso3: MEX, product: Diesel, regime: dual, adjust_freq: adhoc, subsidy_note: 'Diesel IEPS stimulus at 100% (excise fully waived) in Oct 2026: a tax waiver, not a below-cost subsidy', evidence_url: 'https://www.elimparcial.com/dinero/2026/08/31/sheinbaum-extiende-seis-meses-el-acuerdo-con-gasolineros-para-contener-precios-de-magna-y-diesel-y-reducir-presion-sobre-el-gasto-familiar', evidence_sha256: 495613a32b1e4a3f3d36611adc7b83127319b3b0a67f9dab5979561538aa2241, evidence_quote: La Procuraduría Federal del Consumidor (Profeco) había informado desde el 20 de agosto que el convenio se extendería seis meses y que también contempla un precio menor a 27 pesos por litro para el diésel, confidence: medium, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'Diesel is covered by the renewed voluntary pact (under MXN 27/L; it was 28 when introduced in Apr-2026), so it is dual like gasoline, and not market. No decree date was found for when diesel was added, so valid_from is null. Whether the full IEPS waiver counts as a subsidy is a judgement call; it is set to false because it is tax relief. | replaces wb2024 row: market subsidy=False'}
