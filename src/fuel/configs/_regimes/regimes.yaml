- {iso3: NIC, product: Gasoline, regime: administered, adjust_freq: frozen, subsidy: true, subsidy_note: Government withholds the formula adjustments weekly; with 2026 oil prices the state absorbs the gap (subsidy status not quantified), evidence_url: 'https://canal6.com.ni/gobierno-mantiene-sin-variacion-los-precios-de-las-gasolinas-y-el-diesel/', evidence_sha256: 8ffa4377d445569c0aa6a4f2ba16449f5e9fe9205c37ded36c3d8006de78de60, evidence_quote: 'los ajustes que se requieran no serán aplicados, manteniéndose los precios locales de los combustibles gasolinas y diésel sin variación, para beneficio de las Familias nicaragüenses', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'A joint INE/Ministry of Energy communique dated 16-Oct-2026 keeps gasoline and diesel prices unchanged for 18-24 Oct, and has done so weekly; 0 changes per year confirms. That is a government freeze (administered/frozen), not dual. Start date is uncertain: La Prensa says Apr-2022, the override comment says May-2025. In Feb-2026 La Prensa argued the frozen price was above parity; subsidy=true is kept only because of the 2026 oil spike, so it is weak. | replaces override row: dual subsidy=True'}
