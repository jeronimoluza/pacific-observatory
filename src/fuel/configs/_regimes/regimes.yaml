- {iso3: ARM, product: Gasoline, regime: market, adjust_freq: free, subsidy_note: No price regulation or subsidy; the competition commission monitors the market., evidence_url: 'https://armenpress.am/en/article/1261701', evidence_sha256: 3b3686d655ed3e386479da268d13602d40c3df94e035366df09cdb3efec0f509, evidence_quote: 'By the end of September, regular petrol prices at some filling stations had reached 600 drams, while premium petrol prices had exceeded 620 drams.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'An Armenpress piece from 30 Sep 2026 describes station-level prices that follow international prices, under competition-commission scrutiny but with no regulated price. The low change count (1-10/yr) reflects a concentrated importer oligopoly with sticky prices, not regulation. No source states ''not regulated'' outright; that comes from the absence of any regulation. | replaces wb2024 row: market subsidy=False'}
