- {iso3: BOL, product: Diesel, valid_from: '2026-09-19', regime: formula, adjust_freq: band, subsidy_note: 'DS 5716 replaced the subsidised fixed 9,80 Bs/L with import parity pricing; the excess over the DS 5516 margin chain goes to YPFB, so no consumer subsidy.', price_basis: 'Diésel Oíl final regulated price incl. IVA, initially 17,95 Bs/L, import parity (Argus ULSD Gulf Coast) with +/-5% band', evidence_url: 'https://eju.tv/wp-content/uploads/2026/09/DS57162100NCPP-1.pdf', evidence_sha256: 7c6d7d12b69688f3bae61cc9187bad06b0f2d5f68ef107ab201037f411cde9e8, evidence_quote: 'resulta necesario sustituir, para el Diésel Oíl, el precio final fijo previsto en el Decreto Supremo N° 5516, de 13 de enero de 2026, por un régimen de Precio de Paridad de Importación – PPI, preservando para los demás productos el régimen vigente.', confidence: high, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'DS 5716 (signed 18-Sep-2026) replaces the fixed DS 5516 diesel price with a PPI formula: the ANH computes the reference price daily on business days and changes it only when it moves outside a +/-5% band (Art. 4), so adjustments are band-triggered. The decree takes effect on publication and does not state the date; 19-Sep-2026 comes from Rio Times (news), not the Gaceta. DS 5741 (5-Oct-2026, reportedly FX conversion only) was not verified. | valid_from per https://www.riotimesonline.com/bolivia-fuel-tanker-drivers-deal-diesel-2026/ (sha256 95214ac5a2c1): "In force from Saturday 19 September, it ended the fixed, subsidised diesel price."'}
- {iso3: BOL, product: Gasoline, regime: administered, adjust_freq: frozen, subsidy: true, confidence: medium, provenance: override, note: _publish/lac.yaml override; subtype and adjust_freq from WB 2024 codes}
- {iso3: BOL, product: Gasoline, valid_from: '2026-01-13', regime: administered, adjust_freq: frozen, subsidy: true, subsidy_note: DS 5652 (Jul-2026) extended the price freeze and authorised up to Bs 1.000 millones to YPFB to cover the import-cost differential; price below import parity., price_basis: 'Gasolina Especial 6,96 Bs/L incl. taxes (DS 5516); Premium 11,00 Bs/L', evidence_url: 'https://www.infobae.com/america/2026/07/13/bolivia-congela-el-precio-del-combustible-por-seis-meses-en-medio-de-la-crisis-de-abastecimiento-y-calidad/', evidence_sha256: 30af6818d9c5963ed6a79753feaf9e1f6911bdb3512b6c8c395b1e9dec3c680c, evidence_quote: 'El Decreto Supremo 5652 establece que los precios del diésel, la gasolina, el gas natural vehicular (GNV), el gas licuado de petróleo (GLP) y las gasolinas de aviación se mantendrán por un periodo de seis meses', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'DS 5503 (Dec-2025) subsidy removal was abrogated by DS 5516 (13-Jan-2026), which fixed Gasolina Especial at 6,96 Bs/L; DS 5652 (Jul-2026, reported by Infobae, decree text not found) extended the freeze ~6 more months to Jan-2027, and Rio Times reports YPFB said on 21-Sep-2026 the gasoline price was unchanged. valid_from is DS 5516''s signing/Gaceta date (Gaceta N° 1988, 13-Jan-2026); the freeze end date (Jan-2027) is not stated exactly, so valid_to is null. | valid_from per https://s1.boliviaimpuestos.com/img/2026/01/24154524/Decreto_Supremo_5516.pdf (sha256 5d3b90c87f1f): "Es dado en el Palacio de Gobierno, a los trece días del mes de enero del año dos mil veintiséis."'}
- {iso3: BOL, product: Kerosene, regime: administered, adjust_freq: frozen, subsidy: true, confidence: medium, provenance: override, note: _publish/lac.yaml override; subtype and adjust_freq from WB 2024 codes}
- {iso3: BOL, product: Kerosene, valid_from: '2026-01-13', regime: administered, adjust_freq: frozen, subsidy: true, subsidy_note: 'Fixed price kept below parity under the DS 5516/5652 freeze; there is no kerosene-specific subsidy instrument, so this is inferred.', price_basis: 'Kerosene 5,64 Bs/L fixed by DS 5516 Art. 2 II e)', evidence_url: 'https://eju.tv/wp-content/uploads/2026/09/DS57162100NCPP-1.pdf', evidence_sha256: 7c6d7d12b69688f3bae61cc9187bad06b0f2d5f68ef107ab201037f411cde9e8, evidence_quote: 'resulta necesario sustituir, para el Diésel Oíl, el precio final fijo previsto en el Decreto Supremo N° 5516, de 13 de enero de 2026, por un régimen de Precio de Paridad de Importación – PPI, preservando para los demás productos el régimen vigente.', confidence: low, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'DS 5516 fixed kerosene at 5,64 Bs/L. DS 5716 (Sep-2026) moved only diesel to import parity and expressly kept ''el régimen vigente'' for the other products, so kerosene stays at an administered fixed price. The subsidy=true is inferred (freeze below parity, YPFB differential funding) with no kerosene-specific source; news on DS 5652 does not name kerosene. | editor: confidence lowered; no source names a kerosene subsidy (inferred from the DS 5652 freeze funding) | valid_from per https://s1.boliviaimpuestos.com/img/2026/01/24154524/Decreto_Supremo_5516.pdf (sha256 5d3b90c87f1f): "Es dado en el Palacio de Gobierno, a los trece días del mes de enero del año dos mil veintiséis."'}
