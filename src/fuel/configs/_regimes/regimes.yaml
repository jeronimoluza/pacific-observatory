- {iso3: PAK, product: Diesel, valid_from: '2026-07-18', regime: formula, adjust_freq: daily, subsidy_note: No general consumer subsidy; petroleum levy applies. Targeted relief programme does not lower the pump price., evidence_url: 'https://www.radio.gov.pk/17-07-2026/ogra-to-determine-petroleum-prices-on-daily-basis', evidence_sha256: 6a52240435fc31bdf99b6993b77b3868885abbaac657c735a2e2dd60bd9f8229, evidence_quote: authorizing the Oil and Gas Regulatory Authority (OGRA) to determine prices of petroleum products on a daily basis in line with international market trends., confidence: high, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Same daily OGRA pricing mechanism as petrol since 18 July 2026; 51-77 observed changes/365d consistent with weekly-then-daily revisions; Oct 15, 2026 HSD moved Rs 0.17/l. | valid_from per https://profit.pakistantoday.com.pk/2026/07/18/petrol-price-hiked-by-rs544-diesel-surges-rs3105-under-new-daily-pricing-regime (sha256 c269289b0b8c): "The revised prices will remain effective from July 18 to July 20, 2026, due to the weekend holidays."'}
