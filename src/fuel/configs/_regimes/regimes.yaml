- {iso3: TUR, product: Diesel, regime: market, adjust_freq: free, subsidy_note: Diesel ÖTV was put on a staged restoration in August 2026; eşel mobil ended for all fuels by 1 Oct 2026., evidence_url: 'https://www.ekonomigazetesi.com/sektor-haberleri/esel-mobil-uygulanmasi-sona-erdi-88737', evidence_sha256: 300158c2c8b6f7dc2d90314d3932f00759519b3e73f6e93b26c81bc926fb7561, evidence_quote: 'Enflasyonla mücadele ve piyasadaki ani fiyat şoklarını engellemek için benzinde vergi artışı, ağustosta motorin için yapılan düzenlemeye benzer şekilde aylara bölündü.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The article says diesel came off the eşel mobil buffer with a monthly staged ÖTV restoration in August 2026, so diesel is back to free pricing (45 changes/yr). I found no exact effective date for the diesel step, so valid_from is null. | replaces override row: administered subsidy=True'}
