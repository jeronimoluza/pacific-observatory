- {iso3: AFG, product: Diesel, regime: ceiling, adjust_freq: adhoc, subsidy_note: No fiscal subsidy; import-parity pricing., evidence_url: 'https://pajhwok.com/2026/07/16/fuel-prices-surge-in-kabul-as-residents-demand-market-control/', evidence_sha256: 41cbebbf4ea6c82d54fb5911a72ee157e4be83811273e08a95f3c35ed3bd86a9, evidence_quote: 'The Kabul Municipality on Thursday (16 July) issued a new price list, setting the price of petrol at 79 afghanis per litre, diesel at 73 afghanis per litre, and LPG at 74 afghanis per kilogram.', confidence: medium, provenance: audit_manual, reviewer: 'agent:claude', reviewed_at: '2026-10-16', note: 'Kabul Municipality publishes official retail price lists for petrol/diesel/LPG and its spokesperson says it enforces compliance with official rates and prevents overcharging, i.e. a binding cap revised ad hoc with market moves. Weak points: Kabul-only (municipal, not national), enforcement is patchy per residents, and no national decree; 0 observed changes may reflect missing source data. | replaces override row: market subsidy=False'}
