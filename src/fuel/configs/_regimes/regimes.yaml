- {iso3: POL, product: LPG, regime: market, adjust_freq: free, subsidy_note: LPG/autogas is outside the CPN maximum prices., evidence_url: 'https://www.money.pl/gospodarka/lpg-nadal-bez-kontroli-cen-minister-energii-zabiera-glos-7270591186815200a.html', evidence_sha256: 2a2ed2af4c41d5ede8508888c8b1be019441df385c0408c4ff0cdd70ec451545, evidence_quote: 'Maksymalne ceny paliw nie obejmują autogazu, jednak i w przypadku LPG ceny wyraźnie wzrosły po rozpoczęciu wojny na Bliskim Wschodzie.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The article is from 1 Apr 2026 (first CPN edition). October coverage lists caps only for Pb95, Pb98 and diesel, and an August report says LPG was never included. I could not confirm whether the October VAT cut also covers LPG. | replaces override row: market subsidy=False'}
