- {iso3: PRY, product: Gasoline, regime: dual, adjust_freq: adhoc, subsidy_note: No fiscal subsidy found in force; state-owned Petropar prices below private brands using its own margins/stock, evidence_url: 'https://www.hoy.com.py/nacionales/2026/09/24/petropar-sube-los-precios-del-diesel-y-de-la-nafta-97', evidence_sha256: c10c1faba612077a762a72dfba21f33a153120f9282dca7001c98587192f61d4, evidence_quote: 'Con estos nuevos precios, la diferencia con los emblemas privados sigue siendo de 100 a 150 guaraníes menos en algunos casos, en otros 200 y hasta 300 guaraníes, según Wilka.', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Retail is formally free, but state-owned Petropar changes its prices ad hoc (17-Aug and 24-Sep-2026) and anchors the private brands below parity. That is pseudo-regulated (dual), not market, and fits the 1-2 observed changes per year. Search results suggesting a 2026 Petropar subsidy law were misdated 2022 articles (Law 6900/2022), so subsidy=false. | replaces wb2024 row: market subsidy=False'}
