- {iso3: POL, product: Gasoline, valid_from: '2026-10-03', regime: ceiling, adjust_freq: daily, subsidy_note: 'CPN package: VAT cut from 23% to 8% and excise cut to the EU minimum until end-2026 (tax cuts, no fiscal subsidy); daily maximum retail prices set by ministerial notice.', evidence_url: 'https://superbiz.se.pl/wiadomosci/rzad-ustalil-maksymalne-stawki-paliw-za-litr-benzyny-95-zaplacimy-673-zl-aa-oy1Q-4TeF-7hKV.html', evidence_sha256: f1c7284964aaab8313d6a0a7e32a1e77820ee6fd904ef6b3ca1436cdbc16534b, evidence_quote: 'Każdego dnia, najpewniej w okolicy południa, będziemy wydawać obwieszczenie podpisane przez ministra energii, które będzie określało ceny maksymalne, obowiązujące na wszystkich stacjach paliw w Polsce', confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'The third edition of Ceny Paliwa Niżej brought back binding daily maximum prices for Pb95/Pb98 from 3 Oct 2026; caps were still being published on 13 Oct. valid_to 2026-12-31 comes from the article''s statement that the tax changes last to end-2026, and it is not confirmed for the price caps. Subsidy is set false because VAT and excise cuts are tax measures; the old override had it true. | editor: valid_to 2026-12-31 dropped; it is the end date of the VAT/excise cut, not confirmed for the price caps | valid_from per https://superbiz.se.pl/wiadomosci/rzad-ustalil-maksymalne-stawki-paliw-za-litr-benzyny-95-zaplacimy-673-zl-aa-oy1Q-4TeF-7hKV.html (sha256 f1c7284964aa): "Zgodnie z oficjalnym komunikatem ministra energii Miłosza Motyki, od północy 3 października 2026 roku zaczną obowiązywać limity cenowe."'}
