# regime: administered | formula | ceiling | floor | market | dual
#   badge = Market for market, Price Control for every other regime.
# adjust_freq: daily | weekly | biweekly | weekly_biweekly | monthly | quarterly |
#   band | adhoc | frozen | free
# valid_from empty = start unknown; the row holds until a dated row supersedes it.
#   A date is only ever the effective date of a decree or communique.
