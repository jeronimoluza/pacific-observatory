- {iso3: JPN, product: Diesel, regime: ceiling, adjust_freq: weekly, subsidy: true, subsidy_note: METI/ANRE per-litre subsidy paid to wholesalers (元売り) to hold the national average regular gasoline price near JPY170; JPY50.70/L for 1-7 Oct 2026; diesel/kerosene/heavy oil get the same per-litre amount., evidence_url: 'https://vegcale.com/2026/08/11/gasoline-subsidy-when-ends-2026/', evidence_sha256: 0601ec78ced6d175813726151d4c02edffbab7e89e840654ec0f680a5ab4c4f3, evidence_quote: 2026年8月6日〜12日の支給単価はガソリン・軽油・灯油・重油が19.0円/L。これは4週ぶりの縮小です, confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Diesel (軽油) gets the same per-litre subsidy as gasoline under the JPY170 emergency mitigation scheme, so its pump price is held down by the same weekly wholesaler subsidy. The quote is from a secondary blog (Aug 2026). Kyodo''s 30 Sep report confirms the scheme continued into October but names only gasoline. valid_from is the scheme start per the same blog. | editor: valid_from 2026-03-19 dropped; it comes from a blog and other reports say the subsidy paused and restarted in May 2026 | replaces override row: market subsidy=True'}
- {iso3: JPN, product: Gasoline, regime: ceiling, adjust_freq: weekly, subsidy: true, subsidy_note: METI/ANRE per-litre subsidy paid to wholesalers (元売り) to hold the national average regular gasoline price near JPY170; JPY50.70/L for 1-7 Oct 2026; diesel/kerosene/heavy oil get the same per-litre amount., evidence_url: 'https://kumanichi.com/articles/2041284', evidence_sha256: 1713dfa5447bd6d3b86069aa2a7b8d8f69d232d91fa4bcebf5b7769f738cb84c, evidence_quote: 価格を１７０円程度に抑える補助金は、１０月１～７日の支給額を１リットル当たり５０円７０銭とした。, confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Kyodo (30 Sep 2026) confirms the subsidy that holds gasoline at about JPY170 is still being paid for 1-7 Oct 2026, so this is a cap enforced through a weekly-reset per-litre subsidy to wholesalers, not a free market. It is a target on the national average, not a legal per-station maximum. valid_from comes from a blog citing ANRE, and other reports describe a pause and restart in May 2026. | editor: valid_from 2026-03-19 dropped; it comes from a blog and other reports say the subsidy paused and restarted in May 2026 | replaces override row: market subsidy=True'}
- {iso3: JPN, product: Kerosene, regime: ceiling, adjust_freq: weekly, subsidy: true, subsidy_note: METI/ANRE per-litre subsidy paid to wholesalers (元売り) to hold the national average regular gasoline price near JPY170; JPY50.70/L for 1-7 Oct 2026; diesel/kerosene/heavy oil get the same per-litre amount., evidence_url: 'https://vegcale.com/2026/08/11/gasoline-subsidy-when-ends-2026/', evidence_sha256: 0601ec78ced6d175813726151d4c02edffbab7e89e840654ec0f680a5ab4c4f3, evidence_quote: 2026年8月6日〜12日の支給単価はガソリン・軽油・灯油・重油が19.0円/L。これは4週ぶりの縮小です, confidence: medium, provenance: audit_manual, reviewer: 'Jeronimo Luza', reviewed_at: '2026-10-17', note: 'Kerosene (灯油) is covered at the same per-litre subsidy as gasoline under the scheme. The observed ~30 changes a year fit weekly subsidy resets. The evidence is a secondary blog from Aug 2026, and kerosene''s continued coverage in October is inferred from the scheme continuing (Kyodo 30 Sep). | editor: valid_from 2026-03-19 dropped; it comes from a blog and other reports say the subsidy paused and restarted in May 2026 | replaces override row: market subsidy=True'}
