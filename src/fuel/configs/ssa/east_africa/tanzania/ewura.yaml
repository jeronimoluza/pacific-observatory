source_key: ewura_tz_monthly
module: ssa.east_africa.tanzania.ewura
function: fetch_ewura_tz
url: https://www.ewura.go.tz/publications/petroleum-price
fallback_date: 2024-01-01
priority: 10
cadence: monthly
carry_forward: true
# Regulated cap prices per town (3 ports + ~190 towns): no trim, since a
# remote town's cap is a real price, not an outlier; the median town.
station_aggregate: {stat: median, trim: none, min_stations: 5, max_dispersion: 0.25}
station_type: city

# EWURA publishes a public-notice PDF on the first Wednesday of every
# month. Each PDF's first page contains Table 1: Retail Prices — TZS/Litre
# for Dar es Salaam, Tanga, and Mtwara; the following pages list the cap
# price for ~190 towns. Both are kept, one row per town.

products:
  "Petrol":
    series_key: gasoline_regular
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
  "Diesel":
    series_key: diesel
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: standard
  "Kerosene":
    series_key: kerosene
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
