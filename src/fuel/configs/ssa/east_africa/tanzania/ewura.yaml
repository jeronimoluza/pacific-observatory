source_key: ewura_tz_monthly
module: ssa.east_africa.tanzania.ewura
function: fetch_ewura_tz
url: https://www.ewura.go.tz/publications/petroleum-price
fallback_date: 2024-01-01
priority: 10
cadence: monthly
carry_forward: true

# EWURA publishes a public-notice PDF on the first Wednesday of every
# month. Each PDF's first page contains Table 1: Retail Prices — TZS/Litre
# for Dar es Salaam, Tanga, and Mtwara. Per-town granularity (Table 3,
# 190+ towns) is intentionally out of scope for this fetcher.

products:
  "Petrol":
    series_key: gasoline_regular
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
  "Diesel":
    series_key: diesel
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: standard
  "Kerosene":
    series_key: kerosene
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
