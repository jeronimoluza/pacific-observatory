source_key: mz_arene_comunicados
module: ssa.southern_africa.mozambique.arene
function: fetch_mz_arene
url: https://arene.org.mz/noticias-e-comunicados/comunicados/
fallback_date: 2010-01-01
priority: 10
enabled: false
cadence: irregular
carry_forward: true

# ARENE publishes regulated petroleum price comunicados as PDFs and a
# cumulative 2010-2026 price-history PDF. The fetcher uses page-3 OCR for
# individual comunicados and scans the historical PDF for date/price rows.

products:
  "Gasolina":
    series_key: gasolina
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
  "Gasóleo":
    series_key: gasoleo
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: standard
  "Petróleo iluminante":
    series_key: petroleo_iluminante
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
  "Jet A-1":
    series_key: jet_a1
    fuel_family: jet_fuel
    unit: liter
    include_in_build: true
    grade: standard
  "GPL":
    series_key: gpl
    fuel_family: lpg
    unit: kilogram
    include_in_build: true
    density_l_per_kg: 1.96
    grade: standard
