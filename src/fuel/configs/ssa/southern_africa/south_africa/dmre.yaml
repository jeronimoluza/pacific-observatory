source_key: dmre_za_fuel_history
module: ssa.southern_africa.south_africa.dmre
function: fetch_dmre_za
url: https://www.energy.gov.za/files/esources/petroleum/petroleum_arch.html
fallback_date: 2020-01-01
priority: 10
cadence: monthly
carry_forward: true

# DMRE publishes annual Fuel Price History PDFs in South African cents/litre.
# The fetcher converts cents/litre to ZAR/litre and keeps Inland/Coast areas.

products:
  "Petrol 93":
    series_key: petrol_93
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    octane_ron: 93
  "Petrol 95":
    series_key: petrol_95
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    octane_ron: 95
  "Diesel 0.05% sulphur":
    series_key: diesel_500ppm
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: standard
  "Illuminating Paraffin":
    series_key: illuminating_paraffin
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
