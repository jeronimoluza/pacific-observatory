source_key: bera_bw_levels
module: ssa.southern_africa.botswana.bera_levels
function: fetch_bera_bw_levels
url: https://www.bera.co.bw/petroleum.php
fallback_date: 2020-01-01
priority: 5
cadence: yearly  # a level holds until the next one; carried up to 365 days
carry_forward: true
full_refresh: true
station_type: city

# Hand-curated BERA regulated pump prices (Statutory Instruments 2020-2024,
# then press releases / BOL letters / Daily News), read from
# configs/_manual/bera_bw_levels.yaml; nothing is scraped. Gaborone until
# 2025-11-07, single national price from 2025-11-08. How to update:
# ~/vault/raw/specs/fuel/2026-10-16-botswana-bera-prices.md

products:
  "ULP 95":
    series_key: gasoline_premium
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    octane_ron: 95
  "ULP 93":
    series_key: gasoline_regular_93
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    octane_ron: 93
  "Diesel 50ppm":
    series_key: diesel_50ppm
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: 50ppm
  "Diesel 500ppm":
    series_key: diesel_500ppm
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: 500ppm
  "Illuminating Paraffin":
    series_key: illuminating_paraffin
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
