source_key: npa_gh_price_floors
module: ssa.west_africa.ghana.npa
function: fetch_npa_gh
url: https://npa.gov.gh/indicative-prices/
fallback_date: 2024-01-01
priority: 10
cadence: biweekly
carry_forward: true

# NPA publishes directory-indexed ex-refinery and ex-pump price-floor PDFs
# for each pricing window. The fetcher parses the ex-pump floor column.

products:
  "Petrol":
    series_key: petrol_ex_pump_floor
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
  "Diesel":
    series_key: diesel_ex_pump_floor
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: standard
  "Kerosene":
    series_key: kerosene_ex_pump_floor
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: standard
  "LPG":
    series_key: lpg_ex_pump_floor
    fuel_family: lpg
    unit: kilogram
    include_in_build: true
    density_l_per_kg: 1.96
    grade: standard
