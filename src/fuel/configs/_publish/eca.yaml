        note: "President Zelensky signed the 2024-2028 motor-fuel excise schedule. From 1-Jan-2026 gasoline excise rises to EUR 300.80/1,000 L, diesel to EUR 253.80/1,000 L, LPG to EUR 198/1,000 L. Cumulative 2024-2026 burden: LPG ~4x, diesel +83%, A-95 +40%. Driven by EU Association alignment and defense budget needs."
        sources:
