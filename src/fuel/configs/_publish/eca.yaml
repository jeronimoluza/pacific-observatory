  TUR:
    Gasoline:
      classification_sources:
        - "WB 2024 pricing-regime dataset (mech=1 'Free Pricing System' since 2005). Override: de facto Price Control via SCT (Special Consumption Tax) Fuel Price Stabilization Mechanism (FPSM) — Treasury absorbs ~75% of global price moves so only ~25% passes to consumers."
      reform:
        label: "FPSM reinstated Mar-2026"
        note: "Türkiye reintroduced the SCT-based fuel price stabilisation mechanism effective 11-Mar-2026, capping consumer pass-through at ~25% of global price increases. For 2026 budgeting, SCT hikes on fuel/alcohol/tobacco are limited to 7.84% (CBRT inflation target) instead of automatic PPI indexation — formal end of multi-year SCT freeze, but consumer prices remain managed."
        sources:
          - { label: "KPMG — Türkiye FPSM reinstated Mar-2026", url: "https://kpmg.com/us/en/taxnewsflash/news/2026/03/tnf-turkiye-reintroduction-of-fuel-price-stabilization-mechanism-for-special-consumption-tax-on-certain-petroleum-products.html" }
          - { label: "Türkiye Today — 2026 SCT hike cap 7.84%", url: "https://www.turkiyetoday.com/business/turkiye-limits-excise-tax-hikes-on-fuel-alcohol-tobacco-to-reinforce-disinflation-goa-3212243" }
    Diesel:
      classification_sources:
        - "WB 2024 'Free Pricing'; override based on FPSM/SCT manipulation that produces a large implicit Treasury subsidy on diesel."

  UKR:
    Gasoline:
