        note: "Uzbekneftegaz halted AI-80 production Sep-2025; retail AI-80 sales were discontinued 1-Dec-2025 and replaced by an AI-92 expansion. The transition is backed by the World Bank's USD 800 m Advancing Global Integration DPO (Oct-2025), supporting energy-tariff cost recovery by end-2026 with targeted compensation for low-income households."
        sources:
