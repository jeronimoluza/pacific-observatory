  UZB:
    Gasoline:
      classification_sources:
        - "WB 2024 pricing-regime dataset (mech=1 liberalized May-2020). Gasoline exchange-traded since May-2023; AI-91 deregulated, AI-95/98 at market prices. The AI-80 zero-excise window expired 31-Jan-2024 and the AI-80 retail price cap was lifted 10-Jul-2025."
      reform:
