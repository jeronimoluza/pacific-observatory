  SRB:
    Gasoline:
      classification_sources:
        - "WB 2024 pricing-regime dataset (mech=2, freq=1 weekly; subsidy_type=1). Ministry of Internal and Foreign Trade sets weekly Friday caps for Eurosuper BMB 95 and Eurodiesel; wholesale margin fixed at +16 din/L."
      reform:
        label: "Caps extended 6 months"
        note: "Government extended weekly fuel price caps (in place since Feb-2022) for another 6 months in 2025. Total 2025 agricultural budget RSD 138 bn + RSD 11 bn earmarked for fuel-excise refunds; performance-additive fuels stay exempt from the cap."
        sources:
          - { label: "Serbia-business — caps extended + farmer support", url: "https://serbia-business.eu/serbia-extends-fuel-price-caps-for-six-months-supports-farmers-with-subsidized-diesel/" }
