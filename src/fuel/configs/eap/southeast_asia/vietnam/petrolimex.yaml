# Petrolimex Vietnam retail price announcements (OCR of the price image; Zone 1, Zone 2,
# National). Ported from legacy pacific-observatory (source_key vn_petrolimex_retail,
# FETCHER_REGISTRY fallback 2019-12-31, cadence irregular). Legacy treats Vietnam as
# state-controlled (forward-fill until the next announcement), hence carry_forward with
# publication: announcement. Legacy deduplicates this source against vn_moit_fuel (same
# country, date and normalized product); here both share series_key and this source wins
# by priority (10 vs 20). Zones are averaged by the template build (legacy keeps them apart).
# Mazut is VND/kg in the source and stays per kg (fuel_oil is not converted).
source_key: vn_petrolimex_retail
module: eap.southeast_asia.vietnam.petrolimex
function: fetch_vn_petrolimex
url: https://www.petrolimex.com.vn/ndi/thong-cao-bao-chi.html
fallback_date: 2019-12-31
priority: 10
cadence: irregular
carry_forward: true
publication: announcement
currency: VND

