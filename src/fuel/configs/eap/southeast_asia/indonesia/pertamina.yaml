# (source_key id_pertamina_pengumuman_non_subsidi, fallback 2023-07-31, irregular).
# One row per province/FTZ; legacy keeps each province as its own location, the
# template publishes the provincial median (station_aggregate).
source_key: id_pertamina_pengumuman_non_subsidi
module: eap.southeast_asia.indonesia.pertamina
function: fetch_id_pertamina_pengumuman
url: https://www.pertamina.com/pengumuman
