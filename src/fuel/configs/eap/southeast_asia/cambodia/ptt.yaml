# Cambodia PTT monthly retail pump prices. Ported from legacy pacific-observatory
# (source_key kh_ptt_monthly_prices, FETCHER_REGISTRY fallback 2020-01-01, cadence monthly).
# Legacy treats Cambodia as state-controlled (forward-fill to today), hence carry_forward.
source_key: kh_ptt_monthly_prices
module: eap.southeast_asia.cambodia.ptt
function: fetch_kh_ptt
url: https://www.ptt.com.kh/products-and-services-oil-price
fallback_date: 2020-01-01
priority: 10
cadence: monthly
carry_forward: true
currency: KHR

products:
  "Super":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    series_key: super
  "Regular":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    series_key: regular
  "Diesel":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: regular
    series_key: diesel
