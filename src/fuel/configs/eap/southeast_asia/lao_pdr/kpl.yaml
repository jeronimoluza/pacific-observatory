  "Regular Gasoline":
    series_key: regular_gasoline_kpl
    label: Regular Gasoline (KPL notice)
    fuel_family: gasoline
    unit: liter
    grade: regular
  "Diesel":
    series_key: diesel_kpl
    label: Diesel (KPL notice)
