# the provincial Lao State Fuel series as in legacy.
source_key: lao_kpl_fuel_notices
module: eap.southeast_asia.lao_pdr.kpl
function: fetch_lao_kpl
url: https://kpl.gov.la/En/News.aspx?cat=13
