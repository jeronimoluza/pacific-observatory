# Thailand EPPO retail fuel prices, daily JSON feed (PTT first, other brands as fallback).
# Ported from legacy pacific-observatory (source_key th_eppo_retail_daily,
# FETCHER_REGISTRY fallback 2024-01-01, cadence daily). Thailand is not state-controlled
# in legacy, hence no carry_forward. Diesel B10 is emitted by the fetcher but not yet seen.
source_key: th_eppo_retail_daily
module: eap.southeast_asia.thailand.eppo_retail
function: fetch_th_eppo_retail_daily
url: http://www.eppo.go.th/petro/price/index.html
fallback_date: 2024-01-01
priority: 10
cadence: daily
carry_forward: false
history_irrecoverable: true
currency: THB

products:
  "Benzine 95":
    series_key: benzine_95
    label: Benzine 95
    fuel_family: gasoline
    unit: liter
    grade: premium
    octane_ron: 95
  "Gasohol 95":
