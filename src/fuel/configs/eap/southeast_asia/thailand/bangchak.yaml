# Bangchak historical retail oil prices (Thailand). Ported from legacy pacific-observatory
# (source_key th_bangchak_retail_history, FETCHER_REGISTRY fallback 2015-01-01, cadence irregular).
# Legacy does not treat Thailand as state-controlled (no forward fill), hence no carry_forward.
# series_key = legacy fuel_product (+ location when not National): the legacy dedup key.
source_key: th_bangchak_retail_history
module: eap.southeast_asia.thailand.bangchak
function: fetch_th_bangchak_retail_history
url: https://www.bangchak.co.th/en/oilprice/historical
fallback_date: 2015-01-01
priority: 10
cadence: irregular
carry_forward: false
currency: THB

products:
  "E20":
    series_key: e20
    label: E20
    fuel_family: gasoline
    unit: liter
    grade: ethanol
  "E85":
    series_key: e85
    label: E85
    fuel_family: gasoline
    unit: liter
    grade: ethanol
  "Gasohol 91":
    series_key: gasohol_91
    label: Gasohol 91
    fuel_family: gasoline
