# Vanuatu Department of Energy retail fuel prices. Ported from legacy
# pacific-observatory (source_key vu_doe_retail_petrol_diesel_2025, FETCHER_REGISTRY
# fallback 2023-01-01, cadence irregular). Not state-controlled in legacy.
source_key: vu_doe_retail_petrol_diesel_2025
module: eap.pacific_islands.vanuatu.doe
function: fetch_vanuatu_doe
url: https://doe.gov.vu/index.php/news-events/news
enabled: false
disabled_reason: >-
  Disabled in legacy since 0cfd749b (2026-10-16): the parser never read a price
  (diesel pattern had no capture group) and, with the regexes fixed, it reads
  unrelated news and guesses dates from any year in the text (2030 from
  'Vision 2030'). Last valid data 2025-12-31. Needs a rewrite against DOE's
  actual price notices.
fallback_date: 2023-01-01
priority: 10
cadence: irregular
carry_forward: false
currency: VUV

products:
  "Unleaded Petrol 95RON":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    octane_ron: 95
    series_key: unleaded_95
  "Low Sulphur Diesel 10PPM":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: regular
    series_key: diesel_10ppm
