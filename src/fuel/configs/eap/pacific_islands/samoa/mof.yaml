# Samoa Ministry of Finance monthly fuel prices (OCR of the press-release price
# table with tesseract). Ported from legacy pacific-observatory (source_key
# ws_mof_monthly_fuel_prices, FETCHER_REGISTRY fallback 2023-01-01, cadence monthly).
# Legacy treats Samoa as state-controlled (forward-fill to today), hence
# carry_forward. The fetcher itself already expands each month to daily rows.
source_key: ws_mof_monthly_fuel_prices
module: eap.pacific_islands.samoa.mof
function: fetch_samoa_mof
url: https://www.mof.gov.ws/press-releases/
fallback_date: 2023-01-01
priority: 10
cadence: monthly
carry_forward: true
currency: WST

products:
  "Petrol":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    series_key: petrol
  "Diesel":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: regular
    series_key: diesel
  "Kerosene":
    fuel_family: kerosene
    unit: liter
    include_in_build: true
    grade: regular
    series_key: kerosene
