# Australia NSW FuelCheck station-level price history (Data.NSW CKAN). Ported from
# legacy pacific-observatory (source_key au_nsw_fuelcheck_history, FETCHER_REGISTRY
# fallback 2016-08-01, cadence irregular). Legacy _AU_SOURCE_RANK = 0 (tied with
# FuelWatch), translated to priority 10. Not state-controlled in legacy, hence
# carry_forward false.
# Station-level rows (~9.5M): the build keeps each station's last price of the day
# and takes the median across stations, MAD-trimmed. Station = address, else suburb
# (2016-2020 rows are partly stored twice, with and without address).
source_key: au_nsw_fuelcheck_history
module: eap.pacific_islands.australia.nsw_fuelcheck
function: fetch_au_nsw_fuelcheck_history
url: https://data.nsw.gov.au/data/dataset/fuel-check
fallback_date: 2016-08-01
priority: 10
cadence: irregular
carry_forward: false
station_aggregate: {stat: median, trim: mad, k: 3, min_stations: 5, max_dispersion: 0.25}
station_type: station
currency: AUD

products:
  "Unleaded 91":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    octane_ron: 91
    series_key: gasoline_91
  "E10":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    series_key: gasoline_e10
  "Premium 95":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    octane_ron: 95
    series_key: gasoline_95
  "Premium 98":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: premium
    octane_ron: 98
    series_key: gasoline_98
  "E85":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    series_key: gasoline_e85
  "Diesel":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: regular
    series_key: diesel
  "PDL":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: premium
    series_key: diesel_premium
  "B20":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    series_key: diesel_b20
  "LPG":
    # Autogas priced per litre; density only satisfies the LPG schema
    # (legacy 0.54 kg/L -> 1.852 L/kg), no conversion applies to unit liter.
    fuel_family: lpg
    unit: liter
    density_l_per_kg: 1.852
    include_in_build: true
    series_key: lpg
  # Legacy maps these outside the motor-fuel families (natural_gas, electricity,
  # unmapped code); a handful of rows each, kept in the raw only.
  "CNG":
    fuel_family: cng
    unit: liter
    include_in_build: false
    series_key: cng
  "LNG":
    fuel_family: cng
    unit: liter
    include_in_build: false
    series_key: lng
  "EV":
    fuel_family: electricity_ev
    unit: liter
    include_in_build: false
    series_key: ev
  "NAN":
    fuel_family: gasoline
    unit: liter
    include_in_build: false
    series_key: unknown_code
