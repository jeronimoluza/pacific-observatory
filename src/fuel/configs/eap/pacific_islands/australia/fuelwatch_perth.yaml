# Australia FuelWatch WA (Perth) daily retail prices via RSS. Ported from legacy
# pacific-observatory (source_key au_fuelwatch_perth_daily, FETCHER_REGISTRY
# fallback 2024-01-01, cadence daily). Legacy _AU_SOURCE_RANK = 0 (tied with NSW
# FuelCheck), translated to priority 10. Not state-controlled in legacy, hence
# carry_forward false. Two rows per day (North / South of River station means),
# averaged by the build as legacy averages them into one "Perth" location.
# The RSS serves only current prices.
source_key: au_fuelwatch_perth_daily
module: eap.pacific_islands.australia.fuelwatch_perth
function: fetch_au_fuelwatch_perth
url: https://www.fuelwatch.wa.gov.au
fallback_date: 2024-01-01
priority: 10
cadence: daily
carry_forward: false
history_irrecoverable: true
currency: AUD

products:
  "Unleaded":
    fuel_family: gasoline
    unit: liter
    include_in_build: true
    grade: regular
    octane_ron: 91
    series_key: gasoline_91
  "Diesel":
    fuel_family: diesel
    unit: liter
    include_in_build: true
    grade: regular
    series_key: diesel
