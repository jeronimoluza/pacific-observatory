source_key: jm_petrojam_weekly
module: lac.caribbean.jamaica.petrojam
function: fetch_jm_petrojam
url: https://www.petrojam.com/price/
fallback_date: 2004-02-01
priority: 10
cadence: weekly
carry_forward: true

# Petrojam is Jamaica's only petroleum refinery (state-owned) and
# publishes weekly ex-refinery prices that effectively anchor retail
# pump prices. carry_forward=true because each weekly price applies
# until the next Petrojam notice is issued (typically Thursdays).
# Coverage runs back to Feb 2004.

products:
  "Gasolene 87":
