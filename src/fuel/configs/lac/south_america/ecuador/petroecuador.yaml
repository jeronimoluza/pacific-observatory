source_key: ec_petroecuador_monthly
module: lac.south_america.ecuador.petroecuador
function: fetch_ec_petroecuador
url: https://www.eppetroecuador.ec/?p=20421
fallback_date: 2018-01-01
priority: 10
cadence: monthly
carry_forward: true

# EP Petroecuador (state oil company) publishes a monthly "Estructura
# de Precios en Terminal" PDF — wholesale prices that authorized
# distributors pay, set by executive decree. These are state-managed
# terminal/ex-rack prices, NOT retail pump prices. Retail prices add
# regulated margins on top. carry_forward=true at source level: each
# PDF sets the vigencia period explicitly and the price holds until
# the next decree.
#
# Per-product overrides reflect the 2024–2025 reform sequence:
# - Super Premium 95: liberalized in 2018; pure market price → false
# - Diesel 2 / Diesel Premium: subsidy eliminated 13-Sep-2025; market
#   prices with a small residual (~$0.11/gal) → false
# - Extra / Ecopaís remain under a price-band cap (Jun-2024) → true
# - LPG (household), kerosene equivalents remain subsidised → true

products:
  "GASOLINA EXTRA":
    label: Gasoline Extra
    series_key: gasoline_regular_85
    fuel_family: gasoline
    unit: gallon
    include_in_build: true
    grade: regular
    octane_ron: 85
  "EXTRA CON ETANOL":
    label: Gasoline Extra Ethanol
    series_key: gasoline_ecopais
    fuel_family: gasoline
    unit: gallon
    include_in_build: true
    grade: regular_ethanol
  "GASOLINA SUPER PREMIUM 95":
    label: Gasoline Super Premium 95
    series_key: gasoline_premium_95
    fuel_family: gasoline
    unit: gallon
    include_in_build: true
    grade: premium
    octane_ron: 95
    carry_forward: false  # Super liberalized 2018 — market priced
  "DIESEL 2":
    label: Diesel 2
    series_key: diesel
    fuel_family: diesel
    unit: gallon
    include_in_build: true
    grade: standard
    carry_forward: false  # subsidy eliminated 13-Sep-2025 — market priced
  "DIESEL PREMIUM":
    label: Diesel Premium
    series_key: diesel_premium
    fuel_family: diesel
    unit: gallon
    include_in_build: false
    grade: premium
    carry_forward: false  # subsidy eliminated 13-Sep-2025 — market priced
  "DIESEL 1":
    label: Diesel 1
    series_key: diesel_1
    fuel_family: diesel
    unit: gallon
    include_in_build: false
    grade: light
  "FUEL OIL":
    label: Fuel Oil
    series_key: fuel_oil
    fuel_family: fuel_oil
    unit: gallon
    include_in_build: false
    grade: standard
  "GLP DOMESTICO":
    label: LPG
    series_key: lpg_household
    fuel_family: lpg
    unit: kilogram
    density_l_per_kg: 1.96
    include_in_build: true
    grade: subsidized
  "GLP INDUSTRIAL":
    label: LPG
    series_key: lpg_industrial
    fuel_family: lpg
    unit: kilogram
    density_l_per_kg: 1.96
    include_in_build: false
    grade: standard
