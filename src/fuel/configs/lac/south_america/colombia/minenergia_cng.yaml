source_key: co_minenergia_cng_monthly
module: lac.south_america.colombia.minenergia_cng
function: fetch_co_minenergia_cng
url: https://www.datos.gov.co/d/he3q-86dn
fallback_date: 2022-10-01
priority: 10
cadence: monthly
carry_forward: true
# One row per station and month (~150-170 stations); the build takes the
# median after dropping stations outside median +- 3 MAD. See
# fuel/station_aggregate.py.
station_aggregate: {stat: median, trim: mad, k: 3, min_stations: 5, max_dispersion: 0.25}
station_type: station

products:
  "GNCV":
    label: CNG
    series_key: cng
    fuel_family: cng
    unit: m3
    include_in_build: true
    grade: standard
