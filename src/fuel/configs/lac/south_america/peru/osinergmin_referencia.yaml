source_key: pe_osinergmin_referencia_weekly
module: lac.south_america.peru.osinergmin_referencia
function: fetch_pe_osinergmin_referencia
url: https://www.osinergmin.gob.pe/seccion/institucional/regulacion-tarifaria/precios-de-referencia-banda-de-precios/precios-de-referencia-de-combustibles
fallback_date: 2023-01-01
priority: 10
cadence: weekly
carry_forward: true

# IMPORTANT: These are Osinergmin's PR1 reference prices (Soles/galón, ex-plant,
# no ISC/IGV/rodaje and no commercial margin) — NOT consumer retail prices.
# They move with international cotizaciones and lead retail by ~1 week.
# Use for trend tracking; do not compare directly to retail prices in
# countries that report final consumer prices.

