# Central African Republic: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Gobierno (arrêté conjunto Finanzas-Comercio-Energía en ene-2023; arrêté presidencial en jul-2023; anuncios del Ministro/a de Energía e Hidráulica en 2025-2026). Régimen: precio fijado ad hoc y subsidiado, sin fórmula periódica. Canales: conferencia de prensa / comunicado del ministro, visibles solo en prensa (Ecomatin, AFP, Alwihda, Financial Afrik); sin texto oficial en línea (gouv.cf no se actualiza).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos:
#   - Super entre jul-2023 y may-2025: la fila de 2023 da 1100, pero la baja de may-2025 se anunció como "-100 FCFA" hasta 1050, lo que implica 1150 previo. Hubo un cambio intermedio (2024, fecha no encontrada) o la baja del super fue de 50; no se carga nada inferido. La cadena del Super es por tanto inexacta entre esas fechas.
#   - Pétrole lampant omitido: 850 (jul-2023), y en may-2025 Ecomatin dice 750 y Alwihda 700 (contradicción); sin dato en oct-2026.
#   - Precios para "gros consommateurs" desde 01-10-2026 (super 1500, gasoil 1650) no cargados.
#   - Ninguna fila tiene documento oficial: todo es prensa (confianza media como máximo).
#   - Confirmaciones (2a pasada): 2026-09-29 (Ecomatin, 1050/1250) y 2026-10-12 (AFP/Le360, 1150/1400, evidencia del last_checked).
#   - Tramos >12 meses sin fila: 2023-07-06 -> 2025-05-05 (~22 meses; además el Super tiene el cambio intermedio sin fecha) y 2025-05-05 -> 2026-09-29 (~17 meses). Busqué notas fechadas con el precio vigente (Ecomatin ago-2025, Financial Afrik oct-2024, búsquedas 2024/2025/2026) y ninguna cita el precio.
