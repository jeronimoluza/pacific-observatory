# Comoros: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Gobierno por arrêté conjoint (Energía + Finanzas + Economía) que fija los precios de venta al por menor en todo el territorio; SCH (Société comorienne des hydrocarbures) importador monopólico.
# Régimen: precio nacional único fijado ad hoc, subsidiado y muy rígido (750/650/350 de mayo-2022 a mayo-2026).
# Canales: arrêtés no publicados online; anuncio del ministro o del Presidente, difusión por Al-Watwan (estatal), La Gazette des Comores (PDF), Mayotte Hebdo, Le Journal de Mayotte, AFP.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: ningún texto de arrêté a la vista; fecha exacta de vigencia de la suba de 2026 dudosa (arrêté publicado sáb 9-05, La Gazette dice "entreront en vigueur dès ce lundi 11 mai");
#   la vuelta a 750/650/350 se apoya en el comunicado de suspensión del 16-05-2026 (AFP, Xinhua), que no repite las cifras; algunas estaciones mantuvieron el precio alto unos días esperando el arrêté de baja.
#   Sin evidencia de precios posteriores a jun-2026 (pénurie, quotas de 3.000 L/estación; la suspensión es "temporal"); por eso no hay last_checked.
