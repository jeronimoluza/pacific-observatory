# Mauritania: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Comision Nacional de Hidrocarburos (Commission/Comite national des hydrocarbures, decisiones numeradas "القرار رقم NN/2026" que fijan precios maximos por ciudad), bajo el Ministerio del Petroleo y la Energia; nuevo mecanismo de fijacion desde fines de 2025 (decreto del Consejo de Ministros 8-ene-2026), tope de +5% por revision salvo decision del Gobierno. Regimen: administrado, subsidiado, revisiones casi mensuales en 2026. Canales: no se hallo pagina oficial con los precios (petrole.gov.mr / energie.gov.mr inaccesibles); la decision se conoce por prensa: Sahara Medias, Attaqa, Le360 (corresponsal en Nouakchott). AMI no publico las cifras en lo que se pudo consultar.
# UNIDADES: price_local en OUGUIYA NUEVA (MRU). La prensa arabe da casi siempre ouguiya antigua (MRO, "أوقية قديمة"), 1 MRU = 10 MRO: 621.3 MRO = 62.13 MRU. Cada note dice que unidad trae la fuente y como se convirtio.
# Locality: precios de Nouakchott; las decisiones fijan precios distintos por ciudad del interior (Nouadhibou, Nema, Zouerate, etc.) que no se cargan.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: (1) nivel vigente al 2024-01-01 NO encontrado en fuente fechada: el ultimo cambio previo hallado es la suba del 15-jul-2022 (Ministerio del Petroleo, Sahara Medias 190750) que solo da incrementos (+11.5 MRU gasoil, +13 MRU essence), no niveles. Las variaciones de feb-2026 que publica Le360 (-1.21 = -2.42%, -2.9 = -5.12%) implican 50.00 gasoil y 56.64 essence antes del 2-feb-2026, pero es una deduccion y no se carga. No se halló ningun cambio en 2023-2025.
#   (2) petrole lampant (kerosene): solo el nivel de jun-2026; antes, sin cifras.
#   (3) la vigencia del 31-mar-2026 no es explicita en la fuente de la fila; Le360 5-may-2026 dice 'une precedente augmentation intervenue le 31 mars' y fecha la de mayo el lunes 4-may (pompista: 'hier 563,5... ce matin 591,7').
#   (5) entre 2024-01-01 y 2026-02-01 no hay ninguna fila (ni cambio ni confirmacion fechada): tramo de 25 meses sin dato. 2 busquedas extra (fr/ar) sin resultado.
#   (4) despues del 2-jun-2026 no se halló ningun cambio; Sahara Medias 17-sep-2026 da como vigente el nivel de la "cuarta suba" (gasoil 621.3, essence 650.2 MRO) y el Primer Ministro promete no subir mas: cargado como fila de confirmacion 2026-09-17 (essence, gasoil; el kerosene no se menciona). Sin evidencia fechada hoy, por eso no hay last_checked.
