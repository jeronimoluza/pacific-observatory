# Togo: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Gobierno, por arrêté interministériel (Comercio / Economía-Finanzas / Energía); Comité de suivi des fluctuations des prix des produits pétroliers (CSFPPP).
# Régimen: precio de venta al detalle fijado ad hoc con mecanismo de ajuste automático y subsidio parcial; nacional (el arrêté de mayo-2026 autoriza +20 F CFA máx. en localidades alejadas de estaciones).
# Canales: comunicado del Gobierno en commerce.gouv.tg (solo dic-2024 hallado ahí), prensa (Koaci, Togomatin, L-Frii, republicoftogo.com, APA).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: Gasoil 850 -> 775 (fecha no encontrada; probablemente el ajuste del 28/01/2023 que menciona Beninwebtv, sin cifras) => sin fila de gasoil vigente al 2024-01 (775 solo se deduce del comunicado dic-2024 "diminution de 80");
