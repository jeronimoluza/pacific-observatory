  note: 'Guinéenews 01-06-2022 cita el comunicado del Ministerio de Economía, Finanzas y Plan (noche del 31-05-2022): "le prix des produits pétroliers, notamment l''essence, le gasoil et le pétrole passe de 10 000 GNF à 12 000 GNF à la pompe ... à compter de demain mercredi 1er juin 2022". Nivel vigente al 2024-01-01 y hoy. Confirmaciones posteriores sin cambio: comunicado SONAP 15-02-2024 ("reste pour l''heure à 12.000 GNF le litre de gasoil et d''essence", guineenews.org/2024/02/15/guinee-la-sonap-dement-toute-augmentation-du-prix-des-produits-petroliers/, sha 70026cd382ea); Soleil FM 01-04-2026, nueva estructura SONAP desde 01-04-2026 mantiene essence y gasoil a 12.000 (sha dc16853ccc80); MediaGuinée 07-10-2026 "Depuis le 1er juin 2022, le prix officiel du litre d''essence à la pompe est fixé à 12 000" (sha 52a36319e041); sonapguinee.com 16-10-2026 tabla oficial Réseau 12000. Una sola nota para la fecha de vigencia (sin segunda nota independiente de 2022 descargable), por eso media y no más.'
