# Guinea: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Gobierno (Ministerio de Economía y Finanzas + Hidrocarburos; comunicado del MEF en 2022); SONAP (Société Nationale des Pétroles) publica la estructura de precios (Comité paritaire des prix des produits pétroliers).
# Régimen: precio único nacional fijado ad hoc (essence = gasoil = pétrole en 2022), subsidiado; tarifas sectoriales distintas para minería, EDG, SEG, embajadas, soutes (no cargadas: no son precio de bomba al público).
# Canales: comunicados MEF/SONAP difundidos por prensa (Guinéenews, Soleil FM, MediaGuinée); sonapguinee.com muestra hoy la tabla "PRIX OFFICIELS DES PRODUITS PETROLIERS EN GNF/ LITRE".
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: no hay copia del comunicado MEF del 31-05-2022 (solo la nota de Guinéenews que lo cita); la nota de AllAfrica de mar-2026 (desmentido SONAP)
#   no se pudo descargar (conexión rechazada, sin captura Wayback); el pétrole lampant 12.000 solo está confirmado para 2022 (las confirmaciones 2024-2026 hablan de essence y gasoil;
#   la tabla de sonapguinee.com tiene columna PETROLE pero la fila "Marché TTC Réseau" trae solo dos cifras, 12000 y 12000).
# Sin cambios 2024..hoy: 12.000 GNF/L vigente desde 2022-06-01.
