# Sao Tome and Principe: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Gobierno (Ministro de Estado de Economia y Finanzas anuncia; mecanismo de ajuste automatico del decreto-ley de 2018, umbral +-10%); ENCO importa y distribuye. Regimen: precio administrado y fuertemente subsidiado, ajustes ad hoc. Canales: declaraciones del ministro y comunicados del Gobierno, recogidos por STP-Press (agencia estatal); Lusa/Forbes Africa Lusofona como segunda fuente. ENCO y ANP-STP no publican lista de precios.
# Precio unico nacional en dobras nuevas (STN, desde 2018) por litro; las fuentes no distinguen zonas.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: (1) no se encontro la fecha de vigencia del nivel 37/35 (solo el anuncio del 12-may-2023, "anunciou hoje"); no se pudo verificar que no hubo cambios intermedios entre may-2023 y ene-2025, aunque Lusa/Forbes (28-nov-2025) confirma 37/35/21 al asumir el gobierno en enero de 2025.
#   (2) petroleo: 19 en may-2023 y 21 en ene-2025; la fecha del paso 19->21 no se encontro, por eso NO hay fila de petroleo en 2023 y la primera fila de petroleo (2025-04-05, 21) solo confirma el nivel vigente, no marca un cambio en esa fecha.
#   (3) petroleo nov-2025 -> abr-2026: contradiccion (ver notas de 2025-11-27 y 2026-04-01).
#   (4) no se hallaron cambios despues del 1-abr-2026; Rio Times (8-oct-2026) informa 31/30/19 sin cambios desde abril, en medio de desabastecimiento de gasolina y petroleo desde el 1-oct-2026. No hay evidencia fechada hoy, por eso no hay last_checked.
