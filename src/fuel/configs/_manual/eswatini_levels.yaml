# Eswatini: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Ministry of Natural Resources and Energy (MNRE), comunicado firmado por el/la Principal Secretary (Dorcas N. Dlamini hasta 2024; Lindiwe F. Mbingo desde 2024). ESERA no interviene en el anuncio. Regimen: precio administrado con revision mensual contra el BFP (crudo + E/USD); cambio por over/under-recovery, parte absorbida por el Strategic Oil Reserve Fund. Vigencia: medianoche del jueves, efectivo el viernes. Canales: PDF en gov.sz (sueltos, sin listado; ultimo hallado ene-2024, gov.sz inaccesible desde aqui), X/Facebook del Eswatini Government, prensa (Times of Eswatini, Eswatini Observer, Swazi24, Eswatini Positive News). ENPC (estatal) muestra los precios vigentes en su home, con retraso historico.
# Locality: "national". Las fuentes no dicen que el precio sea de Mbabane/Matsapha: es un precio nacional unico fijado por el MNRE.
# Rehecho desde cero sobre series_eswatini.csv (triage): se quitaron las filas inferidas de jun-2024 (diesel), del paso 2025 21.40->21.00 y las fechas supuestas; se agregaron fuentes para mar-2024, sep-2024, jul-2026 y ago-2026 y paraffin en todas las fechas.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos (entre 2024-03-08 y 2026-02-06 la serie esta INCOMPLETA y el arrastre da niveles equivocados en partes del periodo):
#   (1) entre mar y sep-2024 hubo una baja de diesel 22.90 -> 22.40 y de paraffin 17.25 -> 16.75 (niveles "from" del comunicado de sep-2024); fecha no hallada (Wayback de ENPC sugiere jun-2024, no es fuente). Sin fila.
#   (2) entre sep-2024 y feb-2026: diesel 21.40 -> 20.55, petrol 20.60 -> 20.15, paraffin 15.75 -> 14.90 en uno o mas pasos (el triage cita un post del X del Gobierno del 6-nov-2025 con vigencia 7-nov y un paso previo de diesel a 21.00; no se pudo descargar ni el post ni una nota con cifras). Sin filas.
#   (3) desde el 4-abr-2025 rige una tasa vial (Roads Authority levy) de E0.40/litro incorporada a la estructura de precio sin cambio en surtidor ese mes (Times of Eswatini 4-abr-2025); no es una fila.
#   (4) mar-2024: la fuente unica (Times) repite por error las cifras del diesel para el petrol; ver nota.
# Filas de confirmacion (method 'confirmation: ...'): home de ENPC (estatal, no fija precios) en capturas Wayback 2024-10-05, 2025-01-13, 2025-02-15 (media) y 2025-08-14 (baja, posible desactualizacion), y curl de hoy 2026-10-16 (media, = last_checked). Con carry de 92 dias quedan sin cubrir ~2025-05-16 -> 2026-02-05 (la captura de ago-2025 es baja y no se publica) y los tramos entre cambios de 2024 posteriores a 92 dias. ENPC muestra la misma cifra en 'Unleaded Petrol' y 'Replacement' (sustituto con plomo); se toma Unleaded.
# Tramo >12 meses sin fila publicable: ninguno (maximo 2025-02-15 -> 2026-02-06, ~12 meses). Una busqueda extra de un comunicado o nota 2025 con cifras no encontro nada.
# Todas las filas posteriores a ene-2024 son prensa citando el comunicado del MNRE (confianza media); casi todas 2026 con dos notas independientes.
