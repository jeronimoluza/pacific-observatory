# Congo, Rep.: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: arrêté conjunto de los ministros de Comercio, Finanzas/Economía, Hidrocarburos y Presupuesto ("prix de vente plafond" de los productos sometidos a la estructura de precios), publicado en el Journal officiel (sgg.cg); anuncios previos del Primer Ministro. Régimen: precios administrados y subsidiados, ajustes ad hoc ligados al programa FMI. Canales: Journal officiel (sgg.cg/JO/<año>/), Les Dépêches de Brazzaville (adiac-congo.com), prensa regional.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos:
#   - Gazole 500 -> 625: la nota de la ONG RPDH (16-10-2023, 4a90db0ac826) dice que se aplicó en surtidor "courant octobre 2023" (tras el Consejo de Ministros del 07-10-2023); el primer texto oficial hallado es el arrêté 14335 del 11-11-2023. No se encontró el día exacto de octubre.
#   - Revisé todos los JO ordinarios 2024, 2025 y 2026 en sgg.cg (146 números) buscando "prix de vente plafond": solo aparece el arrêté 95/2025 (sin cambio de precio). El JO 26-2026 (25-06-2026) todavía cita el arrêté 95 como vigente. No hay evidencia posterior a jun-2026 de que 775/625 siga hoy, así que no pongo last_checked.
#   - La suba del super a 1050 anunciada para ene-2024 no figura en ningún arrêté publicado (no se aplicó).
#   - Pétrole lampant (320 FCFA en ambos arrêtés) omitido para mantener solo super/gasoil; Jet A1 y Fioul no aplican.
#   - Confirmaciones (2a pasada): Supercarburant 775 en 2024-06-07 (Ecomatin) y 2024-11-16 (Dépêches de Brazzaville). El JO 26-2026 cita el arrêté 95 pero NO trae precios: no es confirmación.
#   - Tramos >12 meses sin fila: Gazole 2023-11-11 -> 2025-02-01 (~15 meses; ninguna fuente fechada accesible da el gasoil: la nota AllAfrica nov-2024 con 625 no responde) y ambos productos 2025-02-01 -> hoy (~20 meses; sin fuente fechada 2025-2026 con el precio, solo un blog no confiable con 525/450).
