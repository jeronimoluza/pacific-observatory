# Burkina Faso: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Comité interministériel de détermination des prix des hydrocarbures (CIDPH, presidido por el SG de la Primature) + arrêtés conjoints Comercio/Finanzas; SONABHY importa.
# Régimen: precio "impératif" fijado ad hoc y subsidiado; estructura por depósito (Ouagadougou/Bingo y Bobo-Dioulasso; Bobo ~5 F menos). Filas = Ouagadougou.
# Canales: declaración televisada en el JT de RTB + Sidwaya (diario público) / Burkina24 / Wakat Séra; arrêtés conjoints solo circulan vía prensa (sonabhy.bf y gouvernement.gov.bf no los publican).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: arrêté de feb-2023 (n°2023-001, enlazado por Wakat Séra) da 404 y no tiene captura Wayback; no se halló arrêté de ago-2026 (solo declaración RTB);
#   pétrole (kerosene, 980 en ago-2022) omitido: no hay fuente posterior que diga si cambió; precios de Bobo-Dioulasso y provincias no cargados.
