# Gabon: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Commission Nationale des Prix des Produits Pétroliers (CNPPP, ley de abr-2019), bajo el Ministerio del Petróleo y Gas. Régimen: estructura de precios con nota/circular mensual a operadores, pero el precio en surtidor está subsidiado y en la práctica congelado; cambios ad hoc. Canales: nota/circular CNPPP a operadores, difundida solo por prensa (Ecomatin, Gabon Media Time, Gabonreview); no hay sitio oficial accesible (petrole.gouv.ga y otros no responden).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos:
#   - No encontré el texto de la circular CNPPP del 29-12-2023; las filas salen de prensa que la cita.
#   - Nivel previo (605/585) y su fecha no cargados.
#   - Sin ningún cambio confirmado después de ene-2024. La eliminación del subsidio prevista para el 01-01-2026 se suspendió (Ecomatin 07-11-2025); el Consejo de Ministros de oct-2026 (30 mil millones FCFA de subsidio en sep-2026) no anunció tarifa nueva (Bénin Web TV, 09-10-2026).
# Contradicciones (sin resolver; no cargadas):
#   - Ecomatin 07-11-2025 (d4443a951698) dice que los precios "demeurent" en 605 super / 585 gasoil / 400 pétrole: son los niveles PREVIOS a ene-2024 y no hallé ninguna suba que los restableciera. Lo trato como error de redacción.
#   - Gabon Media Time 04-04-2026 (cc65fbfbc85d) dice gasoil "maintenu à 675 FCFA" en mar-2026, sin fuente; el mismo medio el 06-08-2026 da super 595. Sin respaldo oficial.
# No pongo last_checked: ninguna fuente oficial de 2026 confirma 595/575.
