# Congo, Dem. Rep.: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Ministère de l'Economie Nationale (arrêtés de prix) + Comité de Suivi des Prix des Produits Pétroliers (CSPPP); el Ministère des Hydrocarbures co-anuncia. Régimen: precio fijado por zona de aprovisionamiento (Ouest/Sud/Est/Nord), estructura de precios con subsidio (PMAG), ajustes irregulares. Canales: comunicado CSPPP/ministerio vía ACP y prensa; economie.gouv.cd/verite_prix_produits_petroliers publica las estructuras mensuales/trimestrales en PDF escaneado con meses de desfase.
# Solo zona Ouest (Kinshasa). Precios Sud/Est/Nord distintos y no cargados.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Las estructuras oficiales (copias en data/fuel/ssa/central_africa/congo_dem_rep/manual_sources/) confirman los niveles por mes, pero no traen fecha de vigencia del cambio:
#   abr-sep 2025 2990/2979,76; oct 2025 2690/2680; dic 2025-mar 2026 2440(,01)/2430; abr-jun 2026 2640/2635 (essence/gasoil, CDF/L, OCR + lectura a ojo).
# Huecos conocidos:
#   - Nivel vigente al 2024-01-01 (essence 3225 / gasoil 3215, estructura del 23-10-2023 según prensa): no cargado; la nota original (AllAfrica/Radio Okapi) no fue accesible para copiarla.
#   - 2024: ACP (03-10-2024) da como precio previo de la essence 3340 (y AllAfrica, según buscador, gasoil 3435), no 3475/3465. Probable ajuste intermedio may-sep 2024 no encontrado.
#   - Nov 2025: no hay estructura Ouest de noviembre publicada; la fecha del cambio a 2440/2430 sale de la nota del Ministère des Hydrocarbures.
#   - Sin evidencia posterior a la estructura T2-2026 (jun-2026, publicada 26-08-2026): no se confirma el nivel de hoy.
#   - Pétrole lampant, Fomi y GLP omitidos (las notas de prensa no los cubren en todas las fechas).
