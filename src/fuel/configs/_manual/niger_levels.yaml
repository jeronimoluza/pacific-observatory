# Niger: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Ministère du Commerce et de l'Industrie (arrêté de prix plafond, visado por Pétrole y Finances); ARSE publica la tarifa vigente. Régimen: precio plafond fijado ad hoc por arrêté, nacional (mismo precio en todo el territorio).
# Canales: arse.ne/tarif-hydrocarbures/ (HTML + PDF del arrêté), comunicado del SGG relayado por ANP/AFP, página Facebook de la Presidencia.
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: arrêtés mensuales intermedios entre ago-2022 y jun-2024 no encontrados (el arrêté n°0055 del 28/06/2024, abrogado por el 0067, no se halló; sus precios se desconocen pero el comunicado SGG del 17/07/2024 dice que antes regían 540/668);
#   el arrêté 0067 dice "pour la période du 23 juillet au 31 août 2024" y no se encontró arrêté de prórroga; FOD (457) y mélange 2 temps omitidos (no son gasolina/gasoil/kerosene);
#   pétrole lampant no figura en los arrêtés 2022/2024. Sin tramos >12 meses sin fila entre 2024-01 y hoy (con confirmaciones BCEAO, ARSE vía Wayback y Tiani).
#   Capturas Wayback de ARSE 20251210 y 20260517 son páginas anti-bot ('One moment, please...'): no usadas.
# Filas de confirmación (method 'confirmation: ...'): fuente fechada que cita el precio vigente en esa fecha; effective = fecha de la fuente. Tablas BCEAO = precio de fin de mes (effective = último día del mes).
