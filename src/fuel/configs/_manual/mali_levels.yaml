# Mali: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Commission de suivi du mécanisme de taxation des produits pétroliers, presidida por el PDG del OMAP (Office malien des produits pétroliers, ex-ONAP). Régimen: prix plafonds a la pompa fijados ad hoc, nacionales; pétrole lampant y Jet A1 libres.
# Canales: comunicado firmado por el PDG del OMAP difundido por prensa (APA, La Nouvelle Tribune, Alwihda, L-Frii); no se halló el comunicado en ningún sitio oficial (onap.ml / omap.ml no responden).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: nivel vigente al 2024-01 sin fila: las notas de oct-2024 dicen que el Super estaba a 850 y el gasoil a 800, pero no se encontró cuándo se fijaron (jun-2022 era 811/809);
#   las filas de oct-2024 son "baja" (tres notas, cifras contradictorias); L-Frii (26/03/2025) menciona un "deuxième ajustement en début d'année 2025" sin cifras, no encontrado;
#   ningún comunicado OMAP original descargado (todas las filas son prensa). Desde sep-2025 hay bloqueo de combustible (JNIM): los precios reales superan el plafond.
#   Tramos >12 meses sin fila publicable: Supercarburant 2024-01-01..2024-12-30 y Gasoil 2024-01-01..2025-03-25 (solo filas 'baja' de oct-2024).
#   CONTRADICCIONES BCEAO: el Bulletin Trimestriel T4-2025 da para Mali 811/809 hasta mar-2025, 800/750 abr-jun 2025, 775/725 jul-sep 2025 y 800/732-734 oct-dic 2025;
#   el Bulletin mensuel ago-2026 da 866/864 en dic-2023, 800/800 en dic-2024 y 775/725 de ago-2025 a feb-2026. Solo se usaron como confirmación las celdas que coinciden con los niveles de prensa
#   (super 800 dic-2024 con confianza media; sep-2025 y ago-2026 media-alta). El 866/864 de dic-2023 contradice el 850/800 previo que da la prensa: no cargado.
# Filas de confirmación (method 'confirmation: ...'): fuente fechada que cita el precio vigente en esa fecha; effective = fecha de la fuente. Tablas BCEAO = precio de fin de mes (effective = último día del mes).
