# Equatorial Guinea: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: Presidente de la República por decreto (estructura de precios de productos refinados), a propuesta de Hidrocarburos y Desarrollo Minero + Hacienda; en el marco del SMP del FMI.
# Régimen: precio subvencionado fijado ad hoc por decreto para el "mercado subvencionado" (estaciones de servicio, personas físicas, tope 100 L/día gasolina-gasóleo y 40 L/día queroseno); fuera de eso, precio liberalizado.
# Canales: guineaecuatorialpress.com (página oficial del Gobierno) publica decretos y notas; cifras y fechas de aplicación sobre todo en prensa privada (Real Equatorial Guinea, Ahora EG, Imperio GE, Ecomatin).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos y CONTRADICCIÓN PRINCIPAL: el Decreto 26/2025 (3-03-2025, publicado 15-03-2025) fija 645/520, pero NO hay evidencia de que se aplicara en surtidor:
#   el FMI (3ª revisión SMP, dic-2025) dice que el compromiso de subir 150 FCFA/L antes de fin-sep-2025 "not met" y llama "first price increase" a la de 75 prevista para feb-2026;
#   y el Decreto 40/2026 (vigente 01-06-2026) da 570/545 = 495/470 + 75, Jet A1 505 = 430 + 75, presentado como subida ("Golpe al bolsillo").
#   Por eso las filas 645/520 van como confidence baja (alerta, no publicar). Ecomatin (10-02-2026) proyectaba 720/595 sumando 75 a 645/520: no ocurrió.
#   No hay texto del Decreto 40/2026 ni del BOE online; la nota de Ahora EG del 28-05-2026 (anuncio de vigencia 1-jun) dio 403 y no tiene captura.
#   Sin evidencia de precios posteriores a jun-2026 (oct-2026: crisis de abastecimiento, sin cambio de precio publicado); por eso no hay last_checked.
#   CPDS (cpdsge.org, sin fecha) también da 570/545 pero dice que el decreto se firmó el 13-05-2026 (Imperio GE: 13-03; Ahora EG según buscador: 3-03).
#   CONTRADICCIÓN ago-2026: el ranking EcoMatin (tchadinfos 05-08, Gabon Media Time 06-08) pone a Guinea Ecuatorial en 645, cuando rige 570 desde 01-06-2026: no es confirmación.
# Filas de confirmación: 2025-03-15 (lampante, web oficial), 2025-03-20 (gasolina 495, gasóleo 470; AFP: aplicación del decreto pendiente), 2026-06-01 (lampante).
# Tramos >12 meses sin confirmación: gasolina y gasóleo 2024-01-01 -> 2025-03-20 (la fila 2022-03-01 cubre hasta ~2023-03) y 2025-03-20 -> 2026-06-01 (~14 meses;
#   Ecomatin 10-02-2026 suponía 645/520 vigentes: contradice, no confirma); lampante 2024-01-01 -> 2025-03-15.
