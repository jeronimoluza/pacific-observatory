# Chad: niveles oficiales de precios de combustible, una fila por (vigencia, producto).
# Autoridad: arrêté conjoint Ministerio de Industria y Comercio + Ministerio de Finanzas y Presupuesto (anunciado a veces por el Primer Ministro o el ministro de Hidrocarburos).
# Régimen: precio fijado ad hoc por arrêté, subsidiado; precio de referencia en N'Djamena, provincias = N'Djamena + frais de transport en valeur absolue.
# Canales: el arrêté no se publica online (petrole.gouv.td placeholder, gouvernement.td/primature.td/sgg.td sin respuesta); se conoce por prensa privada (tchadinfos, Ecomatin).
# Productos no listados en una fecha siguen sin cambio desde su fila anterior.
# Huecos conocidos: ningún texto del arrêté a la vista (todas las filas son prensa privada citando el arrêté -> confidence media);
#   fecha real de inicio de Super 518 y Pétrole lampant 392 desconocida (anterior a abr/may-2023; las filas usan la primera fecha en que una fuente las fija);
#   Pétrole lampant en feb-2024 no aparece en las notas (se asume sin cambio porque jun-2024 lo da en 392 sin mencionar baja);
#   GLP no cubierto; Jet A1 omitido (no es combustible de bomba).
# Sin evidencia posterior al 2026-08-05 (tchadinfos: 700 super / 800 gasoil "restent en vigueur selon les données disponibles"); por eso no hay last_checked.
# Filas de confirmación: 2026-08-05 (Super, Gasoil; tchadinfos) y 2026-08-06 (Super; Gabon Media Time, mismo ranking EcoMatin).
# Tramos >12 meses sin confirmación: Super y Gasoil 2024-06-17 -> 2026-08-05 (~25 meses; en 2025 solo notas de escasez sin precio, p. ej. tchadinfos 28-04-2025);
#   Pétrole lampant 2024-06-17 -> hoy (ninguna fuente fechada posterior lo cita).
# Contradicción menor: Le N'Djam Post 15-02-2024 dice arrêté "signé le 14 février 2024" (tchadinfos y Ecomatin: 13-02).
