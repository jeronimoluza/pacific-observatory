# Asset manifest: fuel (regions eca, menaap, sar, ssa, lac; EAP stays on the legacy
# pipeline in ../pacific-observatory and is not a node here). Same schema as prices.yaml.
# Mac paths: TR = ~/wb/pacificobservatory/repo/template-repo.
pipeline: fuel
code_ref: origin/mvp/fuel  # pasar a origin/main cuando mvp/fuel se mergee

nodes:
  fuel.publish:
    estado: prod
    observer: fuel_status
    code_paths:
      - src/fuel/collect.py
      - src/fuel/fx.py
      - src/fuel/fx_parallel.py
      - src/prices/fx/parallel.py
      - src/prices/fx/parallel_sources.py
      - src/fuel/process.py
      - src/fuel/publish.py
      - src/fuel/publish_xlsx.py
      - src/fuel/publish_parallel.py
      - src/fuel/gates.py
      - src/fuel/configs/**/*.yaml
    paths:
      - {path: "~/wb/pacificobservatory/repo/template-repo/outputs/fuel/dashboards/<region>_fuel_dashboard.html", machine: mac}
      - {path: "~/wb/pacificobservatory/repo/template-repo/outputs/fuel/excels/<region>_fuel_prices.xlsx", machine: mac}
      - {path: "~/wb/pacificobservatory/repo/template-repo/data/fuel/_status/<region>.json", machine: mac, role: status}
    partition: region
    run: >-
      po fuel collect -r R (x5 en paralelo) -> po fuel refresh-fx -> po fuel build -r R
      (secuencial) -> po fuel publish -r R
    freshness: un publish por semana (<= 8 días)
    checks:
      - {color: rojo, desc: publish bloqueado por el gate de países (bajó el conteo)}
      - {color: rojo, desc: sin publish en > 8 días}
      - {color: amarillo, desc: fallas de fuente nuevas (no están en known_failures.md)}

  fuel.country:
    code_ref: origin/mvp/panel36
    estado: prod
    observer: fuel_country
    inputs: [fuel.publish]
    code_paths:
      - src/fuel/process.py
      - src/fuel/fill_rule.py
      - src/fuel/regime_check.py
      - src/fuel/configs/**/*.yaml
    paths:
      - {path: "~/wb/pacificobservatory/repo/template-repo/outputs/fuel/<region>/<subregion>/<country>/fuel_family_usd_prices.csv", machine: mac}
      - {path: "~/po-worktrees/fuel-scale/outputs/fuel/<region>/<subregion>/<country>/fuel_family_usd_prices.csv", machine: a8}
      - {path: "~/wb/pacificobservatory/repo/template-repo/outputs/fuel/regime_alerts/<date>.csv", machine: mac, role: state}
      - {path: "~/po-worktrees/fuel-scale/outputs/fuel/regime_alerts/<date>.csv", machine: a8, role: state}
    partition: country
    run: po fuel build -r R (por país) y po fuel regime-check (timer diario 07:45 UTC en a8)
    freshness: último día publicado por familia (con el arrastre de fill_rule) <= 31 días
    checks:
      - {color: rojo, desc: país construido sin filas publicadas}
      - {color: rojo, desc: "ninguna familia vigente (último día publicado, con arrastre, > 31 días)"}
      - {color: amarillo, desc: "price_basis no retail (fallback rotulado), alguna familia vieja o alertas de regime-check"}
