# Country registry — single source of truth for all pipelines.
# Each pipeline's YAML configs reference country slugs defined here.
#
# To add a country:
#   1. Add an entry below
#   2. Add the country slug to the appropriate region in regions.yaml
#   3. Create pipeline-specific configs (fuel/configs/{region}/, text/configs/{region}/, etc.)

