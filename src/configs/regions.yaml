# Region and subregion topology — defines where countries sit in the
# WB geographic hierarchy. Country properties live in countries.yaml.
#
# Usage:
#   po text collect --region eap
#   po text build --subregion pacific_islands
#   po init --region eca
#
# To add a country:
#   1. Add slug to the appropriate subregion's countries list below
#   2. Add properties entry in countries.yaml
#   3. Create pipeline-specific configs as needed
#
# To add a subregion:
#   1. Add under the appropriate region with name + countries list
#
# To add a region:
#   1. Add top-level key with name + subregions

eap:
  name: East Asia & Pacific
  subregions:
    east_asia:
      name: East Asia
      countries:
        - china
        - japan
        - south_korea
        - mongolia
    pacific_islands:
      name: Pacific Islands
      countries:
        - australia
        - fiji
        - french_polynesia
        - guam
        - marshall_islands
        - new_caledonia
        - new_zealand
        - palau
        - papua_new_guinea
        - samoa
        - solomon_islands
        - tonga
        - tuvalu
        - vanuatu
    southeast_asia:
      name: Southeast Asia
      countries:
        - cambodia
        - indonesia
        - lao_pdr
        - malaysia
        - myanmar
        - philippines
        - singapore
        - thailand
        - timor_leste
        - vietnam

eca:
  name: Europe & Central Asia
  subregions:
    eastern_europe:
      name: Eastern Europe
      countries:
        - ukraine
