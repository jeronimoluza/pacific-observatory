# Regions and countries — single source of truth for all pipelines.
#
# Usage:
#   po fuel collect --region pacific
#   po init --region middle_east
#
# To add a region:
#   1. Add a top-level key below with name, description, and countries
#   2. Run: po init --region <name>
#   3. Create pipeline configs in src/{pipeline}/configs/{region}/
#
# To add a country:
#   1. Add it under the appropriate region's countries key
#   2. Create pipeline-specific configs as needed

