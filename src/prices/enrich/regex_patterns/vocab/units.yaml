# M/P-class unit vocab (locale-invariant productions over this data table).
# surfaces are matched case-insensitively where the source pattern used IGNORECASE.
# basis/su/mul reproduce unit_tables.UNIT_MAP. Adding a unit spelling = one row.

# Cyrillic surfaces (гр/г/кг/мг/мл/л) share the SAME alternation as the latin
# ones: the codepoints are disjoint, so a latin name can never reach them and a
# Cyrillic name can never reach the latin ones. Before they were added, every
# ru/uk/bg/kk/ky/tk/mk/be name stated its size in a script the M-class could not
# read and fell through to pricing_basis=item -- 19-59% of the rows in those
# countries. Bare 'г'/'л' are safe behind the '(?<![A-Za-z0-9.])' left guard plus
# a required digit: a year ("2024 г") is the only known collision, and it is
# ~0.06% of bare-'г' fires measured over a 288k-row corpus sample.
# Hebrew / Thai / Arabic-Persian surfaces are here for the same reason as the
# Cyrillic ones: they are the only spelling those corpora use, they share no
# codepoint with any other script in the table, and the value half already
# parses -- Python's \d and float() both accept Arabic-Indic and Persian digits,
# so "454 gram" written as arabic-indic numerals reads without touching the
# value production.
# Extraction-quality step 3 added four surfaces (2026-09-23): grs and Georgian
# გრ (grams), cc and Persian میل (millilitres), in both tables. Each takes this
# table's fixed shape, pinned here because the YAML has no per-surface field:
# case-insensitive (VALUE_UNIT and the P-class compile with IGNORECASE), left
# guard `_LB` (no letter or digit, and no digit-then-dot, before the number),
# optional whitespace between number and unit, and a trailing `\b`, so "320cc"
# and "320 CC" read as 0.32 lt while "cc cream" (no number) and "320ccs" do not.
# Spelled-out gram/grams and katakana ポンド (pound) added 2026-09-27: "Maloca -
# 400 Gram", "SHRIMP PASTE 500gram", "サーロインステーキ 1ポンド" fell to item.
# Four source patches (pasar_segar, sayurbox, hypermart, nutrimart_id) already
# read "gram" locally; ~700 01+02.1 names in eight other sources did not.
# M-class canon measure surfaces (the VALUE_UNIT alternation), longest-first-safe.
measure:
  - {basis: mass,   su: kg, mul: 0.001,     surfaces: [ｇ, グラム, grams, gram, grs, gm, gr, g, гр, г, გრ, גרם, גר, ג, กรัม, جرام, غرام, جم, غم, گرم]}
  - {basis: mass,   su: kg, mul: 1.0,       surfaces: [ｋｇ, キログラム, キロ, kg, кг, 'ק"ג', קג, קילוגרם, קילו, กิโลกรัม, กิโล, กก, كيلوجرام, كيلوغرام, کیلوگرم, كجم, كغم, كيلو, کیلو, كغ]}
  - {basis: mass,   su: kg, mul: 0.000001,  surfaces: [ｍｇ, mg, мг]}
  - {basis: mass,   su: kg, mul: 0.0283495, surfaces: [oz]}
  - {basis: mass,   su: kg, mul: 0.453592,  surfaces: [lb, ポンド]}
  - {basis: volume, su: lt, mul: 0.001,     surfaces: [ｍｌ, ｃｃ, ミリリットル, ml, cc, мл, 'מ"ל', מל, מיליליטר, มิลลิลิตร, ซีซี, มล, ملي لتر, میلی‌لیتر, میلی لیتر, ملل, میل, مل]}
  - {basis: volume, su: lt, mul: 1.0,       surfaces: [ｌ, リットル, liters, litres, liter, litre, ltrs, ltr, lt, l, л, ליטר, ל, ลิตร, ليتر, لیتر, لتر]}

# P-class pack-measure unit surfaces — NARROWER than M (no cl, no litre-words,
# bare l only), reproducing NUM_X_VALUE_UNIT / VALUE_UNIT_X_NUM verbatim.
pack_measure:
  - {basis: mass,   su: kg, mul: 0.001,     surfaces: [ｇ, グラム, grams, gram, grs, gm, gr, g, гр, г, გრ, גרם, גר, ג, กรัม, جرام, غرام, جم, غم, گرم]}
  - {basis: mass,   su: kg, mul: 1.0,       surfaces: [ｋｇ, キログラム, キロ, kg, кг, 'ק"ג', קג, קילוגרם, קילו, กิโลกรัม, กิโล, กก, كيلوجرام, كيلوغرام, کیلوگرم, كجم, كغم, كيلو, کیلو, كغ]}
  - {basis: mass,   su: kg, mul: 0.000001,  surfaces: [ｍｇ, mg, мг]}
  - {basis: mass,   su: kg, mul: 0.0283495, surfaces: [oz]}
  - {basis: mass,   su: kg, mul: 0.453592,  surfaces: [lb, ポンド]}
  - {basis: volume, su: lt, mul: 0.001,     surfaces: [ｍｌ, ｃｃ, ミリリットル, ml, cc, мл, 'מ"ל', מל, מיליליטר, มิลลิลิตร, ซีซี, มล, ملي لتر, میلی‌لیتر, میلی لیتر, ملل, میل, مل]}
  - {basis: volume, su: lt, mul: 1.0,       surfaces: [ｌ, リットル, l, л, ליטר, ל, ลิตร, ليتر, لیتر, لتر]}
