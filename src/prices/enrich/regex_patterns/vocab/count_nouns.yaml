# C-class count-noun specs, keyed by pattern id. <num><noun> OR <noun><num>.
# The builder (grammar.py) supplies module-level metadata (lang/script/kind/
# bucket/role); this table supplies only the regex-generation shape per id.
#
# templates:
#   num_noun : (?<!\w?)<num> [sep] (?:NOUN) \b     lb: word (?<!\w) | none
#   noun_num : \b(?:NOUN) \s+ <num> \b
#   fixed    : \b(?:NOUN)\b  with fixed_count
#   regex    : verbatim fragment (structural specials); must name group `count`
# case: ci (ignorecase) | cs (case-sensitive; enumerate variants in NOUN)
# sep : optional (\s*) | required (\s+) | glued (no space)

# --- canon channel (feed extract_pack as pack_count) -------------------------
NUM_PCS:
  {template: num_noun, sep: optional, lb: word, case: ci,
   nouns: ['PCS', 'Pcs', 'pcs', 'pieces?', 'pack', 'PACK', 'Pack', 'ct', 'CT']}
NUM_PC_GLUED:
  {template: regex, case: ci, regex: '(?<!\w)(?P<count>\d+)pc\b(?!s)'}
NUM_X_TRAILING:
  {template: regex, case: ci, regex: '(?P<count>\d+)\s*[xX×]\s*$'}
# "Khay N lon|chai|hộp" is a tray of N cans ("Heineken 0.0 Khay 24 Lon 250ml");
# a bare "Khay 500" is a 500 g tray, so khay needs the container noun after N.
LOC_VI:
  {template: noun_num, case: ci,
   nouns: ['Lốc', 'Thùng', 'Hộp', 'Bộ', 'Combo', 'Set', 'Khay(?=\s+\d+\s*(?:lon|chai|hộp)\b)']}
# A box/tray OF N eggs or fruit ("Hộp 10 Trứng ... 530G"): N counts the pieces,
# not boxes. Listed in normalize._TOTAL_INTERNAL_COUNT_IDS, so a stated weight
# is the total and N stays inert; with no weight N is the count.
LOC_VI_PIECES:
  {template: regex, case: ci,
   regex: '\b(?:Lốc|Thùng|Hộp|Bộ|Combo|Set|vỉ|vĩ|khay)\s+(?P<count>\d+)\s*(?:trứng|quả|trái)(?![^\W\d_])'}
COUNT_UNIT_VI:
  {template: num_noun, sep: optional, lb: none, case: ci,
   nouns: ['cái', 'cây', 'gói', 'chai', 'lon', 'chiếc', 'hộp', 'bịch', 'viên', 'miếng']}

# --- extra_count channel (fallback; decide rung 8) ---------------------------
VI_TO_SHEETS:
  {template: regex, case: cs, regex: '(?P<count>\d+)\s*Tờ\b'}
# Pieces the product IS (eggs, fruit), not containers: the count is inert
# against a stated total weight ("10 trứng ... 530g"), so extra_count, not canon.
# "con" counts animals ("Bào ngư (1 CON)"). Not after "N/": "1/2 con" is half a
# bird. "12 con giáp" is the zodiac. A shrimp grade "28 - 32con" (pieces per kg)
# still reads 32; a range can't be told from "loại 1 - 6 trứng" (grade 1, six
# eggs), and on a mass-only leaf the count lands in basis review, not imputation.
VI_PIECE_NOUN:
  {template: regex, case: ci, regex: '(?<!\w)(?<!\d/)(?P<count>\d+)\s*(?:quả|trái|trứng|con(?!\s*giáp))(?![^\W\d_])'}
# "vỉ 6q": q = quả, glued to the number.
VI_Q_GLUED:
  {template: regex, case: cs, regex: '(?<!\w)(?P<count>\d+)q\b'}
# "Vỉ 10" / "vĩ 6": a tray of N eggs.
VI_TRAY:
  {template: regex, case: ci, regex: '\bv[ỉĩ]\s*(?P<count>\d+)\b'}
EN_CAPS:
  {template: num_noun, sep: optional, lb: word, case: cs,
   nouns: ['Caps?', 'Capsules?', 'caps?', 'capsules?', 'CAPS?', 'CAPSULES?']}
EN_TABLETS:
  {template: num_noun, sep: optional, lb: word, case: cs,
   nouns: ['Tabs?', 'Tablets?', 'tabs?', 'tablets?', 'TABS?', 'TABLETS?']}
EN_SACHETS:
  {template: regex, case: cs, regex: '\b(?P<count>\d+)[sS]\b(?:\s|$)'}
EN_SHEETS:
  {template: num_noun, sep: optional, lb: word, case: cs,
   nouns: ['Sheets?', 'sheets?', 'SHEETS?']}
EN_PACK_OF:
  {template: regex, case: cs, regex: '\bPack\s*(?:of|[xX])\s*(?P<count>\d+)\b'}
EN_N_PACK:
  {template: regex, case: cs, regex: '\b(?P<count>\d+)\s*[-]?\s*(?:Pack|PACK|pack)\b'}
EN_N_INDIVIDUAL_PACK:
  {template: regex, case: cs,
   regex: '\b(?P<count>\d+)\s*(?:INDIVIDUAL|Individual|individual)\s*(?:PACK|Pack|pack)\b'}
EN_HALF_DOZEN:
  {template: fixed, case: cs, fixed_count: 6, nouns: ['(?:Half|HALF|half)\s*(?:Dozen|DOZEN|dozen)']}
EN_DOZEN:
  {template: fixed, case: cs, fixed_count: 12, nouns: ['Dozen', 'DOZEN', 'dozen']}
EN_TWIN_PACK:
  {template: fixed, case: cs, fixed_count: 2, nouns: ['Twin\s*Pack']}
EN_TRIPLE_PACK:
  {template: fixed, case: cs, fixed_count: 3, nouns: ['Triple\s*Pack', 'Tri\s*Pack']}
EN_DOUBLE_PACK:
  {template: fixed, case: cs, fixed_count: 2, nouns: ['Double\s*Pack']}
VI_PIECES:
  {template: regex, case: cs, regex: '\b(?P<count>\d+)\s*M\b'}
NUM_ROLLS:
  {template: num_noun, sep: required, lb: word, case: cs, nouns: ['Rolls?', 'rolls?', 'ROLLS?']}
EN_COMMA_XN:
  {template: regex, case: cs, regex: ',\s*[xX]\s*(?P<count>\d+)\b'}
EN_PCS:
  {template: regex, case: cs,
   regex: '(?<!\w)(?P<count>\d+)\s*(?:PCS|Pcs|pcs|PIECES|Pieces|pieces|PIECE|Piece|piece)\.?\b'}
EN_APOS_S:
  {template: regex, case: cs, regex: "\\b(?P<count>\\d+)\\s*['’`]\\s*[sS]\\b"}
EN_N_TICKETS:
  {template: num_noun, sep: required, lb: word, case: cs,
   nouns: ['Tickets?', 'tickets?', 'TICKETS?']}
# Russian pharmacy counts. lb: none, not word: the names glue a Latin `N` to
# the digits ("ЦИТОФЛАВИН N100 ТАБЛ"), and `(?<!\w)` rejects that -- 2,758
# corpus rows with it, 730,907 without (00-SPEC, 2026-09-17 round 2).
RU_TABS_CAPS:
  {template: num_noun, sep: optional, lb: none, case: ci, nouns: ['табл', 'капс']}
# Thai eggs: ฟอง is the classifier for eggs ("ไข่ไก่ 30 ฟอง" = 30 eggs). Not
# before "x N": "30 ฟอง x 4" is four trays, and extra_count cannot carry the 4.
TH_EGGS:
  {template: regex, case: cs, regex: '(?<![\d.,])(?P<count>\d+)\s*ฟอง(?!\s*[xX×]\s*\d)'}

# broad bidirectional count-noun class (C): <num><noun> + guarded <noun><num>.
# Appended last so existing first-match order is unchanged; fires only when no
# narrower pattern above already captured the integer.
EN_COUNT_NUM_NOUN:
  {template: num_noun, sep: optional, lb: word, case: ci,
   nouns: ['slices?', 'sachets?', 'cakes?', 'combos?', 'pods?', 'sliders?',
           'sticks?', 'bars?', 'tins?', 'trays?', 'tubes?', 'bottles?',
           'cans?', 'jars?', 'cups?', 'bags?', 'boxe?s?', 'cases?', 'sets?',
           'pk', 'stk', 'unidades', 'piezas', 'und']}
# Noun-then-number is the low-precision direction: real large packs are written
# number-first ("300 Pack", "200'S"), while a bare number TRAILING a container
# noun is usually an SKU ("Duo Pack 806939") or a gram weight ("TIN BOX 250").
# Bounded to two digits so "Box 12" still reads as a count and the rest fall
# through to `item` rather than fabricating a denominator.
EN_COUNT_NOUN_TRAIL:
  {template: regex, case: ci,
   regex: '\b(?:pack|combo|set|box|case)\s*-?\s*(?P<count>\d{1,2})(?![\d.,]*\s*(?:ml|mls|l|ltrs?|litres?|liters?|cl|dl|g|gm|gr|grams?|kg|mg|oz|lb)\b)\b'}
