# Brand-prior whitelist for tier-b residual rescue.
#
# Schema:
#   {brand_normalized}:
#     coicop: <4 or 5-digit coicop code>     # required
#     note:   <short rationale>              # optional, for human review
#
# Lookup is keyed on the canonical brand token produced by
# normalize._apply_brand_aliases (which reads static/brand_aliases.json).
# A brand listed here MUST also have an entry mapping its raw forms to the
# canonical token in brand_aliases.json — otherwise the normalizer never tags
# it and this whitelist is dead code.
#
# Curation rule: only include brands whose primary product line is
# unambiguous at the 4-digit COICOP level. Marlboro is unambiguous (all
# variants → cigarettes / 02.3.0). Sony is NOT unambiguous (consumer
# electronics span 09.1.1 audiovisual, 09.1.2 PCs, 12.7.0 misc) — left out
# until cluster-aware sub-prior is added.

# ----- Tobacco (COICOP 02.3) -----
marlboro:
  coicop: "02.3.0"
  note: "Philip Morris cigarettes; all sub-brands (Red, Gold, Black Menthol) are cigarettes"
camel:
  coicop: "02.3.0"
  note: "JTI/Reynolds cigarettes"
lucky-strike:
  coicop: "02.3.0"
  note: "BAT cigarettes"
winston:
  coicop: "02.3.0"
  note: "JTI cigarettes"
dunhill:
  coicop: "02.3.0"
  note: "BAT cigarettes — note: also a luxury accessories line, rare in price scrapes"
mevius:
  coicop: "02.3.0"
  note: "JT cigarettes (was Mild Seven); dominant JP brand"
fortune:
  coicop: "02.3.0"
  note: "PMFTC PH cigarettes — local market leader"
hope:
  coicop: "02.3.0"
  note: "PMFTC PH cigarettes"

