# Cascade tuning surface — the four KNN tunables, single-defined here.
#
# Loaded at import by `config.py`, which exposes each value under its existing
# module-level constant name (KNN_BOOTSTRAP_CLUSTER_FLOOR, etc.) so every
# `config.<NAME>` import site resolves unchanged. Mirrors the existing
# static/channel_coicop_priors.yaml in-static YAML pattern.
#
# Values here are byte-identical to the previous inline literals — this file is
# a relocation, not a re-calibration. Phase 1 re-tunes the cascade by editing
# these values; the test_config_knobs.py guard asserts no silent drift.

# Tier-b cluster-resolved KNN: coicop_code cluster-agreement floor at query
# time. Accept the cluster's coicop only when this share of the K neighbors
# sharing the chosen coicop agree.
knn_cluster_agreement_min: 0.90

# Sub_label_id co-gate at query time. When coicop passes but the K neighbors
# disagree on sub_label_id below this threshold, route to a constrained tier-c
# call instead of writing the cluster's sub_label_id straight through.
knn_sub_label_agreement_min: 0.90

# Minimum per-(canonical_strict, country, channel) cluster size before a
# bootstrap HNSW index is built for that country.
# was 200; lowered post-sanitization to retain SG/MY indices (5k eval, 2026-06-11)
knn_bootstrap_cluster_floor: 150

# Channel-aware KNN: keep only same-channel neighbors when at least this many
# clear the threshold; otherwise fall through to cross-channel candidates
# (logged as cross_channel_accept=True).
min_same_channel_knn: 3
