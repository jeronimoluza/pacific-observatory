# Query-bank vocabulary. `po prices discovery load-bank <country>` expands it.
# cities[0] is the main commercial city. Leave a term out where locals would
# search with another language's word. Terms marked "unverified" want a
# native speaker's check.
country: belarus
names:
  en: Belarus
  ru: Беларусь
  be: Беларусь
cities: [Минск, Гомель, Могилёв, Витебск, Гродно, Брест]
currency_words: [руб, BYN, р., белорусских рублей]
terms:
  ru:
    online_shop: интернет-магазин
    supermarket: супермаркет
    pharmacy: аптека
    electronics: магазин электроники
    phone_shop: магазин телефонов
    building_materials: строительные материалы
    cosmetics: косметика
    clothing: магазин одежды
    furniture: мебель
    food_delivery: доставка еды
    fuel_price: цены на топливо
    electricity_tariff: тарифы на электроэнергию
    water_tariff: тарифы на воду
    mobile_data_plans: тарифы мобильного интернета
    transport_fares: стоимость проезда
    market_prices: цены на рынке
    consumer_price_index: индекс потребительских цен
    classifieds: объявления
    price: цена
    buy_online: купить онлайн
    price_list: прайс-лист
  en:
    online_shop: online store
    supermarket: supermarket
    pharmacy: pharmacy
    electronics: electronics store
    phone_shop: phone shop
    building_materials: building materials
    cosmetics: cosmetics
    clothing: clothing store
    furniture: furniture store
    food_delivery: food delivery
    fuel_price: fuel price
    electricity_tariff: electricity tariff
    water_tariff: water tariff
    mobile_data_plans: mobile data plans
    transport_fares: transport fares
    market_prices: market prices
    consumer_price_index: consumer price index
    classifieds: classifieds
    price: price
    buy_online: buy online
    price_list: price list
  be:
    online_shop: інтэрнэт-крама            # unverified
    pharmacy: аптэка                       # unverified
