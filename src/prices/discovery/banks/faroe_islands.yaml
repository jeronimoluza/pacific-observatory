# Query-bank vocabulary. `po prices discovery load-bank <country>` expands it.
# cities[0] is the main commercial city. Leave a term out where locals would
# search with another language's word. Terms marked "unverified" want a
# native speaker's check.
country: faroe_islands
names:
  en: Faroe Islands
  fo: Føroyar
cities: [Tórshavn, Klaksvík, Runavík]
currency_words: [kr, DKK, krónur]
terms:
  fo:
    online_shop: vevsøla                  # unverified
    supermarket: handil                   # unverified
    pharmacy: apotek
    electronics: elektronikkur            # unverified
    clothing: klæði                       # unverified
    furniture: húsgøgn                    # unverified
    fuel_price: bensinprísur              # unverified
    electricity_tariff: raforkuprísur     # unverified
    water_tariff: vatnprísur              # unverified
    mobile_data_plans: farsímaaskrift     # unverified
    consumer_price_index: kappingarvísitala   # unverified
    classifieds: smáar lýsingar           # unverified
    price: prísur                         # unverified
    price_list: prísskrá                  # unverified
  en:
    online_shop: online shop
    supermarket: supermarket
    pharmacy: pharmacy
    electronics: electronics store
    phone_shop: phone shop
    building_materials: building materials
    cosmetics: cosmetics
    clothing: clothing store
    furniture: furniture store
