notes: |
  Sushiya — Ukraine's largest fast-casual sushi chain (21 restaurants, 5 cities).
  Magento storefront, fully server-rendered menu (Tier 1A, no Playwright):
  li.product-item cards, name in a.product-item-link, price in the .price span
  of the finalPrice wrapper ("395 ₴"). Crawls rolls/sets/sushi/soups/drinks/
  appetizers -> COICOP 11.1 (restaurants & catering), the one division otherwise
  only covered by accommodation. Whole source is restaurant menu -> single
  COICOP, source_curated. Reachable from non-UA IPs (2026-06).
