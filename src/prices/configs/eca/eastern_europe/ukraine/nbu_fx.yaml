notes: |
  Official NBU UAH exchange rates for reference currencies (USD/EUR/GBP/PLN/CNY)
  via the date-range endpoint (one request per currency per window). FX is an
  RER/PPP denominator series with no COICOP position — coicop_code is null by
  design (coicop_codes empty). price_local is UAH per 1 unit of the currency.
