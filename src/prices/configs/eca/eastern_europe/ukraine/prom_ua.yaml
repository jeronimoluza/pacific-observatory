notes: |
  Prom.ua — Ukraine's largest general-merchandise marketplace. Server-rendered
  listings (Tier 1A, no Playwright); product blocks key off stable data-qaid QA
  hooks (visible CSS classes are hashed) and the final price sits in
  data-qaprice. Crawls clothing/footwear (03), furniture (05) and recreation
  goods — toys/sport/books (09) landings -> COICOP via downstream Gemini.
  ~10 SSR cards/page, ?page=N paginates. Reachable from non-UA IPs (2026-06).
