archive_prefix: pegas.md/
notes: |
  Pegas Moldova's first-party Magento REST proxy exposes stable SKU IDs,
  product names, current MDL prices, live SKU detail URLs, and stock attributes. It
  reports 9,136 products and accepts 100-item pages, so the onboarding smoke
  is a validation run rather than a catalogue-size cap. Zero prices and
  disabled products are excluded.
