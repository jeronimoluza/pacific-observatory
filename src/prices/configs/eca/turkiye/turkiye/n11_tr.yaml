  site specifically) -- relies on the project-wide default chrome120
  impersonation, no per-spider override.
  No discovered category-browse sitemap; catalog surface is the Vue-SSR
  search endpoint /arama?q=<term>&pg=<N>, server-rendered product cards
  (name in h2.product-item-title, current price in h3.price-currency,
  Turkish-locale formatted "17.400 TL"). Walks a fixed list of Turkish
  category search terms.
  Enumerability proof: /arama?q=telefon&pg=1 vs ...&pg=2 -- 26 distinct
  product ids each, only 1 overlapping.
  channel is marketplace, coicop_codes unset -- n11 mixes 1P/3P sellers
  with no reliable per-card seller signal in the server-rendered markup
  (grouped with hepsiburada_tr per shard note as "large Turkish
  marketplaces").
