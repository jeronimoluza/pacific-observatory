scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: technodom_kz
url: https://www.technodom.kz/
language: ru
cadence: weekly
channel: electronics
archive_prefix: "www.technodom.kz/p/"
archive_path_re: '^/p/[^/?]+-\d+$'
notes: |
  Page family: listing (category pages). Next.js SSR storefront -- category
  pages under /catalog/<dept>/<subdept> embed the full product list for that
  page inside a <script id="__NEXT_DATA__"> JSON blob at
  props.pageProps.initialState.productList, no Playwright and no separate
  API call needed. Re-verified live 2026-09-06: GET
  /catalog/smartfony-i-gadzhety/smartfony-i-telefony/smartfony -> 200, 1.7MB,
  24/482 SKUs on page 1 across 21 pages; ?page=2 returns a disjoint SKU set
  (real pagination, confirmed). Sample: sku 293876 'Смартфон Apple iPhone 17
  Pro Max 12/256GB/6.9/48 Silver' KZT 871990. Product PDP lives at
  /p/<uri>-<sku>. Currency KZT matches countries.yaml.

  Note: airba.kz, a related P4 candidate on the same triage sheet
  ("Airba Fresh" grocery, per AI_NOTES), now DNS/redirects straight to this
  same www.technodom.kz -- the grocery storefront the notes described no
  longer exists as a separate site. Do not onboard airba.kz separately.
