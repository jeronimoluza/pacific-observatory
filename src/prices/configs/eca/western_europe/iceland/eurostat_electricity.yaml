notes: |
  Eurostat household electricity price (dataset nrg_pc_204), band DC
  (2,500-4,999 kWh/yr), all taxes and levies included (I_TAX), reported in
  national currency (NAC). Half-yearly cadence; fetcher emits only the latest
  published half-year (idempotent on cutoff). Verified live 2026-08-07 via
  the Eurostat JSON-stat 2.0 REST API, single-geo filter (e.g. Bulgaria
  2025-S2 = 0.265 BGN/kWh). Shared module _shared/eca/eurostat_energy.py
  covers 41 ECA countries with one implementation.
