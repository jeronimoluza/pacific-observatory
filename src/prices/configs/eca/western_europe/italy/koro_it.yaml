scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: koro_it
language: it
cadence: weekly
channel: specialty-food
archive_prefix: "www.koro-shop.it/"
archive_path_re: '^/[a-z0-9\-]+-[0-9]+(-x-[0-9]+)?-(g|kg|ml|l)$'
notes: |
  Nuxt3 frontend over the shared Shopware 6 backend (bff.koro.com); one
  sales channel per country, this is koro_it (own domain koro-shop.it).
  Store API POST /store-api/product with sw-access-key header. Requires
  "total-count-mode":1 or Shopware reports total==page size. Access key is
  channel-scoped -- do not reuse across KoRo country storefronts. Full
  platform writeup: see eca/western_europe/austria/koro_at.yaml.

  Verified live 2026-08-07: POST with the IT access key returns real IT
  catalog rows priced in EUR. URL built as www.koro-shop.it/detail/{id}.
  Note: src/prices/configs/eca/western_europe/italy/spesalia_it.yaml
  already exists (a PrestaShop specialty grocer); koro_it is a
  complementary specialty-food source, not a duplicate.

  coicop_divisions: 01, 05, 06
  divisions_basis: walked_categories (14 top-level nav categories enumerated
  via /store-api/navigation on the shared platform; same category tree
  across all KoRo channels)
