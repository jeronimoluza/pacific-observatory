notes: |
  Eurostat household natural gas price (dataset nrg_pc_202), band D2
  (20-199 GJ/yr), all taxes and levies included (I_TAX), reported in
  national currency (NAC). Half-yearly cadence; fetcher emits only the latest
  published half-year (idempotent on cutoff). Verified live 2026-08-07 via
  the Eurostat JSON-stat 2.0 REST API, single-geo filter. Shared module
  _shared/eca/eurostat_energy.py covers 34 ECA countries with one
  implementation (7 countries have no reported gas grid and are excluded:
  Cyprus, Malta, Finland, Iceland, Norway, Montenegro, Kosovo).
  coicop_divisions: 04
  divisions_basis: walked_categories (dataset scope is natural gas retail price only)
