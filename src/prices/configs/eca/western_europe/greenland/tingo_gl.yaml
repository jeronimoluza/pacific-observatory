notes: |
  Nuuk fashion/apparel store, Simply.com-hosted WordPress/WooCommerce.
  Standard public Store API at /wp-json/wc/store/v1/products; DKK prices,
  238 products across 3 pages (X-WP-Total: 238, X-WP-TotalPages: 3 as of
  2026-09-11). Handled by the shared _woo_base pagination/scaling logic
  via a dedicated tingo_gl.py subclass (moved off generic_woo_configured
  2026-09-11).

  Repair note (2026-09-11): the prior generic_woo_configured config
  produced a clean 0-row run (an earlier probe also saw a bare HTTP 455
  in stdlib, per this manifest's original notes). Root cause: same
  CleanTalk-style firewall as inuitquality.com (`ct_sfw_pass_key` cookie)
  -- a back-to-back multi-page crawl (page 1 -> page 2 -> page 3) is
  exactly the pattern that trips its non-standard HTTP 454 block with
  zero JSON body; observed live: page 1 succeeded (100 rows), page 2
  454'd, crawl stopped short. generic_woo_configured's custom_settings
  had no 454 in RETRY_HTTP_CODES. Fix: dedicated spider adds 454 to
  RETRY_HTTP_CODES. Verified live: page 1 and page 2 return disjoint
  product ids (page 1 starts at id 65820 "Camilla coat", page 2 includes
  id 62227 "Nujigga suede skirt"), both non-zero DKK.
