notes: |
  Local Nuuk clothing/accessories brand/store, Simply.com-hosted
  WordPress/WooCommerce. Standard public Store API at
  /wp-json/wc/store/v1/products; DKK prices, single page (73 products
  total, X-WP-Total: 73 as of 2026-09-11). Handled by the shared
  _woo_base pagination/scaling logic via a dedicated inuitquality.py
  subclass (moved off generic_woo_configured 2026-09-11).

  Repair note (2026-09-11): the prior generic_woo_configured config
  produced a clean 0-row run. Root cause: this tenant's CleanTalk-style
  firewall (`ct_sfw_pass_key` cookie) intermittently answers a
  back-to-back/bursty request with a non-standard HTTP 454 and zero JSON
  body instead of the real page; a single isolated request reliably gets
  200. generic_woo_configured's custom_settings had no 454 in
  RETRY_HTTP_CODES, so one unlucky 454 killed the whole crawl. Verified
  live: re-run after this fix (dedicated spider, RETRY_HTTP_CODES adds
  454) produced 73/73 unique-URL rows, all non-zero DKK prices.
