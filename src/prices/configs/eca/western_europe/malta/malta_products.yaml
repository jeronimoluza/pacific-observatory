notes: |
  Malta-local public Woo catalogue with positive current
  product prices, stable identifiers, categories, stock state, and canonical
  product URLs. Scaled platform-wave evidence reports 100 positive records in the first response; the collector
  paginates to exhaustion and omits zero-valued placeholder products.
