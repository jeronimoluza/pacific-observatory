scaffolding: spider
extraction_pattern: scrapy_woocommerce_store_api
analytical_role: marketplace_offer
coicop_classification: classifier
spider: malta_products
url: https://maltaproducts.com/
language: en
currency: EUR
cadence: weekly
channel: specialty-food
archive_prefix: maltaproducts.com/products/
