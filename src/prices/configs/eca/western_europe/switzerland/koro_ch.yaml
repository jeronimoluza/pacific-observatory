scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: koro_ch
language: de
cadence: weekly
channel: specialty-food
archive_prefix: "www.koro-shop.ch/detail/"
archive_path_re: '^/detail/[^/?]+'
notes: |
  Nuxt3 frontend over the shared Shopware 6 backend (bff.koro.com); one
  sales channel per country, this is koro_ch (own domain koro-shop.ch).
  Store API POST /store-api/product with sw-access-key header. Requires
  "total-count-mode":1 or Shopware reports total==page size. Access key is
  channel-scoped -- do not reuse across KoRo country storefronts. Full
  platform writeup: see eca/western_europe/austria/koro_at.yaml.

  Verified live 2026-08-07: POST with the CH access key returns CHF-priced
  rows (calculatedPrice.unitPrice), e.g. "Veganer Spekulatius Aufstrich
  400 g" CHF 5.00, "Kürbiskernmus 12 x 500 g" CHF 98.50 -- CHF-EUR near-parity
  makes these numerically close to the DE/EUR channel, verified as a genuine
  per-channel context price, not a copy-paste of the EUR figure. URL built
  as www.koro-shop.ch/detail/{id}. Complementary to the existing denner_ch /
  nu3_ch manifests.

  coicop_divisions: 01, 05, 06
  divisions_basis: walked_categories (14 top-level nav categories enumerated
  via /store-api/navigation on the shared platform; same category tree
  across all KoRo channels)
