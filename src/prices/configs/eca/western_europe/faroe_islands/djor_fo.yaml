notes: >
  Djórahandilin, the Faroe Islands' largest animal-goods retailer.
  WooCommerce Store API open, 191 categories, reports DKK with
  currency_minor_unit 2 (19900 -> 199.00 DKK) which the shared base divides
  out. Non-food (COICOP 09.3 pets), onboarded because any source is worth
  having for a country that had none.
