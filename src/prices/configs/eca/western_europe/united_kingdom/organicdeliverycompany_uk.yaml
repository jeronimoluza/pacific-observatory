scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: organicdeliverycompany_uk
url: https://organicdeliverycompany.co.uk/
language: en
cadence: weekly
channel: specialty-food
archive_prefix: "organicdeliverycompany.co.uk/products/"
archive_path_re: '^/products/[^/?]+'
notes: |
  Re-verified live 2026-08-06: GET /products.json?limit=6 -> HTTP 200,
  8.7KB JSON, standard Shopify storefront, no auth. Homepage confirms
  Shopify.currency active=GBP, matching countries.yaml. Sample: 'Pomegranate
  (each)' GBP 2.45, 'Frozen Blackcurrants 10 Kg' GBP 47.00. Organic
  fruit/veg/grocery home-delivery service -- whole-catalog walk, no
  collection filter. First non-proxy UK price manifest in the repo.
