scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: koro_be
language: fr
cadence: weekly
channel: specialty-food
archive_prefix: "www.koro.com/befr/detail/"
archive_path_re: '^/befr/detail/[^/?]+'
notes: |
  Nuxt3 frontend over the shared Shopware 6 backend (bff.koro.com); one
  sales channel per country, this is koro_be. Store API POST
  /store-api/product with sw-access-key header (extracted from
  window.__NUXT__.config.public in the homepage SSR payload). Requires
  "total-count-mode":1 or Shopware reports total==page size. Access key is
  channel-scoped -- do not reuse across KoRo country storefronts. Full
  platform writeup: see eca/western_europe/austria/koro_at.yaml.

  Verified live 2026-08-07: POST with the BE access key returns real BE
  catalog rows, calculatedPrice.unitPrice in EUR, available flag, ean.
  Belgian storefront default locale is fr-BE (no NL translation on this
  channel). URL built as www.koro.com/befr/detail/{id} (Shopware's
  non-SEO canonical detail route, per-product unique).

  coicop_divisions: 01, 05, 06
  divisions_basis: walked_categories (14 top-level nav categories enumerated
  via /store-api/navigation on the shared platform; same category tree
  across all KoRo channels)
