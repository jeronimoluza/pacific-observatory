  lists 7 shards (~5,000 URLs each), ~4,600 /mehsul/ product URLs
  verified live in shard 0 alone (~30k+ products across all shards) --
  this satisfies enumerability without needing a walkable category
  listing page (none found; homepage carries no real catalog).
  channel is electronics; coicop_codes left unset (catalog spans
  multiple electronics/home-appliance leaves).
  GOTCHA carried from tap_az: watch for CDN-hosted sitemap/product-image
  hosts needing allowed_domains -- not hit here, sitemap and product
  pages are both on bakuelectronics.az itself.
  Smoke run 2026-08-17 (--max-items 60): passed, see smoke report. One
  stale sitemap URL (404) verified live and handled by dropping that
  response, not failing the shard.
