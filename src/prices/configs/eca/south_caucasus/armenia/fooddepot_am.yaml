notes: |
  Food Depot — premium Armenian online supermarket. Workbook flagged this
  SUSPECT ("category pages did not expose prices in the fetch") because
  the storefront itself is a bare create-react-app shell with no
  server-rendered content. Its JS bundle references
  https://api.fooddepot.am, a wide-open unauthenticated Bagisto REST API
  (Playwright-to-discover, plain-HTTP-to-scrape). Verified live
  2026-09-01: GET /api/products/?limit=100&page=N, 2841 products across
  29 pages, clean self-terminating pagination via meta.last_page (no
  wraparound trap, unlike sas_am/supermarket_am). Categories come from
  GET /api/categories, a small nested tree (5 roots: special offers,
  food-and-beverages, alcohol, equipment, household-goods) flattened
  recursively to map a product's cats[0] id to a leaf name.
  price is a decimal STRING already in whole AMD (e.g. "14500.0000" =
  14,500 AMD, not a subunit) — do NOT divide by 100 or treat the decimal
  point as meaningful. PDP url reconstructed as
  https://fooddepot.am/<url_key> (verified 200; SPA client-side routes it
  but the link is stable/canonical). Names are Armenian by default.
