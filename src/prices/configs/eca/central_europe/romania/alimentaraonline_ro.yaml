  ItemList of Product entries (name, offers.lowPrice, offers.priceCurrency,
  real per-product url, sku) -- no rendering needed. Re-verified live
  2026-08-06: GET /catalog/produse-alimentare-40 -> 200, 392KB,
  numberOfItems: 4079 across 170 pages (/catalog/<slug>/pN). Sample:
  'Banane pret/kg - 08031010' RON 11.10, 'Zahar Alb Cristal MARGARITAR 1Kg'
  RON 7.50, 'Lamai pret/kg - 08055010' RON 21.50. Romanian-products and
  plant-based verticals confirmed live (produse-romanesti-318, plant-based-319).
