scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: aggregate_proxy
coicop_classification: classifier
spider: cjenoteka_hr
url: https://cjenoteka.hr/
language: hr
cadence: weekly
channel: other
archive_prefix: "cjenoteka.hr/p/"
archive_path_re: '^/p/[^/?]+'
notes: |
  Cross-retailer price-comparison aggregator (priceteka.com API backend),
  not a retailer itself — complements the already-onboarded CroCart
  aggregator (different 23-commodity fixed set from a different 5-chain
  source list). Re-verified live 2026-08-06: GET https://cjenoteka.hr/ ->
  HTTP 200, 671KB Next.js SSR, `__NEXT_DATA__` present with
  featured/bestseller/popular product lists, each priced across multiple
  real retailers. Sample: 'DUKAT Lagano jutro trajno mlijeko bez laktoze
  1,5%mm 1l' 1.99 EUR at Konzum, 1.73 EUR at Kaufland, 1.69 EUR at
  Studenac. No search/browse API for the wider catalogue was found within
  budget, so coverage is the ~18 curated homepage products x up to ~16
  retailers each (dm, Bipa, Konzum hipermarket/supermarket, Kaufland,
  Plodine hipermarket/supermarket, Spar, Interspar, Studenac, Tommy,
  Eurospin, Lidl) — narrow, but every price point is real and
  retailer-attributed. The retailer slug is carried in the `category`
  field (this schema has no dedicated retailer column). channel set to
  "other" since Cjenoteka itself is an aggregator, matching the CroCart
  convention.
