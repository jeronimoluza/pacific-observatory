notes: |
  WooCommerce confirmed (round-1 flagged the "woocommerce" string but
  didn't confirm the Store API). /wp-json/ lists a "wc/store" namespace,
  but the versioned /wp-json/wc/store/v1/products route 404s -- the older
  non-versioned /wp-json/wc/store/products route works (same gotcha as
  vipspar_mz.py). Re-verified live 2026-08-06: GET
  /wp-json/wc/store/products?per_page=5 -> 200, real product 'Ledena
  kava, 1 l' EUR 1.34 (on sale, regular 2.69), minor_unit=2.
