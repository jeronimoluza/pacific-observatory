notes: |
  Tesco Hypermarket (Zlaté Piesky, Bratislava) on the Wolt delivery
  marketplace. Same SSR query-state walk as the existing wolt subclasses
  (shared base `_wolt_base.py`): venue page -> category-listing (162
  categories) -> per-leaf-category `/items/<slug>` page 1.

  Discovered via Wolt Bratislava city-page venue slugs (also found
  billa-eurovea and two more Tesco branches as backup candidates);
  confirmed live 2026-08-07: /venue/tesco-hypermarket-zlate-piesky -> 200,
  category-listing returns 162 categories. Sample from cerstve-ovocie-3
  (fresh fruit): "Bio Banány voľné" EUR 2.29, "Banány voľné" EUR 1.79,
  "Citróny voľné" EUR 3.35 -- real Slovak produce names, plausible EUR
  magnitudes, 32 items in this one leaf alone. Hypermarket format (not
  Tesco Expres) -> full-line, not convenience-scale.

  Extends Wolt coverage in this shard from 6 to 10 markets -- Slovak
  Republic had only billa_sk previously, a thin single-source country.

  coicop_divisions: 01
  divisions_basis: sampled_rows (one leaf category sampled directly; full
  162-category tree on a hypermarket plausibly spans 01/02/05/13 like
  other Wolt supermarket manifests but was not walked)
