scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: spar_wolt_hu
url: https://wolt.com/en/hun/budapest/venue/sparszupermarket-klauzalter
language: hu
cadence: weekly
channel: marketplace
archive_prefix: "wolt.com/en/hun/budapest/venue/"
archive_path_re: '^/en/hun/budapest/venue/[^/?]+'
notes: |
  Spar Szupermarket (Klauzál tér, Budapest) on the Wolt delivery
  marketplace. Same SSR query-state walk as the existing wolt subclasses
  (shared base `_wolt_base.py`): venue page -> category-listing (238
  categories) -> per-leaf-category `/items/<slug>` page 1.

  Discovered via Wolt Budapest city-page venue slugs; confirmed live
  2026-08-07: /venue/sparszupermarket-klauzalter -> 200, category-listing
  returns 238 categories. Sample from zoldseg-3 (vegetables): "SPAR Asia
  mungóbabcsíra 200 g" HUF 949 (unit_info "200 g" -- price already in
  minor units /100 per the base spider's convention). Real Hungarian
  product names, plausible HUF magnitude for a 200 g produce item.

  Extends Wolt coverage in this shard from 6 to 10 markets -- Hungary had
  only coop_hu previously, a thin single-source country.

  Smoke run (--max-items 15) crossed 4 categories: soup garnish/croutons
  (Levesbetét, 01), ice cubes (01), bird/hamster/rabbit feed and cat litter
  (Madaraknak/Rágcsálóknak/Macskaalom -- pet supplies, COICOP 09.3.4). One
  noise row ("ÁRrésSTOP" price 0, a promo-banner tile, not a real product)
  -- classifier/build should drop zero-price rows naturally.

  coicop_divisions: 01, 09
  divisions_basis: sampled_rows (4 leaf categories sampled; full 238-
  category tree on a supermarket venue plausibly spans 01/02/05/13 too but
  those were not directly observed)
