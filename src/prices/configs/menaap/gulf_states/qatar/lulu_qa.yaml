scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
channel: hypermarket
spider: lulu_qa
url: https://gcc.luluhypermarket.com/en-qa
language: en
cadence: weekly
timeout: 5400
archive_prefix: "gcc.luluhypermarket.com/en-qa/"
archive_path_re: '^/en-qa/.+/p/\d+/?$'
notes: |
  Verified live 2026-09-01: LuLu Hypermarket Qatar, on the shared multi-
  country gcc.luluhypermarket.com storefront (robots.txt lists en-ae/en-qa/
  en-sa/en-om/en-kw/en-bh sitemaps off one host; identical platform already
  built for lulu_om/lulu_kw/lulu_bh/lulu_sa -- reused the pattern directly,
  only locale and currency changed). Category listing pages are client-
  rendered React with no product data in the raw response, so this spider
  is seeded off /en-qa/sitemap/products-1 (1,980 product URLs, single
  sitemap file, no further pagination) and reads each server-rendered PDP
  directly. The page's own schema.org Product JSON-LD is a stub
  (offers.price always "0.00", priceCurrency null) -- not usable; price
  comes from the rendered `<span data-testid="price">42.50 QAR</span>`
  instead.
  Locality proved: currency on the PDP price span is QAR, and the sitemap
  path is Qatar-specific (en-qa). Spot check: Fage Total 0% Fat Yogurt
  Lactose Free 450g at 42.50 QAR (real, non-zero, plausible). 213 of the
  1,980 sitemap URLs match a food/beverage keyword filter (milk/juice/rice/
  oil/cheese/coffee/yogurt/etc.) -- a real grocery share, not incidental.
  Out-of-stock items render "0.000 QAR" in the same span (confirmed on
  several cable/electronics PDPs); those are skipped rather than emitted as
  zero-priced rows. Mixed catalog (grocery, electronics, fashion, homeware)
  -- channel approximated as hypermarket.
  coicop_divisions: 01, 03, 05, 08, 09
  divisions_basis: sampled_rows (URL keyword sample + spot PDP checks, same
  method as sibling lulu_* manifests; category not derivable from PDP
  markup, full tree not walked)
