scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
channel: electronics
spider: jarir_kw
url: https://www.jarir.com/kw-en/
language: en
cadence: daily
archive_prefix: "www.jarir.com/kw-en/"
archive_path_re: '^/kw-en/[A-Za-z0-9._-]+-\d+\.html$'
notes: |
  Re-verified live 2026-08-06: Jarir Bookstore Kuwait. Same Vue-SSR/Magento
  backend as jarir_sa/jarir_ae/jarir_qa — schema.org Product JSON-LD
  embedded server-side on every PDP, no Playwright needed. The /kw-en/
  storefront's own sitemap (sitemap_kw_ar.xml) returns a binary image
  payload instead of XML (same defect on AE/QA), so this spider reuses
  jarir_sa's product-sitemap index for URL discovery and re-requests each
  slug under /kw-en/. Confirmed genuinely localized (not a fallback): SKU
  27177 prices at 6.90 KWD here vs 89.00 QAR / 8.69 BHD on the sibling
  storefronts. KWD is a 3-decimal currency — checked the JSON-LD price is
  already plain decimal, not an integer minor-unit value, so no rescaling
  needed. Books, electronics, stationery, arts & crafts, toys — mixed
  catalog, channel approximated as electronics (dominant category).
  coicop_divisions: 05, 08, 09, 13
  divisions_basis: sampled_rows (PDP spot-checks across arts-crafts, laptops/electronics, stationery categories; full-catalog category tree not walked)
