scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
channel: electronics
spider: jarir_bh
url: https://www.jarir.com/bh-en/
language: en
cadence: daily
archive_prefix: "www.jarir.com/bh-en/"
archive_path_re: '^/bh-en/[A-Za-z0-9._-]+-\d+\.html$'
notes: |
  Re-verified live 2026-08-06: Jarir Bookstore Bahrain. Same Vue-SSR/Magento
  backend as jarir_sa/jarir_ae/jarir_qa/jarir_kw — schema.org Product
  JSON-LD embedded server-side on every PDP, no Playwright needed. The
  /bh-en/ storefront's own sitemap (sitemap_bh_ar.xml) returns a binary
  image payload instead of XML (same defect on AE/QA/KW), so this spider
  reuses jarir_sa's product-sitemap index for URL discovery and re-requests
  each slug under /bh-en/. Confirmed genuinely localized (not a fallback):
  SKU 27177 prices at 8.69 BHD here vs 89.00 QAR / 6.90 KWD on the sibling
  storefronts. BHD is a 3-decimal currency — checked the JSON-LD price is
  already plain decimal, not an integer minor-unit value, so no rescaling
  needed. Books, electronics, stationery, arts & crafts, toys — mixed
  catalog, channel approximated as electronics (dominant category).
  coicop_divisions: 05, 08, 09, 13
  divisions_basis: sampled_rows (PDP spot-checks across arts-crafts, laptops/electronics, stationery categories; full-catalog category tree not walked)
