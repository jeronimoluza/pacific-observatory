scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
channel: hypermarket
spider: lulu_om
url: https://gcc.luluhypermarket.com/en-om
language: en
cadence: weekly
archive_prefix: "gcc.luluhypermarket.com/en-om/"
archive_path_re: '^/en-om/.+/p/\d+/?$'
notes: |
  Verified live 2026-08-31: LuLu Hypermarket Oman, on the shared multi-
  country gcc.luluhypermarket.com storefront (robots.txt lists en-ae/en-qa/
  en-sa/en-om/en-kw/en-bh sitemaps off one host). Category listing pages
  are client-rendered React with no product data in the raw response, so
  this spider is seeded off /en-om/sitemap/products-1 (1,980 product URLs,
  single sitemap file, no further pagination) and reads each server-
  rendered PDP directly. The page's own schema.org Product JSON-LD is a
  stub (offers.price always "0.00", priceCurrency null) -- not usable;
  price comes from the rendered `<span data-testid="price">1.050 OMR</span>`
  instead. Out-of-stock items render "0.000 OMR" in the same span
  (confirmed against an "Out of Stock" badge on an Acer laptop PDP); those
  are skipped rather than emitted as zero-priced rows, so in-stock coverage
  is somewhat under half of the 1,980 URLs in a random 8-item sample.
  Mixed catalog (grocery, electronics, fashion, homeware) -- channel
  approximated as hypermarket.
  coicop_divisions: 01, 03, 05, 08, 09
  divisions_basis: sampled_rows (random 8-URL sample from the products sitemap; category not derivable from PDP markup, full tree not walked)
