notes: |
  Verified live 2026-08-07: same GCC Statistical Centre (GCC-Stat) harmonised
  regional CPI dataset (GCCSTAT.ES,DF_ES_CPI,1.0) already wired for
  bahrain/kuwait/oman/qatar this round — one SDMX CSV covers all six GCC
  states, filtered here to COUNTRY="Saudi Arabia". Bucket-2 shared module
  (src/prices/fetchers/_shared/menaap/gccstat_cpi.py); this manifest is the
  Saudi Arabia wrapper (fetch_sa_gccstat_cpi, already present in the shared
  module's _COUNTRIES map, function added this round). 12-indicator
  COICOP-2018-style grouping (division 13 absent); all-items headline
  indicator dropped, no sanctioned sentinel yet. GASTAT's own "Average
  Prices of Goods and Services" bulletin is a stronger item-level
  official_avg source but has no machine-readable download surfaced this
  round (see Phase 8 report) — this GCC-Stat series is Saudi Arabia's only
  cpi_benchmark source onboarded so far. Smoke test (full fetch, no
  --max-items on fetchers) returned 1188 rows, monthly Jan-2015 onward,
  index values in a plausible 90-110 range.
  coicop_divisions: 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12
  divisions_basis: walked_categories (all 12 mapped INDICATOR values enumerated from the full CSV)
