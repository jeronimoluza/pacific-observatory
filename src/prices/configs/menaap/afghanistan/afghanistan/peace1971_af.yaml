notes: |
  Peace Stationery's first-party Afghanistan homepage renders current product
  cards with numeric IDs, names, stable product URLs, and explicit AFN prices.
  Desktop/mobile duplicates are removed by product ID, and commented dollar
  placeholder values are ignored. The shop route currently returns 403, so the
  adapter intentionally uses the 15-card public homepage and does not claim
  full catalogue coverage.
