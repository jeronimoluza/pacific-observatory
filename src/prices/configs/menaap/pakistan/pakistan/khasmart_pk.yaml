notes: |
  Pakistani pharmacy retailer (medicine, personal care) with a smaller
  grocery/baby-shop section mixed in. WooCommerce Store API confirmed live
  2026-08-17 (https://khasmart.pk/wp-json/wc/store/v1/products), 100
  items/page, prices.currency_code=PKR, minor_unit=0 (e.g. 395 -> Rs395).
  Shard probe reported no detected currency; the API's own currency_code
  field resolves it. Full scrape: see report for row count.
