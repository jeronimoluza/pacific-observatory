scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: priceoye_pk
url: https://priceoye.pk/
language: en
currency: PKR
cadence: weekly
channel: electronics
archive_prefix: "priceoye.pk/"
archive_path_re: '^/[^/?]+/[^/?]+/[^/?]+$'
notes: |
  Verified live 2026-08-17: priceoye.pk — a Pakistani electronics/mobile
  online retailer (sells directly, checkout flow present; not purely a
  comparison-shopping listing). Each PDP embeds a schema.org Product
  JSON-LD block server-side with a real offers.price/priceCurrency,
  confirmed "Infinix Note 60 Edge 5G" -> PKR 87399.00, InStock. Homepage/
  category listing pages themselves do not carry per-product prices (only
  descriptive price-range copy and an Elasticsearch "similar products"
  widget lacking a price field), so the spider walks
  https://priceoye.pk/sitemap/sitemap-product.xml (15,911 product URLs)
  directly, same sitemap-of-PDPs pattern as btech_eg/jarir_sa.
  robots.txt disallows several AI-training bots (ClaudeBot among them,
  under Content-Signal ai-train=no) but explicitly allows general crawling
  (`Allow: /`) and this repo already runs with ROBOTSTXT_OBEY=False for all
  sources; collection here is for price-index research, not AI training.
  Electronics/mobiles retailer, NOT a grocery source.
  coicop_divisions: 05, 08, 09; divisions_basis: sampled_rows.
timeout: 14400
