scaffolding: fetcher
extraction_pattern: pdf
analytical_role: cpi_benchmark
coicop_classification: publisher_labeled
channel: null
source_key: ly_bsc_cpi
module: menaap.north_africa.libya.bsc_cpi
function: fetch_ly_bsc_cpi
url: https://bsc.ly/economic_statistic/prices/
language: ar
cadence: monthly
fallback_date: 2020-01-01
coicop_codes: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
notes: |
  Libya Bureau of Statistics and Census (bsc.ly), Ministry of Planning -- monthly
  "Report on Inflation and Consumer Price Indices by Main Groups" PDF (base year
  2024=100). Verified live 2026-09-01: listing page carries monthly releases from
  2010 through July 2026 (uploaded 2026/08) -- genuinely current, not stale.
  Text-extractable via pdfplumber (no OCR needed); confirmed with the July 2026
  report: real table with per-group M-o-M % change, current-month index,
  year-ago-month index, and weight, keyed by Libya's own 2-digit group code
  (00 General Index [headline, dropped], 01 Food and Beverages ... 12
  Miscellaneous goods and Services). This is the pre-2018-COICOP-revision 12-group
  scheme (same shape as Jordan's DOS CPI in this same shard) -- codes used as
  published, no translation table needed (identity mapping "01"->"01" etc).
  Filenames on the listing page are NOT a reliable naming convention (typos,
  "_compressed", "-1"/"-1-1" suffixes, one .docx.pdf) so the fetcher does not
  guess a URL slug -- it ranks every PDF link by its WordPress
  /uploads/<year>/<month>/ upload path and opens the most recent candidates until
  one parses, then reads the actual report period from the PDF's own English
  header text ("...for July 2026 compared with July 2025.").
  Central Bank of Libya (cbl.gov.ly) also publishes CPI reports but 403s on
  curl_cffi (chrome124/chrome120/safari17_0) for the one economic_indicators page
  probed -- not pursued further since bsc.ly is the primary statistical-office
  series and is live and open.
  coicop_divisions: 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12
  divisions_basis: walked_categories (all 12 groups in the published table read
  directly, not sampled)
