  currency_code=LYD from the API, minor_unit=2 (e.g. "Novaclear Collagen
  Firming Neck & Decollete Cream" price 8500 -> LYD 85.00). End-to-end
  tested via `prices collect --source green_apples_pharmacy --max-items 20`.
