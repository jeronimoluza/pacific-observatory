notes: |
  Nashrah is a daily local-price bulletin from the Libya Trade Network. Its
  first-party tables expose dated retail prices with product, producer, unit,
  category, and Libyan-dinar notation. Stable composite IDs retain all row
  dimensions. The source includes food, construction materials, grain, and
  feed; these are observed market-reference prices rather than seller SKUs.
