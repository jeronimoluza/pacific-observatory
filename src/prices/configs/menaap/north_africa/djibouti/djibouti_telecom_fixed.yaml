notes: |
  Djibouti Telecom (national incumbent) fixed-line (landline) prepaid tariff,
  from the public "/internet/" plan page. Re-verified live 2026-09-28: GET
  https://www.djiboutitelecom.dj/internet/ -> HTTP 200, 5
  `.elementor-price-table` widgets with real DJF prices -- 3 one-time
  installation-fee tiers (Djibouti-ville et Balbala / Etudiants / Regions) and
  2 recurring prepaid-package tiers (Djibouti-ville / Regions). Plain
  server-rendered WordPress/Elementor HTML, no auth, no WAF. Checked /wp-json/
  route listing: only core WP plugin routes, no WooCommerce/commerce endpoint
  -- this is a marketing/tariff page, not a storefront.

  The /mobile/ and /pro/ pages on the same site were also probed and carry no
  `.elementor-price-table` widgets and no DJF/FDJ price text anywhere in the
  HTML -- mobile plans and business plans are not published as scrapeable
  prices on this site and are NOT covered by this fetcher.

  Thin (5 line items) but a genuine incumbent-set administered tariff, not a
  retail catalog. No stated "effective from" date on the page, so rows are
  emitted as period_kind=snapshot at fetch time rather than effective_from.
  coicop_codes: 08.3.1 (landline telephone service) -- the whole page is
  fixed-line only.
