language: en
cadence: weekly
channel: supermarket
archive_prefix: "spinneys-egypt.com/"
archive_path_re: '^/[^/]+/?$'
notes: |
  Upper-mid Egyptian chain. Nuxt SPA fronting Magento 2, same
  mcprod.<domain>/graphql backend pattern as Hyper One and Seoudi (the
  storefront's own /graphql proxy 400s on a raw POST body; use the mcprod
  subdomain directly). Live re-verify: POST
  mcprod.spinneys-egypt.com/graphql products(search:"rice") -> 200,
  "RICH LAND - EGYPTIAN RICE PREMIUM - 1KG" EGP 34.95. Categories incl.
  Fruits & Vegetables, Meat & Poultry, Seafood & Fish, Cheese/Dairy/Eggs,
  Bakery & Bread, Frozen. Currency EGP matches countries.yaml.
