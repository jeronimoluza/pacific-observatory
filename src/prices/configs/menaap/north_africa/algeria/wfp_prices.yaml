notes: |
  WFP food prices for Algeria via HDX (shared MENAAP fetcher
  _shared.menaap.wfp_food_prices). Re-verified live 2026-08-07: CKAN
  package_show resolves wfp_food_prices_dza.csv (200, 7,957 rows), currency
  DZD throughout (matches countries.yaml). Max observation date 2026-06-15
  -- current, not the CKAN-staleness-trap pattern (checked max(date)
  directly on the pulled CSV, not the dataset page's last_modified). 39
  commodities incl. semolina, couscous, dates, dried chickpeas/lentils,
  onions, potatoes, three bread/flour variants, cooking oil, sugar, tea.
  Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type. COICOP deferred to the classifier.
  coicop_divisions: 01
  divisions_basis: sampled_rows (commodity list is entirely division-01
  staple foods -- cereals, legumes, produce, oils, dairy)
