  2026-08-06: GET /wp-json/wc/store/v1/products?per_page=5 -> HTTP 200,
  10.3KB JSON. Sample: 'NESTLE CERELAC BLE 300G' MAD 27.95, 'MIXA CREME
  CICA REPARATION 400ML' MAD 105.00. currency_code MAD matches
