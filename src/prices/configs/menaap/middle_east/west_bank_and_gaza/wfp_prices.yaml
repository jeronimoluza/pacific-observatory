notes: |
  WFP food prices for State of Palestine via HDX (shared MENAAP fetcher
  _shared.menaap.wfp_food_prices). Repo slug is west_bank_and_gaza (iso3
  PSE); HDX dataset slug is wfp-food-prices-for-state-of-palestine.
  Re-verified live 2026-08-06: CKAN package_show resolves
  wfp_food_prices_pse.csv (200, 3.3MB, 26,814 rows). Max observation date is
  2026-06-15 — current. CURRENCY NOTE: the live CSV's currency column is
  ILS throughout, not USD as countries.yaml declares for this slug — trust
  the probe. 41 commodities: fruit, veg, dairy (incl. goat cheese, labaneh),
  meat, 3 rice varieties, 2 oil types, semolina, bottled water. Sample at
  max date: 'Bread', KG, ILS 4.05. Per-market rows collapsed to a national
  monthly average per commodity/unit/currency/price-type; market count +
  USD value kept in notes; retail vs wholesale kept in the dedup hash.
  COICOP deferred to the classifier (item_name = WFP commodity).
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  WFP publishes clean, stable English commodity labels ("Millet", "Rice
  (imported)"), not retail SKU strings, so the shared fetcher now stamps a
  division-01/02 leaf per row from the hand-written map in
  src/prices/fetchers/_shared/wfp_coicop.py (603 commodity labels covering
  89.6% of the 116,815 rows collected across the 68 panels). A commodity the
  map does not cover -- the panels' fuel, wage, exchange-rate, transport and
  household-goods block, plus a short list of genuinely ambiguous food
  labels -- is DROPPED with a logged warning, never emitted with a null
  coicop_code. coicop_codes is deliberately unset: measured across the
  collected panels these rows span 132 leaves in 12 different 3-digit
  classes, so the source is wide, not narrow.
