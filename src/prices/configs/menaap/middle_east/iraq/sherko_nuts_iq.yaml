notes: >
  Sherko Nuts -- a named, first-party nuts/seeds/pulses specialty shop in
  Erbil, Iraq, on Lezzoo. Same platform/discovery/spider as
  varya_grocery_iq (generic_lezzoo_venue). Note: this venue has multiple
  same-brand storefronts on Lezzoo (sherko-nuts-100m-9888,
  sherko-nuts-60m-9889) -- only the base sherko-nuts-1594 venue was
  onboarded to avoid near-duplicate catalogs from the same shop's branches.

  MEASURED 2026-09-11 via curl_cffi (chrome124) against the venue's
  schema.org Restaurant JSON-LD: 60 items, 60 distinct product ids/urls,
  0 zero/blank prices, currency IQD throughout. Single category "Nuts"
  (60 items) but includes pulses too -- "Local Chickpeas" 3000 IQD --
  alongside "Turkish Obaid Pistachio" 4000 IQD, "Almond With Peel" 7000
  IQD. Single plain GET returns the full menu; no further pagination
  reachable (documented Lezzoo limitation) -- enumerability evidenced by
  60/60 distinct ids within the one page. End-to-end tested via `prices
  collect --source sherko_nuts_iq --max-items 20`.
