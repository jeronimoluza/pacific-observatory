notes: >
  Asfahan Nuts -- a named, first-party nuts/seeds specialty shop in Erbil,
  Iraq, on Lezzoo. Same platform/discovery/spider as varya_grocery_iq
  (generic_lezzoo_venue).

  MEASURED 2026-09-11 via curl_cffi (chrome124) against the venue's
  schema.org Restaurant JSON-LD: 60 items, 60 distinct product ids/urls,
  0 zero/blank prices, currency IQD throughout. Single category "Nuts"
  (60 items) -- 100% nuts/seeds, covers the COICOP nuts leaf which is a
  gap category worldwide. Sample: "Mixed Nuts 4 Types" 14000 IQD, "Salty
  Mixed Nuts" 10000 IQD, "Egyptian Seeds" 6000 IQD. Single plain GET
  returns the full menu; no further pagination reachable (documented
  Lezzoo limitation) -- enumerability evidenced by 60/60 distinct ids
  within the one page. End-to-end tested via `prices collect --source
  asfahan_nuts_iq --max-items 20`.
