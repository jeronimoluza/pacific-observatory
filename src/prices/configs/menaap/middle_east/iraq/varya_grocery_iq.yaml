notes: >
  Varya Grocery -- a named, first-party fresh-produce grocer in Erbil,
  Iraq, storefront hosted on Lezzoo (same platform/discovery path as the
  already-onboarded bakhtiyari_lezzoo_iq and chawshin_lezzoo_iq; see those
  manifests' notes for the dead-end candidates already tried first, e.g.
  Akamai-blocked carrefour.iq). Uses `generic_lezzoo_venue`
  (src/prices/price_scraping/spiders/generic_lezzoo_venue.py), a
  configurable spider taking `venue_url` -- found after discovering
  Lezzoo's Erbil venue directory (/erbil) lists ~1000 merchant slugs, most
  restaurants but a real minority of grocers/butchers/nut shops (see
  ~/gapwork/known_blockers_disco_mena_iraq.md for the full directory-
  mining method).

  MEASURED 2026-09-11 via curl_cffi (chrome124) against the venue's
  schema.org JSON-LD (hasMenu.hasMenuSection[].hasMenuItem[]): 60 items,
  60 distinct product ids/urls, 0 zero/blank prices, currency IQD
  throughout on every sampled item. Categories: Fruits - Half a kilo
  (26), 1 Kilo (24), Vegetables - 1 Kilo (9), Herbs (1) -- 100% fresh
  produce, 0% non-food. Sample: "Avocado" 5000 IQD, "Pineaple" 6000 IQD,
  "Kiwi" 1750 IQD, "Banana" 990 IQD -- prices plausible for Erbil retail.
  Single plain GET returns the full menu; no further pagination reachable
  (same documented limitation as the two existing Lezzoo Iraq sources) --
  enumerability evidenced instead by 60/60 distinct ids within the one
  page, matching the accepted precedent for this platform.
  End-to-end tested via `prices collect --source varya_grocery_iq
  --max-items 20`.
