scaffolding: spider
extraction_pattern: scrapy_woocommerce_store_api
analytical_role: marketplace_offer
coicop_classification: classifier
spider: iraq_naram
url: https://naram.com/
language: ar
currency: IQD
cadence: weekly
channel: marketplace
archive_prefix: naram.com/products/
archive_path_re: '^/(products|product)/'
notes: |
  Iraq-local public Woo catalogue with positive current
  product prices, stable identifiers, categories, stock state, and canonical
  product URLs. Scaled platform-wave evidence reports 100 positive records in the first response; the collector
  paginates to exhaustion and omits zero-valued placeholder products.
