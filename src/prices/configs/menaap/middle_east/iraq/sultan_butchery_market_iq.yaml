notes: >
  Sultan Butchery and Market -- a named, first-party butcher/produce shop
  in Erbil, Iraq, on Lezzoo. Same platform/discovery/spider as
  varya_grocery_iq (generic_lezzoo_venue).

  MEASURED 2026-09-11 via curl_cffi (chrome124) against the venue's
  schema.org Restaurant JSON-LD: 60 items, 60 distinct product ids/urls,
  0 zero/blank prices, currency IQD throughout. Categories: Meat (32),
  Fruits and vegetables (26), Ketchup & Mayonnaise (1), Discount (1) --
  meat is the plurality category, hence channel=specialty-food (butcher-
  led) rather than fresh-market. Sample: "cucumbers" 1250 IQD, "egglant"
  1250 IQD, "Garlic" 1500 IQD, "heinz tomato ketchup" 5750 IQD (a packaged
  condiment, minor share of the catalog). Single plain GET returns the
  full menu; no further pagination reachable (documented Lezzoo
  limitation) -- enumerability evidenced by 60/60 distinct ids within the
  one page. End-to-end tested via `prices collect --source
  sultan_butchery_market_iq --max-items 20`.
