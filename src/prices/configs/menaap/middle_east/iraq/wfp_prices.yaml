notes: |
  WFP food prices for Iraq via HDX (shared MENAAP fetcher
  _shared.menaap.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_irq.csv (200, 6.7MB, 56,711 rows),
  currency IQD throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. 49 commodities incl. dates, eggplant, local cheese,
  yogurt, three rice varieties, three wheat-flour sourcing variants. Sample
  at max date: 'Bulgur', KG, IQD 1500. Per-market rows collapsed to a
  national monthly average per commodity/unit/currency/price-type; market
  count + USD value kept in notes; retail vs wholesale kept in the dedup
  hash. COICOP deferred to the classifier (item_name = WFP commodity).
