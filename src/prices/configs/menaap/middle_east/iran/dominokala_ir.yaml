scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: dominokala_ir
url: https://dominokala.com/
language: fa
currency: IRR
cadence: weekly
channel: electronics
archive_prefix: "dominokala.com/product/"
archive_path_re: '^/product/[^/?]+'
notes: |
  Verified live 2026-09-28: dominokala.com is a WooCommerce store with the
  Store API open at /wp-json/wc/store/v1/products (no auth), paginated
  cleanly via per_page/page (page1/page2 confirmed disjoint ids).
  prices.currency_code returns "IRT" (Toman, non-ISO) with
  currency_minor_unit 0; the site quotes Toman, not Rial (Iran's ISO 4217
  currency), so the spider sets FORCE_CURRENCY="IRR" and
  PRICE_MULTIPLIER=10 (1 Toman = 10 Rial), matching the convention already
  used by adibmarket_ir/torob_ir/sheypoor_ir for the same reason.
  End-to-end test run (--max-items 5) returned real rows, e.g. "جاروبرقی
  آاگ مدل AEG VX9-2-OKO" (AEG VX9-2-OKO vacuum cleaner) priced 715,970,000
  IRR (71,597,000 Toman on-page). Catalog is home/kitchen appliances --
  fills the household-equipment (COICOP 05) gap in a country whose 14
  trusted sources (as of the 2026-09-15 build) sit almost entirely in one
  division; existing Iran manifests skew cosmetics/pharmacy/food.
  Page family scraped: API (Store API JSON, never fetches a rendered page).
