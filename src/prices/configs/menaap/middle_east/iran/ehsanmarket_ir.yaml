scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: ehsanmarket_ir
url: https://ehsanmarket.shop/
language: fa
currency: IRR
cadence: weekly
channel: specialty-food
timeout: 3600
archive_prefix: "ehsanmarket.shop/product/"
archive_path_re: '^/product/[^/?]+/?$'
notes: |
  Verified live 2026-09-05: ehsanmarket.shop is a WooCommerce store with the
  Store API open at /wp-json/wc/store/v1/products (no auth), paginating
  cleanly via per_page/page (X-WP-Total: 1770). Page 2 of the listing returns
  a fully distinct id set.

  prices.currency_code returns "IRT" (Toman, non-ISO) with
  currency_minor_unit 0 and the rendered PDP quotes تومان (5 occurrences,
  zero ریال), so the spider sets FORCE_CURRENCY="IRR" and PRICE_MULTIPLIER=10
  (1 Toman = 10 Rial), matching the adibmarket_ir / hastmarket_ir /
  royalnuts_ir / torob_ir convention. STORED VALUE IS RIAL (IRR), scaled x10
  from the site's Toman price.

  Ehsan Market retails imported groceries and confectionery
  (خوراکی‌های خارجی). Sampled catalog is essentially all division 01:
  instant coffee, coconut milk, chocolate bars, breakfast spread, Nespresso
  capsules, desserts and snacks.

  Onboarded because Iran had only 2 genuine food sources against 21
  cosmetics / pharmacy / home-improvement ones.

  Page family parsed: API.
