scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: hami_ir
url: https://hami.ir/
language: fa
currency: IRR
cadence: weekly
channel: cosmetics
archive_prefix: "hami.ir/product/"
archive_path_re: '^/product/[^/?]+'
notes: |
  Verified live 2026-08-18: hami.ir is "Hami" (فروشگاه حامی), a
  cosmetics/personal-care store. Open, unauthenticated WooCommerce Store
  API at /wp-json/wc/store/v1/products?per_page=100&page=N -- uses the
  shared WooBaseSpider (src/prices/price_scraping/spiders/_woo_base.py).
  The API reports currency_code="IRT" (Toman, no ISO 4217 code); the
  spider multiplies price by 10 and reports IRR, matching the site's own
  PDP JSON-LD conversion (confirmed: API price 3,280,000 Toman ==
  JSON-LD 32,800,000 IRR for "میست آبرسان کپسولی PDRN و هیالورونیک اسید
  آنوا") and the existing torob_ir/sheypoor_ir convention.
