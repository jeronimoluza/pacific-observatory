scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: bizma_ir
url: https://bizma.ir/
language: fa
currency: IRR
cadence: weekly
channel: cosmetics
archive_prefix: "bizma.ir/product/"
archive_path_re: '^/product/[^/?]+'
notes: |
  Verified live 2026-08-18: bizma.ir is a WooCommerce store with the Store
  API open at /wp-json/wc/store/v1/products (no auth), paginated cleanly
  via per_page/page. prices.currency_code returns "IRT" (Toman, non-ISO)
  with currency_minor_unit 0; the site quotes Toman, not Rial (Iran's ISO
  4217 currency), so the spider sets FORCE_CURRENCY="IRR" and
  PRICE_MULTIPLIER=10 (1 Toman = 10 Rial), matching the convention already
  used by torob_ir/sheypoor_ir for the same reason. End-to-end test run
  (--max-items 5) returned real rows, e.g. "کرم نرم‌کننده اوسرین و اوره
  10درصد" priced 397000 IRR (39700 Toman on-page). Catalog mixes
  skincare, oral care, and toiletries.
