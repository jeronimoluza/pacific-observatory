scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: celineshops_ir
url: https://celineshops.ir/
language: fa
currency: IRR
cadence: weekly
channel: cosmetics
archive_prefix: "celineshops.ir/product/"
archive_path_re: '^/product/[^/?]+'
notes: |
  Verified live 2026-08-18: celineshops.ir is a WooCommerce store with the
  Store API open at /wp-json/wc/store/v1/products (no auth), paginated
  cleanly via per_page/page. prices.currency_code returns "IRT" (Toman,
  non-ISO) with currency_minor_unit 0; the site quotes Toman, not Rial
  (Iran's ISO 4217 currency), so the spider sets FORCE_CURRENCY="IRR" and
  PRICE_MULTIPLIER=10 (1 Toman = 10 Rial), matching the convention already
  used by torob_ir/sheypoor_ir for the same reason. End-to-end test run
  (--max-items 5) returned real rows, e.g. "رژلب دیپ ایمپکت نوت" priced
  9882000 IRR (988200 Toman on-page). Catalog is makeup-led (lipstick,
  concealer). robots.txt Disallows ClaudeBot/Claude-SearchBot/
  meta-externalagent/SemrushBot/PetalBot explicitly; the collector fetches
  the Store API directly with a generic browser UA, not under those
  tokens.
