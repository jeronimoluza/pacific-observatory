scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: royalnuts_ir
url: https://royalnuts.ir/
language: fa
currency: IRR
cadence: weekly
channel: specialty-food
timeout: 3600
notes: |
  Verified live 2026-09-01: royalnuts.ir is a WooCommerce store with the
  Store API open at /wp-json/wc/store/v1/products (no auth), paginated
  cleanly via per_page/page (X-WP-Total: 2228). Category list confirms a
  genuine specialty-food retailer: nuts (آجیل, پسته, بادام), dried fruit
  (خشکبار), dates (خرما), spices/herbs (ادویه و چاشنی), tea (چای),
  chocolate/nut gift boxes, cookies, sauces. .ir domain, Toman pricing —
  genuinely an Iranian retailer, not a diaspora storefront.
  prices.currency_code returns "IRT" (Toman, non-ISO) with
  currency_minor_unit 0; the site quotes Toman, not Rial (Iran's ISO 4217
  currency). Spider sets FORCE_CURRENCY="IRR" and PRICE_MULTIPLIER=10
  (1 Toman = 10 Rial), matching the convention already used by
  adibmarket_ir/hastmarket_ir for the same reason. STORED VALUE IS RIAL
  (IRR), scaled from the site's Toman price x10. Full-catalog test run
  (--max-items 2228, whole catalog) returned 2228/2228 rows, all distinct
  product_id/url, zero blank names, zero zero-price rows. Catalog is
  ~99.9% genuine food SKUs (chocolate, nuts, dried fruit, saffron, tea,
  coffee, spices, sauces, honey, bakery); 3 rows (0.13%) are WooCommerce
  system/test products ("LoadTest", "شارژ حساب", "تست پرداخت") left in
  the merchant's own catalog, not scraper artifacts — negligible, not
  filtered.
