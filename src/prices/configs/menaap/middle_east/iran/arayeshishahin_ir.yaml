archive_prefix: "arayeshishahin.ir/product/"
archive_path_re: '^/product/[^/?]+'
notes: |
  Verified live 2026-08-18: arayeshishahin.ir — "آرایشی شاهین - فروشگاه
  لوازم آرایشی و بهداشتی" (Arayeshi Shahin, a cosmetics/personal-care
  storefront). WooCommerce storefront; GET /wp-json/wc/store/v1/products
  -> 200, real product "ژل لیفت کننده ابرو دِمی اصل DEMI EYEBROW LIFT GEL
  10G", prices.price=548000, currency_code="IRT" (non-ISO Toman marker),
  currency_minor_unit=0.
  Toman/Rial: unlike the sibling mahak-cosmetic.ir/khayamdaru.ir
  storefronts, this site's own product-page meta tags already state
  product:price:currency="IRT" honestly for the same value (548000) —
  confirming the Store API price is genuinely Toman-denominated, not a
  labeling error. ISO 4217 has no Toman code, so per the
  sheypoor_ir/torob_ir convention the spider's `_item` override
  multiplies the Store API price by 10 and reports IRR.
