  matching the shufersal_il precedent. This is Carrefour's Israeli license
  holder (Electra Consumer Products, trading as Yaynot Bitan/Carrefour).
  Re-verified live 2026-08-06: branch 002, 6,241 items, e.g. 'עגבניות שרי
  שלמות' (whole cherry tomatoes) ILS 9.90, 'סילאן טבעי לחיץ' (natural date
  syrup) ILS 16.90. Currency ILS.
