scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: dapies_lb
url: https://dapies.com/wp-json/wc/store/v1/products
language: en
cadence: weekly
channel: supermarket
archive_prefix: "dapies.com/product/"
archive_path_re: '^/product/[^/?]+/?$'
notes: |
  "Online Grocery Store in Lebanon | Fresh & Healthy Groceries" —
  WooCommerce ("dapiesFood" theme). Standard WooCommerce Store API, no
  auth. Confirmed live 2026-09-01: currency_code=USD, currency_minor_unit=2
  (e.g. price "450" -> $4.50, matches the page's own price_html "4.50").
  Sample: "Nabat Agar Agar Powder 100g" USD 4.50.

  Distinct storefront/company from spinneys_lb and tripolimarket_lb
  (already onboarded) — not the same shelf.
