notes: |
  WFP food prices for Jordan via HDX (shared MENAAP fetcher
  _shared.menaap.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_jor.csv (200, 6.4MB, 47,942 rows),
  currency JOD throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. The richest, most balanced panel of the MENAAP
  shard — 36 commodities incl. both olive and vegetable oil, fruit, veg,
  meat, two cheese and two milk types. Sample at max date: 'Bread (pita)',
  KG, JOD 0.32. Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
