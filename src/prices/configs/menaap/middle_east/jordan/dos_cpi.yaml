notes: |
  Jordan Department of Statistics Monthly Consumer Price Index (2018=100), via the
  DOS PxWeb statistical databank (jorinfo.dos.gov.jo/Databank), table
  DOS_Database/15/CPI_T1. Re-verified live 2026-08-07: metadata resolves 2006M01 -
  2026M06 (documented REST API, POST query protocol), a live query for
  2026M04-2026M06 returns numeric values (All Items 116.13 for 2026M06) -- current,
  not stale. Found after DOS's separately-linked "Agricultural prices" databank
  (Databank/Metadata/Agricultural-prices.xlsx) turned out to be a survey
  codebook/methodology document, not actual price data -- dead end, do not
  re-investigate that URL. Publisher's ITEM_CPI codes are Jordan's own national CPI
  classification (pre-2018-revision, 12 divisions; division 12 folds personal care
  instead of a separate division 13), converted mechanically to COICOP dotted
  notation by digit position (2-digit division, 1-digit group, 1-digit class).
  Headline "0" (All Items) dropped -- no sanctioned COICOP sentinel.
  coicop_divisions: 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12
  divisions_basis: walked_categories (every ITEM_CPI code read directly from the
  table's own metadata response, not sampled)
