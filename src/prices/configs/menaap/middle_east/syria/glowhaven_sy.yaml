notes: |
  WooCommerce Store API (/wp-json/wc/store/v1/products). Fragrances and
  skincare (e.g. 'Sweet Pea Body Lotion by Bath & Body Works') --
  classified cosmetics.

  Verified live 2026-09-11: x-wp-total=806, x-wp-totalpages=41 at
  per_page=20. Page 1 vs page 2 returned disjoint product-id sets, zero
  overlap -- genuine pagination.

  Currency: Store API reports currency_code=USD -- spread-checked pages
  1, 10, 20, 30, 41 (spanning the full catalog, ~120 products sampled),
  all USD, zero SYP. Confirmed genuine (imported branded fragrances /
  skincare priced in USD), not assumed. currency_minor_unit=2 (e.g.
  price "1700" -> USD 17.00).

  Test run 2026-09-11: prices collect --source glowhaven_sy --max-items
  20 -> 20/20 rows, all priced, all distinct product_ids.

  Page family: API.
