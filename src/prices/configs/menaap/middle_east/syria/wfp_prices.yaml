notes: |
  WFP food prices for Syria via HDX (shared MENAAP fetcher
  _shared.menaap.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_syr.csv (200, 33.5MB, 275,971 rows —
  by far the largest panel in the whole scaffolding wave), currency SYP
  throughout (matches countries.yaml). Max observation date is
  2026-05-15 — current. 77 distinct commodities across all 8 categories,
  including parallel-market bread/pasta variants tracked separately for
  crisis monitoring. Sample at max date: 'Bread (bakery)', 1.1 KG,
  SYP 29.58. Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
