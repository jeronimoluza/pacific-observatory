scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
channel: specialty-food
spider: lionstea_lk
url: https://lionstea.lk/wp-json/wc/store/v1/products
language: en
currency: LKR
cadence: daily
archive_prefix: "lionstea.lk/"
archive_path_re: '^/wp-json/wc/store/v1/products'
notes: |
  Lions Tea, "Ceylon Quality Tea". curl_cffi TLS impersonation 403s;
  plain requests with no impersonation clears to 200 -- same
  impersonation-is-the-cause pattern as ksuper_lk / islandcoffee_lk.

  WooCommerce Store API, no auth: /wp-json/wc/store/v1/products.
  Confirmed 51 products total (X-WP-Total header).
  currency_minor_unit=2 read from the payload (not assumed) -- e.g.
  "130000" -> LKR 1,300.00 for "Apple with Cinnoman Tea".

  Page family: API only -- the spider never fetches an HTML page.

  Verified live 2026-09-11: --max-items 5 run produced rows. Sample:
  "Strawberry Tea" LKR 700.00, "Orange Tea" LKR 700.00.
