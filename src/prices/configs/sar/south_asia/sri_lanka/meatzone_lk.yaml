scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
channel: specialty-food
spider: meatzone_lk
url: https://meatzone.lk/wp-json/wc/store/v1/products
language: en
currency: LKR
cadence: daily
archive_prefix: "meatzone.lk/"
archive_path_re: '^/wp-json/wc/store/v1/products'
notes: |
  Meat Zone, "Fresh Meats Marketplace in Colombo". WooCommerce Store
  API, no auth: /wp-json/wc/store/v1/products. Confirmed 73 products
  total (X-WP-Total header). currency_minor_unit=2 read from the
  payload (not assumed) -- e.g. "225000" -> LKR 2,250.00 for
  "Cuttlefish (Without Clean)". Fish/seafood, lamb, and poultry
  categories only -- no non-food noise observed.

  Page family: API only -- the spider never fetches an HTML page.

  Verified live 2026-09-11: --max-items 5 run produced rows. Sample:
  "Lamb Chops" LKR 4,800.00, "Prawns – Small" LKR 2,850.00.
