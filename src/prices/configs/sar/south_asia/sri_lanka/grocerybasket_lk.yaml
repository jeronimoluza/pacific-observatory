scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
channel: specialty-food
spider: grocerybasket_lk
url: https://thegrocerybasketsl.com/products.json
language: en
currency: LKR
cadence: daily
archive_prefix: "thegrocerybasketsl.com/"
archive_path_re: '^/products/[^/?]+/?$'
notes: |
  The Grocery Basket SL, "Imported Baby Food & Groceries in Sri Lanka".
  Vanilla Shopify storefront -- /products.json?limit=250&page=N,
  confirmed 1,250+ products across 5+ pages. Shopify.currency
  active=LKR confirmed inline (not assumed from countries.yaml).

  Catalog skews toward imported/specialty snacks, cereals, condiments,
  baby food at premium prices (e.g. LKR 3,990 for an imported chip
  bag) -- real LKR retail, but priced for the imported/premium segment
  rather than mainstream local retail. channel: specialty-food.

  Page family: API only -- /products.json, never fetches an HTML page.

  Verified live 2026-09-11: --max-items 100 run against page 1
  produced rows. Sample: "Takis Blue Heat Sharing Size Bag" LKR
  3,990.00, "Lajkonik Crunchy Salty Pretzels 130G" LKR 2,800.00.
