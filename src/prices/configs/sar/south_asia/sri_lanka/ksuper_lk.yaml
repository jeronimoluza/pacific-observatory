notes: |
  Super K Online Grocery, Sri Lanka. `server: hcdn` 403s under
  curl_cffi TLS impersonation (all 3 profiles: chrome124/chrome120/
  safari17_0) but clears to 200 under plain requests with no
  impersonation -- the impersonated JA3 fingerprint is denylisted here,
  same pattern as the broader hcdn cluster (impersonation is the
  cause, not the cure).

  Not a backend-driven storefront: the whole catalog is a static JS
  array (`const products = [...]`) inline in /data.js, referenced from
  a client-rendered SPA shell. Small, hand-maintained catalog (100
  items across 7 categories: Dry Rations, Snacks, Beverages, Personal
  Care, Home Care, Canned Foods, Sauces & Oils -- food-dominant), some
  image fields point at Unsplash stock photos where a real product
  photo is missing. Still real LKR prices for real SL grocery items.

  No routable per-product page exists (client-rendered SPA, no PDP
  URLs) -- DuplicationPipeline dedups on item["url"], so the spider
  synthesizes a unique `?product=<id>` URL per row rather than reusing
  the shared homepage URL, which would otherwise collapse all 100 rows
  to 1.

  Page family: single static asset (/data.js) -- no pagination, no PDP.

  Verified live 2026-09-11: --max-items 100 run against /data.js
  produced 100 rows, 100 distinct urls. Sample: "Samba Rice 1kg" LKR
  230.00, "Dhal 1kg" LKR 320.00.
