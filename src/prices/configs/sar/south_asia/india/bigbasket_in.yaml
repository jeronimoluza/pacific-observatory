notes: >
  Onboarded 2026-09-11 from the still_untried SAR queue (Phase 3 entry, discovery already done).
  Explicit priority target: India's existing rows are dominated by pharmacy catalogues
  (tata_1mg, pharmeasy) which fill zero food-grid cells; BigBasket is a real online supermarket
  (groceries, fresh fruit/veg, dairy, staples, packaged food). Page family: listing (category
  pages at /pc/<slug>/?page=N; Next.js __NEXT_DATA__ embeds up to 48 products per page, no
  Playwright needed -- plain curl_cffi/Scrapy request succeeds, no WAF). 7 hardcoded top-level
  food/beverage category slugs walked with pagination until a page contributes 0 new product
  ids. Verified live 2026-09-11: page=1 vs page=2 on fresh-vegetables returns disjoint product
  id sets (48/48, 0 overlap). Price is pricing.discount.prim_price.sp (selling price) with MRP
  fallback; currency INR confirmed India-only storefront (not inferred from symbol).
  Caveat found during the verification run: bigbasket.com redirects (308)
  /pc/<slug>/?page=2 to /cl/<slug>/ (dropping the page param), so in practice
  each category currently yields its page-1 set (~48 SKUs) before the
  new-ids-contributed-zero stop condition fires. Test run measured 192 rows /
  192 distinct urls across the 7 category slugs (4 responded 200, 3 were
  redirect-deduped by Scrapy's dupefilter before a second page rendered).
  Widening CATEGORY_SLUGS or reverse-engineering the true next-page contract
  (likely a separate infinite-scroll API) would increase depth; left as
  follow-up since 192 rows already clears the 5-row bar by a wide margin.
