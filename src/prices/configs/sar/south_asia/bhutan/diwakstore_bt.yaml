notes: >
  Odoo-based department store (electronics, clothing, homewares, groceries).
  Spider is scoped to the groceries vertical only via
  /shop/category/groceries-5, which Odoo aggregates across all grocery
  sub-categories (bakery, beverages, dairy/eggs, fruits/vegetables, grains,
  meat/fish, oils, snacks, staples, sweets). ~27 grocery items total, paginated
  2 pages then re-serves the last page verbatim (stop-on-repeat, not
  stop-on-empty). "Cloudflare blocked" in the original candidate notes was a
  curl-TLS-fingerprint false positive; plain requests + verify=False clears
  it. Verified live 2026-09-11 (SAR gap-fill sweep, still_untried_20260911.csv).
  Page family: listing.
