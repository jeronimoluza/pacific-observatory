scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: gtplaza
url: https://gtplaza.com/
language: en
cadence: weekly
channel: supermarket
archive_prefix: "gtplaza.com/"
archive_path_re: '^/[^/]+/\d+-[^/]+\.html$'
notes: |
  CSV listed the platform as Custom; re-verification found itemprop-tagged
  PrestaShop category HTML (data-id-product + schema.org/Product microdata),
  same shape as the west-Africa/Madagascar stores in this wave. Live: home
  nav exposes 76 categories spanning groceries/electronics/etc (whole-store
  marketplace, not grocery-only); category page /15-tea-coffee-and-cocoa-
  products returns e.g. "Ovaltine 300g Refill Pack" $860.00 GYD.

  cfg_currency (GYD) matches what the probe saw.
timeout: 14400
