notes: |
  First-party Habanos La Tabaqueria public WooCommerce Store API. The bounded
  per_page=100 request is used for onboarding and emits positive COP rows with
  stable IDs, canonical permalinks, stock state, and zero minor units. This is
  not a catalogue-completeness claim; the captured headers report 758 total
  products across 8 pages.
