scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: source_curated
channel: null
source_key: wfp_bol
module: _shared.lac.wfp_food_prices
function: fetch_wfp_bol
url: https://data.humdata.org/dataset/wfp-food-prices-for-bolivia-plurinational-state-of
language: en
cadence: monthly
fallback_date: 2020-01-01
notes: |
  WFP food prices for Bolivia via HDX (shared LAC fetcher
  _shared.lac.wfp_food_prices; added to _PANELS as "bol"). Re-verified live
  2026-08-06: CKAN package_show resolves wfp_food_prices_bol.csv (200,
  3.3MB, 24,607 rows), currency BOB throughout (matches countries.yaml).
  Max observation date is 2026-06-15 — current. 27 unique commodity
  strings (bread, eggs, maize, meats, milk, noodles, potato varieties,
  quinoa, rice varieties, etc), both Retail and Wholesale pricetype rows
  present. Sample at max date: 'Rice (long grain)', KG, BOB 10.69.
  Per-market rows collapsed to a national monthly average per commodity/
  unit/currency/price-type; market count + USD value kept in notes; retail
  vs wholesale kept in the dedup hash. COICOP deferred to the classifier
  (item_name = WFP commodity).

  Also checked and DROPPED as stale: Venezuela panel
  (wfp-food-prices-for-venezuela-bolivarian-republic-of, currency USD —
  confirms the dollarization warning — but max obs date 2025-05-15, >14mo
  stale) and Peru/Paraguay panels (wfp-food-prices-for-peru /
  -for-paraguay, both max obs date 2022-06-15, >4yr stale). Do not re-add
  those three without re-checking the live max date first.
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  WFP publishes clean, stable English commodity labels ("Millet", "Rice
  (imported)"), not retail SKU strings, so the shared fetcher now stamps a
  division-01/02 leaf per row from the hand-written map in
  src/prices/fetchers/_shared/wfp_coicop.py (603 commodity labels covering
  89.6% of the 116,815 rows collected across the 68 panels). A commodity the
  map does not cover -- the panels' fuel, wage, exchange-rate, transport and
  household-goods block, plus a short list of genuinely ambiguous food
  labels -- is DROPPED with a logged warning, never emitted with a null
  coicop_code. coicop_codes is deliberately unset: measured across the
  collected panels these rows span 132 leaves in 12 different 3-digit
  classes, so the source is wide, not narrow.
