notes: |
  Round 3 platform-fingerprint reversal: rounds 1-2 probed jumbo.cl, saw the Next.js storefront
  404 the catalog API on the retail domain, and predicted Jumpseller/gave up. It is VTEX -- the
  underlying `jumbocl.myvtex.com` origin serves /api/catalog_system/pub/products/search directly
  (HTTP 206, verified live 2026-08-07: "Platano Extra Granel" CLP 1590). Category tree
  (/api/catalog_system/pub/category/tree/3) has 18 top-level departments spanning full
  hypermarket range: groceries, produce, dairy, meat/fish, liquor, cigarettes, personal care,
  cleaning, home/toys, pets, clothing (Vestuario), pharmacy (Farmacia). Chile was previously
  covered only by odepa_wholesale (a wholesale feed) -- this is the country's first retail SKU
  source.
