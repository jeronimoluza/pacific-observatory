  (/api/catalog_system/pub/category/tree/3) has 18 top-level departments: groceries, produce,
  dairy, meat/fish, prepared foods, liquor (Botilleria), cigarettes, personal care, cleaning,
  home, pets. No pharmacy or clothing departments (unlike Jumbo Chile), so tagged as supermarket
  not hypermarket. Chile's second retail SKU source added this round, alongside jumbo_cl.
