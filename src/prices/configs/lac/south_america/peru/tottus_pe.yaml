scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: tottus_pe
url: https://www.tottus.com.pe/tottus-pe
language: es
currency: PEN
cadence: weekly
channel: supermarket
archive_prefix: "www.tottus.com.pe/tottus-pe/"
archive_path_re: '^/tottus\-pe/articulo/[^/?]+/[^/?]+/[^/?]+$'
notes: |
  Falabella-Group supermarket banner. page family: PDP (product-detail-page
  walk only -- category listings are zone-gated, see below).
  Same Next.js "Catalyst" shell family as sodimac_pe/homecenter_co, but
  every /tottus-pe/lista/<catId>/<slug> listing 302s to the homepage
  regardless of cookies (vary: Cookie, X-Zone-Id -- delivery-zone gate,
  confirmed live 2026-09-06 even on a cookie-less first request). Listing
  enumeration is not viable, so this walks the PDP sitemap instead:
  robots.txt -> static/site/sitemaps/pdp/pdp_pe_TO_COM-index.xml -> 2
  shards, ~31.8k product URLs total (confirmed live). PDP pages are NOT
  zone-gated (200 direct). Price picked as the `prices[]` entry with
  crossed=false from __NEXT_DATA__.props.pageProps.productData.variants[]
  (same eventPrice/crossed convention as sodimac_pe). Category =
  breadCrumb[-1].label. Verified live: PDP 146700547 "Chompa Cuello
  Redondo Hombre Redwood" -> S/ 16.90 crossed=false vs S/ 39.90 crossed=true.
  Test run 2026-09-06: --max-items 5 against a stride-15 sample of the PDP
  sitemap returned 5 valid rows with real PEN prices.
