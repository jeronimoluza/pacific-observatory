notes: |
  Found via Dutch-language ddgs search ("supermarkt online bestellen
  Paramaribo Suriname boodschappen"), probed 2026-09-11. "Boodschappen en
  Paketten voor Suriname" -- diaspora grocery/parcel order-and-deliver
  service (order in EUR, delivered to family in Suriname).

  WooCommerce Store API, open, no auth. X-WP-Total: 3601 across 181 pages.
  Enumerability confirmed: page1 vs page2 ids disjoint. currency_code=EUR
  from the API (kept as-reported per the "site's own code wins" rule) --
  this is diaspora order-and-deliver pricing, NOT Suriname's domestic SRD
  retail price level (same pattern already documented for now2su.com in
  avoda_sr's notes). Flagging for downstream analysts rather than
  excluding: this is a distinct business/catalog, not a duplicate shelf.

  Distinct from avoda_sr: a page-5 product-name overlap check (30 items
  each side) found 0 matches, and the category taxonomy uses a completely
  different Dutch naming convention. Not the same shelf.

  Rich, food-heavy category breakdown (counts as of 2026-09-11): DRANKEN
  211, Family packs 572, FRUIT 22, GROENTEN 75, Kip 46, ONTBIJT 203, Rund
  22, SAUS EN MARINADE 195, THEE & KOFFIE 49, VIS 32, VLEES 154, Varken
  42, ZOET & SNACKS 156, ZUIVEL 95, Zoutvlees 10, BROOD 14, Beleg 21,
  DIEPVRIES 21, KRUIDEN 30 -- plus non-food (BABY, PHARMA, SCHOOL,
  HYGIENE, TOILETARTIKELEN, ELEKTRO, DAMES). coicop_codes left unset for
  the classifier given the mixed catalog.

  Page family: API (reads the JSON Store API directly, never fetches a
  rendered page).

  Test: prices collect --source wangfamirie_sr --max-items 100 -> 100
  rows, 100 distinct product URLs, all EUR-priced.
