notes: |
  N.V. EBS regulated electricity tariff schedule. Two clean HTML tables
  parsed with pandas.read_html: monthly base fee per connection category
  (6 rows) + consumption tariff per kWh (4 residential usage tiers +
  1 non-residential flat rate). Page states tariffs "geldig per
  verbruiksmaand december 2024" -- taken as effective_from for both
  tables. Larger/irregular tariff tables on the same page (Groot
  verbruiker 1/2, Sociale instellingen, Reclame Borden, Teruglevering)
  intentionally not parsed -- each covers a tiny customer segment and
  has a multi-header layout that doesn't fit pandas.read_html cleanly.

  Dev-tested 2026-09-01: 11 rows, zero duplicate observation_hash.
