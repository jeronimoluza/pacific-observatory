analytical_role: retailer_sku
coicop_classification: classifier
spider: deto_sr
url: https://deto.sr/
language: nl
cadence: weekly
channel: home-improvement
notes: |
  WooCommerce Store API (/wp-json/wc/store/v1/products). Hardware/tools/
  household goods (e.g. 'ARTPLAST TOOLBOX PP M/WIELEN LINEA TEKNA
  46X28X66.5CM') -- classified home-improvement.

  Verified live 2026-09-11: x-wp-total=884, x-wp-totalpages=884 at
  per_page=1 (884 products, ~45 pages at per_page=20). Page 1 vs page 2
  (per_page=20) returned disjoint product-id sets, zero overlap --
  genuine pagination.

  CURRENCY FALSE POSITIVE, resolved per the wave-5 brief: the Store
  API's currency_code field returns "ABC", not a real ISO 4217 code.
  currency_symbol / currency_prefix on the same response both say
  "SRD", and this was cross-checked against a live rendered product
  page (https://www.deto.sr/product/artplast-toolbox-pp-m-wielen-linea-
  tekna-46x28x66-5cm/, fetched 2026-09-11): its own
  woocommerce-Price-amount markup shows "SRD 2.741,04", which is
  exactly 274104 / 10**2 from the API's own price + currency_minor_unit
  -- so the price math is correct and only the currency_code label is a
  tenant misconfiguration. Spider sets FORCE_CURRENCY="SRD" to pin the
  verified real currency instead of propagating "ABC".

  Note: product permalinks resolve on www.deto.sr; the bare apex domain
  also serves the Store API directly.

  Test run 2026-09-11: prices collect --source deto_sr --max-items 20 ->
  20/20 rows, all priced SRD, all distinct product_ids.

  Page family: API.
