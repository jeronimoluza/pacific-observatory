scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: nanshe_sr
url: https://nanshe.sr/
language: nl
cadence: weekly
channel: electronics
notes: |
  WooCommerce Store API, non-standard install: /wp-json/ 404s on this
  tenant (confirmed 2026-09-11), but the API is live via the
  ?rest_route= query-string form -- 'https://nanshe.sr/?rest_route=
  /wc/store/v1/products' returns 200 JSON (the fallback form documented
  in _woo_base.py's own module docstring). Home electronics/appliances
  catalog (Samsung Television, Oster Iron, Kitchen Elite Air Fryer,
  Hamilton Beach Toaster, Conair hair-care, Brentwood kitchen
  appliances) -- classified electronics. The brief's fingerprint-only
  'high quality / low prices' tagline matches the actual catalog:
  branded small appliances / consumer electronics.

  Verified live 2026-09-11: x-wp-total=1293, x-wp-totalpages=1293 at
  per_page=1 (1,293 products, ~65 pages at per_page=20). Page 1 vs page
  2 (per_page=20) returned disjoint product-id sets, zero overlap --
  genuine pagination.

  Currency: Store API reports currency_code=SRD -- matches Suriname's
  country currency.

  Test run 2026-09-11: prices collect --source nanshe_sr --max-items 20
  -> 20/20 rows, all priced, all distinct product_ids.

  Page family: API. Product permalinks are '?product=<slug>' query-
  string URLs, never fetched by this spider.
