scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: budgetshoppen_sr
url: https://budgetshoppen.com/
language: nl
cadence: weekly
channel: electronics
notes: |
  WooCommerce Store API (/wp-json/wc/store/v1/products). TVs, appliances,
  electronics (e.g. 'Scote 60-100 Inch Mobile TV Floor Stand with
  Shelf') -- classified electronics.

  Verified live 2026-09-11: x-wp-total=1483, x-wp-totalpages=1483 at
  per_page=1 (~1,483 products, ~75 pages at per_page=20). Page 1 vs page
  2 (per_page=20) returned disjoint product-id sets, zero overlap --
  genuine pagination.

  Currency: Store API reports currency_code=SRD -- matches Suriname's
  country currency. currency_minor_unit=0 (integer SRD, no decimal
  shift). 2 of 40 sampled products carry a "0" price (price-on-
  application placeholders); the base class drops zero-price rows.

  Test run 2026-09-11: prices collect --source budgetshoppen_sr
  --max-items 20 -> 20/20 rows, all priced, all distinct product_ids.

  Page family: API.
