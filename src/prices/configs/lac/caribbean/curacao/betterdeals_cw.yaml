notes: |
  Curacao onboarding 2026-10-05. Better Deals (Willemstad, Curacao): Shopify
  store, myshopify better-deals-curacao, countryCode CW. Shop currencyCode is
  ANG (the Shopify shop setting has not been migrated to XCG; same 1:1 peg and
  value). /products.json?limit=250 paginates (page 1 and 2 return different
  250-product sets, e.g. Apple 20W USB-C adapter 59.99, HP LaserJet Pro
  MFP 3103fdw 999.99). Consumer electronics, computers, appliances.
  Page family: API. coicop_codes left unset (wide).
throttle_group: shopify
