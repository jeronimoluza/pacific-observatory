notes: |
  Onboarded 2026-09-05. Island Liquor Grenada, a liquor/tobacco storefront
  on the CaribeEats delivery aggregator. Page family parsed: API (whole
  catalogue in one unauthenticated GET; synthetic '#<product_id>' urls, not
  browsable -- no archive-regex validation possible locally).

  53 SKUs / 8 categories verified live 2026-09-05: Alcohol: Liquor 36,
  Rums 5, Liqueur 2, Cigarettes 6, Cigars 1 (COICOP 02.1 / 02.2) plus a
  2-item non-alcoholic tail (Drinks, Tonic Water -> 01.2). coicop_codes
  deliberately unset: the catalogue spans more than one 3-digit class, so
  the narrowness short-circuit does not apply -- same call already made for
  `island_liquor_dm`.

  Missed by the 2026-09-01 Grenada pass because that pass enumerated only
  the `service_id=groceries` slice of the platform directory; this vendor is
  tagged business_type_id=1 and only appears in the unfiltered
  GET /api/businesses?region_id=1473 listing.

  Payload `currency` is XCD, matching countries.yaml grenada. Distinct from
  `island_liquor_dm` (Dominica) and `island_liquor_kn` (St Kitts) -- same
  brand family, three separate territories, three slugs, three price levels.
throttle_group: caribeeats
