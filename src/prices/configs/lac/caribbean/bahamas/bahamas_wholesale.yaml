notes: |
  Bahamas Wholesale Agencies publishes a dated, public 23-page product price
  list covering food and non-food consumer goods. The fetcher discovers the
  current PDF from the first-party listing page and records the payable w/VAT
  price, source item code, pack unit, and PDF date. The verified 2026-08-24
  edition yielded 1,288 rows, including two wrapped rows recovered by
  pdfplumber's layout-aware text extraction.
