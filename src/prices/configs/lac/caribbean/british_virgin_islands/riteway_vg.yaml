notes: |
  60-year BVI chain, 9 stores. Magento 2 ("Roadtown" theme) SSR HTML;
  /graphql 404s via the Varnish edge (module disabled), so the spider
  reads the server-rendered shop-groceries.html category listing directly.
  Live re-verify: GET /shop-groceries.html -> 200, 1.9MB, real product
  cards incl. "Fresh Ground Beef" USD 4.99. Standard Magento ?p=N
  pagination. Currency USD matches countries.yaml.
