notes: |
  Farmacias Arrocha (Panama) drugstore chain webshop -- broad assortment
  spanning personal care, cosmetics, fragrances, packaged food, toys, and
  office/school supplies (Panama uses USD as legal tender). Open Shopify
  /products.json catalog. Verified live 2026-08-17: currency confirmed
  USD via /cart.js. Wide catalog -- coicop_codes left unset for classifier
  assignment.
  Full scrape 2026-08-17: 1,641 rows (7 pages) before 429s from the site
  truncated further pagination (Shopify-side throttling under sustained
  load; base class DOWNLOAD_DELAY=2.0s not enough). Live catalog likely
  larger -- re-run after a cooldown for fuller coverage.
