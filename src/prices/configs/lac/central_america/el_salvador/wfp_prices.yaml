notes: |
  WFP food prices for El Salvador via HDX (shared LAC fetcher
  _shared.lac.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_slv.csv (200, 1.0MB, 7,560 rows),
  currency USD throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. Both wholesale and retail channel rows present;
  national-average style market coverage. Sample at max date: 'Maize
  (white)', 46 KG, USD 26.49 (wholesale, San Salvador) — retail-basis rows
  for the same commodity also present at the same date (e.g. USD 0.34 per
  Libra). Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
