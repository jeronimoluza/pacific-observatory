notes: |
  Onboarded 2026-08-07 (round-3 non-food shard, COICOP 03/05/08/09 gap).
  Same shared platform as decathlon_th — see _decathlon_base.py docstring.
  Per-country Algolia app id/key (index-scoped; do not reuse across
  countries). Taiwan's index is Traditional-Chinese-only — no _en fields
  at all (name_zh/url_zh/sport_zh only); spider sets LANG_SUFFIX="zh" and
  SPORT_FACET_FIELD="sport_zh" accordingly. product_name is emitted as the
  site's own zh-TW text, unmodified.
  coicop_divisions: 03, 09
  divisions_basis: walked_categories (same sport_zh facet taxonomy as
  decathlon_th's sport_en — sport/recreation goods dominant 09,
  sportswear/footwear 03)
