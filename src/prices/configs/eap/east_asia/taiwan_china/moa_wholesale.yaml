notes: |
  Taiwan MOA (Ministry of Agriculture) open-data wholesale prices. General
  source spanning four endpoints in one fetcher: produce (FarmTransData 037,
  900+ fruit/veg crops + cut flowers by market), live hogs (AnimalTransData
  026), goats & sheep (SheepTransData 276), and broiler chicken + eggs
  (PoultryTransBoiledChickenData 056). The animal endpoints cover the COICOP
  live-animal leaves (01.1.2.1.x); produce covers the fresh fruit/veg sourcing
  gaps. No auth; each endpoint returns its most-recent window newest-first
  (capped ~5.5k–10k rows) so daily runs accumulate history. Prices NT$/kg;
  per-market origin kept in notes + dedup hash. Cut flowers in the produce feed
  are dropped downstream by the division-01 food gate. COICOP deferred.
