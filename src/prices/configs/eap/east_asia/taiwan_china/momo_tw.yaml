scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: momo_tw
url: https://www.momoshop.com.tw
archive_prefix: "momoshop.com.tw"
archive_path_re: '^/goods/GoodsDetail\.jsp$|^/TP/TP\d+/goodsDetail/TP\d+$'
language: zh
cadence: daily
channel: hypermarket
notes: >
  General marketplace, seeded with F&B search keywords. Products come from a
  schema.org JSON-LD ItemList in the server-rendered search page (no JS).
  channel=hypermarket so tier-c narrowing is skipped; category = seed keyword.
