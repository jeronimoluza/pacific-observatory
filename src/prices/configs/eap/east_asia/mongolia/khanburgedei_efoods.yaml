notes: |
  Khanburgedei is a premium Mongolian supermarket chain (TTEM LLC, ~8 stores).
  This is its dedicated grocery storefront (separate from the general-
  merchandise estore.khanburgedei.mn, which is mostly apparel/cosmetics
  brands and out of scope here). Crawl restricted to food department
  roots (daily food incl. meat/dairy/bread, produce, processed/pantry,
  liquid food/beverages incl. alcohol, sweets, frozen) via category_root
  allow-list in the spider. Product cards on listing pages carry a clean
  numeric price (data-ct-price attribute) — no PDP visit needed.
