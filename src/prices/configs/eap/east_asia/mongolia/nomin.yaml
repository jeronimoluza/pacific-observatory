scaffolding: fetcher
extraction_pattern: html_product_cards
analytical_role: retailer_sku
coicop_classification: classifier
source_key: mn_nomin
module: eap.east_asia.mongolia.nomin
function: fetch_mn_nomin
url: https://nomin.mn/
language: mn
cadence: daily
channel: hypermarket
archive_prefix: "nomin.mn/p/"
archive_path_re: '^/p/\d+$'
fallback_date: 2024-01-01
notes: |
  Nomin hypermarket storefront. The parent source workbook classed this as a
  Mongolia grocery priority, but the old spider used www.nomin.mn start URLs
  that can fail DNS resolution. This fetcher uses https://nomin.mn/ and parses
  server-rendered homepage cards with product links and MNT prices across food,
  household paper, detergent, soap, and home/kitchen items.
