  rendered with product names, product detail links, and tugrik prices. Current
  homepage cards cover food and beverage staples such as bread, milk, sausage,
  drinks, chocolate, and wine. The fetcher parses visible product cards only and
  preserves product-page URLs for later enrichment or category expansion.
