notes: >
  Expatistan crowd-sourced cost-of-living aggregator. Emits one record per
  (city, item) pair in LOCAL currency (apply WB FX feed downstream for USD).
  Includes two summary rows per city (Family-of-four / Single-person monthly
  costs) as category="Summary" — CPI-analog city totals. Serves PPP + soft
  inflation proxy; not stickiness. Closes LivingCost EAP coverage gap.
  Recommended cadence: weekly.
