cadence: daily
fallback_date: 2020-01-01
notes: |
  Hong Kong AFCD fresh-food wholesale prices — a single daily CSV of average
  wholesale prices at the Cheung Sha Wan / FMO markets. General source: covers
  live animals (pig, cattle, chicken), marine fish, freshwater fish, vegetables
  and eggs in one file. The only clean EAP source for the live-animal COICOP
  leaves (01.1.2.1.x) that retail never carries. Prices HK$/catty (HK$/egg for
  eggs); "-" marks missing and is skipped; the "Last Revision Date" column is
  the observation date and the file carries ~2 weeks of history, accumulated
  across runs. Repeated section-header rows are dropped. COICOP deferred.
