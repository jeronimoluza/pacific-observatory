fallback_date: 2026-01-01
notes: |
  Macao Consumer Council (消費者委員會) official Price Station -- multi-
  supermarket item-level price comparison. Front end at consumer.gov.mo is
  ASP.NET WebForms (VIEWSTATE) but embeds a separate Next.js SPA backend at
  api03.consumer.gov.mo/app/supermarket/ discovered via Playwright network
  trace (not the DSEC CPI ASMX service used by dsec_cpi.yaml). Endpoint
  itemlist_price_range?lang=en&category=<id> returns SSR HTML with the data
  inline as __NEXT_DATA__ JSON: per-item min_price/max_price range observed
  across surveyed supermarkets, no per-item date. 14 top-level categories
  discovered dynamically (Rice/Cereal/Oil/Canned/Seasoning/Beverage/Milk/
  Infant/Household Cleansing/Personal care/Snacks/Frozen/Paper/Spreads),
  ~598 commodity rows total. Spans multiple COICOP divisions (01/05/12) so
  left to the classifier, same as HK's online_price_watch.py. price_local
  is the midpoint of min/max (raw range kept in notes), observation_date is
  the request date (no source-side date field) -- same convention as
  th_talaadthai. Discovered 2026-08-11.
