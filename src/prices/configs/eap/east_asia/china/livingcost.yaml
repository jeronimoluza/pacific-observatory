scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: aggregate_proxy
coicop_classification: classifier
spider: livingcost
url: https://livingcost.org/cost/china
language: en
cadence: weekly
channel: null
archive_prefix: "livingcost.org/cost/china/"
archive_path_re: '^/cost/china/[a-z0-9-]+$'
spider_kwargs:
  country_slug: china
notes: >
  LivingCost.org crowd-sourced cost-of-living aggregator. Emits one
  record per (city, item) pair, USD-canonical (apply WB FX feed
  downstream for local-currency). Serves PPP + soft inflation proxy;
  not stickiness.
