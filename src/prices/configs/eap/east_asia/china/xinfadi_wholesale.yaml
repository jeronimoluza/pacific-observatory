scaffolding: fetcher
extraction_pattern: rest_api
analytical_role: official_avg
coicop_classification: classifier
channel: wholesale
source_key: cn_xinfadi_wholesale
module: eap.east_asia.china.xinfadi_wholesale
function: fetch_cn_xinfadi_wholesale
url: http://www.xinfadi.com.cn/priceDetail.html
language: zh
cadence: daily
fallback_date: 2024-01-01
notes: >
  China's first genuine F&B price-level fetcher (2026-08-11) - the prior only
  real grocery source (suning spider) is retail-catalog; everything else in
  China is pharmacy or a cost-of-living aggregator. Beijing's largest
  wholesale market; open unauthenticated JSON endpoint
  (getPriceData.html, POST, params limit/current/pubDateStartTime/
  pubDateEndTime/prodCatid/prodName) with server-side date filtering and
  pagination. ~450-550 items/day across vegetables (蔬菜), fruit (水果),
  meat/poultry/eggs (肉禽蛋), and aquatic products (水产) - covers COICOP
  01.1.2/01.1.3/01.1.6/01.1.7 fresh-food leaves that retail supermarkets
  structurally under-carry. Wholesale, not retail, prices. Fetcher walks a
  fixed 30-day lookback from today (not from cutoff) to avoid a multi-year
  backfill against the site's 759k+ historical rows; unit is converted from
  斤 (jin, 0.5kg) to kg (x2), other units passed through natively.
