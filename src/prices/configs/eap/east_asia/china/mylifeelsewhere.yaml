scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: aggregate_proxy
coicop_classification: classifier
spider: mylifeelsewhere
url: https://www.mylifeelsewhere.com/cost-of-living/china
language: en
cadence: weekly
channel: null
archive_prefix: "www.mylifeelsewhere.com/cost-of-living/china"
archive_path_re: '^/cost-of-living/china$'
spider_kwargs:
  country_slug: china
notes: >
  MyLifeElsewhere crowd-sourced cost-of-living aggregator.
  Country-only — emits one record per (country, item) pair (~34
  items / 7 categories per country, no city dimension). Both
  price (local) and price_usd are populated from source.
