scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: aggregate_proxy
coicop_classification: classifier
spider: expatistan
url: https://www.expatistan.com/cost-of-living/country/china
language: en
cadence: weekly
channel: null
archive_prefix: "www.expatistan.com/cost-of-living/"
archive_path_re: '^/cost-of-living/[a-z0-9-]+$'
spider_kwargs:
  country_slug: china
  currency: CNY
notes: >
  Expatistan crowd-sourced cost-of-living aggregator. Emits one
  record per (city, item) pair in LOCAL currency (apply WB FX feed
  downstream for USD). Includes two summary rows per city
  (Family-of-four / Single-person monthly costs) as
  category="Summary" — CPI-analog city totals.
