scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: source_curated
coicop_codes:
  - "04.5.2"
spider: o4a2_go_gas_to
url: https://o4a2.com/collections/go-gas
language: en
currency: NZD
cadence: weekly
channel: fuel-station
# archive_path_re pinned 2026-09-17 to this merchant's slug marker: dominant
# marker over a 6-path live sample. The o4a2.com/products/ namespace is
# flat, so the prefix alone cannot tell one seller from another.
archive_prefix: "o4a2.com/products/"
archive_path_re: '^/products/.*pick-?up-from-gogas'
notes: |
  O4A2 vendor collection for Go Gas LPG products in Tonga. Fuel/utility-adjacent
  source only; useful for COICOP 04.5.2 but not food or beverages. This is a
  vendor-level scrape from the same O4A2 marketplace host. The collection
  exposed 6 priced rows during live probe on 2026-09-01.
throttle_group: o4a2
