scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: o4a2_to
spider_kwargs:
  vendor_filter: "Elenoa Store"
url: https://o4a2.com/
language: en
cadence: weekly
channel: convenience
timeout: 600
archive_prefix: "o4a2.com/products/"
archive_path_re: '^/products/[a-z0-9-]+$'
notes: |
  Discovered 2026-09-11 (Pacific food-source pass). Elenoa Store (Popua,
  Tongatapu) is a named, real Tongan convenience/snack store, one of the
  distinct named retailers on the O4A2 (https://o4a2.com) Shopify-based
  grocery-delivery marketplace serving Tonga (Shopify.country="TO",
  Shopify.currency active="NZD"). Already flagged as a named vendor in
  golden_star_to.yaml's 2026-09-01 catalogue notes but never scaffolded as
  its own source until now. Per the onboard-price-sources marketplace-as-
  directory doctrine, this manifest scopes the shared o4a2_to spider to
  vendor="Elenoa Store" only.
  Tier 1B: /products.json?limit=250&page=N, no auth, pagination via `page`
  cursor to exhaustion.
  Measured live 2026-09-11 (full unbounded /products.json walk, filtered to
  this vendor): 113 rows, all priced, currency 100% NZD (Shopify-declared).
  Sample items: croissants, instant noodles (Chio Mie), flavoured chips --
  low unit prices ($0.50-$1.30), a small snack/convenience-store assortment
  distinct from the other vendors' bulk/grocery mix. channel: convenience.
  ANALYTICAL CAVEAT (same as every other O4A2 vendor manifest): O4A2 is a
  diaspora gifting platform -- buyer pays in NZD, recipient collects
  in-store in Tonga. Retailer, goods and collection point are genuinely
  Tongan (locality holds), but prices are NZD gifting-platform prices, not
  domestic pa'anga (TOP) shelf prices, and may carry a platform margin/FX
  spread. Treat as a Tongan retail signal, not a CPI-grade domestic price.
