scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: source_curated
coicop_codes:
  - "11.1.1"
spider: o4a2_hot_pizza_to
url: https://o4a2.com/collections/hot-pizza
language: en
currency: NZD
cadence: weekly
channel: specialty-food
# archive_path_re pinned 2026-09-17 to this merchant's slug marker: 85.7%
# dominant. The o4a2.com/products/ namespace is flat, so the prefix alone
# cannot tell one seller from another.
archive_prefix: "o4a2.com/products/"
archive_path_re: '^/products/.*pick-?up-from-hot-pizza'
notes: |
  O4A2 vendor collection for Hot Pizza in Tonga. Prepared-food source only;
  useful for COICOP 11.1.1 but not a grocery basket. This is a vendor-level
  scrape from the same O4A2 marketplace host. The collection exposed 14 priced
  rows during live probe on 2026-09-01.
throttle_group: o4a2
