notes: >
  Food-service wholesale distributor. WooCommerce Store API at the OLDER
  namespace /wp-json/wc/store/products (the standard /wc/store/v1/products
  path 404s -- rest_no_route -- on this tenant). 132 products confirmed via
  X-WP-Total header. Prices are integer minor units, rescaled by the
  Store API's currency_minor_unit (raw 7340 -> $73.40, cross-checked
  against price_html on the same payload).
