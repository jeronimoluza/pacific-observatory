notes: |
  Tappoo Fiji's online storefront -- separate from the tappoo.com.fj
  brochure/nav site, reached via its "Shop Online" link
  (https://store.tappoo.com.fj). Shopify-hosted
  (Shopify.shop="tappoostore.myshopify.com"), Shopify.country="FJ",
