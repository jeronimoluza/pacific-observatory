notes: |
  American Samoa Dept of Commerce Basic Food Index (BFI), monthly, ~20-item
  basket across 14 retail stores. Full archive (Jan 2021-present, one release
  per month with 3 exceptions) discovered via the site's Wix FAQ widget API
  (_api/v1/access-tokens for a public per-visitor token, then
  _api/faq-server/v2/question-entries/query filtered to the "Basic Food
  Index" category) -- the /stats page itself renders this tab client-side
  via Wix, no content in raw HTML. Links resolve to either the Wix media CDN
  or Google Drive share links (both public, no auth). PDF text
  extractability is inconsistent release-to-release (~1 in 7 in the archive
  is a native/digital PDF; the rest are scanned images) -- image-only
  releases are skipped with a logged warning, no OCR wired (would need
  pytesseract + pdf2image, not currently a project dependency). Only the
  release's own (current) month is kept from each PDF's 3-month rolling
  table, to avoid double-counting overlap across consecutive releases.
