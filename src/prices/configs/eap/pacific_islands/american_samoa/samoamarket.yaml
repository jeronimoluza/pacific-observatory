notes: |
  Public SamoaMarket catalog. The homepage and shop-online pages describe
  service to customers worldwide, including American Samoa; grocery partner
  catalog pages expose food-and-beverage products and product detail URLs.
  Prices are displayed in NZD on the public storefront. The existing
  samoa_market spider follows wholesale pagination and product links and
  extracts name, price, and product code from the product detail page.
