notes: |
  American Samoa Bar Association publication of Regulation 19.0170 Taxi
  Rates, sourced from American Samoa commercial-vehicle transportation
  regulations. The fetcher parses named route rows and supplemental taxi
  charter, waiting, minimum, and excess-luggage charges from the public HTML
  page. Rows are official USD maximum permissible taxi fares for American
  Samoa and are counted as transport-service tariff coverage.
