notes: |
  American Samoa Power Authority monthly utility billing-rate PDFs. The
  fetcher discovers linked PDFs from rates.html and parses text-native
  electricity, streetlight, water, solid-waste, disposal-facility, and
  groundwater/wastewater tariff rows. This is a non-food fallback source used
  only after retail/food candidates were exhausted; it is local and official,
  with named service/rate rows and USD prices.
