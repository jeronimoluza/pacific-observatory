notes: |
  American Samoa Department of Commerce CPI Newsletter item-level
  "Quarterly Averaged Prices" table. This is separate from the CPI index
  benchmark in doc_cpi.yaml: it emits named commodity price observations
  such as apples, beef, bread, eggs, rice, sugar, taro, tuna, soft drinks,
  beer, tobacco, fuel, electricity, and building materials. The fetcher uses
  the same public Wix FAQ widget discovery path as doc_cpi.yaml, downloads
  newsletter PDFs, parses the rolling five-quarter table, and keeps only the
  rightmost/current quarter to avoid duplicate overlap. COICOP assignments are
  source-curated because the commodity list is stable and small.
