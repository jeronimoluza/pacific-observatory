  inventory (brand "AC Pacific LLC" wholesaler) -> channel: hypermarket per
  GLOSSARY.md discriminating test. Currency USD confirmed both by
  countries.yaml and the site's own data-product-tracking-info JSON
  ("currency": "USD").
