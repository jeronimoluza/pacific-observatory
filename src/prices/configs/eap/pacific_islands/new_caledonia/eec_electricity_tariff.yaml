notes: |
  Electricité et Eau de Calédonie (EEC) regulated electricity tariff
  schedule, government-set. The tariff page stamps "Grille tarifaire en
  vigueur du 1er octobre 2025".

  The page holds nine HTML tables; this fetcher takes only the two
  unambiguous, per-consumer ones -- "Prix unitaire (en FCFP)" (per-kWh
  energy rate by usage category: Domestic <=3.3kVA / Domestic >3.3kVA /
  Professional, 3 rows) and "Redevance comptage (FCFP)" (fixed monthly
  metering fee by meter/breaker type, 5 rows). Skipped deliberately: the
  photovoltaic feed-in ("Tarif d'achat") table is a rate EEC pays OUT to
  solar producers, not a consumer price, and several PRIME FIXE / CALIBRAGE
  tables have merged multi-row headers whose category boundaries are
  ambiguous without inventing structure the source doesn't state cleanly.

  `pandas.read_html` silently corrupts this page's comma-decimal figures
  ("37,91" -> parsed as the integer 3791) -- the fetcher parses raw table
  cells with BeautifulSoup and does the comma-to-dot conversion itself.
  price_local is always whole XPF (New Caledonia franc has no subunit).

  Verified live 2026-09-06: 8 rows, effective_from 2025-10-01.
