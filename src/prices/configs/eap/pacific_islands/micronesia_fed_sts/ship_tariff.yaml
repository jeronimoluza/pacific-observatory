notes: |
  FSM Department of Transportation, Communications & Infrastructure (TC&I)
  -- national "Ship Tariff Regulations" for the government field-trip
  vessels (Caroline Voyager, Micronesian Navigators, etc.) that serve
  inter-state and outer-island routes. Static PDF linked from TC&I's live
  Marine Division regulations listing (verified 2026-09-28 -- it is the
  only tariff document listed there, alongside several other still-current
  marine regulations of similar vintage). Micronesia's first transport-
  division (07) source.

  pdfplumber extracts prose, not tables, for the passenger-fare section.
  Only passenger-facing rows are emitted (18 total): the 2 base
  administered per-mile rates (cabin $0.20/mi for trips >=100 miles, deck
  $0.07/mi), the document's own 6+6 worked route examples for both cabin
  and deck fare between the four state centers (Pohnpei/Chuuk/Kosrae/Yap --
  arithmetic products of rate x distance, but recorded because they are the
  concrete quoted trip price, the same kind of observation other transport
  tariffs in this corpus record), the special/charter voyage hourly rate
  ($120/hr), and onboard meal rates (breakfast/lunch/dinner). Part 4
  "Shipment of Cargo" (per-revenue-ton freight, live-animal and drum rates)
  is deliberately NOT extracted -- producer/business shipping cost, not a
  household consumer price.

  A separate <100-mile "Point to point" cabin rate ($0.18/mi, reg. 3.1.2)
  exists on the same page and is NOT the rate used for any of the 6
  illustrated inter-state routes (all >=100mi, reg. 3.1.3, $0.20/mi) -- the
  fetcher anchors on the ">=100 miles" clause specifically to avoid picking
  up the wrong figure. Source PDF also has a one-off "Pohpei" typo in the
  deck-fare table, normalized to "Pohnpei" so both fare directions read
  identically.

  EFFECTIVE-DATE CAVEAT: the regulation's approval page gives only
  "Date:__________, 2003" / "effective August ______, 2003" -- year and
  month, exact day left blank in the source. Modelled as
  period_kind=effective_from with effective_from=2003-08-01. This is a
  genuinely old, still-current regulation (no newer amendment found on
  TC&I's site), but the fixed per-mile/per-hour/per-meal rates have very
  likely not moved with inflation since 2003 -- flagged loudly, not
  silently presented as fresh pricing. Field-trip vessel service itself is
  also reported (by third-party sources, not this document) as running only
  a few times a year, so treat this source as a low-frequency administered-
  rate reference, not a high-turnover retail price.

  Currency is USD -- FSM's actual currency, no FX conversion needed.

  Probed and verified live 2026-09-28: 18 rows extracted from the current PDF.
