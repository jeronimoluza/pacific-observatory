notes: |
  VNSO Port Vila Market Survey -- quarterly weighted-average retail prices
  for ~20 fresh-produce items sold at Port Vila's central market. The
  landing page links a per-quarter "Download Tables" .xlsx; this fetcher
  always reads the CURRENT (top-of-page) workbook, not the historical PDF
  archive of past quarters also linked lower on the page.

  The xlsx's "Tab 1-2" sheet stacks "Table 1: Quantity Supplied" and
  "Table 2: Weighted Average Price Per Kilograms (in Vatu)" in one column
  block -- this fetcher reads Table 2 directly (VNSO's own per-kg price,
  not something derived here from value/quantity). Prices are whole Vatu,
  consistent with VUV having no minor unit -- unlike the URA tariff RATES
  (see ura_electricity_tariff.yaml), which the regulator itself publishes
  to 2dp.

  coicop_classification: source_curated -- ~20 stable commodities recurring
  every quarter, hand-mapped to COICOP-2018 leaves in the fetcher's
  _COICOP_MAP. Two mappings are judgment calls: "Island Cabbage" is a
  Pacific leafy green (not true cabbage) -> other leafy vegetables
  (01.1.7.1.9); "Dried coconut" and "Green coconut" (maturity stages of the
  same fruit, no separate COICOP leaf) both -> coconuts, fresh (01.1.6.1.8).

  Complements the two existing supermarket spiders (aelanbasket_vu,
  dynamic_vanuatu) with fresh/wet-market prices those catalogs structurally
  don't carry -- this is the "wholesale/official_avg feed for fresh
  produce" lead called out in the wave-7 brief.

  vnso.gov.vu TLS chain requires requests(verify=False), same class as
  vnso_cpi.py (see known_blockers.md "NSO portal SSL certificate failures").
