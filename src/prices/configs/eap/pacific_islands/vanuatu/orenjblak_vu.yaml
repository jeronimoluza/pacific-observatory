notes: |
  ORENJBLAK is a Port Vila, Vanuatu TakeApp storefront for locally rooted
  apparel, merchandise, ID cards, and accessories. Live probe 2026-09-07
  decoded the Next.js flight payload with currency VUV, countryCode VU, and
  19 physical products including T-shirts, hoodies, mugs, bottles, lanyards,
  and ID-card accessories. TakeApp stores encode VUV as whole-vatu amounts,
  so this spider overrides the shared TakeApp price divisor to preserve
  displayed VUV prices such as 3000 rather than 30.00.
