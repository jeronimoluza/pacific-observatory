scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: tide_table_mh
url: http://www.rreinc.com/tidetablemenu.html
language: en
currency: USD
cadence: monthly
channel: specialty-food
archive_prefix: "www.rreinc.com/tidetablemenu.html"
archive_path_re: '^/tidetablemenu\.html$'
notes: |
  Official Tide Table Restaurant and Lounge menu page from Robert Reimers
  Enterprises in Majuro. The page exposes beverage names and USD prices as
  HTML text, including cocktails, spirits, blended drinks, and beers. The
  HTTPS endpoint has a certificate hostname mismatch as of 2026-09-01, so the
  scraper uses the matching HTTP page. This is prepared food/beverage menu
  coverage, not supermarket grocery coverage.
