notes: |
  RONLAW indexes Nauru legal instruments and exposes searchable text for
  price-control orders. Live probe 2026-09-07 found Price Control Order No 2
  2026_serv5.pdf, commenced 2026-05-29, with six maximum wholesale/retail
  fuel prices for diesel, petrol, and Jet A1 in dollars per litre. The public
  PDF viewer path serves the web app shell to curl, so the spider reads the
  RONLAW search API text and anchors rows to the viewer URL.
