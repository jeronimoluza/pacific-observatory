fallback_date: 2015-01-01
notes: |
  Kiribati Ministry of Commerce, Industry and Cooperatives (MCIC) -- Price
  (Regulation) Orders made under the Prices Ordinance (Cap 75). Kiribati's
  FIRST item-level food and tobacco price source: the country has zero
  scrapeable retail e-commerce (Punjas Kiribati is a corporate site, MOEL's
  Wix storefront has dead "Shop Now" links, everything else is a Facebook
  page), so before this manifest its only div-01/02 signal was the NSO CPI
  index plus cost-of-living survey publishers.

  Each Order gazettes a maximum WHOLESALE and maximum RETAIL price for ~120
  named branded packs. Verified live 2026-09-05: 689 rows, 79% of them
  COICOP division 01 or 02 -- flour (75), rice (143), sugar (134), potatoes
  (5), powdered milk (77), infant/formula milk (47), breakfast cereals (20),
  Sunquick cordial (10), bottled baby food (25), tobacco (10). The
  remaining 21% is a non-food tail the Ordinance also controls: exercise
  books, bar soap, benzene, kerosene, engine oil, bicycles, batteries,
  mosquito nets. Prices are AUD (Kiribati uses the Australian dollar).

  Rows are disaggregated by the island groups the Order prices separately:
  Gilbert Group, Christmas Island, Tabuaeran & Teraina, and (in the
  single-region Line Group Order) Line & Phoenix Group.

  CAVEAT 1 -- administered ceiling, not a shelf price. These are the legal
  MAXIMUM a Kiribati retailer may charge, so realized prices sit at or
  below them. Hence analytical_role=official_avg and channel=null (per the
  schema rule); this source adds real div-01/02 coverage but does NOT move
  the food-channel count.

  CAVEAT 2 -- most of the archive is a scan and is read by OCR. 21 Order
  PDFs are linked from /price-order/ (re-measured live 2026-09-11); only 3
  carry a text layer with a ruled table pdfplumber can see. The rest are
  image-only, and are now re-read through `prices.fetchers.ocr` (pdftoppm +
  tesseract, both already on the collection host; no new dependency). The
  scan is parsed off the table's own ruled lines rather than off OCR line
  text, so a cell OCR could not read stays empty instead of pulling its
  neighbour's value one column across. Every OCR'd value is then checked
  against the Order's own arithmetic -- two-decimal shape, plausible AUD
  ceiling range, wholesale <= retail, and per-kg/per-lb near the 2.2046
  kg/lb ratio -- and dropped if it fails. Measured on a full 2015-01-01
  rebuild: 935 rows (689 from the 3 text-layer Orders, 246 from 2 OCR'd
  scans), OCR reject rate 17.0% (68 of 401 candidate cells). The newest
  usable vintage moves from 2022-06-14 to 2024-02-22 (Prices (Regulation)
  Order No.1 of 2024, a scan). 16 PDFs still yield nothing -- amendment
  notices with no ruled table, plus scans (price-control-23th-august-2021)
  whose rules are too faint to detect. All are logged by name every run.

  CAVEAT 2b -- six PDFs carry only a year in the filename. Their date now
  comes from the listing's own "Date added" field, which is the publisher's
  upload date, not the gazetted commencement date (the 2024 Order leaves its
  own commencement line blank). Before this they were skipped outright.

  CAVEAT 2c -- OCR rows carry NO "<section> - " prefix on item_name, unlike
  text-layer rows, because the numbered commodity headings are drawn in the
  product column and a scan drops them often enough that carrying the last
  one forward files rice under flour. An OCR'd vintage therefore does not
  join to a text-layer vintage on item_name alone.

  CAVEAT 3 -- layout is not stable across vintages. 2022 Orders publish
  either one island group in 5 columns or three in 13; the parser reads the
  region banner above the "Wholesale" header row and derives the number of
  4-column blocks from the row width instead of assuming one shape. Only
  the retail column is emitted as price_local; the matching wholesale
  figure is carried in `notes`, and the two trailing per-kg / per-lb /
  per-piece columns are deliberately dropped because they restate the same
  price and would double-count.

  CAVEAT 4 -- the source's text layer inserts stray spaces inside numbers
  ("4 6.00", "0 .85"). Those are stripped before parsing and every value is
  bounds-checked. 5 of 684 rows still show wholesale > retail (e.g.
  "Thailand VHP 50kg (110lb) 72.90 / 64.00"); those are typos in the
  gazetted PDF itself, not extraction damage, and are left as published
  rather than silently repaired.
