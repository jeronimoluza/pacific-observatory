notes: |
  Kiribati NSO quarterly CPI. Only the newest bulletin currently carries a
  machine-readable XLSX (older releases are PDF-only); fetcher reads the
  CPI landing page for the newest linked .xlsx under the
  consumer-price-index download category. That workbook's "Quarterly Price
  Index" table carries the full COICOP-division series back to 2006, so one
  fetch backfills the whole history. Base period 2024 Q2=100 (NSO
  re-normalised Q2-2024 as the base quarter). 12 COICOP groups; division
  "0" (All-Items headline) dropped — no sanctioned sentinel code yet.
