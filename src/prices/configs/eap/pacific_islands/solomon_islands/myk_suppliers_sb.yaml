notes: >
  MYK Supplier Ltd Honiara online store for cleaning and household supplies.
  The public Squarespace storefront exposes product names, variant ids,
  product URLs, and prices in product-list data-context JSON, adding non-food
  household-supplies coverage for Solomon Islands. The Squarespace commerce
  metadata reports USD for the prices even though the site organization,
  address, phone, and country metadata are Solomon Islands.
