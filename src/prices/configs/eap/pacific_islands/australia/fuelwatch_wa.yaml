notes: |
  Government of Western Australia FuelWatch RSS feed. The feed exposes station
  prices by fuel product, region, and day; today's prices are available all day.
  Collector samples Metro North of River (region 25) for common fuels:
  Unleaded Petrol, Premium Unleaded, Diesel, and 98 RON. RSS prices are
  published as cents per litre and emitted as AUD/litre.
