scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: drakes_supermarkets
url: https://online.drakes.com.au
language: en
channel: supermarket
archive_prefix: "087.drakes.com.au/lines/"
archive_path_re: '^/lines/[^/?]+'
notes: |
  Largest independent AU grocer. Per-store "Shopfront" (Marketplacer) app on
  numbered store subdomains (087 = Drakes McDowall, used as representative
  store). Browse grid hydrates client-side, but each product ("line") page is
  server-rendered with schema.org Product JSON-LD (name + offers.price +
  priceCurrency) and a BreadcrumbList JSON-LD for category. Spider seeds off
  087.drakes.com.au/sitemap.xml (~14.8k /lines/ URLs) and parses JSON-LD.
  Plain requests (browser UA), no Playwright/impersonation. Prices are the 087
  store's; zero-price lines skipped.
timeout: 14400
