notes: |
  Verified live 2026-08-11: Samoa Bureau of Statistics monthly CPI, base
  period Feb 2016=100. Fetcher walks to the latest release under
  /documents/economics/CPI/<year>/ and parses the "Table 1&2" sheet's
  "Table 1. CONSUMER PRICE INDEX" block (12 named divisions, division 13
  absent from Samoa's own basket). Same workbook also has a "Table 3. AVERAGE
  RETAIL PRICES OF SELECTED COMMODITIES" sheet — ~190 named commodities
  across all 13 divisions (Chicken leg quarters, Bread, Milk Anchor, Soft
  Drink Coke, Electricity Cashpower, ...), a genuinely rich whole-basket
  official_avg series, arguably richer than the Local Market Survey onboarded
  this same round. NOT built this pass — its header is a 2-row merged
  year/month layout that needs careful merged-cell resolution to get right;
  flagged as the strongest follow-up target from this session, not a dead
  end. Tables 4-9 in the same workbook (imported-goods CPI, local-goods CPI,
  inflation-rate derivatives) also out of scope this round.
  coicop_divisions: 01, 02, 03, 04, 05, 06, 07, 08, 09, 10, 11, 12
  divisions_basis: walked_categories (all 12 mapped columns of Table 1)
