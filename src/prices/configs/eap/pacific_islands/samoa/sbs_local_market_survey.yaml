scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: source_curated
channel: wholesale
source_key: ws_sbs_local_market
module: eap.pacific_islands.samoa.sbs_local_market_survey
function: fetch_ws_sbs_local_market
url: https://www.sbs.gov.ws/local-market-survey/
language: en
cadence: monthly
fallback_date: 2024-01-01
notes: |
  Verified live 2026-08-11. Samoa Bureau of Statistics monthly Local Market
  Survey — item-level weighted average price per kg (Tala) for 12 fresh-produce
  staples sold at local markets (taro, banana, taro palagi, ta'amu, coconut,
  breadfruit, yam, head cabbage, tomatoes, Chinese cabbage, cucumber, pumpkin).
  This is the fresh-produce coverage supermarkets structurally miss. The
  release page lists every monthly PDF+XLSX back to 2015 (older releases use
  other path/casing conventions not walked here). IMPORTANT: the latest
  release's "Table 2" sheet is NOT fully cumulative — verified columns run
  Jan1993-Dec2007 monthly, then only 3 annual snapshots (2008/2010/2014,
  2009/2011-13/2015-24 simply absent), then a rolling ~13-month window ending
  at the release month. The fetcher downloads only the single latest release
  (cheap, and the rolling window naturally accumulates monthly history from
  here forward via the cutoff-gated append) but does NOT backfill the
  2008-mid-2025 gap — that would require walking dozens of older per-month
  files under different path/layout conventions (/digi/, /images/sbs-
  documents/..., /images/.../local-market-survey/<year>/ for 2020-2022), not
  done this round. First run with fallback_date below picks up the ~13 months
  the current release actually carries; flagged as a good backfill target for
  a future pass. Item -> COICOP-2018 leaf mapping is static
  (coicop_classification: source_curated), looked up against the repo's own
  coicop_categories.xlsx rather than guessed — two judgment calls are
  documented in the fetcher's module docstring (BANANA -> cooking banana
  01.1.7.5.7 not fresh-fruit banana; TARO PALAGI -> Yautia 01.1.7.5.6).
  channel: wholesale because this is a farm-gate/local-market average, not a
  single-retailer price. SBS also publishes /cpi/ (index only, separate
  cpi_benchmark manifest) and Tables 1/3/4/5/6 (quantity, value, volume index,
  price index, seller counts) in the same workbook — out of scope this round.
  coicop_divisions: 01
  divisions_basis: walked_categories (all 12 items in the current Table 2)
