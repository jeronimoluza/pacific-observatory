notes: |
  Open Development Cambodia (NGO open-data portal) runs a CKAN instance
  hosting a "Retail fuel prices in Cambodia" dataset, manually transcribed
  from Ministry of Commerce price-notification PDFs. Confirmed live
  2026-09-06 via the public CKAN datastore_search API (no auth):
  https://data.opendevelopmentcambodia.net/api/3/action/datastore_search
  ?resource_id=a5bcac01-eec8-43b4-b43d-8b4f5d98c262&limit=1000 -- 187 daily
  rows, fields im_date/regu_gas/diesel_gas/moc_no/reference, prices in
  KHR/L. moc.gov.kh itself exposes a richer commodity-price + CPI GraphQL
  API (graphql.moc.gov.kh/graphql) that was under maintenance on
  2026-09-06 -- worth a fetcher of its own once it's back up.
