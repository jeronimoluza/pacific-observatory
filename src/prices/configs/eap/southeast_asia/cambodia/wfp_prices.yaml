fallback_date: 2020-01-01
notes: |
  WFP food prices for Cambodia via HDX (shared EAP fetcher
  _shared.eap.wfp_food_prices). Single country CSV of per-market monthly average
  retail and wholesale prices for staple food commodities — cereals, pulses,
  tubers, fresh/dried fish, oils, sugar — that retail catalogues do not carry.
  Per-market rows collapsed to a national monthly average per commodity/unit/
  currency/price-type; market count + USD value kept in notes; retail vs
  wholesale kept in the dedup hash. CSV URL resolved at run time from the HDX
  slug via CKAN. COICOP deferred to the classifier (item_name = WFP commodity).
