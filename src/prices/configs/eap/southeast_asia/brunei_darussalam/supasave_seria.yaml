notes: |
  Supa Save Brunei Seria branch online grocery storefront. WooCommerce Store
  API confirmed open on 2026-09-07:
  https://seria.supasave.com.bn/wp-json/wc/store/v1/products?per_page=10&page=1
  The endpoint returned BND product rows for food and pantry staples including
  flour, produce, bakery, baking needs, and promotion categories. HEAD on
  per_page=1 reported X-WP-Total: 4224 on 2026-09-07. The Scrapy downloader
  and full Chrome-style headers received a protection-layer 403 in validation,
  while a simple JSON request succeeded, so this source is integrated as a
  fetcher rather than a spider.
