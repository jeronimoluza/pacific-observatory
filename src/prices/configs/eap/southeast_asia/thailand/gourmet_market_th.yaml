spider: gourmet_market_th
language: th
archive_prefix: "gourmetmarketthailand.com/th/"
archive_path_re: '^/th/[a-z0-9_-]+_\d{10,}$'
notes: >
  Listing-card extraction (Tier 2 / Playwright). Site is a Next.js SPA; product
  cards expose `.item-card-detail` anchors with `.name` + `.price` inline.
  Product slug trailing digits are the product barcode/EAN.
channel: supermarket
