language: en
cadence: daily
fallback_date: 2026-07-31
notes: |
  KPDNHEP PriceCatcher — Malaysia's official daily price-monitoring program
  across 500+ registered premises nationwide (wet markets, supermarkets,
  minimarkets, hypermarkets), 758 SKUs. Re-verified live 2026-08-06:
  pricecatcher_2026-08.csv HTTP 200, 9.9MB, 384,270 rows so far this month
  (date,premise_code,item_code,price); lookup_item.csv HTTP 200, 758-row
  item master (item_code,item,unit,item_group,item_category);
  lookup_premise.csv HTTP 200, premise_code -> premise/address/premise_type/
  state/district. ~600 of 758 items are food/beverage (chicken, meat,
  seafood, vegetables, fruit, rice, flour, noodles, oils, eggs, dairy,
  nuts, spices, sauces, sugar, beverages); the remainder (toiletries,
  stationery, diapers) rides the same program and is excluded downstream
  by the food gate. Whole-catalog walker: one monthly bulk CSV per month
  since cutoff, no auth, no pagination. Malaysia had zero official_avg
  manifest before this. Currency MYR confirmed, matches cfg_currency.
  COICOP, added 2026-09-11: the fetcher module carries a `_COICOP_MAP` keyed on
  the raw lookup_item.csv `item` string (365 entries, covering the collected
  history, the current surveyed vocabulary, and the retired food labels).
  `coicop_classification` is deliberately LEFT as `classifier` -- see the module
  docstring; `source_curated` would remove this 2M-row file from the corpus.
  Measured on the 2026-09 pull: 96.7% of rows now carry a code.

  Also fixed 2026-09-11: rows whose item_code is absent from lookup_item.csv
  (14 of 342 codes in 2026-08) used to be emitted with the literal item_name
  "()" -- 228,496 rows, 11.4% of the source. Because item_name is part of
  `_IDENT`, every such row at the same premise on the same date hashed
  identically: those 228,496 rows carried only 38,475 distinct
  observation_hash values. They are now named by item_code, which both keeps
  them distinct and lets them be resolved when the publisher's lookup catches up.
