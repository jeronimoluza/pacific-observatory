notes: |
  Official Malaysia Ministry of Finance weekly retail prices for RON95,
  RON97, diesel, and targeted subsidy tiers via data.gov.my. The CSV is
  public and includes both level and weekly-change series; this fetcher emits
  only the level series as MYR/litre. Added to fill Malaysia's transport-fuel
  tariff gap alongside the existing PriceCatcher food/essentials source.
