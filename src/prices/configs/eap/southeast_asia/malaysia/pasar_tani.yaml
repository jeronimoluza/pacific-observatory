scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: pasar_tani
url: https://pasartani.net
archive_prefix: "pasartani.net/browse/ad/"
archive_path_re: '^/browse/ad/[^/]+/[^/]+\.html$'
language: ms
cadence: weekly
channel: fresh-market
notes: |
  Farmer-direct DJ-Classifieds marketplace; thin catalogue (~tens of ads).
  Category listing rows scraped directly (name from img alt, integer MYR
  price from span.price_val). Location-facet categories skipped. Decimal
  price precision lives only in free-text descriptions and is not extracted.
