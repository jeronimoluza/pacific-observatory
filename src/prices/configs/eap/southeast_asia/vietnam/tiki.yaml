scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: tiki
url: https://tiki.vn
language: vi
cadence: daily
channel: supermarket
archive_prefix: "tiki.vn/"
archive_path_re: "^/[^/]+-p\\d+\\.html$"
notes: |
  Vietnamese general e-commerce marketplace. Collected via Tiki's own open
  listing API, /api/personalish/v1/blocks/listings, which returns clean
  numeric VND prices plus a paging block -- no locale-string parsing and no
  HTML selectors.

  REPAIRED 2026-08-18. The spider returned ZERO rows on every run from
  2026-08-07 onward (427 rows on 2026-07-30, 0 on 08-07 and 08-13). Two
  independent causes, both confirmed live:

  1. TLS fingerprint. tiki.vn 403s impersonate=chrome124 (what the spider
     pinned) and chrome120 (the project-wide default). chrome131,
     firefox133 and safari17_0 all return 200. Now pinned to chrome131 via
     the explicit meta={"impersonate": ...} pattern with
     RandomBrowserMiddleware disabled -- setting IMPERSONATE_BROWSERS alone
     left 3 of 8 requests unimpersonated and 403ing.
  2. Dead selectors. Category pages are now a client-rendered shell with no
     product cards and no __NEXT_DATA__ blob, so both the CSS path and its
     JSON fallback matched nothing even on a 200.

  GOTCHA -- paging.total is CAPPED AT 2000 per category, so paging a root
  category silently truncates. The spider descends into child categories
  (via /v2/categories) whenever a node reports the cap.

  GOTCHA -- the previous seeded category ids were stale and mislabelled:
  c8322 was seeded as "Snacks & Candy" but is actually "Nha Sach Tiki", the
  BOOK store, so ~2000 books were being collected under a confectionery
  label. Ids re-derived 2026-08-18 from the live menu-config endpoint;
  scope is now 5 consumer-goods roots (grocery, NGON food, beauty/health,
  home care, toys & baby).

  Smoke 2026-08-18: 399 rows, 14/14 requests HTTP 200, 399 distinct product
  ids, single currency VND, price range 10,000-788,000 VND. Full scrape
  pending -- addressable universe is 7,810+ across the seeded roots.
