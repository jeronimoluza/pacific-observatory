notes: |
  EVN household retail electricity tariff — tiered 6-bậc schedule, VND/kWh.
  Source: Decision 1279/QĐ-BCT dated 2025-05-09 (Ministry of Industry and Trade).
  The EVN news article lists tariff decisions in its headline; the fetcher detects
  new decision dates and warns if _KNOWN_DECISIONS needs updating. Tariff values
  are hardcoded because the EVN PDF (QD1279-QD-BCT-20250509163514982.pdf) is
  image-only (scanned); the numbers match the publicly reported rates:
  bậc 1: 1,893; bậc 2: 1,956; bậc 3: 2,271; bậc 4: 2,860; bậc 5: 3,197;
  bậc 6: 3,587 VND/kWh.
  Only household (sinh hoạt) tiers are emitted; industrial/commercial rates
  are separate COICOP divisions not in the household PPP basket.
