scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: deferred_gemini
spider: lazada_ph_lazmart
url: https://www.lazada.com.ph
language: en
cadence: daily
channel: marketplace
notes: >
  Lazada Philippines / LazMart grocery channel - marketplace aggregator that
  resells Puregold / Mercury Drug / Rose Pharmacy / TGP alongside third-party
  sellers, hence channel=aggregator (skips tier-c COICOP-priors narrowing).
  Unlike the WAF-blocked lazada.vn, the .ph catalog AJAX endpoint answers
  unauthenticated requests: GET /catalog/?ajax=true&q=<kw>&page=<n> returns
  JSON with mods.listItems (40/page) carrying name/itemId/sku/price/seller.
  Works with plain browser headers + X-Requested-With (no scrapy-impersonate).
  Spider walks a fixed grocery/F&B keyword list, paginating each up to 20 pages
  and deduping by itemId. No category in the payload (numeric ids only) - left
  null per convention.
