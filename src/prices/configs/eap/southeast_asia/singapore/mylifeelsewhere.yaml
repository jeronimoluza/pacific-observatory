spider: mylifeelsewhere
language: en
spider_kwargs:
  country_slug: singapore
notes: >
  MyLifeElsewhere crowd-sourced cost-of-living aggregator.
  Country-only — emits one record per (country, item) pair (~34
  items / 7 categories per country, no city dimension). Both
  price (local) and price_usd are populated from source.
  Recommended cadence: weekly.
