  Core, Priority Plus, Priority Ultra, Seniors SIM Only Plan) each
  embedding a promotional AND regular monthly rate as plain "$X.XX/mth"
  text next to the plan-name heading (e.g. Enhanced Lite $24.50/$35.00;
  Seniors plan has only one price shown, no promo/regular split).

  9 rows emitted (4 plans x promo+regular, + 1 Seniors single price).
  Site's own class names are styled-components hashes that will change on
  a future deploy -- if this returns 0 rows, re-check the hash suffix
  against a fresh page fetch first.

  No archive of prior pricing -- snapshots the CURRENT catalog each run
  (period_kind: effective_from = scrape date, page carries no own
  effective-date field).

