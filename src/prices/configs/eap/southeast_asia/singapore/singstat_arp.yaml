notes: |
  SingStat Table M213761 — public TableBuilder JSON endpoint. Series list
  must be fetched from /metadata then queried one-by-one via
  ?seriesNoORrowNo=<id>; the bulk endpoint silently caps at 3 series.
  Items carry an embedded "(Per <unit>)" suffix that becomes `unit`.
  Pre- vs post-Jan-2024 prices use different CPI baskets (footnote
  noted by SingStat) — Gemini classification downstream is per-row, so
  the basket switch is harmless for COICOP tagging.
