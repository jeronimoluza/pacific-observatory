notes: |
  SingStat Table M213751 — public TableBuilder JSON. Singapore's CPI
  grouping is 11 divisions, NOT COICOP-2018 13. Translation map lives
  in the fetcher's _DIVISION_MAP. COICOP 02 (alcohol & tobacco) is
  folded into SingStat's Misc bucket and is NOT separately reported —
  intentionally uncovered. All-Items index (coicop_code=null) is also
  emitted for headline-inflation use; downstream consumers filter on
  presence of coicop_code.
