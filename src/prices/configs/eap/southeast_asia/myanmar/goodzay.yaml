scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: goodzay
url: https://goodzay.com
language: my
cadence: daily
channel: marketplace
archive_prefix: "goodzay.com/products/"
archive_path_re: '^/products/[^/?]+'
notes: |
  Shopify multi-vendor marketplace (many independent sellers under one
  storefront). Products expose a `vendor` field per seller; catalogue
  spans groceries, pharmacy, bakery, beverages, snacks, and beauty.
  Full catalogue via /products.json (root, paginated 250/page).
