scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: choppies_ebasket_bw
url: https://chptst205.echoppies.com/popular.php
language: en
cadence: weekly
channel: supermarket
notes: |
  Probed 2026-09-11 (SSA anglophone-Africa food gap-fill pass). Choppies
  is a major regional (Botswana-headquartered) supermarket chain; this is
  its online "eBasket" storefront. Hostname looks like a staging alias
  (chptst205.echoppies.com) but serves a real, live, publicly-reachable
  catalogue with a Botswana Pula currency icon (botswana-currency.png) and
  genuine food SKUs (TOMATO PP, CARROTS 1 KG PP, WHITE BREAD, CHICKEN TWIN
  PACK, CHOPPIES 2L FRESH MILK) -- treated as live on that evidence.

  Custom/legacy PHP platform (jQuery 1.7/1.8, Rackspace CDN assets), NOT a
  known framework. No WAF: plain non-impersonating requests get HTTP 200.

  Categories (from popular.php nav): b_cfc, m_beverages, "m_edible
  groceries", "m_ethnic products", m_fresh, "m_general merchandise",
  "m_house hold", m_perishable, "m_personal care", m_pets -- food-dominant
  taxonomy with a few non-food categories mixed in (left in scope, the
  classifier routes those SKUs by product name).

  Listing: index.php?cat=<slug>&page=N, 20 products/page in div.itemBox
  blocks (product id, name, price, PDP url all present in the listing
  card -- no PDP fetch needed). Price already in whole Pula units (e.g.
  "25.95"), no minor-unit division.

  Enumerability: CONFIRMED live -- cat="m_edible groceries" pages 1-7 each
  returned a genuinely distinct 20-id set (verified pairwise, zero repeats
  across 7 pages sampled). No published total/"N of M" text in the HTML;
  spider walks until a page adds zero new product ids (see per-category id
  tracking in the spider -- some categories, e.g. m_pets, loop back and
  re-serve an already-seen tail page forever instead of ever returning an
  empty page, MEASURED 2026-09-11) or MAX_PAGES=150 safety cap is hit (not
  hit by any category in the 2026-09-11 full run; largest was m_edible
  groceries at page 51).

  Currency: BWP confirmed from the site's own Pula currency icon and plain
  decimal price display; matches countries.yaml default.

  coicop_codes left unset -- catalogue spans multiple COICOP-01 classes
  (fresh produce, dairy, bakery, groceries) plus some non-food categories,
  wide by the narrowness rule.

  Root cause of the original 0-row failure: the category-listing markup
  breaks '<a title=' across a newline, unlike the popular.php landing page
  sampled during scaffolding, so the original regex (no \s+ between the
  <a> tag and its attributes) never matched -- fixed 2026-09-11.

  A second, previously-masked cap was found once that fix was in place:
  MAX_PAGES was 30 (600 SKUs/category), and two categories
  (m_edible groceries, m_ethnic products) were MEASURED still returning a
  full, all-new 20-id page at page 30 with zero duplicates -- i.e. the
  safety cap was truncating real catalogue, not guarding a loop. Separately,
  m_pets was MEASURED to loop back and re-serve the same ~10-item tail page
  forever once its real ~30-item catalogue was exhausted, which the old
  "stop on empty page" condition never caught (only MAX_PAGES eventually
  killed it). Fixed by (a) raising MAX_PAGES to 150 and (b) tracking
  product ids seen per category so the spider stops on the first page that
  adds zero *new* ids, not just a literally empty one.

  MEASURED full run 2026-09-11 (no --max-items, post both fixes):
  `prices collect --source choppies_ebasket_bw` -> 3,153 rows, 3,153
  distinct urls, 3,153 distinct product ids (zero duplicates -- the
  spider's own per-category id-tracking now prevents them upstream of the
  shared DuplicationPipeline), ZERO zero-priced rows, currency BWP
  throughout. No category hit the new MAX_PAGES=150 cap (largest was
  m_edible groceries at page 51 of 150). Per-category counts: Edible
  Groceries 995, Ethnic Products 655, Personal Care 363, Fresh 327,
  House Hold 309, Perishable 198, Beverages 192, General Merchandise 72,
  Pets 30, Cfc 12. Sample: CFC 2PIECE AND CHIPS BWP 39.95, E/T 1KG RED
  KIDNEY BEANS BWP 32.95.
