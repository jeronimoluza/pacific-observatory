scaffolding: fetcher
extraction_pattern: rest_api
analytical_role: official_avg
coicop_classification: source_curated
channel: null
source_key: fews_zwe
module: _shared.ssa.fews_net
function: fetch_fews_zwe
url: https://fdw.fews.net/api/marketpricefacts/?country_code=ZW
language: en
cadence: monthly
fallback_date: 2023-01-01
notes: |
  New source (round 3 resume, 2026-08-07): USAID FEWS NET market price facts
  REST API (fdw.fews.net/api/marketpricefacts/), shared SSA fetcher
  _shared.ssa.fews_net. Zimbabwe's only prior manifest was wfp_prices
  (official_avg via HDX) — this is a second, independent official_avg feed
  (different upstream agency: FEWS NET/USAID vs WFP), not a duplicate.
  Verified live: 142193 total facts for country_code=ZW (by far the largest
  panel in this batch — many markets/commodities), currency **USD**, not
  ZWL/ZWG — Zimbabwe's market is de facto dollarized and FEWS NET reports in
  USD; countries.yaml lists ZWL/ZWG as the official currency, this is a
  legitimate divergence, not a bug. Max period_date 2026-07-31. Sample at
  max date: Beef (Fresh bovine meat), kg, USD, Retail. fallback_date set to
  2023-01-01 (later than the 2020-01-01 convention used elsewhere in this
  batch) specifically because of this country's much larger per-month row
  volume — bounds first-run pagination to a manageable page count while
  still covering 3+ years. Server-side start_date filter confirmed
  narrowing. Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = FEWS NET product label).
  coicop_divisions: 01
  divisions_basis: walked_categories (whole-catalog API walk, no commodity
  filter applied; food staples only per FEWS NET's own product scope)
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  FEWS NET publishes a small, stable English product vocabulary, so the
  shared fetcher now stamps a division-01/02 leaf per row from _COICOP_MAP
  in src/prices/fetchers/_shared/ssa/fews_net.py (66 product labels covering
  94.2% of the 7,709 rows collected across the 16 panels). A product the map
  does not cover -- Diesel, Gasoline, LPG, the two wage series, Soap, bulk
  potable water, and two genuinely ambiguous food labels -- is DROPPED with
  a logged warning, never emitted with a null coicop_code. coicop_codes is
  deliberately unset: measured across the collected panels these rows span
  39 leaves in 8 different 3-digit classes, so the source is wide.
