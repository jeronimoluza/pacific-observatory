scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: bite_liqour_ls
url: https://store.localbites.co.ls/stores/biteliqour
language: en
cadence: weekly
channel: specialty-food
notes: |
  Wave 8. BiteLiqour -- a single, named, first-party bottle/liquor store in
  Maseru, hosted on the LocalBites food-delivery platform
  (store.localbites.co.ls/stores/biteliqour) rather than its own domain.
  Same "merchant on an aggregator" pattern already accepted for
  chawshin_lezzoo_iq / bakhtiyari_lezzoo_iq / *_wolt_* sources: channel
  describes THIS merchant, not the platform. This spider walks only this
  one store's catalog -- the platform's other 13 merchants (restaurants/
  QSR, not groceries) are the separate localbites_ls source, channel=
  marketplace, which deliberately excludes this store to avoid double-
  collecting it (verified disjoint: 0 product_id/url overlap between the
  two sources' collected rows).

  Currency/peg: prices are quoted in "M" (Maloti) or occasionally "R" on
  Lesotho sites; LSL is pegged 1:1 to ZAR and the rand circulates as legal
  tender, so an "R"-prefixed amount is not a currency mismatch. This site's
  own API returns currency_code LSL directly (no ambiguity here).

  Discovered from the "LocalBites Lesotho" workbook candidate
  (store.localbites.co.ls). BiteLiqour is the only one of LocalBites' 14
  named merchants (api.localbites.co.ls/api/stores, open JSON, no auth)
  that is a genuine retail beverage/liquor store rather than a restaurant --
  confirmed by its product list: "Jameson Irish Whiskey 750ml" M528,
  "Johnnie Walker Black Label 12yo 750ml" M574, "Castle Milk Stout 500ml
  6-pack" M123, "Schweppes Tonic Water 1L" M28 -- retail bottle-store SKUs
  and pack sizes, not restaurant menu items.

  REAL PAGINATED JSON API (fixed 2026-09-01, orchestrator flagged the first
  cut's page-1 cap as a failure signature -- 24 of 66 rows, correctly
  called out per the shared brief's "flat capped count" rule): the store
  page's server-rendered __NEXT_DATA__ blob (the spider's original
  approach) is capped at page 1 no matter what page/offset query param is
  passed on the SSR route. The frontend JS bundle
  (`/_next/static/chunks/*.js`) reveals the actual client-side pagination
  call: `GET https://api.localbites.co.ls/api/delivery-zone/products` with
  query params `store=biteliqour`, `page`, `per_page` (max 100 -- 200
  returns 422 "must not be greater than 100"), `latitude`, `longitude`
  (lat/long are REQUIRED, a fixed Maseru coordinate is used as a constant;
  omitting them returns 422 "The latitude field is required"). The
  endpoint ALSO requires header `Accept: application/json` -- without it,
  the host silently serves the SPA's HTML shell (200, no JSON, no error)
  instead of the API response, which is why it was missed on the first
  pass. Verified true pagination by walking page=1..5 at per_page=15: 66
  distinct product ids total, last_page accurate, zero overlap between
  pages. With per_page=100 the whole 66-item catalog now comes back as a
  single page. Spider still follows the response's own `last_page` field
  rather than hardcoding per_page=100, so it keeps working if the catalog
  grows past 100 items. Row url is the platform's PDP route
  /products/<slug> (confirmed live, 200).

  Verified live 2026-09-01 (--max-items 200, fixed spider, single run):
  62 rows, 62 distinct product_id, 62 distinct url, 0 blank names, 0 zero/
  negative prices, currency LSL throughout (median M155, min M17, max
  M747). The API's own catalog totals 66 -- 4 rows (Drostdy Hof Adelpracht
  Late Harvest, Raindance Natural Sweet Red, Drostdy Hof Claret, Raindance
  Dry Red Wine) are genuinely unpriced on the retailer's own site (both
  `price` and `special_price` are null in the API response, not a parsing
  bug) and are correctly dropped rather than shipped as fake M0 rows.
  Category composition: Beer 16, Cider 11, Drink & Juice 11, Vodkaa 6,
  Whiskey 5, Ginn 5, Wines 3, Tequilaa 2, Cocktail Kits 1, Liqueur 1,
  Rumm 1 -- 100% beverage/liquor retail, no restaurant items. Cold
  re-fetch of 3 emitted product URLs (johnnie-walker-black-label-12yo-
  whisky-750ml, castle-milk-stout-500-ml-6-pack, russian-bear-750-ml) all
  returned 200 with the scraped name and price string present verbatim.
