scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: waltons_na
url: https://www.waltons.com.na/
language: en
cadence: weekly
channel: other
archive_prefix: "waltons.com.na/product/"
archive_path_re: '^/product/[^/?]+/?$'
notes: |
  Waltons -- Namibian storefront of the South African office/stationery
  and electronics chain. Probed live 2026-09-11. WordPress/WooCommerce
  storefront, standard public Store API at /wp-json/wc/store/v1/products
  (bare host, no www, resolves fine), no auth needed.
  Enumerability: per_page=1 page=1 -> id 19660, page=2 -> id 19658
  (distinct), X-WP-Total header = 967 products / 967 pages at per_page=1.
  Currency confirmed via API's own currency_code=NAD, currency_minor_unit=2
  -- not ZAR. Categories sampled: Electronics, Stationery -- narrow
  catalog by division but genuinely large (967 SKUs); channel: other
  since neither "electronics" nor a stationery-specific enum value alone
  covers the mixed catalog.
  Permalinks resolve to www.waltons.com.na even though the API itself is
  reachable on the bare host -- allowed_domains includes both.
  Page family: API (spider reads the JSON Store API directly; permalinks
  under /product/<slug>/ are real PDPs but the spider never fetches them).
  Handled by the shared _woo_base pagination/scaling logic.
  Test run 2026-09-11: prices collect --source waltons_na --max-items 20 ->
  20 rows, all priced, all NAD.
