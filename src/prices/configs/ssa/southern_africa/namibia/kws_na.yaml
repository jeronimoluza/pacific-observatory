scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: kws_na
url: https://kwsnamibia.shop/
language: en
cadence: weekly
channel: fresh-market
archive_prefix: "kwsnamibia.shop/shop/"
archive_path_re: '^/shop/[^/?]+/?$'
notes: |
  Klein Windhoek Schlachterei -- Namibian butcher/fresh-meat retailer.
  Probed live 2026-09-11. WordPress/WooCommerce storefront, standard
  public Store API at /wp-json/wc/store/v1/products, no auth needed.
  Enumerability: per_page=1 page=1 -> id 10243, page=2 -> id 9864
  (distinct), X-WP-Total header = 144 products / 144 pages at per_page=1.
  Currency confirmed via API's own currency_code=NAD, currency_minor_unit=2
  (e.g. raw "19995" -> N$199.95) -- matches the site's price_html, not ZAR.
  Page family: API (spider reads the JSON Store API directly; permalinks
  under /shop/<slug>/ are real PDPs but the spider never fetches them).
  High priority per the campaign brief -- one of two Namibia sources that
  reaches food leaves (fresh/processed meat), alongside doorstep_na.
  Handled by the shared _woo_base pagination/scaling logic.
  Test run 2026-09-11: prices collect --source kws_na --max-items 20 ->
  20 rows, all priced, all NAD.
