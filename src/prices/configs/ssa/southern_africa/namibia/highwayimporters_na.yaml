scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: highwayimporters_na
url: https://highwayimporters.com.na/
language: en
cadence: weekly
channel: dept-store
archive_prefix: "highwayimporters.com.na/product/"
archive_path_re: '^/product/[^/?]+/?$'
notes: |
  Highway Importers -- general-merchandise importer/dropshipper, Namibia.
  Probed live 2026-09-11. WordPress/WooCommerce storefront, standard
  public Store API at /wp-json/wc/store/v1/products, no auth needed.
  Enumerability: per_page=1 page=1 -> id 12052, page=2 -> id 12051
  (distinct), X-WP-Total header = 596 products / 596 pages at per_page=1.
  Currency confirmed via API's own currency_code=NAD, currency_minor_unit=2
  -- not ZAR. Categories sampled span Beauty & Health, Car & Bike
  Accessories, Clothing & Accessories, Drinkware, Gadgets & Electronics,
  Hair Products, Home & Garden, Home Cleaning, Kids Toys, Kitchen
  Gadgets, Office & Stationery, Outdoor Gadgets, Party Games -- a genuine
  wide-catalog general store, channel: dept-store (no single vertical
  enum value fits).
  Page family: API (spider reads the JSON Store API directly; permalinks
  under /product/<slug>/ are real PDPs but the spider never fetches them).
  Handled by the shared _woo_base pagination/scaling logic.
  Test run 2026-09-11: prices collect --source highwayimporters_na
  --max-items 20 -> 20 rows, all priced, all NAD.
