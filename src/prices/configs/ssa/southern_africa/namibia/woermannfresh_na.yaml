scaffolding: spider
extraction_pattern: scrapy_html
analytical_role: retailer_sku
coicop_classification: classifier
spider: woermannfresh_na
url: https://shop.woermannfresh.com/
language: en
cadence: weekly
channel: supermarket
coicop_codes: null
notes: |
  Probed 2026-09-11. Discovered via OpenStreetMap shop=supermarket nodes
  with a `website` tag (Windhoek bbox) after the session's WebSearch
  budget was exhausted -- the brochure-only corporate site
  `woermann.com.na`/`woermannfresh.com` (Squarespace marketing page) links
  out to a separate, genuinely transactional storefront at
  shop.woermannfresh.com (Woermann & Brock's "wbsupers" chain). No TLS
  impersonation needed -- plain `requests` default UA clears it (200,
  identical byte length to curl_cffi chrome124).

  Bespoke Vue/Laravel storefront (not Woo/Shopify/Magento) backed by
  Elasticsearch. No API call needed for scraping: each
  `/category/<slug>?page=N` page embeds the full Elasticsearch response
  as an HTML-entity-encoded JSON string inside the
  `<elasticsearch-listing :default-search-result='...'>` custom-element
  attribute. `results[i].result` carries title/slug/code (barcode) plus
  `price`/`was_price` (VAT-inclusive).

  Enumerability gate: verified on the `deodorant` leaf category (163
  items, page size 100, 2 pages) -- page 1 returned 100 product ids, page
  2 returned 63 DIFFERENT ids, zero overlap. Paginates for real.

  Catalog size: walked all 70 leaf categories (from the site's own
  category tree, embedded on the homepage as `:parent-categories`) at
  page 1 and summed `pagination.total_hits.value` -> ~2,604 products
  (some may sit in >1 leaf category, so this slightly over-counts, but
  confirms order-of-magnitude -- not a flat/broken-spider count). Leaves
  span 10 top-level groups: baby-care, bakery, butchery, drinks,
  food-cupboard, fresh-food, frozen-foods, household, outdoor,
  toiletries -- food/drink groups are the large majority by leaf count
  and item count, household/outdoor/toiletries are left in as a wide
  supermarket source (coicop_codes unset for the classifier).

  Currency: no currency field in the API payload. Set NAD at the class
  level (not derived from a displayed symbol) -- unambiguously Namibian
  (site chrome: "My Store: Windhoek"; parent brand Woermann & Brock;
  sampled rows' VAT arithmetic is exactly 15%, Namibia's VAT rate, e.g.
  price_excluding_vat 29.56 * 0.15 = 4.434 ~= vat_amount 4.43).

  Page family: listing only (category pages carry product data inline;
  PDP pages at /product/<slug> exist but are never fetched by this
  spider).

  Namibia had only 18 distinct product names in the 43M-row corpus before
  this source; this alone adds ~2,600 SKUs across a real 10-category food
  supermarket tree.

  Test: prices collect --source woermannfresh_na --max-items 100 -> 182
  rows (max-items fence overshoots per-batch, as expected), 182 distinct
  urls, 182 distinct product_ids (no DuplicationPipeline collapse).
  Sample: NAD 39.99 "Dove 150ml M Aero Cool Fresh" (Toiletries >
  Deodorant), NAD 33.99 "Mello Roti's 90g Baked" (Bakery).
