scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: langerhans_na
url: https://langerhanspharmacy.com/
language: en
cadence: weekly
channel: pharmacy
archive_prefix: "langerhanspharmacy.com/products/"
archive_path_re: '^/products/[^/?]+/?$'
notes: |
  Langerhans Pharmacy -- Namibia. Probed live 2026-09-11. Shopify
  storefront, open unauthenticated catalog at /products.json?limit=250&
  page=N, no auth needed.
  Enumerability: page=1 vs page=2 (limit=5) returned fully disjoint id
  sets. Walked to exhaustion: page1=250, page2=250, page3=120, page4=0 ->
  ~620 products total.
  Currency confirmed NAD (not ZAR) via the storefront's own
  Shopify.currency.active="NAD" and /cart.json currency="NAD".
  Page family: API (spider reads the /products.json catalog endpoint
  directly; permalinks under /products/<handle> are real PDPs but the
  spider never fetches them).
  Handled by the shared _shopify_base pagination logic (one row per
  variant; price is decimal, no minor-unit scaling for Shopify's own
  /products.json unlike the archived-HTML cents tiers).
  Test run 2026-09-11: prices collect --source langerhans_na --max-items
  20 -> 20 rows, all priced, all NAD.
