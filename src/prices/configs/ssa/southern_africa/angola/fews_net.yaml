notes: |
  New source (round 3 resume, 2026-08-07): USAID FEWS NET market price facts
  REST API (fdw.fews.net/api/marketpricefacts/), shared SSA fetcher
  _shared.ssa.fews_net. Angola's only prior manifest was a retailer_sku
  spider (kiwaba_ao) — this is the country's first official_avg source.
  Verified live: 6857 total facts for country_code=AO, currency AOA (matches
  countries.yaml), max period_date 2026-05-31. Sample at max date: Refined
  sugar, kg, AOA, Retail. Server-side start_date filter confirmed narrowing.
  Per-market rows collapsed to a national monthly average per commodity/
  unit/currency/price-type; market count + USD value kept in notes; retail
  vs wholesale kept in the dedup hash. COICOP deferred to the classifier
  (item_name = FEWS NET product label, in English even though the
  site/market is Portuguese-speaking).
  coicop_divisions: 01
  divisions_basis: walked_categories (whole-catalog API walk, no commodity
  filter applied; food staples only per FEWS NET's own product scope)
