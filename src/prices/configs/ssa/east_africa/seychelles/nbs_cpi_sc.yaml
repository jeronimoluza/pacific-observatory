notes: |
  National Bureau of Statistics (Seychelles), "Consumer Price Index Time
  Series" XLSX, relinked monthly under a new numeric node-id
  (/downloads/<id>-consumer-price-index-time-series.../download) and
  linked from the site homepage (NOT /statistics/consumer-price-indices,
  which only links the monthly PDF press releases); fetcher takes the
  highest node-id among homepage download links. Verified live
  2026-09-28: curl_cffi needs impersonate=safari17_0 (chrome124/chrome120
  403). Sheet "CPI_Series", monthly index values from Jan 2007 (column D)
  through the latest release (Aug 2026 at time of onboarding). NBS
  publishes the legacy COICOP-1999 12-group breakdown, mapped 1:1 to
  codes 01-12 (no separate division 13). "ALL ITEMS" headline and
  "NON-FOOD ITEMS" aggregate rows dropped -- no sanctioned all-items
  sentinel. fallback_date set to the series start so run 1 backfills the
  full 2007-present history in one pass.
