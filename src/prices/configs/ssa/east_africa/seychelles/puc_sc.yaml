notes: |
  Public Utilities Corporation (Seychelles). Tariff tables load via a
  WordPress "xyz-snippet" AJAX widget (POST admin-ajax.php,
  action=run_xyz_shortcode, snippet=<name>, nonce read fresh from the
  parent page each run) -- not present in the static page HTML.
  Electricity: 3 residential bands (Domestic-110/120/130), commercial/
  government/bulk out of scope. Water: single Water-Domestic-Sector
  table with separate WATER CHARGES and SEWERAGE CHARGES columns per
  consumption band. Neither page states an effective/revision date, so
  rows are snapshotted with period_kind=effective_from dated by the
  scrape run. Verified live 2026-09-28.
