notes: |
  EriTel is Eritrea's sole state-owned telecom operator. Plain
  server-rendered HTML tariff tables across three service pages (Mobile
  GSM id=1017, Fixed Telephony id=1018, Internet Services id=1020) -- no
  JS, no WAF (plain `requests` clears it). Verified live 2026-09-28: 189
  rows parsed from tables whose heading contains "Schedule of Charges"
  (Mobile GSM voice/SMS/SIM-card charges, PSTN connection + voice-calling
  charges, International Call Tariffs, VDSL/ADSL Platinum and Wifi
  Platinum bandwidth-tier monthly fees, VSAT service-class monthly fees).
  Currency is Nakfa (NKF on-page, ISO ERN) for all tables except VSAT,
  whose own column header says "Monthly Fee*in USD" -- emitted as USD per
  that table's own labelling, not converted.
  Deliberately NOT parsed: "Eritel Service Areas" (a location list, not
  pricing), the inter-service-area tariff-category matrix table, one-time
  "Deployment Charges" tables, and the vertical package spec sheets (e.g.
  "ADSL Silver 1GB Package") that list Bandwidth/Volume/Price as rows
  describing one plan rather than one row per priced item -- left for a
  follow-up pass if this source needs deeper coverage later.
  No revision/effective date is published on the page, so rows are
  emitted as period_kind=snapshot (observation_date = scrape date) rather
  than effective_from.
  Onboarded per the w40 brief: Eritrea had 0 manifests of any kind before
  this pass (0 COICOP divisions, 0 sources, 0 rows). This is the
  country's first verified source and its only institutional/tariff one.
