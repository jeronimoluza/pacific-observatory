scaffolding: fetcher
extraction_pattern: rest_api
analytical_role: official_avg
coicop_classification: source_curated
channel: null
source_key: fews_bdi
module: _shared.ssa.fews_net
function: fetch_fews_bdi
url: https://fdw.fews.net/api/marketpricefacts/?country_code=BI
language: fr
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (2026-09-11): USAID FEWS NET market price facts REST API
  (fdw.fews.net/api/marketpricefacts/), shared SSA fetcher _shared.ssa.fews_net,
  same pattern as fews_caf. Burundi's only prior food-eligible source was
  kilakitu_bi (marketplace, retailer_sku, 284 rows) plus wfp_prices
  (official_avg) -- this is a second, independent official_avg feed (FEWS
  NET/USAID, distinct upstream from WFP), not a duplicate. Verified live
  2026-09-11: 190,136 total facts for country_code=BI via get_session()'s
  browser-realistic User-Agent (a bare requests.get with no UA returns a
  non-JSON body). API hard-caps pagination at offset=1000, so the first-run
  backfill is bounded to roughly the newest ~1000 raw facts; every later
  run's delta is bounded by monthly cadence. Per-market rows collapsed to a
  national monthly average per commodity/unit/currency/price-type; market
  count + USD value kept in notes; retail vs wholesale kept in the dedup
  hash. COICOP deferred to the classifier (item_name = FEWS NET product
  label, English).
  coicop_divisions: 01
  divisions_basis: walked_categories (whole-catalog API walk, no commodity
  filter applied; food staples only per FEWS NET's own product scope)
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  FEWS NET publishes a small, stable English product vocabulary, so the
  shared fetcher now stamps a division-01/02 leaf per row from _COICOP_MAP
  in src/prices/fetchers/_shared/ssa/fews_net.py (66 product labels covering
  94.2% of the 7,709 rows collected across the 16 panels). A product the map
  does not cover -- Diesel, Gasoline, LPG, the two wage series, Soap, bulk
  potable water, and two genuinely ambiguous food labels -- is DROPPED with
  a logged warning, never emitted with a null coicop_code. coicop_codes is
  deliberately unset: measured across the collected panels these rows span
  39 leaves in 8 different 3-digit classes, so the source is wide.
