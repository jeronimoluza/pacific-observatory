scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: eastmatt_ke
url: https://www.eastmatt.com/
language: en
currency: KES
cadence: weekly
channel: supermarket
notes: |
  Page family: API. The shard's seed domain eastmatt.co.ke does not
  resolve at all (curl: could not resolve host); WebSearch found the real
  online-ordering domain is eastmatt.com (eastmatt.co.ke is only used as
  an email domain per the company's own contact listings). Domain-recovery
  case, same pattern as chalkiadakis.gr -> xalkiadakis.gr.

  Server-rendered PHP catalogue whose "load more" button calls a fully
  open JSON API with no auth:
    GET /ios1/itemdepartment2.php?DepartmentID=<id>&branch=KITENGELA
        &CategoryID=&Type=Department&limit=48&page=N

  Verified live 2026-09-06: DepartmentID=2 alone returns
  {"total_items": 1677, "total_pages": 35}; page 1 vs page 2 of a
  category-scoped call (CategoryID=101) returned zero id overlap across 48
  items each -- genuine pagination, not a fixed page. Sampled price:
  "SAFISHA BLEACH REGULAR 750ML" KES 205.00.

  branches.php only exposes branch=KITENGELA for the online-ordering flow
  (Eastmatt's 10 other physical branches have no online catalogue) -- the
  spider is single-branch by design, walking the 8 top-level DepartmentIDs
  (2-9) from the homepage nav rather than enumerating every CategoryID.

  Test run 2026-09-06 (--max-items 15): 106 rows written, real Kenyan SKUs
  (cleaning products, foods) with non-zero KES prices.
