scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: source_curated
channel: null
source_key: wfp_ssd
module: _shared.ssa.wfp_food_prices
function: fetch_wfp_ssd
url: https://data.humdata.org/dataset/wfp-food-prices-for-south-sudan
language: en
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (round 3, 2026-08-07): WFP food prices for South Sudan via
  HDX (shared SSA fetcher _shared.ssa.wfp_food_prices). South Sudan had
  zero manifests before this. Verified live: CKAN package_show resolves
  wfp_food_prices_ssd.csv, currency SSP throughout (matches
  countries.yaml). Max observation date is 2026-07-15 — current. 54
  commodities, richest panel in this batch: cereals (maize x3, sorghum
  x6 variants, rice, millet, wheat flour), pulses (beans x2, cowpeas,
  groundnuts x2), tubers/veg (cassava x3, potatoes, cabbage, onions,
  tomatoes, pumpkin/cassava leaves, sukuma wiki), livestock (cattle, goat,
  sheep) and meat (beef, goat, chicken), milk, dried/fresh fish, sugar,
  salt, oil, charcoal, plus Fuel (diesel/petrol, incl. separate parallel-
  market series) and non-COICOP wage/milling-cost series (excluded from
  the division tag below). Sample at max date: 'Maize (white)'.
  Per-market rows collapsed to a national monthly average per commodity/
  unit/currency/price-type; market count + USD value kept in notes;
  retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
  coicop_divisions: 01, 04, 07
  divisions_basis: walked_categories (full 54-commodity list enumerated
  from the CSV; food items -> 01, Charcoal -> 04 (other fuels), Fuel
  (diesel/petrol, incl. parallel-market variants) -> 07; Wage and Milling
  cost series are not COICOP consumption items and are excluded from the
  tag)
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  WFP publishes clean, stable English commodity labels ("Millet", "Rice
  (imported)"), not retail SKU strings, so the shared fetcher now stamps a
  division-01/02 leaf per row from the hand-written map in
  src/prices/fetchers/_shared/wfp_coicop.py (603 commodity labels covering
  89.6% of the 116,815 rows collected across the 68 panels). A commodity the
  map does not cover -- the panels' fuel, wage, exchange-rate, transport and
  household-goods block, plus a short list of genuinely ambiguous food
  labels -- is DROPPED with a logged warning, never emitted with a null
  coicop_code. coicop_codes is deliberately unset: measured across the
  collected panels these rows span 132 leaves in 12 different 3-digit
  classes, so the source is wide, not narrow.
