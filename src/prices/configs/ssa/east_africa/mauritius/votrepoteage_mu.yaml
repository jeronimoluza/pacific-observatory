scaffolding: spider
extraction_pattern: scrapy_api
analytical_role: retailer_sku
coicop_classification: classifier
spider: votrepoteage_mu
url: https://votrepoteage.mu/
language: fr
cadence: weekly
channel: fresh-market
archive_prefix: "votrepoteage.mu/shop/"
