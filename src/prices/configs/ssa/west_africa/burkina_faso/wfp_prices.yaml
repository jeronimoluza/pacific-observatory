notes: |
  WFP food prices for Burkina Faso via HDX (shared SSA fetcher
  _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_bfa.csv (200, 58,154 rows),
  currency XOF throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. 12 commodities incl. millet, sorghum, maize, rice
  (imported/local), cowpeas, groundnuts. Sample: 'Millet', KG, XOF 82
  (series starts 1992). Per-market rows collapsed to a national monthly
  average per commodity/unit/currency/price-type; market count + USD value
  kept in notes; retail vs wholesale kept in the dedup hash. COICOP
  deferred to the classifier (item_name = WFP commodity).
