  storefront by other signals (local phone, "same day delivery"
  language), just an EUR-denominated domestic shop. Currency set to
  EUR here per the "declared wins" rule; flagged for the team to
  decide whether EUR-priced Gambia rows are acceptable input to the
  GMD price-level basket. Channel changed supermarket -> pet (pet
  supplies retailer, not a supermarket). Original child-task notes
