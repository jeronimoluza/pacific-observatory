notes: |
  WFP food prices for the Gambia via HDX (shared SSA fetcher
  _shared.ssa.wfp_food_prices; HDX dataset slug is "wfp-food-prices-for-
  gambia", not "-for-the-gambia" which 404s). Re-verified live 2026-08-06:
  CKAN package_show resolves wfp_food_prices_gmb.csv (200, 157,228 rows),
  currency GMD throughout (matches countries.yaml). Max observation date is
  2026-04-15 — current. 77 commodities, the widest panel of any SSA country
  seen this round, incl. millet, rice (several grades), groundnuts,
  cassava, fish, livestock. Sample: 'Millet', KG, GMD 10.53. Per-market
  rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
