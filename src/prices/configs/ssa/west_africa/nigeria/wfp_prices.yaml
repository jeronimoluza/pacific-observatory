notes: |
  WFP food prices for Nigeria via HDX (shared SSA fetcher
  _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_nga.csv (200, 87,729 rows),
  currency NGN throughout (matches countries.yaml). Max observation date is
  2026-07-15 — current. 43 commodities incl. millet, sorghum, maize,
  rice (several grades), beans, garri, yam, cassava, groundnuts, palm oil,
  bread, gasoline/diesel/kerosene retail prices. Sample: 'Millet', KG,
  NGN 150.18 (2002 series start; current rows run through mid-2026).
  Per-market rows collapsed to a national monthly average per
  commodity/unit/currency/price-type; market count + USD value kept in
  notes; retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity). South Africa and Nigeria were the
  two biggest zero-coverage gaps in the repo; this closes Nigeria's.
