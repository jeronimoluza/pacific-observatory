scaffolding: spider
extraction_pattern: scrapy_paginated_json_api
analytical_role: marketplace_offer
spider: saloneemarket
url: https://saloneemarket.com/products
language: en
currency: SLE
cadence: daily
channel: marketplace
archive_prefix: saloneemarket.com/products/
archive_path_re: '^/products/'
notes: |
  Salone E Market is a Freetown consumer marketplace with a public first-party
  product API. The verified API reports 271 products with stable IDs, category,
  stock, availability, and Le prices mapped to SLE. The collector paginates the
  server total with a 10,000-product safety ceiling and excludes crossed prices.
