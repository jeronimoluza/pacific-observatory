notes: >
  Sierra Leone multi-vertical marketplace (food, beauty, electronics,
  clothing, furniture). Same hcdn JS interstitial as leskanso_gn -- see
  ~/gapwork/known_blockers_repair_2.md. MEASURED 2026-09-11 via
  generic_woo_playwright: X-WP-Total=10, single page (no page 2 -- catalog
  genuinely fits on one page), 100% non-zero prices. Currency is SLL
  (old-leone ISO code), NOT the country default SLE -- this tenant's
  WooCommerce currency setting still uses the pre-2022 code; e.g. id=4367
  "Fresh Hass Avocado" price=45,000 SLL. currency: SLL is set explicitly
  here (countries.yaml default for Sierra Leone is SLE) per the repo's own
  rule that a site's own currency_code is authoritative over the country
  default. End-to-end tested via
  `prices collect --source gotrustmesl --max-items 20`.
