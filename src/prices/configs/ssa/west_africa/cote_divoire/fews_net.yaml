notes: |
  New source (round 3 resume, 2026-08-07): USAID FEWS NET market price facts
  REST API (fdw.fews.net/api/marketpricefacts/), shared SSA fetcher
  _shared.ssa.fews_net. Cote d'Ivoire's only prior manifest was wfp_prices
  (official_avg via HDX) — this is a second, independent official_avg feed
  (different upstream agency: FEWS NET/USAID vs WFP), not a duplicate.
  Verified live: 4929 total facts for country_code=CI, currency XOF (matches
  countries.yaml), max period_date 2026-05-31. Note the single newest row
  sampled during verification carried collection_status "Not Collected"
  (FEWS NET's own per-row publication-workflow field) rather than
  "Published"/"Collected" — this affects at most the very latest row for
  this country and the aggregation only counts rows with a numeric value >0,
  so it does not silently admit an empty/placeholder observation. Sample at
  max date: Rice (100% Broken), kg, XOF, Retail. Server-side start_date
  filter confirmed narrowing. Per-market rows collapsed to a national
  monthly average per commodity/unit/currency/price-type; market count +
  USD value kept in notes; retail vs wholesale kept in the dedup hash.
  COICOP deferred to the classifier (item_name = FEWS NET product label, in
  English even though the site/market is French-speaking).
  coicop_divisions: 01
  divisions_basis: walked_categories (whole-catalog API walk, no commodity
  filter applied; food staples only per FEWS NET's own product scope)
