scaffolding: fetcher
extraction_pattern: rest_api
analytical_role: cpi_benchmark
coicop_classification: publisher_labeled
coicop_codes: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]
channel: null
source_key: lr_lisgis_cpi
module: ssa.west_africa.liberia.lisgis_cpi
function: fetch_lr_lisgis_cpi
url: https://liberia.opendataforafrica.org/wmstzic/consumer-price-index-cpi-2019-2026
language: en
cadence: monthly
fallback_date: 2019-01-01
notes: |
  LISGIS (Liberia Institute of Statistics and Geo-Information Services)
  Consumer Price Index, published via a Knoema-hosted "Liberia Data
  Portal" (liberia.opendataforafrica.org), dataset "wmstzic" -
  "Consumer Price Index (CPI) - 2019-2026" (COICOP, Chained Index, Jan
  2019-Present; Base: Dec 2018=100; Weights: 2016). LISGIS's own domain
  (lisgis.gov.lr) is currently a placeholder/coming-soon page that names
  the CPI program and explicitly points to this portal as the current
  publication channel.

  The portal exposes a JSON data API (undocumented, reverse-engineered
  from robots.txt's disallow list which named /api/1.0/sdmx, then probed
  the sibling /api/1.0/data and /api/1.0/meta routes):
  GET /api/1.0/data/wmstzic?area=<areaKey>&indicator=<indicatorKey>
  Keys must be the *numeric* dimension-member keys (e.g. 1000010), not
  the short id codes (e.g. "I2") -- the id-code form returns a
  structurally valid but empty response with no error.

  13 indicator members: "Total" (all-items headline, dropped -- no
  sanctioned COICOP sentinel per the skill's open design question) plus
  12 COICOP-1999-style divisions (I2..I13) mapping 1:1 by content onto
  COICOP-2018 divisions 01-12. Division 13 (Insurance and financial
  services, split out only in the COICOP-2018 revision) is not
  separately published -- same gap as Sierra Leone's Stats SL series.

  Each indicator's response mixes multiple `Frequency` values (A/H/Q/M)
  for the same series -- Knoema appears to SUM rather than average when
  auto-aggregating, so A/H/Q values are implausible multiples of the
  monthly figure. Only Frequency=="M" rows are genuine LISGIS-published
  monthly index points; every other frequency is discarded by the
  fetcher.

  Verified live 2026-09-11: plain `requests` + a browser User-Agent (no
  TLS-fingerprint impersonation needed). Test run with fallback_date
  2019-01-01 returned 88 monthly rows per division (Jan 2019-Apr 2026)
  across all 12 divisions.

  Also checked for a companion retail-price-level (official_avg) LISGIS
  table on this portal -- none found; the portal's other ~60 Liberia
  datasets are trade, health, demographic, and national-accounts series,
  no retail/market price-level series. See moci_commodities.yaml (same
  country dir) for the retail-price-level companion, sourced from the
  Ministry of Commerce and Industry instead of LISGIS.
