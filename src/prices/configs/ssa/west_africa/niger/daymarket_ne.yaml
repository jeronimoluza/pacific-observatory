  bottled cooking gas, powdered milk, juice, fresh oranges, bread, oral
  care, biscuits, coffee, soap -- spans several COICOP divisions in one
  small "votre supermarche" catalog, which is the highest-value source in
  this batch per the campaign's breadth-over-depth guidance for
  thin-coverage countries.
