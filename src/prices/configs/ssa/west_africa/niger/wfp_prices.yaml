notes: |
  WFP food prices for Niger via HDX (shared SSA fetcher
  _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_ner.csv (200, 68,778 rows),
  currency XOF throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. 10 commodities incl. rice (imported), millet,
  sorghum, maize, cowpeas, groundnuts. Sample: 'Rice (imported)', KG,
  XOF 200 (series starts 1990). Per-market rows collapsed to a national
  monthly average per commodity/unit/currency/price-type; market count +
  USD value kept in notes; retail vs wholesale kept in the dedup hash.
  COICOP deferred to the classifier (item_name = WFP commodity).
