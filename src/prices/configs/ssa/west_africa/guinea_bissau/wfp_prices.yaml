scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: classifier
channel: null
source_key: wfp_gnb
module: _shared.ssa.wfp_food_prices
function: fetch_wfp_gnb
url: https://data.humdata.org/dataset/wfp-food-prices-for-guinea-bissau
language: portuguese
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (round 3, 2026-08-07): WFP food prices for Guinea-Bissau via
  HDX (shared SSA fetcher _shared.ssa.wfp_food_prices). Guinea-Bissau had
  zero manifests before this. Verified live: CKAN package_show resolves
  wfp_food_prices_gnb.csv, currency XOF throughout (matches
  countries.yaml). Max observation date is 2026-06-15 — current. 53
  commodities: cereals (rice x3, maize, millet, sorghum, wheat/wheat
  flour, fonio), pulses (beans, groundnuts x2, cashew nut/fruit), meat
  (beef x2, chicken x2, pork x2, sheep x2), fish (4 varieties), veg/fruit
  (bananas x2, cassava, carrots, cucumbers, lemons, mangoes, okra, onions,
  sweet potatoes, tomatoes), oils (palm/vegetable), milk powder, sugar,
  salt, bread, plus non-food: Fuel (Super Petrol/diesel), charcoal,
  firewood, candles, batteries, handwash/laundry soap. Sample at max
  date: 'Rice (local)'. Per-market rows collapsed to a national monthly
  average per commodity/unit/currency/price-type; market count + USD
  value kept in notes; retail vs wholesale kept in the dedup hash. COICOP
  deferred to the classifier (item_name = WFP commodity).
  coicop_divisions: 01, 04, 05, 07, 13
  divisions_basis: walked_categories (full 53-commodity list enumerated
  from the CSV; food -> 01, charcoal/firewood -> 04, candles/batteries ->
  05, Fuel (Super Petrol/diesel) -> 07, handwash/laundry soap -> 13)
