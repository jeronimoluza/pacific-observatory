notes: |
  WFP food prices for Guinea via HDX (shared SSA fetcher
  _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_gin.csv (200, 3.2MB, 26,190 rows),
  currency GNF throughout (matches countries.yaml). Max observation date is
  2026-07-15 — current. 26 commodities incl. fonio, cassava meal (attieke/
  gari), fresh/dry/smoked fish, groundnuts, imported/local rice. Sample at
  max date: 'Bread', Unit, GNF 4500. Per-market rows collapsed to a
  national monthly average per commodity/unit/currency/price-type; market
  count + USD value kept in notes; retail vs wholesale kept in the dedup
  hash. COICOP deferred to the classifier (item_name = WFP commodity).
