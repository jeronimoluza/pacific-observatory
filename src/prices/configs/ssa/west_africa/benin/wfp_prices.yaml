scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: classifier
channel: null
source_key: wfp_ben
module: _shared.ssa.wfp_food_prices
function: fetch_wfp_ben
url: https://data.humdata.org/dataset/wfp-food-prices-for-benin
language: fr
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (round 3, 2026-08-07): WFP food prices for Benin via HDX
  (shared SSA fetcher _shared.ssa.wfp_food_prices). Benin previously had
  two retailer_sku manifests (nolmarket_bj, yoboumarket_bj) but no
  official_avg source. Verified live: CKAN package_show resolves
  wfp_food_prices_ben.csv, currency XOF throughout (matches
  countries.yaml). Max observation date is 2026-06-15 — current. 53
  commodities: cereals (maize x3, millet, sorghum x2, wheat/wheat flour,
  rice x5 grades), tubers (cassava x5 forms, yam x5 forms, potatoes,
  sweet potatoes), pulses (beans x3, groundnuts x2, soybeans, peas),
  veg/fruit (cabbage, carrots, leafy vegetables, lemons, okra, onions,
  oranges, papaya, plantains, tomatoes), fish/shrimp/snail, oils (3),
  coconut, no fuel/energy commodity present. Sample at max date: 'Maize'.
  Per-market rows collapsed to a national monthly average per commodity/
  unit/currency/price-type; market count + USD value kept in notes;
  retail vs wholesale kept in the dedup hash. COICOP deferred to the
  classifier (item_name = WFP commodity).
  coicop_divisions: 01
  divisions_basis: walked_categories (full 53-commodity list enumerated
  from the CSV; all 6 WFP categories present are food-only — no non-food
  category in this panel)
