notes: |
  Onboarded 2026-09-28 (weekly run W40). MTN Congo's "Forfaits Internet
  classiques" page server-renders 6 tables of prepaid data-bundle tariffs
  (1 jour / 7 jours / 30 jours validity, plus NUIT/FTT/Residentielles named
  offers) in FCFA -- 34 rows total. No JS, no WAF; verified live with a
  plain `requests` session. Lump-sum package prices, not per-unit, so
  unit="forfait" and the Mo volume is folded into item_name. Sibling Airtel
  Congo (airtel.cg/prix-les-plus-bas) carries an equivalent page and is a
  good next candidate -- not pursued this pass (budget). Second source
  opening COICOP division 08 (communication) for Congo-Brazzaville.
