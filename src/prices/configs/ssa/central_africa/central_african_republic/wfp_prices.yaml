notes: |
  WFP food prices for the Central African Republic via HDX (shared SSA
  fetcher _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06: CKAN
  package_show resolves wfp_food_prices_caf.csv (200, 3.6MB, 30,357 rows),
  currency XAF throughout (matches countries.yaml). Max observation date is
  2026-06-15 — current. 39 commodities (tied for richest in this shard),
  incl. smoked antelope/gazelle (bushmeat — rare hit on the 'other meat'
  COICOP leaf), catfish/frozen/canned sardine/smoked fish, sesame,
  groundnuts (shelled/unshelled), charcoal. Sample at max date: 'Cassava
  (cossette)', KG, XAF 125. Per-market rows collapsed to a national monthly
  average per commodity/unit/currency/price-type; market count + USD value
  kept in notes; retail vs wholesale kept in the dedup hash. COICOP
  deferred to the classifier (item_name = WFP commodity).
