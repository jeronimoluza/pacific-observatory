notes: |
  New source (round 3 resume, 2026-08-07): USAID FEWS NET market price facts
  REST API (fdw.fews.net/api/marketpricefacts/), shared SSA fetcher
  _shared.ssa.fews_net. Central African Republic's only prior manifest was
  wfp_prices (official_avg via HDX) — this is a second, independent
  official_avg feed (different upstream agency: FEWS NET/USAID vs WFP), not
  a duplicate. Verified live: 9102 total facts for country_code=CF, currency
  XAF (matches countries.yaml), max period_date 2026-06-30. Sample at max
  date: Palm Oil (Refined), L, XAF, Retail. Server-side start_date filter
  confirmed narrowing. Per-market rows collapsed to a national monthly
  average per commodity/unit/currency/price-type; market count + USD value
  kept in notes; retail vs wholesale kept in the dedup hash. COICOP deferred
  to the classifier (item_name = FEWS NET product label, in English even
  though the site/market is French-speaking).
  coicop_divisions: 01
  divisions_basis: walked_categories (whole-catalog API walk, no commodity
  filter applied; food staples only per FEWS NET's own product scope)
