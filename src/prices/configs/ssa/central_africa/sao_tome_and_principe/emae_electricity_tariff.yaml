notes: |
  New source, wave 13 (2026-09-01). EMAE (Empresa de Agua e Electricidade) is Sao
  Tome and Principe's state water/electricity utility -- this is the ELECTRICITY
  half of its tarifarios page; see the sibling emae_water_tariff.yaml for the WATER
  half of the same page (one site visit, two sources per the wave brief).

  Static server-rendered HTML, no anti-bot. pandas.read_html parses the page's two
  electricity tables cleanly: a post-paid schedule (price/kWh banded by monthly
  consumption: <=100, <=300, >300 kWh) and a pre-paid schedule (price/kWh banded by
  meter phase: monofasico/trifasico), each broken out by 10 customer categories
  (Domestico, Industrial, Comercial e Servicos, Empresas Estatais, Embaixadas,
  Bancos, Telecomunicacoes, Agencias de Viagem, Regiao Autonoma, Administracao
  Publica). Measured live 2026-09-01: 24 rows total (12 post-paid + 10 pre-paid;
  2 pre-paid categories share the Domestico rate row's meter-type split so the
  count isn't a flat 12+12 -- see the run's row count for the exact figure).

  Currency: page says "em dobras", undated STN vs STD. Magnitude (1.67-9.87 per
  kWh) rules out pre-2018 STD (which would print in the thousands for the same
  tariff) -- recorded as STN.

  No effective/publication date is printed anywhere on the page (unlike Gabon's
  SEEG PDF or Vanuatu's URA table, both of which print one) -- period_kind is
  therefore snapshot, observation_date = scrape date, not effective_from.

  fallback_date=2015-01-01 is arbitrary (no dated history exists to backfill); it
  only matters in that it's earlier than "today" so the first run isn't skipped.
