scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: classifier
channel: null
source_key: wfp_tcd
module: _shared.ssa.wfp_food_prices
function: fetch_wfp_tcd
url: https://data.humdata.org/dataset/wfp-food-prices-for-chad
language: fr
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (round 3, 2026-08-07): WFP food prices for Chad via HDX
  (shared SSA fetcher _shared.ssa.wfp_food_prices). Chad had zero manifests
  before this. Verified live: CKAN package_show resolves
  wfp_food_prices_tcd.csv, currency XAF throughout (matches
  countries.yaml). Max observation date is 2026-06-15 — current. 34
  distinct commodities: cereals (millet, sorghum x4 variants, maize x2,
  rice x2, wheat), pulses (beans x3, groundnuts), oils, livestock (cattle,
  goat, sheep), dried fish, vegetables/fruit (onions, garlic, mangoes,
  dates, sweet potatoes). Sample at max date: 'Millet', KG. Per-market rows
  collapsed to a national monthly average per commodity/unit/currency/
  price-type; market count + USD value kept in notes; retail vs wholesale
  kept in the dedup hash. COICOP deferred to the classifier (item_name =
  WFP commodity).
  coicop_divisions: 01
  divisions_basis: walked_categories (full commodity list enumerated from
  the CSV; all 7 WFP categories are food — cereals and tubers, meat/fish/
  eggs, miscellaneous food, oil and fats, pulses and nuts, vegetables and
  fruits; no fuel/non-food commodity present despite a "non-food" category
  label existing in the schema)
