notes: |
  World Bank Real-Time Development Indicators, monthly food price estimates by
  product and market for Chad. 16 commodities at market level, monthly from
  2007, priced in local currency (XAF) -- roughly a decade further back than
  Common Crawl or Wayback reach for retail catalogues.

  Served from the GLOBAL RTFP panel (catalog 4483), which carries 37 countries
  in one ~1.1 GB file. The fetcher downloads and parses it once per process and
  slices each country from the cache, so a whole-collection run pays for the
  download a single time rather than 37 times.

  `coicop_classification: classifier` is what admits this manifest's
  price_observations.csv to the corpus (see _classifier_csv_map), but COICOP is
  NOT deferred here: the fetcher stamps a curated leaf per ITEM from its own
  lookup table, and classify's narrowness short-circuit resolves it per row. The
  YAML `coicop_codes` field could not express this -- it is per-source, so it
  can only assert one leaf for a whole multi-commodity feed.

  Mapping keys on (country, ticker), never ticker alone: `oil` is vegetable in
  Indonesia, soybean in Lao PDR and palm in Myanmar. `food_price_index` is an
  INDEX, not a level, and is deliberately excluded, as are the `_fao` twins of
  tickers this country already carries nationally -- they are the same commodity
  on a different unit basis and would double-count.
