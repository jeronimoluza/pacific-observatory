notes: |
  Daarishop sells food packs, household essentials, pharmacy vouchers, and
  other goods for delivery to households in Chad. Its public first-party
  WooCommerce Store API reports 41 products on one page with stable IDs, URLs,
  current EUR prices, categories, and stock state. EUR is the observed checkout
  currency for this cross-border fulfilment service and is not converted to XAF.
