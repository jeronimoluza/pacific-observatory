scaffolding: spider
extraction_pattern: scrapy_playwright
analytical_role: retailer_sku
coicop_classification: classifier
channel: convenience
spider: express_market_cm
spider_kwargs:
  vendor_group: bakery
url: https://expressmarketcm.com/
language: fr
cadence: weekly
notes: |
  ORCHESTRATOR REVIEW 2026-09-01 -- both of Cameroon's food sources come from
  THIS ONE PLATFORM (expressmarketcm.com), scraped by ONE spider
  (express_market_cm) and split into two manifests by vendor filter. That
  split is permitted under the rule-14 merchant-split pattern (same basis as
  the *_wolt_* sources) and the two share ZERO product_id -- verified, 0
  overlap on 26 vs 46 rows -- so no shelf is counted twice. But the
  consequence is that Cameroon's entire food coverage rests on a single
  storefront: if expressmarketcm.com dies, the country goes from 2 food
  sources to 0 overnight. Treat this as a fragile pass and re-probe early.

  Three further caveats measured by the orchestrator:
  - `express_market_bakery_cm` BLENDS SIX different bakery vendors into one
    manifest. That is the opposite of the rule-14 single-merchant split; it is
    an aggregate wearing a merchant's label. Splitting per bakery would be more
    honest if any of them individually clears the row gate.
  - Vendor grouping is by NAME because the platform's own `type` field is
    wrong, and it leaks: the "bakery" source carries "Whisky Grant's Triple
    Wood 75cl" and "Johnnie Walker Red Label", and the "supermarket" source
    carries 3 Boulangerie rows.
  - 24 of the supermarket source's 26 rows were stock=0 at scrape time. These
    are last-posted prices, not observed live offers.

  New source (wave 13, 2026-09-01). Same Express Market CM PocketBase feed
  as express_market_supermarket_cm.yaml (see that manifest's notes for
  the WAF/Playwright rationale) -- scoped here to the 6 vendors named
  "Boulangerie ..." (bakeries) in Bafoussam. The source's own vendor
  `type` field tags these the same as the supermarket vendor
  ("Supermarche"), which is unreliable -- a boulangerie is not a
  supermarket -- so this spider groups by vendor NAME containing
  "boulangerie" instead of trusting that field. channel=specialty-food
  reflects what these vendors actually are: bakeries whose primary
  business is bread/pastry, plus a general grocery shelf.

  Verified live 2026-09-01 via the same products API call: 46 of 203
  total marketplace products belong to these 6 vendors (Boulangerie de
  la Poste, Boulangerie du Peuple, Boulangerie La Manne, Boulangerie
  Patisserie HANANA, Boulangerie la PAIX, Boulangerie SAKER). Sample
  rows: 'Madeleine' 150 XAF, 'Cake Chocolat' 600 XAF, 'Cake citron' 600
  XAF (bakery items), plus general grocery carried on the same shelf
  ('Jus Top 1L' 500 XAF, 'Chocolat Tartina - Chococam - 400g' 1300 XAF).
  All 46 rows are Bafoussam. Prices are plain integer XAF (JSON numbers,
  no thousands-separator parsing needed). Test run 2026-09-01: 46/46
  rows, 46 distinct product_id, 46 distinct url, 0 zero/negative price,
  0 blank name, 0 duplicate product_id. Several product names repeat
  verbatim across different bakery vendors at the same or slightly
  different price (e.g. 'Jus Top 1L' = 500 XAF at all 6) -- expected for
  a shared upstream supplier catalog, not a scraping bug; each row keeps
  a distinct PocketBase record id / product_id / url so none of these
  collapse in dedup. One row ('Chocolat - Mambo - Riz - 100G') carries a
  category_id that maps to 'Boutiques de Mode' in the source's own
  category table -- a mislabel on the source's end, not this spider's;
  left as-is since product_name (what the classifier actually reads) is
  correct. channel=convenience (not specialty-food): these vendors carry
  a small, broad mix -- bread/pastry plus general grocery (chocolate,
  milk, spirits, juice) -- rather than one narrow food/drink category, so
  "small-format, limited SKU count" is the more honest discriminating
  test than "narrow food/drink range". Caveat: the API's own `stock`
  field shows all 46 rows at
  stock=0 (available=False) at scrape time -- confirmed against one live
  PDP ('Farine de Ble ...' -> 'Indisponible'). Kept as valid rows (last
  posted shelf price, not fabricated) but this vendor group's catalog
  reads as fully stale at scrape time; re-check freshness on a future
  pass.
