scaffolding: fetcher
extraction_pattern: tabular_download
analytical_role: official_avg
coicop_classification: source_curated
channel: null
source_key: wfp_cmr
module: _shared.ssa.wfp_food_prices
function: fetch_wfp_cmr
url: https://data.humdata.org/dataset/wfp-food-prices-for-cameroon
language: fr
cadence: monthly
fallback_date: 2020-01-01
notes: |
  New source (round 3, 2026-08-07): WFP food prices for Cameroon via HDX
  (shared SSA fetcher _shared.ssa.wfp_food_prices). Cameroon previously
  had one retailer_sku manifest (yorix_cm) but no official_avg source.
  Verified live: CKAN package_show resolves wfp_food_prices_cmr.csv,
  currency XAF throughout (matches countries.yaml). Max observation date
  is 2026-06-15 — current. 55 commodities: cereals (maize x2, millet,
  sorghum x2, rice x3, wheat flour), pulses (beans x2, cowpeas,
  groundnuts x2, soybeans), tubers (cassava x3, cocoyam, taro, potatoes
  x2, yam), veg/fruit (bananas, plantains, mangoes, onions, garlic,
  leafy vegetables, okra x2, peppers, tomatoes, watermelons), beef,
  chicken, eggs, dried/fresh/salted fish, milk (fresh/powder), oils (5
  variants), sugar, salt, pasta, plus non-COICOP Wage series (excluded
  below). No fuel/energy commodity present despite a "non-food" category
  label. Sample at max date: 'Maize (white)'. Per-market rows collapsed
  to a national monthly average per commodity/unit/currency/price-type;
  market count + USD value kept in notes; retail vs wholesale kept in the
  dedup hash. COICOP deferred to the classifier (item_name = WFP
  commodity).
  coicop_divisions: 01
  divisions_basis: walked_categories (full 55-commodity list enumerated
  from the CSV; all commodities are food; the two Wage series are not
  COICOP consumption items and are excluded from the tag)
  2026-09-11: coicop_classification changed classifier -> source_curated.
  The sentence above about deferring COICOP to the classifier is superseded.
  WFP publishes clean, stable English commodity labels ("Millet", "Rice
  (imported)"), not retail SKU strings, so the shared fetcher now stamps a
  division-01/02 leaf per row from the hand-written map in
  src/prices/fetchers/_shared/wfp_coicop.py (603 commodity labels covering
  89.6% of the 116,815 rows collected across the 68 panels). A commodity the
  map does not cover -- the panels' fuel, wage, exchange-rate, transport and
  household-goods block, plus a short list of genuinely ambiguous food
  labels -- is DROPPED with a logged warning, never emitted with a null
  coicop_code. coicop_codes is deliberately unset: measured across the
  collected panels these rows span 132 leaves in 12 different 3-digit
  classes, so the source is wide, not narrow.
