notes: |
  WFP food prices for the Democratic Republic of the Congo via HDX (shared
  SSA fetcher _shared.ssa.wfp_food_prices). Re-verified live 2026-08-06:
  CKAN package_show resolves wfp_food_prices_cod.csv (200, 11.6MB, 95,051
  rows), currency CDF throughout (matches countries.yaml). Max observation
  date is 2026-05-15 — current. 38 commodities: cassava (+chikwangue/
  cossette/flour), plantains, sweet potatoes, fresh/salted/smoked fish,
  live goat, beef/chicken/goat/pork meat. Sample at max date: 'Cassava
  flour', KG, CDF 1449. Per-market rows collapsed to a national monthly
  average per commodity/unit/currency/price-type; market count + USD value
  kept in notes; retail vs wholesale kept in the dedup hash. COICOP
  deferred to the classifier (item_name = WFP commodity).
