# Abante Configuration

name: "Abante"
country: "philippines"
base_url: "https://abante.com.ph/"
language: "filipino"

# Listing discovery configuration
# This scraper covers multiple Pacific countries using tag-based pagination
listing:
  type: "pagination"
  start_url: "https://www.abante.com.ph/category/news/"
  url_template: "https://www.abante.com.ph/category/news/page/{num}/"
  start_page: 2
  batch_size: 50

# Client configuration
client: "http"
concurrency: 10
rate_limit: 0.2
retries: 3
retry_seconds: 2.0

headers:
  User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.6261.129 Safari/537.36"
  Accept-Language: "en-US,en;q=0.9"
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng;q=0.8"
  Connection: "keep-alive"
  Upgrade-Insecure-Requests: "1"
  Referer: "https://newsinfo.inquirer.net/"

# CSS selectors for data extraction
selectors:
  thumbnail:
    container: 'div.elementor-post__text'
    title: "h3.elementor-post__title a::text"
    url: "h3.elementor-post__title a::attr(href)"
  article:
    body: "div.elementor-widget-container p"
    date: "meta[property='article:published_time']::attr(content)"
    tags: ".elementor-post-info__terms-list a"

# Data cleaning configuration
cleaning:
  date: "handle_mixed_dates"

# Test/debug options
max_pages: null
max_articles: null
