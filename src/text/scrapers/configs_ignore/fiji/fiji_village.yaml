# Fiji Village Configuration
# Uses pagination strategy on the archive site

name: "Fiji Village"
country: "fiji"
base_url: "https://archive.fijivillage.com"

# Listing discovery configuration using pagination strategy
listing:
  type: "pagination"
  start_url: "https://archive.fijivillage.com/index.php?q=&news_type=News&page=1"
  url_template: "https://archive.fijivillage.com/index.php?q=&news_type=News&page={num}"
  start_page: 2
  batch_size: 10

# Client configuration
client: "http"
concurrency: 10
rate_limit: 0.2
retries: 3
retry_seconds: 2.0

# CSS selectors for data extraction
selectors:
  thumbnail:
    container: "article.result-card"
    title: "h2.title-main a::text"
    url: "h2.title-main a::attr(href)"
  article:
    date: ".article-panel .small.text-muted.mb-2 span.ms-2::text"
    body:
      - ".article-body p"
      - "div[class='article-body mb-4']"

# Data cleaning configuration
cleaning:
  date: "handle_mixed_dates"

# Test/debug options
max_pages: null
max_articles: null

# Site-specific notes:
# - Uses archive.fijivillage.com for listing discovery (paginated HTML pages)
# - Each listing page contains ~20 article cards with title, URL, date, and tags
# - Article pages have body in .article-body and tags as .tag-badge spans
# - Date format on listing: DD/MM/YYYY HH:MM (e.g. 21/11/2025 08:55)
# - Article URLs are relative (article.php?id=XXXXX), resolved against base_url
