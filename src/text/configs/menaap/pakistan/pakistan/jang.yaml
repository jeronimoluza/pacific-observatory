name: Daily Jang
language: urdu
country: pakistan
base_url: https://jang.com.pk

# Category: National (Latest News > National) — matches priority-1 national-news rule
# 2026-10-16 (panel 20261016T0917Z): no ledger yet: 305+ pages walked, nothing kept when killed
listing:
  type: pagination
  url_template: "https://jang.com.pk/category/latest-news/national?offset={num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li"
    title: "h2::text"
    url: "a::attr(href)"
  article:
    body: "div.detail_view_content p"
    date: "meta[property='og:image']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: 8  # 2026-10-16 verify: 20 pages hit the 300 s cap
max_articles: null
