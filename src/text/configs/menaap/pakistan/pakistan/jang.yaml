name: Daily Jang
language: urdu
country: pakistan
base_url: https://jang.com.pk

# Category: National (Latest News > National) — matches priority-1 national-news rule
listing:
  type: pagination
  url_template: "https://jang.com.pk/category/latest-news/national?offset={num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li"
    title: "h2::text"
    url: "a::attr(href)"
  article:
    body: "div.detail_view_content p"
    date: "meta[property='og:image']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
