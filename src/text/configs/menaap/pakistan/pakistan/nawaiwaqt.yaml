name: Nawaiwaqt
language: urdu
country: pakistan
base_url: https://www.nawaiwaqt.com.pk

listing:
  type: api
  pagination_type: offset
  offset_start: 0
  offset_step: 9
  request_method: POST
  url_template: "https://www.nawaiwaqt.com.pk/ajax_post_pagination"
  form_data:
    post_per_page: "9"
    post_listing_limit_offset: "{offset}"
    directory_name: categories_pages
    template_name: lazy_loading
    category_name: national
  view_container: article
  json_paths:
    title: "h3.jeg_post_title a::text"
    url: "h3.jeg_post_title a::attr(href)"

headers:
  X-Requested-With: XMLHttpRequest
  Referer: https://www.nawaiwaqt.com.pk/national

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.content-inner p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
