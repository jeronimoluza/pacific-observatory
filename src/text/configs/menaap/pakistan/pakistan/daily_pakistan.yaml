name: Daily Pakistan
language: urdu
country: pakistan
base_url: https://dailypakistan.com.pk

listing:
  type: api
  pagination_type: offset
  offset_start: 0
  offset_step: 36
  request_method: POST
  url_template: "https://dailypakistan.com.pk/ajax_post_pagination"
  form_data:
    post_per_page: "36"
    post_listing_limit_offset: "{offset}"
    directory_name: categories_pages
    template_name: lazy_loading
    category_name: national
  view_container: "div.post-review"
  json_paths:
    title: "div.post-title a::text"
    url: "div.post-title a::attr(href)"

headers:
  X-Requested-With: XMLHttpRequest
  Referer: https://dailypakistan.com.pk/national

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.news-detail-content-class p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
