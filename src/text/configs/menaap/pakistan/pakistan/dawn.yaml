name: Dawn
language: en
country: pakistan
base_url: https://www.dawn.com/

listing:
  type: archive
  start_url: "https://www.dawn.com/pakistan"
  url_template: "https://www.dawn.com/pakistan/{year}-{month}-{day}"
  start_date: "2013-01-01"
  date_format: "daily"

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.w-full article[data-layout='story']"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "article[data-layout='default'] p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
