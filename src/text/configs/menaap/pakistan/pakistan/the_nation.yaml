name: The Nation
language: en
country: pakistan
base_url: https://www.nation.com.pk

listing:
  type: pagination
  start_url: "https://www.nation.com.pk/national"
  url_template: "https://www.nation.com.pk/national/page/{num}/"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h3.jeg_post_title a::text"
    url: "h3.jeg_post_title a::attr(href)"
  article:
    body: "div.content-inner p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
