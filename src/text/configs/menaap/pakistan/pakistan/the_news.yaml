name: The News International
language: en
country: pakistan
base_url: https://www.thenews.com.pk

listing:
  type: pagination
  start_url: "https://www.thenews.com.pk/latest-stories"
  url_template: "https://www.thenews.com.pk/latest-stories?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.writter-list-item-story"
    title: "div.latest-right h2 a::text"
    url: "div.latest-right h2 a::attr(href)"
  article:
    body: "div.story-detail p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
