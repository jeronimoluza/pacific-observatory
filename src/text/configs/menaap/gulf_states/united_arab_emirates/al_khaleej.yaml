name: Al Khaleej
language: ar
country: united_arab_emirates
base_url: https://www.alkhaleej.ae

listing:
  type: pagination
  url_template: "https://www.alkhaleej.ae/الإمارات?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.articles"
    title: "a.article::text"
    url: "a.article::attr(href)"
  article:
    body: "div.article-text"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
