name: Emarat Al Youm
language: ar
country: united_arab_emirates
base_url: https://www.emaratalyoum.com

listing:
  type: pagination
  url_template: "https://www.emaratalyoum.com/local-section?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h3"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div#articledetails p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
