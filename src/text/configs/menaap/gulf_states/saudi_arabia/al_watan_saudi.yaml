name: Al Watan
language: ar
country: saudi_arabia
base_url: https://www.alwatan.com.sa

listing:
  type: pagination
  url_template: "https://www.alwatan.com.sa/محليات?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h2.title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.relative-style p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
