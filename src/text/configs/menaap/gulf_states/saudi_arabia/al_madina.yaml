name: Al Madina
language: ar
country: saudi_arabia
base_url: https://www.al-madina.com

listing:
  type: pagination
  url_template: "https://www.al-madina.com/محليات?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h2.article-title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.article-body"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
