# Unusable with current pipeline strategies (deferred, not fabricated).
# Reason: alriyadh.com serves an incomplete TLS certificate chain — httpx
#   (certifi CA bundle, used by the pipeline's HTTP client) raises
#   SSL: CERTIFICATE_VERIFY_FAILED / unable to get local issuer certificate.
#   curl and browsers tolerate it (cached/system intermediate CA), so it
#   looked fine during manual probing but the live `text collect` probe
#   returned 0 thumbnails. Selectors below (h4.entry-title, div.article-text,
#   div.article-time time) were verified correct via BeautifulSoup and would
#   work once the cert issue is resolved site-side or the client trusts it.
name: Al Riyadh
language: ar
country: saudi_arabia
base_url: https://www.alriyadh.com

listing:
  type: pagination
  url_template: "https://www.alriyadh.com/news.local?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h4.entry-title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.article-text p"
    date: "div.article-time time::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
