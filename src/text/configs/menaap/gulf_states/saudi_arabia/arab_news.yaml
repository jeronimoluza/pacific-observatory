name: Arab News
language: en
country: saudi_arabia
base_url: https://www.arabnews.com

listing:
  type: pagination
  start_url: "https://www.arabnews.com/taxonomy/term/1/all"
  url_template: "https://www.arabnews.com/taxonomy/term/1/all?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.article-item"
    title: ".article-item-title h2 a::text"
    url: ".article-item-title h2 a::attr(href)"
  article:
    body: "div.field-name-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
