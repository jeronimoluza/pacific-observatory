name: Kuwait Times
language: en
country: kuwait
base_url: https://kuwaittimes.com

listing:
  type: pagination
  start_url: "https://kuwaittimes.com/kuwait/"
  url_template: "https://kuwaittimes.com/kuwait/?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.row div.col-md-12"
    title: "div.article-title h2 a::text"
    url: "div.article-title h2 a::attr(href)"
  article:
    body: "div.article-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
