name: Kuwait Times
language: en
country: kuwait
base_url: https://kuwaittimes.com

listing:
  type: api
  pagination_type: offset
  offset_start: 0
  offset_step: 20
  url_template: "https://kuwaittimes.com/ajax/load_more_articles_section_subsection/?section=14&subsection=0&limit=20&offset={offset}&offsetarchive=0&pagenb=1"
  view_path: view
  view_container: "div.col-md-12"
  json_paths:
    title: "div.article-sub-title a::text"
    url: "div.article-sub-title a::attr(href)"

headers:
  X-Requested-With: XMLHttpRequest
  Referer: https://kuwaittimes.com/kuwait/

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.article-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
