name: Sabr
language: arabic
country: kuwait
base_url: https://www.sabr.cc

listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.sabr.cc/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2&_fields=id,date,link,title,excerpt"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "excerpt.rendered"

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: filler

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
