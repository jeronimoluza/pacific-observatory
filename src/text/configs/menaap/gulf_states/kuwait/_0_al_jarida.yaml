name: Al Jarida
language: arabic
country: kuwait
base_url: https://www.aljarida.com

listing:
  type: pagination
  start_url: "https://www.aljarida.com/latest"
  url_template: "https://www.aljarida.com/latest/page/{num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h2 a::text"
    url: "h2 a::attr(href)"
  article:
    body: ["div.entry-content p", "article p", "div.article-body p"]
    date: ["time::attr(datetime)", "meta[property='article:published_time']::attr(content)"]

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
