name: Al Rai
language: ar
country: kuwait
base_url: https://www.alraimedia.com

listing:
  type: pagination
  url_template: "https://www.alraimedia.com/محليات?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.container-details-text"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.article-desc p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
