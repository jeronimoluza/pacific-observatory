name: Times of Oman
language: en
country: oman
base_url: https://timesofoman.com

listing:
  type: pagination
  start_url: "https://timesofoman.com/category/oman"
  url_template: "https://timesofoman.com/category/oman/page/{num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.post.horizontal"
    title: "h2.post-title a::text"
    url: "h2.post-title a::attr(href)"
  article:
    body: "#__content__ p"
    date: "span.text-muted::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
