name: Al Roya
language: arabic
country: oman
base_url: https://alroya.om

listing:
  type: pagination
  start_url: "https://alroya.om/category/7/%D9%85%D8%AD%D9%84%D9%8A%D8%A7%D8%AA"
  url_template: "https://alroya.om/category/7/%D9%85%D8%AD%D9%84%D9%8A%D8%A7%D8%AA/page-{num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h3.entry-title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.post-text-container p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
