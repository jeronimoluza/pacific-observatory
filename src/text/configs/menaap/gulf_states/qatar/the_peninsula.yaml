name: The Peninsula
language: en
country: qatar
base_url: https://thepeninsulaqatar.com

listing:
  type: pagination
  url_template: "https://thepeninsulaqatar.com/category/qatar?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.townews"
    title: "a.title::text"
    url: "a.title::attr(href)"
  article:
    body: "div.con-text p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
