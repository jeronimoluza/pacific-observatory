name: Gulf Times
language: en
country: qatar
base_url: https://www.gulf-times.com

listing:
  type: pagination
  start_url: "https://www.gulf-times.com/morearticles/qatar"
  url_template: "https://www.gulf-times.com/morearticles/qatar?pgno={num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.row div[class='col-md-3 article']"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.article-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
