name: Al Sharq
language: arabic
country: qatar
base_url: https://al-sharq.com

listing:
  type: pagination
  url_template: "https://al-sharq.com/category/محليات/{num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.item"
    title: "div.text-d a::text"
    url: "div.text-d a::attr(href)"
  article:
    body: "div.text p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
