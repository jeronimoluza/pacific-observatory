name: Al Arab
language: ar
country: qatar
base_url: https://alarab.qa

listing:
  type: pagination
  url_template: "https://alarab.qa/category/محليات?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.inner"
    title: "a.title::text"
    url: "a.title::attr(href)"
  article:
    body: "div.text.m-special.mt-1 p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
