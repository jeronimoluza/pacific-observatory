name: Al Raya
language: arabic
country: qatar
base_url: https://www.raya.com

listing:
  type: api
  pagination_type: offset
  offset_start: 0
  offset_step: 9
  url_template: "https://www.raya.com/api/pb/fetch-more-articles?v=0&sectionId=1&limit=9&offset={offset}&start=0&offsetArchive=0&custom_field=&widget_id=283"
  json_paths:
    collection: data
    url: short_url
    title: title
    date: publish_time

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: ".article-body"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
