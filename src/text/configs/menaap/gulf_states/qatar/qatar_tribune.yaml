name: Qatar Tribune
language: en
country: qatar
base_url: https://www.qatar-tribune.com

listing:
  type: pagination
  url_template: "https://www.qatar-tribune.com/latest-news?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.articleContent"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.articleContent p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
