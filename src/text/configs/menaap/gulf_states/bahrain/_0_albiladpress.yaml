# Unusable with current pipeline strategies (deferred, not fabricated).
# Reason: /news/bahrain category page has no single stable per-article container —
#   article links are scattered across a "columns" widget, a "most-read" sidebar,
#   and an "online-slider" widget, none of which is the actual category feed.
# Reason: /latest-news returns a Cloudflare-thin response (5.7KB, no article links),
#   suggesting the main feed is client-rendered or bot-gated on that path.
# Revisit: would need browser client or reverse-engineering the AJAX feed endpoint.
name: Al Bilad Press
language: ar
country: bahrain
base_url: https://www.albiladpress.com

listing:
  type: pagination
  url_template: "https://www.albiladpress.com/news/bahrain?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
