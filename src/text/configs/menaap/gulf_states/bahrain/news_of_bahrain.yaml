name: News of Bahrain
enabled: false
disabled_reason: "source-health 2026-10-17: not_found on https://www.newsofbahrain.com/bahrain/page/1/ (HTTP 404 after redirect to https://www.newsofbahrain.com/en/bahrain/page/1); failing since 2026-10-16T22:46:25Z, probes 2026-10-16T22:46:25Z, 2026-10-16T23:32:35Z, 2026-10-17T05:03:00Z. Homepage still answers 200 (2026-10-17): the outlet lives, its listing is gone; re-onboard with a new listing URL."
language: en
country: bahrain
base_url: https://www.newsofbahrain.com

listing:
  type: pagination
  url_template: "https://www.newsofbahrain.com/bahrain/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h2 a::text"
    url: "h2 a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "time.post-published::attr(datetime)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
