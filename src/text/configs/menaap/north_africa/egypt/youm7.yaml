name: Youm7
language: arabic
country: egypt
base_url: https://www.youm7.com

listing:
  type: pagination
  url_template:
    - "https://www.youm7.com/Section/%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF-%D9%88%D8%A8%D9%88%D8%B1%D8%B5%D8%A9/297/{num}"
    - "https://www.youm7.com/Section/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9/319/{num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.bigOneSec"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div#articleBody div"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
