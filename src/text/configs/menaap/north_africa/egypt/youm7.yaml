name: Youm7
language: arabic
country: egypt
base_url: https://www.youm7.com

# 2026-10-16 (panel 20261016T0917Z): watermark 07-03: discovery walked 170+ pages back to it past the cap and kept nothing
listing:
  type: pagination
  url_template:
    - "https://www.youm7.com/Section/%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF-%D9%88%D8%A8%D9%88%D8%B1%D8%B5%D8%A9/297/{num}"
    - "https://www.youm7.com/Section/%D8%B3%D9%8A%D8%A7%D8%B3%D8%A9/319/{num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.bigOneSec"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body:
      # 2026-10-16: paragraphs are now direct <p> children (426/470 empty bodies with div)
      - "div#articleBody p"
      - "div#articleBody div"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: 10  # 2026-10-16 verify: body fixed, 20 pages = 800 rows ran past 300 s
max_articles: null
