name: Al Chourouk
language: ar
country: tunisia
base_url: https://www.alchourouk.com

# Category: national/وطنية
listing:
  type: pagination
  url_template: "https://www.alchourouk.com/%D9%88%D8%B7%D9%86%D9%8A%D8%A9?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.row-article"
    title: ".views-field-title a::text"
    url: ".views-field-title a::attr(href)"
  article:
    body: "article .field--name-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
