name: Web Manager Center
language: fr
country: tunisia
base_url: https://www.webmanagercenter.com

listing:
  type: pagination
  url_template: "https://www.webmanagercenter.com/a-la-une/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.td_module_10"
    title: "h3.entry-title a::text"
    url: "h3.entry-title a::attr(href)"
  article:
    body: "div.td-post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
