name: Alwasat
language: en
country: libya
base_url: https://en.alwasat.ly

listing:
  type: api
  pagination_type: offset
  page_start: 0
  page_step: 20
  url_template: "https://en.alwasat.ly/news/section/ajax_more_news/get?sid=p6666666p&offset={offset}"
  json_paths:
    collection: ""
    url: permalink
    title: header
    date: dated

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.article-desc p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
