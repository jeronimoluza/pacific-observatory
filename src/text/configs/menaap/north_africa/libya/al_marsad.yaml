name: Al Marsad
language: arabic
country: libya
base_url: https://almarsad.co

# Categories: محلي/Local(id unknown, slug-based only - wp-json blocked by Cloudflare)
# WordPress theme with standard /category/<slug>/page/{num}/ archives.
# wp-json REST endpoint returns a Cloudflare "Attention Required" challenge,
# so this uses HTML category-archive pagination (Tier 1) instead of the API.
listing:
  type: pagination
  url_template: "https://almarsad.co/category/%d9%85%d8%ad%d9%84%d9%8a/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.preview-classic"
    title: "h2.title a::text"
    url: "h2.title a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
