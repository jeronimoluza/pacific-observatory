name: February (Febp)
country: libya
language: arabic
base_url: https://febp.ly

# Categories: Libya / ليبيا(16), Economy / اقتصاد(4)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://febp.ly/wp-json/wp/v2/posts?per_page=100&page={page}&categories=16,4&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
