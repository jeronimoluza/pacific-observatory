name: Fassato News
enabled: false
disabled_reason: "source-health 2026-10-17: not_found on https://fassatonews.net/wp-json/wp/v2/posts?per_page=100&page=1&categories=3,21&_fields=id,date,link,title,excerpt,content (HTTP 404 after redirect to https://www.fassatonews.net/wp-json/wp/v2/posts?per_page=100&page=1&categories=3,21&_fields=id,date,link,title,excerpt,content; ?rest_route= variant empty_listing); failing since 2026-10-16T22:54:47Z, probes 2026-10-16T22:54:47Z, 2026-10-16T23:34:49Z, 2026-10-17T05:04:48Z. Homepage still answers 200 (2026-10-17): the outlet lives, its listing is gone; re-onboard with a new listing URL."
country: libya
language: arabic
base_url: https://fassatonews.net

# Categories: Libya / ليبيا(3), Economy / إقتصاد(21)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://fassatonews.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,21&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
