name: The Libya Observer
language: arabic
country: libya
base_url: https://ar.libyaobserver.ly

listing:
  type: paginated_archive
  start_url: "https://ar.libyaobserver.ly/archive/{year}{month}"
  url_template: "https://ar.libyaobserver.ly/archive/{year}{month}?page={num}"
  start_date: "2018-01-01"
  date_format: monthly
  start_page: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.m-hentry"
    title: "h2.entry-title a::text"
    url: "h2.entry-title a::attr(href)"
    date: "time.entry-date::text"
  article:
    body: "div.node__content p"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
