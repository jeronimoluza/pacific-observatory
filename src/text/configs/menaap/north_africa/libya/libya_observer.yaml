name: The Libya Observer
language: en
country: libya
base_url: https://libyaobserver.ly

listing:
  type: pagination
  start_url: "https://libyaobserver.ly/news"
  url_template: "https://libyaobserver.ly/news?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h2.entry-title a::text"
    url: "h2.entry-title a::attr(href)"
  article:
    body: "div.node__content p"
    date: "time.entry-date::attr(datetime)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
