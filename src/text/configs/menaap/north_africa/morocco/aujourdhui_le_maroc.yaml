name: Aujourd'hui le Maroc
language: fr
country: morocco
base_url: https://aujourdhui.ma

listing:
  type: pagination
  url_template:
    - "https://aujourdhui.ma/category/actualite/page/{num}/"
    - "https://aujourdhui.ma/category/economie/page/{num}/"
    - "https://aujourdhui.ma/category/politique/page/{num}/"
  start_page: 1
  step: 1
  batch_size: 5

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "[class*='jl_clist_layout']"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.post_content.jl_content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
