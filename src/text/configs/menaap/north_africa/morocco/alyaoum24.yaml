name: Alyaoum24
country: morocco
language: ar
base_url: https://alyaoum24.com

# Categories: الرئيسية/Home-national(21633), أخبار سياسية/Political(89), أخبار اقتصادية/Economy(91)
# 2026-10-16 (panel 20261016T0917Z): no ledger yet: API walk of 104+ pages never finished
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://alyaoum24.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=21633,89,91&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.post_content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: 10
max_articles: null
