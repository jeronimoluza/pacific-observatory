name: Hespress English
language: en
country: morocco
base_url: https://en.hespress.com

listing:
  type: pagination
  start_url: "https://en.hespress.com/"
  url_template: "https://en.hespress.com/page/{num}/"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.article-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
