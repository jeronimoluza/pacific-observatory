name: Echorouk Online
language: arabic
country: algeria
base_url: https://www.echoroukonline.com

listing:
  type: pagination
  start_url: "https://www.echoroukonline.com/algeria"
  url_template: "https://www.echoroukonline.com/algeria/page/{num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".ech-card"
    title: "h3.ech-card__title a span::text"
    url: "h3.ech-card__title a::attr(href)"
  article:
    body: "div.ech-artx p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
