name: Liberté
country: algeria
language: fr
base_url: https://www.liberte-algerie.com

listing:
  type: pagination
  url_template: "https://www.liberte-algerie.com/actualite?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "ul.list-main > li:has(h2), ul.list-main > li:has(h3)"
    title:
      - "h2 a::text"
      - "h3 a::text"
    url:
      - "h2 a::attr(href)"
      - "h3 a::attr(href)"
  article:
    body: "main div.cols-a p"
    date: "header.header-article div.module-users p span::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
