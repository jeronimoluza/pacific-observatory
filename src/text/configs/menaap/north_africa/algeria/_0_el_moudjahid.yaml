name: El Moudjahid
language: arabic
country: algeria
base_url: https://www.elmoudjahid.dz

listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.elmoudjahid.dz/api/ar/articles/algerie?page={page}"
  json_paths:
    collection: "data"
    url: "url"
    title: "title"
    date: "published_at"

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "article.module-article section p"
    date: "ul.list-details li ul li:last-child"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
