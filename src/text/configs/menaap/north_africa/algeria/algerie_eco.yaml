name: Algérie Eco
country: algeria
language: fr
base_url: https://algerie-eco.com

# Categories: National(8), Entreprises-Management(3), Banques-Finances(18)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://algerie-eco.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=8,3,18&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0
headers:
  Referer: "https://algerie-eco.com/"

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
