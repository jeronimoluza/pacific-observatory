name: ADI News (Agence Djiboutienne d'Information)
language: fr
country: djibouti
base_url: https://www.adi.dj

# Custom CMS (not WordPress) - no JSON API found (wp-json/rest_route both 404).
# Per-category pages (ECONOMIE, GOUVERNEMENT, PARLEMENT, ...) are only sparsely
# tagged (~20% of articles, shallow depth ~5-7 pages each spanning 2010-2026).
# Using the general "toutes-les-actualites" listing instead: dense archive
# (~593 pages x 24/page, back to mid-2024) and since this is the official
# government news wire, off-topic dilution (SPORT/CULTURE) is a minority share.
listing:
  type: pagination
  url_template: "https://www.adi.dj/toutes-les-actualites?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "a.group[href*='/article/']"
    title: "h4::text"
    url: "::attr(href)"
  article:
    body: "div.prose p"
    date: "span.mr-4::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
