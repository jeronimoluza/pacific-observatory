name: Al Qarn
language: arabic
country: djibouti
base_url: https://www.alqarn.dj

listing:
  type: paginated_archive
  start_url: "https://www.alqarn.dj/archives?archDate={year}-{month}&page=1"
  url_template: "https://www.alqarn.dj/archives?archDate={year}-{month}&page={num}"
  start_date: "2024-01-01"
  date_format: monthly
  start_page: 2
  batch_size: 5

client: http
concurrency: 3
rate_limit: 0.1
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "ul.news-post li"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.article-body p"
    date: "div.bluebar span::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
