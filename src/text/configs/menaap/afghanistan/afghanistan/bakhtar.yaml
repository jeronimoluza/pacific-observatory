name: Bakhtar News Agency
language: en
country: afghanistan
base_url: https://www.bakhtarnews.af

listing:
  type: pagination
  start_url: "https://www.bakhtarnews.af/en/Political-34"
  url_template: "https://www.bakhtarnews.af/en/Political-34?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h2 a::text"
    url: "a::attr(href)"
  article:
    body: ".post-text p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
