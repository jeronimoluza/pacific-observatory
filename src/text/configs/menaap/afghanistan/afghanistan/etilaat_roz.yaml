name: Etilaat Roz
country: afghanistan
language: fa
base_url: https://www.etilaatroz.com

# Categories: Afghanistan(22), News(6)
# QUIRK (Premium Times Nigeria pattern): categories=22,6 combined with any
# _fields param returns the site's HTML homepage instead of JSON (CDN/plugin
# block). Dropping _fields entirely fixes it -- verified both single- and
# multi-category requests return full JSON (incl. content.rendered) once
# _fields is omitted. Do not re-add _fields to this url_template.
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.etilaatroz.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=22,6"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
