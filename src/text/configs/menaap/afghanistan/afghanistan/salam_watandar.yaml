name: Salam Watandar
country: afghanistan
language: fa
base_url: https://swn.af

# Categories: Afghanistan(136), Governance(157), Politics(182), Eco-business(144)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://swn.af/wp-json/wp/v2/posts?per_page=100&page={page}&categories=136,157,182,144&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".elementor-widget-container p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
