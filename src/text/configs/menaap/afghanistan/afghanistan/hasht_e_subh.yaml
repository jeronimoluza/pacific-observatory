name: 8AM Media (Hasht-e Subh Daily)
country: afghanistan
language: en
base_url: https://8am.media/eng

# Categories: Afghanistan News(44), News(2), Daily Reports(61)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://8am.media/eng/wp-json/wp/v2/posts?per_page=100&page={page}&categories=44,2,61&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.content-inner p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
