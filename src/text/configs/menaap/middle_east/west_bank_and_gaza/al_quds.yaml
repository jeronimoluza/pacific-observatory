name: Al Quds
language: arabic
country: west_bank_and_gaza
base_url: https://www.alquds.com

listing:
  type: pagination
  url_template: "https://www.alquds.com/ar/categories/palestine?page={num}"
  start_page: 1
  step: 1
  batch_size: 5

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "a[href*='/posts/']"
    title: ["h3::text", "h4::text"]
    url: "a::attr(href)"
  article:
    body: "div.arabiana-repeatable p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
