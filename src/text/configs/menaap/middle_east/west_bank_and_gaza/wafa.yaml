name: WAFA
language: en
country: west_bank_and_gaza
base_url: https://english.wafa.ps

listing:
  type: pagination
  start_url: "https://english.wafa.ps/"
  url_template: "https://english.wafa.ps/?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h3 a::text"
    url: "a::attr(href)"
  article:
    body: "div.content p"
    date: "span.meta-item.date::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
