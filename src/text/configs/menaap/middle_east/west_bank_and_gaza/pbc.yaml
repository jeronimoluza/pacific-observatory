name: Palestine Broadcasting Corporation
language: arabic
country: west_bank_and_gaza
base_url: https://www.pbc.ps

# Pretty permalinks disabled — use legacy ?rest_route= form.
# Categories: الأخبار المحلية(6,local news), الأخبار السياسية(5,political news), الأخبار الاقتصادية(9,economy)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.pbc.ps/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=6,5,9&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: ".entry-content p, article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
