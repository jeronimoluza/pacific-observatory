name: Khaberni
language: arabic
country: jordan
base_url: https://www.khaberni.com

listing:
  type: pagination
  url_template: "https://www.khaberni.com/news/index/1?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.news-item"
    title: "h6 a::text"
    url: "h6 a::attr(href)"
  article:
    body: "div.news-single-info p"
    date: "li.news-date::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
