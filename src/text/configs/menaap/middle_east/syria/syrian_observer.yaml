name: The Syrian Observer
language: en
country: syria
base_url: https://syrianobserver.com

listing:
  type: pagination
  start_url: "https://syrianobserver.com/category/news"
  url_template: "https://syrianobserver.com/category/news/page/{num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: article
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: ["div.elementor-widget-theme-post-content p", "article p"]
    date: "time::attr(datetime)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
