name: Tehran Times
language: en
country: iran
base_url: https://www.tehrantimes.com

listing:
  type: paginated_archive
  date_format: daily
  start_url: "https://www.tehrantimes.com/page/archive.xhtml?date={year}-{month}-{day}"
  url_template: "https://www.tehrantimes.com/page/archive.xhtml?date={year}-{month}-{day}&pi={num}"
  start_date: "2022-01-01"
  start_page: 2
  batch_size: 5

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li.news, li.report, li.article, li.op-ed"
    title: ["h3 a::text", "h4 a::text"]
    url: ["h3 a::attr(href)", "h4 a::attr(href)"]
  article:
    body: "div.item-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
