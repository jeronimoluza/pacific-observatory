name: "Financial Tribune"
country: "iran"
base_url: "https://financialtribune.com"
language: "en"

listing:
  type: "pagination"
  url_template: "https://financialtribune.com/iran-national-news?page={num}"
  start_page: 0
  step: 1
  batch_size: 5

client: "http"
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li.views-row"
    title: ".views-field-title a::text"
    url: ".views-field-title a::attr(href)"
  article:
    body: "div.field-content p"
    date: "time::attr(datetime)"

cleaning:
  date: "handle_mixed_dates"

max_pages: null
max_articles: null
