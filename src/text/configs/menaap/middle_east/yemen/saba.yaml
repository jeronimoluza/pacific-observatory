name: SABA News Agency
language: en
country: yemen
base_url: https://www.saba.ye

listing:
  type: pagination
  start_url: "https://www.saba.ye/en/category14.htm"
  url_template: "https://www.saba.ye/en/category14.htm?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.LastNewsText"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.mainText p"
    date: "div.mainText::text"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
