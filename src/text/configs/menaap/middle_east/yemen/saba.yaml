name: SABA News Agency
language: arabic
country: yemen
base_url: https://www.saba.ye

listing:
  type: pagination
  start_url: "https://www.saba.ye/ar/category1.htm"
  url_template: "https://www.saba.ye/ar/category1.htm?page={num}&per-page=30"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "td[bgcolor='#F0F0F0']"
    title: "a[href*='news']::text"
    url: "a[href*='news']::attr(href)"
  article:
    body: "div[itemprop='articleBody']"
    date: "time[itemprop='datePublished']::attr(datetime)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
