name: Yemen Monitor
language: arabic
country: yemen
base_url: https://www.yemenmonitor.com

listing:
  type: pagination
  start_url: "https://www.yemenmonitor.com/local"
  url_template: "https://www.yemenmonitor.com/local/page/{num}/"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "ul.posts-items li"
    title: "h2.post-title a::text"
    url: "h2.post-title a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
