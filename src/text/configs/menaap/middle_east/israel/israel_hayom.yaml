name: Israel Hayom
language: en
country: israel
base_url: https://www.israelhayom.com

listing:
  type: pagination
  start_url: "https://www.israelhayom.com/category/news/israel/"
  url_template: "https://www.israelhayom.com/category/news/israel/page/{num}/"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.jeg_post"
    title: ".jeg_post_title a::text"
    url: ".jeg_post_title a::attr(href)"
  article:
    body: "div.content-inner p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
