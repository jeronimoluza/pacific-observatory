name: Walla News
language: he
country: israel
base_url: https://news.walla.co.il

listing:
  type: paginated_archive
  start_url: "https://news.walla.co.il/archive/1?year={year}&month={month}"
  url_template: "https://news.walla.co.il/archive/1?year={year}&month={month}&page={num}"
  start_date: "2020-01-01"
  date_format: monthly
  start_page: 2

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li:has(div.pub-date)"
    title: "h3::text"
    url: "a[href*='/item/']::attr(href)"
    date: "div.pub-date::text"
  article:
    body: "div.text-content p"
    date: "meta[property='og:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
