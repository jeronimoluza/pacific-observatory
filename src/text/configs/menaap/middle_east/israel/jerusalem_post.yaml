name: The Jerusalem Post
language: en
country: israel
base_url: https://www.jpost.com

listing:
  type: pagination
  start_url: "https://www.jpost.com/latest-articles"
  url_template: "https://www.jpost.com/latest-articles?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3 a.article-item-content-link::text"
    url: "h3 a.article-item-content-link::attr(href)"
  article:
    body: "section.article-default-section p"
    date: "time::attr(datetime)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
