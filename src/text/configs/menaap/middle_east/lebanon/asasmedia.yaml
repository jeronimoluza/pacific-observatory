name: Asas Media
language: arabic
country: lebanon
base_url: https://asasmedia.com

# Pretty permalinks disabled — use legacy ?rest_route= form.
# Categories: أخبار(3842,news), اقتصاد(3455,economy), تقرير(3456,report)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://asasmedia.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=3842,3455,3456&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: ".entry-content p, article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
