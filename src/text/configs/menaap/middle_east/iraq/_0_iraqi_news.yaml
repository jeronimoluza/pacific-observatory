# Unusable with current pipeline strategies.
# Reason: Cloudflare managed challenge (HTTP 403, cf-mitigated: challenge) blocks all
# requests including homepage — no HTML or API content is accessible without JS execution.
# WP API endpoint also returns 403 via Cloudflare.
name: Iraqi News
language: en
country: iraq
base_url: https://www.iraqinews.com
listing:
  type: pagination
  url_template: "https://www.iraqinews.com/page/{num}/"
  start_page: 1
  step: 1
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
