name: The National
language: en
country: papua_new_guinea
base_url: https://www.thenational.com.pg

# 2026-10-16 (panel 20261016T0917Z): 9449 queued, 460 HTTP 403 at concurrency 10; slower and capped
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.thenational.com.pg/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title"
  json_paths:
    url: link
    title: title.rendered
    date: date

client: http
concurrency: 2
rate_limit: 0.2
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.td-post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: 200
