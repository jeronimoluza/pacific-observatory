# DEFERRED: Samoa News (samoanews.com) — American Samoa's other national paper
# (listed in onlinenewspapers + abyznewslinks for american_samoa; already have
# talanei.com covered). Consistently returns HTTP 412/429 "Request Blocked" to
# both curl and Python httpx on every request (F5/Imperva-style bot mitigation) —
# no page content reachable at all, not just article pages.
# Tier 3 — heavy anti-bot, needs browser automation (Playwright) to even see the
# homepage. Re-check if `client: browser` support lands.
name: Samoa News
country: american_samoa
language: en
base_url: https://www.samoanews.com

listing:
  type: pagination
  url_template: "https://www.samoanews.com/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
