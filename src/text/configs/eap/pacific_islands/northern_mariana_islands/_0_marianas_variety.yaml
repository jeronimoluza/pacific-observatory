# DEFERRED: Marianas Variety (mvariety.com) — CNMI's other national paper
# (listed across onlinenewspapers/allyoucanread/abyznewslinks; already have
# saipan_tribune.yaml covered). BLOX/TownNews CMS.
# Blockers found during assess-newspaper-source pass:
#   - Category listing pages (e.g. /news/local/) load fine over plain httpx and
#     have clean h2/h3.tnt-headline article cards — good signal.
#   - BUT ?page=2 on the listing returns the identical 29 article IDs as page 1
#     (pagination param is ignored — same quirk as Eswatini's ?paged=N).
#   - Individual article pages (article_<uuid>.html) are gated by a TownNews
#     JS "Security Check" challenge (challenge.us-east-1.vip.tn-cloud.net) —
#     httpx gets a 1KB iframe redirect shell instead of article HTML, on every
#     article tried. This blocks the article-body fallback entirely.
# Tier 2/3 — needs browser automation to clear the article-page challenge;
# listing-only scraping isn't enough since body/date content lives behind it.
name: Marianas Variety
country: northern_mariana_islands
language: en
base_url: https://www.mvariety.com

listing:
  type: pagination
  url_template: "https://www.mvariety.com/news/local/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h2.tnt-headline, h3.tnt-headline"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
