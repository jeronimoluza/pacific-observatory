# Fiji Times Configuration
# Uses WordPress REST API (wp/v2) for article discovery and content extraction

name: "Fiji Times"
country: "fiji"
language: "en"
base_url: "https://www.fijitimes.com.fj"

# Listing discovery configuration using API strategy
listing:
  type: "api"
  url_template: "https://www.fijitimes.com.fj/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,title,content,link,categories"
  pagination_type: "page"
  page_start: 1
  page_step: 1
  json_paths:
    # No collection path needed - root is the array
    id: "id"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"
    url: "link"

# Client configuration
client: "http"
concurrency: 10
rate_limit: 0.2
retries: 3
retry_seconds: 2.0

# CSS selectors for data extraction (not used for API strategy - data comes from JSON)
selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
    date: "filler"
  article:
    body: "filler"
    tags: "filler"

# Data cleaning configuration
cleaning:
  date: "handle_mixed_dates"
  body: "clean_wp_html_body"

# Test/debug options
max_pages: null
max_articles: null

# Site-specific notes:
# - Uses WordPress REST API (wp/v2/posts) for listing discovery
# - Full article content is returned in the API response (content.rendered)
# - No per-article HTTP requests needed - articles are prefetched from API JSON
# - per_page=100 is the WordPress API maximum
# - _fields parameter limits response size to only needed fields
