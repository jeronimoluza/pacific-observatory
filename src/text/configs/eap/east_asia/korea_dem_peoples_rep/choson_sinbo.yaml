name: "Choson Sinbo"
country: "korea_dem_peoples_rep"
language: "ko"
base_url: "https://chosonsinbo.com"

# Listing discovery configuration
# WP REST API is fully operational.
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://chosonsinbo.com/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title"
  json_paths:
    url: link
    title: title.rendered
    date: date

# Client configuration
client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "main.l-common__main"
    date: "span.l-common__date::text"

cleaning:
  date: "handle_mixed_dates"

max_pages: null
max_articles: null
