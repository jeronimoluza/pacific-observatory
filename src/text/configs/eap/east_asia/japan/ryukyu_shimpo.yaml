# Ryukyu Shimpo (Japan) Configuration
# Major Okinawa-based daily newspaper — active WordPress REST API

name: "Ryukyu Shimpo"
country: "japan"
language: "ja"
base_url: "https://ryukyushimpo.jp/"

# Listing discovery configuration
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://ryukyushimpo.jp/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title,excerpt"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "excerpt.rendered"

# Client configuration
client: "http"
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

# Test/debug options
max_pages: null
max_articles: null

cleaning:
  date: "handle_mixed_dates"
  body: "clean_wp_html_body"
