name: RTHK News
country: hong_kong_sar_china
language: en
base_url: https://news.rthk.hk

# Hong Kong's public broadcaster. Tier 2 — deferred: no WP API; category
# listing pages (e.g. /rthk/en/latest-news/local.htm — Joomla/K2 CMS) contain
# only nav/social links in the static HTML, no per-article links — the actual
# list is injected client-side via JS/AJAX.
# Needs custom code: browser client or reverse-engineered K2 component
# JSON/AJAX endpoint.
listing:
  type: pagination
  url_template: "https://news.rthk.hk/rthk/en/latest-news/local.htm?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "STUB"
    title: "STUB"
    url: "STUB"
  article:
    body: "STUB"
    date: "STUB"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
