name: Headline Daily (頭條日報)
country: hong_kong_sar_china
language: chinese_traditional
base_url: https://www.stheadline.com

# Top GDELT-volume HK outlet (Sing Tao News Corp). Tier 2 — deferred: no WP
# API; category pages (e.g. /news/港聞) render an initial article batch server-
# side but further pages are loaded via a token-based AJAX call
# (infinteLoadMoreV2 / NextPage token in embedded JS), not a plain
# page={N} GET pattern.
# Needs custom code: reverse-engineer the infinteLoadMoreV2 AJAX endpoint/token
# flow, or use a browser client.
listing:
  type: pagination
  url_template: "https://www.stheadline.com/news/港聞?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "STUB"
    title: "STUB"
    url: "STUB"
  article:
    body: "STUB"
    date: "STUB"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
