name: Jornal Tribuna de Macau
country: macao_sar_china
language: portuguese
base_url: https://jtm.com.mo

# Categories: Local(2), Actual(4), Ultimas/Latest(12)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://jtm.com.mo/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2,4,12&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
