name: TDM (Teledifusão de Macau)
country: macao_sar_china
language: portuguese
base_url: https://tdm.com.mo

# Macau's public broadcaster (genuine national outlet). HTTPS times out
# intermittently over plain curl in this environment but plain HTTP succeeds.
# Tier 2 — deferred: Vue.js CSR shell (chunk-*.css/js from cdn2.tdm.com.mo,
# no server-rendered article links in the initial HTML). No WP API found.
# Needs custom code: browser client or reverse-engineered JSON endpoint behind
# the Vue app.
listing:
  type: pagination
  url_template: "https://tdm.com.mo/news?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "STUB"
    title: "STUB"
    url: "STUB"
  article:
    body: "STUB"
    date: "STUB"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
