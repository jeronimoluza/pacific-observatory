name: Kantarawaddy Times
country: myanmar
language: en
base_url: https://ktnews.org

# Categories: News(110), Feature(111)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://ktnews.org/wp-json/wp/v2/posts?per_page=100&page={page}&categories=110,111&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p, article p, .post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
