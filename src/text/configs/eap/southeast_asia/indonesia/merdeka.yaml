name: Merdeka.com
country: indonesia
language: id
base_url: "https://www.merdeka.com"

# National news feed (Merdeka's "News" section)
listing:
  type: pagination
  url_template: "https://www.merdeka.com/peristiwa?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".article__item"
    title: "a.article__title::text"
    url: "a.article__title::attr(href)"
  article:
    body: ".articles-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
