name: The Manila Times
country: philippines
language: en
base_url: "https://www.manilatimes.net"

# News > Nation listing. No real archive pagination -- ?page=N returns
# identical content. max_pages: null accepts front-page-only depth
# (~15 articles per scrape) going forward.
listing:
  type: pagination
  url_template: "https://www.manilatimes.net/news/national?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".item-row-2"
    title: ".article-title-h4 a::text"
    url: ".article-title-h4 a::attr(href)"
  article:
    body: ".article-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
