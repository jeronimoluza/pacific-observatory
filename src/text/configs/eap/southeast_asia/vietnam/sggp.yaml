name: Sài Gòn Giải Phóng
country: vietnam
language: vi
base_url: "https://www.sggp.org.vn"

# Chinh tri (politics) listing. NOTE: the /chinhtri/trang-{N}.html URL
# pattern looked like real pagination during discovery (distinct article IDs
# per page) but actually serves a stale, mis-categorized entertainment
# archive from 2023 -- confirmed by inspecting the scraped titles/dates, not
# just the URL structure. The plain /chinhtri/ front page is the real,
# correctly-categorized politics listing; it has no real archive depth
# (?page=N is ignored), so max_pages: null accepts front-page-only depth.
listing:
  type: pagination
  url_template: "https://www.sggp.org.vn/chinhtri/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".story"
    title: ".story__heading a::text"
    url: ".story__heading a::attr(href)"
  article:
    body: ".article__body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
