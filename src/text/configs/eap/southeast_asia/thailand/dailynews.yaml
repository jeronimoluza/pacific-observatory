name: Daily News (Thailand)
country: thailand
language: th
base_url: "https://www.dailynews.co.th"

# Custom post type "news" (rest_base=news, not the default /posts route).
# Categories: politics(50), economic(54) via the news_group taxonomy.
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.dailynews.co.th/wp-json/wp/v2/news?per_page=100&page={page}&news_group=50,54"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".elementor-widget-theme-post-content p"
    date: "meta[property='article:modified_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
