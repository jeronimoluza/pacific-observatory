name: Astro Awani
country: malaysia
language: ms
base_url: "https://www.astroawani.com"

# Berita Malaysia (national news) listing. No real archive pagination --
# ?page=N returns identical content. max_pages: null accepts front-page-only
# depth (~10-15 articles per scrape) going forward.
listing:
  type: pagination
  url_template: "https://www.astroawani.com/berita-malaysia?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".article-teaser-item"
    title: ".article-text a::text"
    url: ".article-text a::attr(href)"
  article:
    body: "article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
