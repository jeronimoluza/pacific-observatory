name: Sinar Harian
country: malaysia
language: ms
base_url: "https://www.sinarharian.com.my"

# Nasional (national news) listing. Note: this site has no real archive
# pagination -- ?page=N returns identical content (same pattern as Times of
# Eswatini). max_pages: null lets duplicate-content detection stop early;
# depth is limited to the current front page (~25 articles) but the scrape
# stays useful going forward.
listing:
  type: pagination
  url_template: "https://www.sinarharian.com.my/nasional?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.col-md-4"
    title: ".article-title a::text"
    url: ".article-title a::attr(href)"
  article:
    body: "article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
