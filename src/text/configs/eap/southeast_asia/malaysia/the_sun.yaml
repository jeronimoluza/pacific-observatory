name: The Sun Malaysia
country: malaysia
language: en
base_url: https://thesun.my

# Categories: Malaysia(166), News(149), Business(162), People & Issues(198)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://thesun.my/wp-json/wp/v2/posts?per_page=100&page={page}&categories=166,149,162,198&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".td-post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
