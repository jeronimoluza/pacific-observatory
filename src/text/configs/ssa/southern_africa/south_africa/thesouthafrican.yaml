name: The South African
country: south_africa
language: en
base_url: https://www.thesouthafrican.com

# Categories: News(48931), Celeb News(17352), Local Celebs(8143), Business &amp; Finance(5220)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.thesouthafrican.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=69,286828&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
