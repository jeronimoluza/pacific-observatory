name: Mail and Guardian
enabled: false
disabled_reason: "source-health 2026-10-17: not_found on https://mg.co.za/wp-json/wp/v2/posts?per_page=100&page=1&categories=3,12,23&_fields=id,date,link,title,excerpt,content (HTTP 404 after redirect to https://mg.co.za/wp-json/wp/v2/posts/?per_page=100&page=1&categories=3%2C12%2C23&_fields=id%2Cdate%2Clink%2Ctitle%2Cexcerpt%2Ccontent; ?rest_route= variant empty_listing); failing since 2026-10-16T22:55:34Z, probes 2026-10-16T22:55:34Z, 2026-10-16T23:35:29Z, 2026-10-17T05:05:17Z. Homepage still answers 200 (2026-10-17): the outlet lives, its listing is gone; re-onboard with a new listing URL."
country: south_africa
language: en
base_url: https://mg.co.za

# Categories: National(3), Business(12), Politics(23)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://mg.co.za/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,12,23&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
