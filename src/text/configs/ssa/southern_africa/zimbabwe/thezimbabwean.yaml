name: The Zimbabwean
country: zimbabwe
language: en
base_url: https://www.thezimbabwean.co

# Categories: News(52756), Zimbabwe News(31862), Politics(7227), Business(4896)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.thezimbabwean.co/wp-json/wp/v2/posts?per_page=100&page={page}&categories=5,7,32,2&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 8
rate_limit: 0.1
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
