name: Zimbabwe Situation
country: zimbabwe
language: en
base_url: https://www.zimbabwesituation.com

# Categories: the latest articles(95096), just the "headlines" by day(915), Business(222), News(96)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.zimbabwesituation.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,2,599,601&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 8
rate_limit: 0.1
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
