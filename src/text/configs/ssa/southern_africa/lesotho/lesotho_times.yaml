name: Lesotho Times
country: lesotho
language: en
base_url: https://lestimes.com

# Categories: News(3), Local News(15), Business(6) — national + economy
# Note: REST API uses ?rest_route= form (not /wp-json/) on this site
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://lestimes.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=3,15,6&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
