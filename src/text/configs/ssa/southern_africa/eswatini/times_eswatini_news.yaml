name: Times of Eswatini - News
country: eswatini
language: en
base_url: https://www.times.co.sz

# Times of Eswatini /news/ section. ?paged param is silently ignored —
# only ~25 articles per scrape (front page only). Pipeline will detect
# duplicate-page after step 2 and stop. Use as a recurring fresh-news source.
listing:
  type: pagination
  url_template: "https://www.times.co.sz/news/?paged={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.col-md-4"
    title: "a[href*='readmore.php']::text"
    url: "a[href*='readmore.php']::attr(href)"
  article:
    body: "div.col-md-9.TheArticle p"
    date: "small.Bywho::text"

cleaning:
  date: handle_mixed_dates
  url: clean_times_eswatini_url

max_pages: null
max_articles: null
