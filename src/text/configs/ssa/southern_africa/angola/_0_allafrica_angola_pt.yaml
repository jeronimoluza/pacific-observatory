# DISABLED: listing URL https://allafrica.com/portuguese/angola/ returns 404. AllAfrica's Portuguese-Angola section path is unknown / may not exist. 0 thumbnails discovered. Re-enable once the correct PT URL is found.
name: AllAfrica Angola PT
country: angola
language: portuguese
base_url: https://allafrica.com

# Pan-African PT aggregator covering Angola
listing:
  type: pagination
  url_template: "https://allafrica.com/portuguese/angola/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "ul.stories li"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: ".story-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
