# DISABLED: Cloudflare-protected on listing query (HTTP 403 "Just a moment"). Re-enable when browser client is wired up.
name: Africa Guinee
country: guinea
language: fr
base_url: https://www.africaguinee.com

# Categories: Politique(22775), Société(7782), Economie(1208), International(620)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.africaguinee.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=19424,19426,19427,19431&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
