name: Critique Echo Newspaper
country: sierra_leone
language: en
base_url: https://www.critiqueecho.com

# Categories: Latest Post(1650), Breaking News(258), Salone News(232), Africa(161)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.critiqueecho.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,5,16,3&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
