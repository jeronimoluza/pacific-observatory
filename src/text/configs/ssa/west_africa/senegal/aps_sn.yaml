name: Agence de Presse Senegalaise
country: senegal
language: fr
base_url: https://aps.sn

# Categories: Dialogue National(1840,n=40), Journée nationale de l’Arbre 2025(2519,n=30), Discours à la Nation 2025(2591,n=12)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://aps.sn/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1840,2519,2591&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
