name: SocialNetLink
country: senegal
language: fr
base_url: https://www.socialnetlink.org

# Categories: Economie- Finance(7663,n=409), IT Business(26,n=299), Ecofinance(7664,n=283), Economie Numerique(3072,n=235), Politics(16680,n=5)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.socialnetlink.org/wp-json/wp/v2/posts?per_page=100&page={page}&categories=7663,26,7664,3072,16680&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
