name: Journal du Senegal
country: senegal
language: fr
base_url: https://www.journaldusenegal.com

listing:
  type: pagination
  url_template: "https://www.journaldusenegal.com/category/economie/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".item-content"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
