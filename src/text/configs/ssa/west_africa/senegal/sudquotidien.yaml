name: Sud Quotidien
enabled: false
disabled_reason: "source-health 2026-10-17: dns_dead on https://www.sudquotidien.sn/wp-json/wp/v2/posts?per_page=100&page=1&categories=80,74&_fields=id,date,link,title,excerpt,content (no DNS record for www.sudquotidien.sn); failing since 2026-10-16T22:37:06Z, probes 2026-10-16T22:37:06Z, 2026-10-16T23:30:49Z, 2026-10-17T05:01:42Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
country: senegal
language: fr
base_url: https://www.sudquotidien.sn

# Categories: Economie(80,n=4507), Politique(74,n=7943)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.sudquotidien.sn/wp-json/wp/v2/posts?per_page=100&page={page}&categories=80,74&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
