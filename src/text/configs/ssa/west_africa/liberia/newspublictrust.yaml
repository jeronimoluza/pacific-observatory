name: News Public Trust
enabled: false
disabled_reason: "source-health 2026-10-17: hijacked on http://newspublictrust.com/wp-json/wp/v2/posts?per_page=100&page=1&categories=28,607,30&_fields=id,date,link,title,excerpt,content (redirects to a parked/suspended page https://newspublictrust.com/cgi-sys/suspendedpage.cgi?per_page=100&page=1&catego); failing since 2026-10-16T22:51:59Z, probes 2026-10-16T22:51:59Z, 2026-10-16T23:33:38Z, 2026-10-17T05:03:50Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
country: liberia
language: en
base_url: http://newspublictrust.com

# Categories: Liberian News(28,n=9841), Liberia Society(607,n=7271), African News(30,n=1032)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://newspublictrust.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=28,607,30&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
