name: Malijet
country: mali
language: fr
base_url: https://malijet.com

listing:
  type: pagination
  url_template: "https://malijet.com/actualite-politique-au-mali?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h2 a::text"
    url: "h2 a::attr(href)"
  article:
    body: "div.px-4.mt-4 p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
