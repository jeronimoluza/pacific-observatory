name: Journal du Mali
country: mali
language: fr
base_url: https://journaldumali.com

listing:
  type: pagination
  url_template: "https://journaldumali.com/category/politique/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.item-content"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "div.post-date span::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
