name: Mali Kahere
country: mali
language: fr
base_url: https://www.malikahere.com

# Categories: a-la-une(26)=2577, politique(27)=1388, economie(28)=380 — depth back to 2013-12
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.malikahere.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=26,27,28"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
