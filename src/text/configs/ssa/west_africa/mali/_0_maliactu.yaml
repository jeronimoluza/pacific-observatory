# DISABLED: Cloudflare-protected on listing query (HTTP 403 "Just a moment"). Re-enable when browser client is wired up.
name: Mali Actu
country: mali
language: fr
base_url: https://maliactu.net

# Categories: Société(66460), Politique(18739), Actualités(11836), Aujourd'hui(8317)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://maliactu.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=9,4,3,3320&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
