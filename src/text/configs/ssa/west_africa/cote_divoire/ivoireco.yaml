name: Ivoireco
enabled: false
disabled_reason: "source-health 2026-10-17: hijacked on https://cynomedia.com/wp-json/wp/v2/posts?per_page=100&page=1&_fields=id,date,link,title,excerpt,content (gambling terms in 62/89 posts); failing since 2026-10-16T22:51:46Z, probes 2026-10-16T22:51:46Z, 2026-10-16T23:33:34Z, 2026-10-17T05:03:44Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
country: cote_divoire
language: fr
base_url: https://cynomedia.com

# Categories: ALL (no filter)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://cynomedia.com/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
