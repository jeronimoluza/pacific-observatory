name: L'Intelligent d'Abidjan
country: cote_divoire
language: fr
base_url: https://www.lintelligentdabidjan.info

listing:
  type: pagination
  url_template: "https://www.lintelligentdabidjan.info/news/category/politique/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h3.entry-title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.td-post-content p"
    date: ".td-post-date time::attr(datetime)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
