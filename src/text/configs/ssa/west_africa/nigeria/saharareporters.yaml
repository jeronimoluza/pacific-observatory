name: Sahara Reporters
country: nigeria
language: en
base_url: https://saharareporters.com

listing:
  type: pagination
  url_template: "https://saharareporters.com/articles?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.node--type-article"
    title: "h2.title.is-3 a::text"
    url: "h2.title.is-3 a::attr(href)"
  article:
    body: "div.content.story p"
    date: ".group-left::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
