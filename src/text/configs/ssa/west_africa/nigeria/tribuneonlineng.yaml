name: Nigerian Tribune
country: nigeria
language: en
base_url: https://tribuneonlineng.com

# Categories: Business(633325,n=23186), Business Coach(633263,n=310), Financewise(277862,n=150)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://tribuneonlineng.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=633325,633263,277862&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
