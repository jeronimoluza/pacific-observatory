name: Pulse Ghana
country: ghana
language: en
base_url: https://www.pulse.com.gh

listing:
  type: pagination
  url_template: "https://www.pulse.com.gh/news?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div:has(> a.font-accent[href*='/story/'])"
    title: "a.font-accent[href*='/story/']::text"
    url: "a.font-accent[href*='/story/']::attr(href)"
  article:
    body: "div.max-w-155 p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
