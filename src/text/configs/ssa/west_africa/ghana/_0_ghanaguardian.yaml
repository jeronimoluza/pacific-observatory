# DISABLED: superseded by per-category split (ghanaguardian_news, _politics, _latest, _business). The 4-cat union query produced 1,400 rows on full --rebuild despite single-cat probes returning 200; per-cat splits are faster (~2-3x) and resilient.
name: Ghana Guardian
country: ghana
language: en
base_url: https://ghanaguardian.com

# Categories: news(130917), Politics(32121), Latest News(22227), Business(13100)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://ghanaguardian.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=38,18,22,20&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
