name: Le Pays
country: burkina_faso
language: fr
base_url: https://lepays.bf

listing:
  type: pagination
  url_template: "https://lepays.bf/category/a-la-une/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.mkd-post-item"
    title: "div.mkd-post-item h3.mkd-pt-two-title a::text"
    url: "div.mkd-post-item h3.mkd-pt-two-title a::attr(href)"
  article:
    body: "div.mkd-post-text p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
