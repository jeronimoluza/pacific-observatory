name: Journal du Faso
country: burkina_faso
language: fr
base_url: https://journaldufaso.com

listing:
  type: pagination
  url_template: "https://journaldufaso.com/category/politique/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.news div.item"
    title: "div.news div.item h3 a::text"
    url: "div.news div.item h3 a::attr(href)"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
