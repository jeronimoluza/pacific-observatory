name: Faso Actu
country: burkina_faso
language: fr
base_url: https://faso-actu.info

listing:
  type: pagination
  url_template: "https://faso-actu.info/category/actualites/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.post"
    title: "article.post h3 a::text"
    url: "article.post h3 a::attr(href)"
  article:
    body: ".entry-content p"
    date: ".entry-meta-date::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
