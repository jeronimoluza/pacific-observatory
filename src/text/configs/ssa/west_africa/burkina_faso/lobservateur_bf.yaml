name: L'Observateur Paalga
country: burkina_faso
language: fr
base_url: https://www.lobservateur.bf

listing:
  type: pagination
  url_template: "https://www.lobservateur.bf/index.php?option=com_k2&view=itemlist&layout=category&task=category&id=36&Itemid=148&limitstart={num}"
  start_page: 0
  step: 10

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.itemContainer"
    title: "div.itemContainer h1 a::text"
    url: "div.itemContainer h1 a::attr(href)"
  article:
    body: "div.itemFullText p"
    date: ".itemDate time::attr(datetime)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
