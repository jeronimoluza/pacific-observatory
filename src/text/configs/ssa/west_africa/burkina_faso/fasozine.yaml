name: Fasozine
country: burkina_faso
language: fr
base_url: https://fasozine.com

# Categories: 2,57,1
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://fasozine.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2,57,1"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
