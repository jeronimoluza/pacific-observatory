name: Agence d'Informations du Burkina
country: burkina_faso
language: fr
base_url: https://www.aib.media

# Categories: ECONOMIE(37,n=12326), Business, Marketing(795,n=13), Business, Customer Service(796,n=11), POLITIQUE(38,n=11959)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.aib.media/wp-json/wp/v2/posts?per_page=100&page={page}&categories=37,795,796,38&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
