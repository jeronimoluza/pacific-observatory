name: Le Calame
country: mauritania
language: fr
base_url: https://www.lecalame.info

listing:
  type: pagination
  url_template: "https://www.lecalame.info/?q=Actualit%C3%A9%20nationale&page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.node"
    title: "h2 a::text"
    url: "h2 a::attr(href)"
  article:
    body: ".field-name-body .field-item"
    date: ".date::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
