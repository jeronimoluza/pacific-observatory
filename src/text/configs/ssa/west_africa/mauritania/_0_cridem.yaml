# TIER 2 — needs custom code before enabling (remove the _0_ prefix once fixed).
# cridem.org is a custom PHP CMS (C_InfoCat.php?cat=N listings, C_Info.php?article=N articles).
# Blockers:
#   1. Article/category hrefs are RELATIVE with no leading slash ("C_Info.php?article=795133")
#      -> requires a relative-URL cleaner to join against base_url.
#   2. Numbered pagination not found: C_InfoCat.php?cat=6&page=2 returns byte-identical content
#      to page 1 (param ignored). Real pagination mechanism (POST / different param) unknown.
# Homepage renders server-side HTML (no Cloudflare/JS wall), so scraping is feasible once the
# URL cleaner + correct pagination param are implemented.
#
# Starting point (NON-FUNCTIONAL until pagination + url cleaner resolved):
