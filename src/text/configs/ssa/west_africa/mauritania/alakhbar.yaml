name: Al Akhbar
country: mauritania
language: arabic
base_url: https://www.alakhbar.info

listing:
  type: pagination
  url_template: "https://www.alakhbar.info/tag/akhbar/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.c-card"
    title: ".c-card__headline a::text"
    url: ".c-card__headline a::attr(href)"
  article:
    body: "article .c-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

# capped: Ghost /tag/akhbar/page/{num}/ archive is very deep (3500+ pages);
# an article fetch TCP-hung at page ~3525 (60s timeout not honored) and stalled the run.
# This session captured ~56k rows uncapped; 400 pages bounds future runs. Raise for more depth.
max_pages: 400
max_articles: null
