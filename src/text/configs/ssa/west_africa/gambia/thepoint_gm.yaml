name: The Point Gambia
country: gambia
language: en
base_url: https://thepoint.gm

listing:
  type: pagination
  url_template: "https://thepoint.gm/africa/gambia/national-news?start={num}"
  start_page: 0
  step: 18

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "h5.articles-listing-title"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: ".container .col-md-8 p"
    date: "meta[property='og:updated_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
