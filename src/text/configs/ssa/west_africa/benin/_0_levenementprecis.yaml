# DEFERRED (Tier-2): valid WP REST endpoint, but server "hcdn" CDN 403s HTTP/1.1 and only
# serves HTTP/2. The text-collect async fetcher uses HTTP/1.1 -> 0 URLs discovered.
# Re-activate (drop the _0_ prefix) once the collector negotiates HTTP/2. Verified 2026-07-22.
name: L'Evenement Precis
country: benin
language: fr
base_url: https://levenementprecis.bj

# Categories: ECONOMIE(35,n=184), Politique(3,n=1409)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://levenementprecis.bj/wp-json/wp/v2/posts?per_page=100&page={page}&categories=35,3&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
