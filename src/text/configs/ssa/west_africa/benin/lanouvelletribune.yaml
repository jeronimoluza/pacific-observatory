name: La Nouvelle Tribune Benin
country: benin
language: fr
base_url: https://lanouvelletribune.info

# Categories: politique(270)=48995, benin(2889)=11601, economie(281)=6870 — depth back to 2004-08
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://lanouvelletribune.info/wp-json/wp/v2/posts?per_page=100&page={page}&categories=270,2889,281"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
