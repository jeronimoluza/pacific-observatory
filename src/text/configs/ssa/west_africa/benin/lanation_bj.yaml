name: La Nation Benin
country: benin
language: fr
base_url: https://lanation.bj

# /actualites — Bootstrap numbered pagination (?page=N); page2 hrefs differ from page1.
listing:
  type: pagination
  url_template: "https://lanation.bj/actualites?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.col-lg-4.featured"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: ".news-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
