name: L'Union
country: gabon
language: fr
base_url: https://www.union.sonapresse.com

# Drupal politique section — ?page={num} numbered pagination (0-indexed:
# page 1 = ?page=0, page 2 = ?page=1, ...). Article URLs are root-relative.
listing:
  type: pagination
  url_template: "https://www.union.sonapresse.com/index.php/fr/politique?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.post-block p"
    date: "span.post-created::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
