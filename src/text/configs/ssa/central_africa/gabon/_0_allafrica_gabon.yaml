# DISABLED: listing URL https://allafrica.com/gabon/ returns 200 but has no `ul.stories` element (slim country-page variant, ~72k vs ~109k for working AllAfrica pages). 0 thumbnails discovered. Re-enable when an alternate listing URL or selector is found.
name: AllAfrica Gabon
country: gabon
language: en
base_url: https://allafrica.com

# Pan-African EN aggregator covering Gabon
listing:
  type: pagination
  url_template: "https://allafrica.com/gabon/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "ul.stories li"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: ".story-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
