name: Gabonews
country: gabon
language: fr
base_url: https://www.gabonews.com

# fr/actus/politique national politics section — SPIP offset pagination
# ?debut_article={num} in steps of 15 (page 1 = 0, page 2 = 15, ...).
listing:
  type: pagination
  url_template: "https://www.gabonews.com/fr/actus/politique/?debut_article={num}"
  start_page: 0
  step: 15

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.layout_3--item"
    title: "h4 a::text"
    url: "h4 a::attr(href)"
  article:
    body: "div.blog-excerpt p"
    date: "span.date::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
