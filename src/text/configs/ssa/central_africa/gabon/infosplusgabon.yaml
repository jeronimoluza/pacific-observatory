name: Infos Plus Gabon
country: gabon
language: fr
base_url: https://www.infosplusgabon.com

# a-la-une main news feed — Joomla offset pagination ?start={num} in steps of 5.
# Title is non-anchored (h1.title text); the clean article URL is the
# a.readmore ("Lire la suite") link, avoiding the print/pdf/mailto siblings.
listing:
  type: pagination
  url_template: "https://www.infosplusgabon.com/a-la-une?start={num}"
  start_page: 0
  step: 5

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.item"
    title: "h1.title::text"
    url: "a.readmore::attr(href)"
  article:
    body: "div.content_area p"
    date: "span.created::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
