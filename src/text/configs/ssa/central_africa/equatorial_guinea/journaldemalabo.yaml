name: Journal de Malabo
country: equatorial_guinea
language: fr
base_url: https://www.journaldemalabo.com

# Categories: Economie(19,n=117), Finance(15,n=25), Eco et Business(11,n=15), Entreprises(14,n=8), Politique(32,n=299)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.journaldemalabo.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=19,15,11,14,32&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
