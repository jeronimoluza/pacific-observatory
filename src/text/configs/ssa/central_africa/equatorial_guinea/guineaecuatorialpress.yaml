name: Guinea Ecuatorial Press
country: equatorial_guinea
language: es
base_url: https://www.guineaecuatorialpress.com

# Categorias/Noticias national news feed — ?page={num} numbered pagination.
listing:
  type: pagination
  url_template: "https://www.guineaecuatorialpress.com/categorias/Noticias?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.news_item"
    title: "h3.news_heading_big a::text"
    url: "h3.news_heading_big a::attr(href)"
  article:
    body: ".article_text p"
    date: "span.news_date::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
