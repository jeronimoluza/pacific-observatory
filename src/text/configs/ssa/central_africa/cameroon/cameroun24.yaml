name: Cameroun24
country: cameroon
language: fr
base_url: https://cameroun24.net

listing:
  type: pagination
  url_template: "https://cameroun24.net/societe.html?slug=societe&page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: ".article-content p"
    date: ".article-date::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
