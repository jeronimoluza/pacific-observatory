name: 237actu
country: cameroon
language: fr
base_url: https://237actu.com

# Categories: Politique(7), Economie(9), Societe(5), Actualites(4)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://237actu.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=7,9,5,4&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
