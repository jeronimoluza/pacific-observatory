name: La Prosperite Online
country: congo_dem_rep
language: fr
base_url: https://laprosperiteonline.net

# Categories: Nation(18), Politique(16), Economie(17), Societe(20), Communication(21)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://laprosperiteonline.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=18,16,17,20,21&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
