name: Radio Okapi
country: congo_dem_rep
language: fr
base_url: https://www.radiookapi.net

listing:
  type: rss
  feed_urls:
    - "https://www.radiookapi.net/feed/"

client: http
concurrency: 3
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "item"
    url: "link::text"
    title: "title::text"
    date: "pubDate::text"
  article:
    body: "div.field-name-body p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
