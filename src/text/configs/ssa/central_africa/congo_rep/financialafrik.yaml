name: Financial Afrik
country: congo_rep
language: fr
base_url: https://www.financialafrik.com

# Categories: Finance(3456,n=6856), Bourses et Marchés(2627,n=2954), Financial Afrik TV(17036,n=745), Finance climat(2530,n=653), Droit des affaires(14924,n=358)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.financialafrik.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3456,2627,17036,2530,14924&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
