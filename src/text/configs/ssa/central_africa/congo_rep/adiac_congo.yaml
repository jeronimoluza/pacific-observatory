name: Les Depeches de Brazzaville (ADIAC)
country: congo_rep
language: fr
base_url: https://www.adiac-congo.com

listing:
  type: pagination
  url_template: "https://www.adiac-congo.com/rubrique/economie?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.views-row"
    title: ".views-field-title a::text"
    url: ".views-field-title a::attr(href)"
  article:
    body: ".field-item p"
    date: "span.date-display-single::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
