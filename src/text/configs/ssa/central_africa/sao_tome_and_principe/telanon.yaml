name: Tela Non
country: sao_tome_and_principe
language: portuguese
base_url: https://www.telanon.info

listing:
  type: pagination
  url_template: "https://www.telanon.info/topico/politica/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li.infinite-post"
    title: "a::attr(title)"
    url: "a::attr(href)"
  article:
    body: "article"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
