name: Alwihda Info
country: chad
language: fr
base_url: https://www.alwihdainfo.com

listing:
  type: pagination
  url_template: "https://www.alwihdainfo.com/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3::text"
    url: "a::attr(href)"
  article:
    body: "article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

# capped: Ghost /page/{num}/ walk did not terminate (5000+ pages, 0 rows);
# 200 pages (~3-4k recent articles) is a solid backfill. Raise for deeper history.
max_pages: 200
max_articles: null
