name: Radio Ndeke Luka
country: central_african_republic
language: fr
base_url: https://www.radiondekeluka.org

# Categories: Politique(14), Economie(10), Societe(18), Securite(17), Education(11), Justice(13)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.radiondekeluka.org/wp-json/wp/v2/posts?per_page=100&page={page}&categories=14,10,18,17,11,13&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
