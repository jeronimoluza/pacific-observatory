name: Horseed Media
country: somalia
language: en
base_url: https://horseedmedia.net

# Categories: Somali-News(1), Dawladda-Federaalka(6), Puntland-News(4), Opinion(12), Features(13), World-News(3)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://horseedmedia.net/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=1,6,4,12,13,3"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
