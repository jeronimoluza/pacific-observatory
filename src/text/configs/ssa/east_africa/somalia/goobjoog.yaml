name: Goobjoog
country: somalia
language: en
base_url: https://goobjoog.com

# Categories: Dalka(3), Amniga(25), War(1), Baarlamaanka(26), Arrimaha-Dhaqaalaha(221), Arrimaha-Dastuurka(220)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://goobjoog.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=3,25,1,26,221,220"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
