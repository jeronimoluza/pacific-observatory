name: Bongo5
country: tanzania
language: swahili
base_url: https://bongo5.com

# Categories: Habari(8508), Siasa(8384), Fahamu(8525), Afya(8527), Tech(8183)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://bongo5.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=8508,8384,8525,8527,8183"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
