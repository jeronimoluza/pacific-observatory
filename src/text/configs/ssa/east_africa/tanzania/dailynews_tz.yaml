name: Daily News Tanzania
country: tanzania
language: en
base_url: https://dailynews.co.tz

# Categories: Tanzania(39), Business(17), Politics(32), Economy(61), Society-Culture(38), Election(65)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://dailynews.co.tz/wp-json/wp/v2/posts?per_page=100&page={page}&categories=39,17,32,61,38,65&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
