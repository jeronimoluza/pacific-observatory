name: Burundi Times
country: burundi
language: en
base_url: https://www.burunditimes.com

listing:
  type: rss
  feed_urls:
    - "https://www.burunditimes.com/feed/"
  page_param: paged
  body_in_feed: true

client: http
concurrency: 3
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "item"
    url: "link::text"
    title: "title::text"
    date: "pubDate::text"
  article:
    body:
      - "div.entry-content p"
      - "article p"
      - "main p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
