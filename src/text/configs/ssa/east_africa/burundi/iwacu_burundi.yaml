name: Iwacu Burundi
country: burundi
language: fr
base_url: https://www.iwacu-burundi.org

# Categories: Politique(119), Economie(56), Societe(121), Editorial(150), Securite(9490), Archives(1)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.iwacu-burundi.org/wp-json/wp/v2/posts?per_page=100&page={page}&categories=119,56,121,150,9490,1&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
