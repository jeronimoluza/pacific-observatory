# DEFERRED: The People (thepeopleonline.net) — one of Seychelles' historical
# "big three" dailies (listed as "People" in w3newspapers). Joomla site,
# actively updated (2026-dated homepage content, high article IDs).
# Blockers found during assess-newspaper-source pass:
#   - No date field found anywhere on article pages (no meta tag, no visible
#     "created"/"published" text) — cannot populate the required date column.
#   - Content sampled skews toward campaign material for a specific presidential
#     candidate ("Dr. Herminie our future President", rally announcements) —
#     The People has historically been affiliated with a political party; worth
#     a closer editorial read before treating it as neutral national news for
#     the EPU index.
# Tier 2 — needs a verified date source + an editorial-neutrality check before
# activating.
name: The People
country: seychelles
language: en
base_url: https://thepeopleonline.net

listing:
  type: pagination
  url_template: "https://thepeopleonline.net/index.php?start={num}"
  start_page: 0
  step: 20

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
