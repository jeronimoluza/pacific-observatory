name: 2424 Madagascar
country: madagascar
language: fr
base_url: https://2424.mg

# Categories: Actualite(4), Politique(8), Economie(7), Social(6), Opinions(34), Tribune-Libre(46)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://2424.mg/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=4,8,7,6,34,46"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
