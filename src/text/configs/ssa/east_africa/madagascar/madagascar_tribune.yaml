name: Madagascar Tribune
country: madagascar
language: fr
base_url: https://madagascar-tribune.com

listing:
  type: pagination
  url_template: "https://madagascar-tribune.com/spip.php?rubrique3&debut_articles={num}"
  start_page: 0
  step: 20

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3.titre_sommaire a::text"
    url: "h3.titre_sommaire a::attr(href)"
  article:
    body: ".texte"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
