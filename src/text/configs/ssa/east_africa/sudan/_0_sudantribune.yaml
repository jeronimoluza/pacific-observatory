# DISABLED: heavy article-fetch rate-limit (~41s/article, 0 successful in probe). Likely WAF/anti-bot on body endpoint. Re-enable with browser client.
name: Sudan Tribune
country: sudan
language: arabic
base_url: https://sudantribune.net

# Categories: News(52492), news(34408), Economics(1652), International(1391)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://sudantribune.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=81,13309,4,5&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
