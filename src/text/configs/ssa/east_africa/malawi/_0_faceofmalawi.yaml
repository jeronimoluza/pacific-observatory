# DISABLED (Connection reset by peer when fetched from Python httpx. CDN/anti-bot blocks our client. WP API works via curl manually.)
# To re-enable: rename without `_0_` prefix and resolve issue.
name: Face of Malawi
country: malawi
language: en
base_url: https://www.faceofmalawi.com

# Categories: Local-Malawi-News(44065), Business(2630), Education(29), Africa(2185), Demonstrations(6158)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.faceofmalawi.com/wp-json/wp/v2/posts?per_page=10&page={page}&categories=44065"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
