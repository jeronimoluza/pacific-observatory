name: Malawi24
country: malawi
language: en
base_url: https://malawi24.com

# Categories: National(8), Politics(4869), Business(4868), Opinion(4877), Education(10783)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://malawi24.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=8,4869,4868,4877,10783&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
