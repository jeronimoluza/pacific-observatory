name: The Nation Malawi
country: malawi
language: en
base_url: https://mwnation.com

# Categories: National-News(24), Business-News(28), Editors-Pick(58), Featured(26), Development(44)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://mwnation.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=24,28,58,26,44&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
