name: Verdade
country: mozambique
language: portuguese
base_url: https://verdade.co.mz

# Categories: Nacional(62), Economia(65), Democracia(140), Newsflash(12), Opiniao(28)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://verdade.co.mz/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=62,65,140,12,28"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
