name: Defi Media
country: mauritius
language: fr
base_url: https://defimedia.info

listing:
  type: pagination
  url_template: "https://defimedia.info/actualites?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "article"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
