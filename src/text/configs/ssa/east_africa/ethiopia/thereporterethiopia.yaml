name: The Reporter Ethiopia
country: ethiopia
language: en
base_url: https://www.thereporterethiopia.com

# Categories: Politics(13), Business(1935), News(1960), Society(1942), Commentary(1937), In-Depth(1957)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.thereporterethiopia.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=13,1935,1960,1942,1937,1957&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 8
retry_seconds: 5.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
