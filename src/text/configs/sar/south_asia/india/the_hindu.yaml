name: The Hindu
language: en
country: india
base_url: https://www.thehindu.com

listing:
  type: pagination
  start_url: "https://www.thehindu.com/news/national/"
  url_template: "https://www.thehindu.com/news/national/?page={num}"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.element"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.articlebodycontent p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
