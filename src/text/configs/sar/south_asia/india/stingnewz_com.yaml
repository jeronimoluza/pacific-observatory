name: www.stingnewz.com
enabled: false
disabled_reason: "source-health 2026-10-17: not_found on http://www.stingnewz.com/?rest_route=/wp/v2/posts&per_page=100&page=1&categories=4,3&_fields=id,date,link,title,excerpt,content (HTTP 404); failing since 2026-10-16T22:49:29Z, probes 2026-10-16T22:49:29Z, 2026-10-16T23:33:03Z, 2026-10-17T05:03:29Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
language: en
country: india
base_url: http://www.stingnewz.com

# Categories: national(3), states(52)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.stingnewz.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=4,3&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
