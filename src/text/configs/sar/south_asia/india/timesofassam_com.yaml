name: www.timesofassam.com
language: en
country: india
base_url: http://www.timesofassam.com

# Categories: headlines(1070), national(99), breaking-news(81), business(59), political(12)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.timesofassam.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,22,2111,30,35&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
