name: www.liveaapnews.com
language: en
country: india
base_url: http://www.liveaapnews.com

# Categories: %e0%a4%89%e0%a4%a4%e0%a5%8d%e0%a4%a4%e0%a4%b0-%e0%a4%ac%e0%a4%82%e0%a4%97%e0%a4%be%e0%a4%b2(1218), %e0%a4%aa%e0%a4%b6%e0%a5%8d%e0%a4%9a%e0%a4%bf%e0%a4%ae-%e0%a4%ac%e0%a4%82%e0%a4%97%e0%a4%be%e0%a4%b2(238), %e0%a4%ae%e0%a4%a7%e0%a5%8d%e0%a4%af-%e0%a4%ac%e0%a4%82%e0%a4%97%e0%a4%be%e0%a4%b2(237)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.liveaapnews.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=13,1,14&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
