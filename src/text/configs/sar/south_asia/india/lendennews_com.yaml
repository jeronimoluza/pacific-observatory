name: lendennews.com
language: en
country: india
base_url: https://lendennews.com

# Categories: %e0%a4%95%e0%a4%ae%e0%a5%8b%e0%a4%a1%e0%a4%bf%e0%a4%9f%e0%a5%80(10021), %e0%a4%95%e0%a5%8b%e0%a4%9f%e0%a4%be-%e0%a4%b8%e0%a4%bf%e0%a4%9f%e0%a5%80(6721), stock-market(5125), %e0%a4%b6%e0%a4%bf%e0%a4%95%e0%a5%8d%e0%a4%b7%e0%a4%be(3272), %e0%a4%aa%e0%a5%8d%e0%a4%b0%e0%a4%a6%e0%a5%87%e0%a4%b6(3209)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://lendennews.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=4765,33,1270,8,7689&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
