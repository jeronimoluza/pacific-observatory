name: Kashmir Reader
language: en
country: india
base_url: https://kashmirreader.com

# Categories: top-news(1, 44K), state(3, 16K), business(9, 9.9K), india(5, 8.9K)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://kashmirreader.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,3,9,5&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
