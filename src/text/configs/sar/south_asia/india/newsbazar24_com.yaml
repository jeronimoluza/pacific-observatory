name: www.newsbazar24.com
language: en
country: india
base_url: https://www.newsbazar24.com

# Categories: business(122), kolkata(1684), malda(1163), religion-news-in-bengali(690), %e0%a6%85%e0%a6%a4%e0%a6%bf%e0%a6%b0%e0%a6%bf%e0%a6%95%e0%a7%8d%e0%a6%a4-%e0%a6%aa%e0%a6%be%e0%a6%a4%e0%a6%be(640)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.newsbazar24.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=30,15,14,31,1&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
