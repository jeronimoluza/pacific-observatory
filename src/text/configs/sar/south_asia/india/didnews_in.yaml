name: didnews.in
language: en
country: india
base_url: http://didnews.in

# Categories: political(1031), delhi-ncr(809), national-news(422), uttarpradesh-news(376), exclusive(315)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://didnews.in/wp-json/wp/v2/posts?per_page=100&page={page}&categories=25,32,24,37,36&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
