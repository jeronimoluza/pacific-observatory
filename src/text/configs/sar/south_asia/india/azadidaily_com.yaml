name: www.azadidaily.com
language: en
country: india
base_url: http://www.azadidaily.com

# Categories: %e0%a4%a6%e0%a4%ae%e0%a4%a8-%e0%a4%a6%e0%a4%be%e0%a4%a8%e0%a4%b9-%e0%a4%a6%e0%a5%80%e0%a4%b5-%e0%a4%95%e0%a5%80-%e0%a4%96%e0%a4%ac%e0%a4%b0%e0%a5%87%e0%a4%82(225)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.azadidaily.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=74&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
