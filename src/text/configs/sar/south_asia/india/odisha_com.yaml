name: www.odisha.com
language: en
country: india
base_url: http://www.odisha.com

# Categories: main-news(2301), politics(241), %e0%ac%93%e0%ac%a1%e0%ac%bf%e0%ac%b6%e0%ac%be-%e0%ac%96%e0%ac%ac%e0%ac%b0(750), economy-and-business(102), education(68)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.odisha.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=33,35,42,32,36&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
