name: organiser.org
language: en
country: india
base_url: https://organiser.org

# Categories: politics(5110), news(797), india(642), economy(563), business(272)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://organiser.org/wp-json/wp/v2/posts?per_page=100&page={page}&categories=36190,8495,8504,36198,10&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
