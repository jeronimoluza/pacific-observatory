name: The Indian Express
language: en
country: india
base_url: https://indianexpress.com

listing:
  type: pagination
  start_url: "https://indianexpress.com/section/india/"
  url_template: "https://indianexpress.com/section/india/page/{num}/"
  start_page: 2
  step: 1

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.articles"
    title: "h2.title a::text"
    url: "h2.title a::attr(href)"
  article:
    body: "div.full-details p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates

max_pages: null
max_articles: null
