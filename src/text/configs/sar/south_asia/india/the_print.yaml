name: ThePrint
language: en
country: india
base_url: https://theprint.in

# Categories: india(294329, 514K), economy(1104, 52K), governance(1102, 7.5K), judiciary(256770, 5.7K)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://theprint.in/wp-json/wp/v2/posts?per_page=100&page={page}&categories=294329,1104,1102,256770&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
