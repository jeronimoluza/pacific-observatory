name: www.news39.net
language: en
country: bangladesh
base_url: http://www.news39.net

# Categories: national(392), local(5030), %e0%a6%a6%e0%a7%8b%e0%a6%b9%e0%a6%be%e0%a6%b0(2828), %e0%a6%a8%e0%a6%ac%e0%a6%be%e0%a6%ac%e0%a6%97%e0%a6%9e%e0%a7%8d%e0%a6%9c(1943), featured(777)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.news39.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,7,38,37,106&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
