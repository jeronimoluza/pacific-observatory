name: www.dainikpurbokone.net
language: en
country: bangladesh
base_url: http://www.dainikpurbokone.net

# Categories: national(10413), zila-upazila-gram(10826), chattogram(7783), international(2815), education(492)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.dainikpurbokone.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,15412,2,4,8&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
