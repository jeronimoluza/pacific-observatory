name: Anb24
enabled: false
disabled_reason: "source-health 2026-10-17: hijacked on http://www.anb24.net/wp-json/wp/v2/posts?per_page=100&categories=1004,1005,1003,1012&page=1&_fields=id,date,link,title,excerpt,content (redirects to a parked/suspended page http://www.anb24.net/cgi-sys/suspendedpage.cgi?per_page=100&categories=1004,1005); failing since 2026-10-16T22:55:17Z, probes 2026-10-16T22:55:17Z, 2026-10-16T23:33:01Z, 2026-10-17T05:03:33Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
language: en
country: bangladesh
base_url: http://www.anb24.net

# Categories: lead-2(1004, 1195), lead-3(1005, 961), lead-1(1003, 750), lead4(1012, 173)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.anb24.net/wp-json/wp/v2/posts?per_page=100&categories=1004,1005,1003,1012&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
