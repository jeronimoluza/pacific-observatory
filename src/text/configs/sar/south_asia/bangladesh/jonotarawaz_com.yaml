name: Jonotarawaz
language: en
country: bangladesh
base_url: https://jonotarawaz.com

# Categories: lead-news(4, 155), sub-lead-news(5, 130), national(7, 11403), sylhet-news(9, 2854), politics(6, 24709)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://jonotarawaz.com/wp-json/wp/v2/posts?per_page=100&categories=4,5,7,9,6&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
