name: Hawker
language: en
country: bangladesh
base_url: http://www.hawker.com.bd

# Categories: breaking-news(2, 7551), %e0%a6%95%e0%a6%b0%e0%a7%8d%e0%a6%aa%e0%a7%8b%e0%a6%b0%e0%a7%87%e0%a6%9f-%e0%a6%b8%e0%a6%82%e0%a6%ac%e0%a6%be%e0%a6%a6-corporate-news(40, 6614), economy(7, 592), business(6, 96), share-market(51, 639)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.hawker.com.bd/wp-json/wp/v2/posts?per_page=100&categories=2,40,7,6,51&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
