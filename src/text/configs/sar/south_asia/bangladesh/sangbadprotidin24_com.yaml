name: Sangbadprotidin24
language: en
country: bangladesh
base_url: https://sangbadprotidin24.com

# Categories: uncategorized(1, 59487), %e0%a6%b8%e0%a6%be%e0%a6%b0%e0%a6%be%e0%a6%a6%e0%a7%87%e0%a6%b6(5, 22097), %e0%a6%9c%e0%a6%be%e0%a6%a4%e0%a7%80%e0%a7%9f(3, 18968)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://sangbadprotidin24.com/?rest_route=/wp/v2/posts&per_page=100&categories=1,5,3&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
