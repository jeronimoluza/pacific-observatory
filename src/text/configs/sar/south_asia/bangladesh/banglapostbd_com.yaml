listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.banglapostbd.com/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=61,59,52,126,51&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
