listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.crimebarta.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,37,45,46,54&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

