name: shamolbangla24.com
language: en
country: bangladesh
base_url: http://shamolbangla24.com

# Categories: breaking-news(17165), news-update(11), %e0%a6%b6%e0%a7%87%e0%a6%b0%e0%a6%aa%e0%a7%81%e0%a6%b0(18318), %e0%a6%9c%e0%a6%be%e0%a6%a4%e0%a7%80%e0%a7%9f(13231), %e0%a6%a2%e0%a6%be%e0%a6%95%e0%a6%be(12049)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://shamolbangla24.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=111,17,63,16,81&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
