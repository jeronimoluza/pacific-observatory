name: www.timewatch.com.bd
language: en
country: bangladesh
base_url: http://www.timewatch.com.bd

# Categories: national(345), finance(211), all-country(308), politices(160), %e0%a6%ac%e0%a7%8d%e0%a6%af%e0%a6%be%e0%a6%82%e0%a6%95-%e0%a6%ac%e0%a7%80%e0%a6%ae%e0%a6%be(145)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.timewatch.com.bd/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=10,3,4,8,66&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
