name: zoombangla.com
language: en
country: bangladesh
base_url: https://zoombangla.com

# Categories: state(12), %e0%a7%a8%e0%a7%a6%e0%a7%a8%e0%a7%a9(525), 4873(277), %e0%a6%b0(88)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://zoombangla.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=12741,37148,4873,6887&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
