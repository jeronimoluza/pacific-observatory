listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.bograsangbad.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=4,12,13,1,19&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
