name: Bangladesh Post
language: en
country: bangladesh
base_url: https://bangladeshpost.net

# HTML pagination. Categories: national, business, economy.
# Container is each <a> anchor that directly wraps the article headline.
# Article URLs are relative /posts/<slug>-<id> — pipeline resolves via base_url.
listing:
  type: pagination
  url_template: "https://bangladeshpost.net/categories/national?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "a:has(.homepage-post-title)"
    title: ".homepage-post-title::text"
    url: "::attr(href)"
  article:
    body: "div.post-details-content p"
    date: "div.mb-10::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
