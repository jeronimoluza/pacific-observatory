name: www.brahmanbaria24.com
language: en
country: bangladesh
base_url: http://www.brahmanbaria24.com

# Categories: 2011-12-05-15-11-25(8864), 2012-02-04-09-45-47(3110), 2011-12-05-15-11-54(2702), 2011-12-06-07-55-08(2255), 2011-12-05-15-14-53(2150)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.brahmanbaria24.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=50,91,51,69,56&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
