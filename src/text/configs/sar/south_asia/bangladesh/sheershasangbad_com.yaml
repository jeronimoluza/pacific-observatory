name: www.sheershasangbad.com
language: en
country: bangladesh
base_url: http://www.sheershasangbad.com

# Categories: politics(625), %e0%a6%b9%e0%a6%be%e0%a6%87-%e0%a6%b2%e0%a6%be%e0%a6%87%e0%a6%9f%e0%a6%b8(4926), country(3466), %e0%a6%b9%e0%a6%9f-%e0%a6%86%e0%a6%aa-%e0%a6%a8%e0%a6%bf%e0%a6%89%e0%a6%9c(2691), national-news(1644)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.sheershasangbad.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,106,14,107,2&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
