name: www.meelparvai.net
enabled: false
disabled_reason: "source-health 2026-10-17: dns_dead on http://www.meelparvai.net/?rest_route=/wp/v2/posts&per_page=100&page=1&categories=302,301,306,310,305&_fields=id,date,link,title,excerpt,content (no DNS record for www.meelparvai.net); failing since 2026-10-16T22:35:54Z, probes 2026-10-16T22:35:54Z, 2026-10-16T23:30:40Z, 2026-10-17T05:01:27Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
language: en
country: sri_lanka
base_url: http://www.meelparvai.net

# Categories: kajian(1601), ibadah(612), muslimah-talk(578), khazanah(332), keluarga(249)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.meelparvai.net/?rest_route=/wp/v2/posts&per_page=100&page={page}&categories=302,301,306,310,305&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
