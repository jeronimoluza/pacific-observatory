name: The Island
language: en
country: sri_lanka
base_url: https://island.lk

# Categories: news(1), business(2), opinion(7), politics(5), foreign-news(4131)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://island.lk/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,2,7,5&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "article p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
