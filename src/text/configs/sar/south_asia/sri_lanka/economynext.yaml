name: EconomyNext
language: en
country: sri_lanka
base_url: https://economynext.com

# Categories: economy(12, 8.5K), markets(4, 7K), politics(84, 6.1K), business(2689, 3.4K), fiscal(13, 2.7K), political-news(2733, 2.3K)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://economynext.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=12,4,84,2689,13,2733&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
