name: Lankanewsweb
language: en
country: sri_lanka
base_url: https://lankanewsweb.net

# Categories: political-news(247, 295), news(17, 19269), special-news(140, 50), business(18, 4769)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://lankanewsweb.net/wp-json/wp/v2/posts?per_page=100&categories=247,17,140,18&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
