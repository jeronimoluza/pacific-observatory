name: Nepal Press
language: en
country: nepal
base_url: https://english.nepalpress.com

# Categories: news(1, 5.3K), political(3, 3.5K), main-news(13, 1.4K), business(8, 476)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://english.nepalpress.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1,3,13,8&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
