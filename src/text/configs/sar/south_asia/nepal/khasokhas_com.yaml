name: www.khasokhas.com
language: en
country: nepal
base_url: https://www.khasokhas.com

# Categories: news(268), latestnews(26462), whatsnew(25189), nepal(14978), %e0%a4%ae%e0%a5%81%e0%a4%96%e0%a5%8d%e0%a4%af-%e0%a4%96%e0%a4%ac%e0%a4%b0(14937)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.khasokhas.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=8,25,2,135,26&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
