name: Deshsanchar
language: en
country: nepal
base_url: https://deshsanchar.com

# Categories: main-news(13, 70841), news(1, 18729), business(36, 9718), politics(67, 63030)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://deshsanchar.com/wp-json/wp/v2/posts?per_page=100&categories=13,1,36,67&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
