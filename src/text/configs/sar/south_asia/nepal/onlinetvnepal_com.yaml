name: onlinetvnepal.com
language: en
country: nepal
base_url: https://onlinetvnepal.com

# Categories: news(564), %e0%a4%b8%e0%a4%ae%e0%a4%be%e0%a4%9a%e0%a4%be%e0%a4%b0(13111), %e0%a4%b8%e0%a4%ae%e0%a4%be%e0%a4%9c(5432), %e0%a4%b0%e0%a4%be%e0%a4%9c%e0%a4%a8%e0%a5%80%e0%a4%a4%e0%a4%bf(2301), %e0%a4%ae%e0%a4%a8%e0%a5%8b%e0%a4%b0%e0%a4%9e%e0%a5%8d%e0%a4%9c%e0%a4%a8(2177)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://onlinetvnepal.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2,8,6,15,11&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
