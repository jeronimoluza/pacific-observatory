name: www.hellokhabar.com
language: en
country: nepal
base_url: http://www.hellokhabar.com

# Categories: main-news(5481), national-news(12296), political-and-current-affair-news(1166), %e0%a4%86%e0%a4%b0%e0%a5%8d%e0%a4%a5%e0%a4%bf%e0%a4%95(990), hot-issue-special-news(666)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.hellokhabar.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2,74,6,14,10&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
