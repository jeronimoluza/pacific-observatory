name: www.kantipath.com
language: en
country: nepal
base_url: http://www.kantipath.com

# Categories: politics(5610), economy(1642), society(4819), crime(3064), administration(2576)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.kantipath.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=2,74,78,91,106&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
