name: merokhel.com
language: en
country: nepal
base_url: https://merokhel.com

# Categories: %e0%a4%ab%e0%a5%81%e0%a4%9f%e0%a4%ac%e0%a4%b2(12280), %e0%a4%95%e0%a5%8d%e0%a4%b0%e0%a4%bf%e0%a4%95%e0%a5%87%e0%a4%9f(8306), %e0%a4%b8%e0%a4%82%e0%a4%98-%e0%a4%b8%e0%a4%82%e0%a4%b8%e0%a5%8d%e0%a4%a5%e0%a4%be(2472), %e0%a4%85%e0%a4%a8%e0%a5%8d%e0%a4%af(1588), %e0%a4%ad%e0%a4%b2%e0%a4%bf%e0%a4%ac%e0%a4%b2(1208)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://merokhel.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=5,4,50,16,7&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
