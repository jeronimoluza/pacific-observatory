name: InfoMarket
language: ro
country: moldova
base_url: https://infomarket.md

# Some articles are subscriber-only: they render only div.article-layout
# (lead teaser + paywall CTA), no nested div.article-body. Fallback picks up
# the teaser paragraphs on those instead of failing empty-body.
listing:
  type: pagination
  url_template: "https://infomarket.md/ro/category/economy?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.news-list-row"
    title: "h2.news-list-row__title a::text"
    url: "h2.news-list-row__title a::attr(href)"
  article:
    body:
      - "div.article-body p"
      - "div.article-layout p"
    date: "div.article-meta span:nth-of-type(2)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
