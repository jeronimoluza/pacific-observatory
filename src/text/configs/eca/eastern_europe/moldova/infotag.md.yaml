name: Infotag
language: ru
country: moldova
base_url: https://infotag.md

listing:
  type: pagination
  url_template: "https://infotag.md/m9_economics/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.hentry"
    title: "h3.sec-title a::text"
    url: "h3.sec-title a::attr(href)"
  article:
    body: "div.news-text p"
    date: "small.date::attr(title)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
