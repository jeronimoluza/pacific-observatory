name: Actualitati.md
language: ru
country: moldova
base_url: https://actualitati.md

# WP REST API is present but blocked (?categories=&_fields= -> 403
# nfw_rest_api_access_restricted); use the tagDiv theme's HTML pagination
# instead. Site publishes in Russian despite the .md domain.
listing:
  type: pagination
  url_template: "https://actualitati.md/category/economie/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".td_module_wrap"
    title: "h3.entry-title a::text"
    url: "h3.entry-title a::attr(href)"
  article:
    body: "div.td-post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
