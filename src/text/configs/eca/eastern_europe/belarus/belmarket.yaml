name: Belarusy i Rynok (Belmarket)
language: ru
country: belarus
base_url: https://belmarket.by

listing:
  type: pagination
  url_template: "https://belmarket.by/news?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.news-ul__item"
    title: "a.news-ul-item__title::text"
    url: "a.news-ul-item__title::attr(href)"
  article:
    body: "div.text-wrapper p"
    date: "data.anons-big__data::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
