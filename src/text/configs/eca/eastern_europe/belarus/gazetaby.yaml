name: Salidarnasts (Gazeta.by)
language: ru
country: belarus
base_url: https://gazetaby.com

listing:
  type: pagination
  url_template: "https://gazetaby.com/category/novosti/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.item"
    title: "a.title::text"
    url: "a.title::attr(href)"
  article:
    body: "div.subcontainer-custom p"
    date: "time.date::attr(datetime)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
