name: Infoabad
language: ru
country: turkmenistan
base_url: https://infoabad.com

# Custom CMS (not WordPress). /tmnews is the Turkmenistan-specific news
# section (deep archive, pagination visible up to page 355); /news is
# generic world news and was skipped as off-topic. Container is
# div.tmnews_list_item, ~20 per page. Article page has a real <time
# datetime="..."> ISO tag (no article:published_time meta) and body text
# lives in div.value > p.
listing:
  type: pagination
  url_template: "https://infoabad.com/tmnews?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.tmnews_list_item"
    title: "h3.h4 a::text"
    url: "h3.h4 a::attr(href)"
  article:
    body: "div.value p"
    date: "time::attr(datetime)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
