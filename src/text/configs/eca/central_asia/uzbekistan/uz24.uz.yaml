name: UZ24
language: uz
country: uzbekistan
base_url: https://uz24.uz

# Custom CMS (not WordPress). Politics category (Siyosat) has real numbered
# pagination /uz/categories/politics?page={num} (11+ pages deep). Two card
# layouts appear on the same page: 4 "tile" cards (article.article-category,
# title in h2 a) and ~10 "row" cards (article.article-row, title in
# h3.article__title a) -- both are genuine category-list items, so both
# container classes are matched. A third layout (article.article-column
# inside an <aside> sidebar) is a generic "trending" widget with mixed
# topics, not category-specific, and is deliberately excluded. Article body
# lives in article.content p; date is the FIRST time.article__time tag
# (subsequent time tags on the page belong to related-article sidebar
# cards).
listing:
  type: pagination
  url_template: "https://uz24.uz/uz/categories/politics?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.article-category, article.article-row"
    title:
      - "h2 a::text"
      - "h3 a::text"
    url:
      - "h2 a::attr(href)"
      - "h3 a::attr(href)"
  article:
    body: "article.content p"
    date: "time.article__time::attr(datetime)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
