name: TopTJ Economy
language: ru
country: tajikistan
base_url: https://toptj.com

# Same outlet/CMS as toptj_politics.yaml, Economy category (/news/ekonomika).
# See toptj_politics.yaml for selector/date-parsing notes.
listing:
  type: pagination
  url_template: "https://toptj.com/news/ekonomika?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.news-card"
    title: "h3.news-card__title a::text"
    url: "h3.news-card__title a::attr(href)"
  article:
    body: "div.article__body p"
    date: "div.article__meta::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
