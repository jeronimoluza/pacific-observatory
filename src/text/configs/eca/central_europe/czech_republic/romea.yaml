name: Romea
country: czech_republic
language: cs
base_url: https://www.romea.cz

# Categories: Domácí(776), Komentáře(780)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.romea.cz/wp-json/wp/v2/posts?per_page=100&page={page}&categories=776,780&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title
    date: date
    body: content

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "article p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
