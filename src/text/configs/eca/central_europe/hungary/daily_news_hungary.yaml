name: Daily News Hungary
country: hungary
language: en
base_url: https://dailynewshungary.com

# Categories: Economy(649), Foreign affairs(701), Energy(658), EU relations(1118)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://dailynewshungary.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=649,701,658,1118&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: ".entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
