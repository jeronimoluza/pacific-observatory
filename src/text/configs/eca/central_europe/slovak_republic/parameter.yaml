name: Parameter
country: slovak_republic
language: hu
base_url: https://parameter.sk

# Categories: Belföld(29), Vélemény(519)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://parameter.sk/wp-json/wp/v2/posts?per_page=100&page={page}&categories=29,519&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title
    date: date
    body: content

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "main p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
