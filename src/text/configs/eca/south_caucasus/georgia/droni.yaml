name: Droni.ge
country: georgia
language: ka
base_url: https://droni.ge

# Category: akhali-ambebi (general/national news)
listing:
  type: pagination
  url_template: "https://droni.ge/ka/category/akhali-ambebi?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.post-item"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.blog-details p"
    date: "meta[name='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
