# Unusable with current pipeline strategies (deferred, needs custom code).
# Reason: Geotimes.ge runs a legacy custom PHP CMS (index.php?m=5&cat_id=N),
#   not WordPress (/wp-json/ 404s cleanly). Category listing DOES paginate
#   (?m=5&cat_id=31&page=N returns different content, cat_id=31 = "View
#   all"/general news, 10 items/page in div.col-lg-12.mb-4). BUT article
#   pages have no isolable date or body element: there is no meta date tag,
#   and title+date+body text are all concatenated inside a single
#   div.news_inner_img blob (date appears mid-text as "06.07.2026 21:12").
#   Would need custom extraction (regex over the blob, or locating the
#   real template block) before this is scrapeable without hacks.
name: Geotimes.ge
language: ka
country: georgia
base_url: https://geotimes.ge

listing:
  type: pagination
  url_template: "https://geotimes.ge/index.php?m=5&cat_id=31&page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.col-lg-12.mb-4"
    title: "a::text"
    url: "a::attr(href)"
  article:
    body: "div.news_inner_img"
    date: "div.news_inner_img::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
