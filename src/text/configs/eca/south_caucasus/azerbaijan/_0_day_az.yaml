# Unusable with current pipeline strategies (Tier 2 — needs custom code).
# Reason: no WordPress REST API. news.day.az/politics/ (and other AZ-domestic
#   sections: economy, society) is a "category-page" div with `data-id="1"` —
#   client-side/AJAX driven listing. A plain `?page=2` request returns
#   byte-identical content to page 1 (151/151 links overlap) — pagination is
#   silently ignored, not a working param.
# Otherwise promising: portal has clean per-country sections (armenia/georgia/
#   russia/turkey/iran vs. AZ-domestic economy/politics/society), so an
#   AJAX-aware fetcher could isolate Azerbaijan-only content cleanly.

name: Day.Az
country: azerbaijan
language: ru
base_url: https://news.day.az

listing:
  type: pagination
  url_template: "https://news.day.az/politics/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
