name: Milli.Az
country: azerbaijan
language: az

# NOTE: base_url + news portal is served from the news.milli.az subdomain;
# top-level milli.az wp-json probe returned 404 (no WP API).
base_url: https://news.milli.az

# Portal has per-neighbor-country sections (armenia/georgia/russia/turkey/iran) —
# avoided. "politics" is Azerbaijan-domestic. Thumbnail listing has no reliable
# year in its date snippet ("29 İyul 20:56"), so no thumbnail.date selector is
# set — the article-page Yoast meta tag (has full year) is used instead.
listing:
  type: pagination
  url_template: "https://news.milli.az/politics/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li"
    title: "strong.title a::text"
    url: "strong.title a::attr(href)"
  article:
    body: "div.article_text p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
