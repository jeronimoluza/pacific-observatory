name: Vesti.az
country: azerbaijan
language: ru
base_url: https://vesti.az

# Custom CMS, no WP API. "novosti" section is world/international-heavy
# (Trump/Ukraine/Iran); "politika" is Azerbaijan-domestic politics — used here.
listing:
  type: pagination
  url_template: "https://vesti.az/politika?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.item"
    title: "div.content a.text::text"
    url: "div.content a.text::attr(href)"
  article:
    body: "div.texts.mt-site p"
    date: "div.date_news .date div:first-child span"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
