# Unusable with current pipeline strategies (Tier 2 — needs custom code).
# Reason: no WordPress REST API. `?page=N` pagination on category pages DOES
#   work (confirmed: cemiyyet page1 vs page2 only 3/33 overlap), and container
#   `a.stat_item_link` is real, BUT it matches BOTH the category's own articles
#   AND an interleaved cross-category "you may also like" stream on the same
#   page (verified: 17/33 matches were /az/cemiyyet/..., the other 16 were
#   /az/dunya/, /az/ekskluziv/, /az/foto/, /az/video/, /az/elmvetehsil/ — mixed
#   world/lifestyle/exclusive content). Tried excluding ancestor
#   `.wrap_top3`/`.wrap_popular` wrappers — still contaminated, the mixed cards
#   live inside the same `div.section_wrap.wrap_stat` as the real category
#   items. Needs either a stricter DOM heuristic (e.g. filter thumbnail URLs to
#   the target category slug) or per-item post-filtering, not a clean selector.

name: Moderator.az
country: azerbaijan
language: az
base_url: https://moderator.az

listing:
  type: pagination
  url_template: "https://moderator.az/az/category/cemiyyet/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.font_scale.clearfix p"
    date: "filler"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
