name: Zerkalo.az
country: azerbaijan
language: ru
base_url: https://zerkalo.az

# WordPress theme site, no working REST API. Categories: economics(economy),
# politics(politics) — excludes sport/culture/formula-1/video/feuilleton.
listing:
  type: pagination
  url_template: "https://zerkalo.az/category/economics/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.newsrightblock"
    title: "h3.newright_header a::text"
    url: "h3.newright_header a::attr(href)"
  article:
    body: "div.entry-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
