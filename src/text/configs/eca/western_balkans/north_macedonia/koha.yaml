name: Koha (North Macedonia)
country: north_macedonia

# Albanian-minority outlet; content verified Albanian-language (per-source
# override; most North Macedonia sources use mk).
language: sq
base_url: https://koha.mk

# Categories: Aktuale(60)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://koha.mk/wp-json/wp/v2/posts?per_page=100&page={page}&categories=60&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.tdb-block-inner.td-fix-index p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
