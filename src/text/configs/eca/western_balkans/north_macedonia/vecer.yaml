name: Vecer.mk
country: north_macedonia
language: mk
base_url: https://vecer.mk

# Macedonian Вечер (vecer.mk) -- NOT the Slovenian Večer (vecer.com, language sl).
# robots.txt Sitemap: line points at a broken localhost URL and no sitemap.xml
# variant resolves, so listing falls back to the site's RSS feed at /feed
# (Next.js "feed" package, ~20 most-recent items, updated continuously).
# Feed <description> is a truncated excerpt, not the full body, so the article
# page is fetched for body text: <article class="prose ..."><div id="content">
# holds the paragraphs. article:published_time meta is set on article pages.
listing:
  type: rss
  feed_urls:
    - "https://vecer.mk/feed"

client: http
concurrency: 3
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "item"
    url: "link::text"
    title: "title::text"
    date: "pubDate::text"
  article:
    body: "article.prose p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
