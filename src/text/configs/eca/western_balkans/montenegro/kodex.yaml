name: Kodex
language: me
country: montenegro
base_url: https://kodex.me
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: https://kodex.me/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title
  json_paths:
    url: link
    title: title.rendered
    date: date
client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0
headers:
  User-Agent: Googlebot/2.1 (+http://www.google.com/bot.html)
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  Accept-Language: sr-Latn,sr;q=0.9,en;q=0.8
selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: article p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
