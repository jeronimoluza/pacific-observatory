# Unusable with current pipeline strategies for historical collection.
# Reason: Cloudflare challenge on regular UAs (HTTP 403). Googlebot UA gets
# HTTP 200, but pagination (/page/N/, ?paged=N) is fake — all pages return the
# same ~73 articles. No working WP API (/wp-json 404). No sitemap exposed.
# Only homepage articles are discoverable, which is insufficient for historical
# bulk collection.
name: Dan
language: me
country: montenegro
base_url: https://www.dan.co.me
listing:
  type: pagination
  start_url: https://www.dan.co.me/
  url_template: https://www.dan.co.me/page/{num}/
  start_page: 2
  batch_size: 5
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
headers:
  User-Agent: Googlebot/2.1 (+http://www.google.com/bot.html)
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
  Accept-Language: sr-ME,sr;q=0.9,en;q=0.8
selectors:
  thumbnail:
    container: article
    title: h2 a::text
    url: h2 a::attr(href)
  article:
    body: div.entry-content p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
