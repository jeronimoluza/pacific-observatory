# Unusable with current pipeline strategies.
# Reason: Next.js SPA — homepage HTML is an empty shell with only JS bundle
# references and _next/static asset links; no article content or links rendered
# server-side. Would need a browser client or discovery of the underlying API.
name: Insajder
language: sr
country: serbia
base_url: https://insajder.net
listing:
  type: pagination
  start_url: https://insajder.net/
  url_template: https://insajder.net/page/{num}
  start_page: 2
  batch_size: 5
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: article
    title: h2 a::text
    url: h2 a::attr(href)
  article:
    body: article p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
