# Unusable with current pipeline strategies.
# Reason: No article:published_time meta tag, no time[datetime] attribute; the
# only dates are inside JSON-LD (datePublished) or as text like "22. april 2026"
# in .single-news-date. handle_mixed_dates has no "%d. %B %Y" pattern and only
# the Serbian month "april" would match English %B anyway (mart/maj/jun/jul/
# avgust/septembar/oktobar/novembar/decembar all fail). Needs custom cleaner.
name: NIN
language: sr
country: serbia
base_url: https://www.nin.rs
listing:
  type: pagination
  start_url: https://www.nin.rs/politika/vesti
  url_template: https://www.nin.rs/politika/vesti?page={num}
  start_page: 2
  batch_size: 5
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: article.news-item
    title: h3.news-item-title::text
    url: h3.news-item-title a::attr(href)
  article:
    body: main article p
    date: .single-news-date::text
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
