# Unusable with current pipeline strategies.
# Reason: Cloudflare challenge ("Just a moment...") on both homepage and
# wp-json endpoints — httpx receives 403 challenge HTML, not site content.
name: Pescanik
language: sr
country: serbia
base_url: https://pescanik.net
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: https://pescanik.net/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title
  json_paths:
    url: link
    title: title.rendered
    date: date
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: div.entry-content p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
