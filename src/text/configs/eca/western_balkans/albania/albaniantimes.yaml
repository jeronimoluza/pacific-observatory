name: The Albanian Times
country: albania
language: en

# Content verified English-language (per-source override; most Albania
# sources use sq, but this outlet's actual articles are in English).
base_url: https://albaniantimes.al

# Categories: Politics(3), Albania(4), Economy(9)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://albaniantimes.al/wp-json/wp/v2/posts?per_page=100&page={page}&categories=3,4,9&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.right-side__text p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
