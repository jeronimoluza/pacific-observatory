# Unusable with current pipeline strategies.
# Reason: Single-page app — homepage returns ~3.5MB but only 3 actual anchors
# after parsing; all article links rendered client-side. No working pagination.
# Would require browser client with JS execution.
name: TV Klan
language: sq
country: albania
base_url: https://tvklan.al
listing:
  type: pagination
  start_url: https://tvklan.al/lajme
  url_template: https://tvklan.al/lajme/page/{num}/
  start_page: 2
  batch_size: 5
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: article
    title: h2 a::text
    url: h2 a::attr(href)
  article:
    body: div.entry-content p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
