# Unusable with current pipeline strategies.
# Reason: Cloudflare challenge blocks curl/httpx access (403 on homepage).
# Needs browser client; posts endpoint also returns 404 — no API fallback.
name: Gazeta Tema
language: sq
country: albania
base_url: https://gazetatema.net
listing:
  type: pagination
  start_url: https://gazetatema.net/
  url_template: https://gazetatema.net/page/{num}/
  start_page: 2
  batch_size: 5
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: article
    title: h2 a::text
    url: h2 a::attr(href)
  article:
    body: div.entry-content p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
