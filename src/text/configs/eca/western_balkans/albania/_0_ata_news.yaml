# Unusable with current pipeline strategies.
# Reason: Albanian Telegraphic Agency has WP API (264k posts) but all article
# pages return Cloudflare "Just a moment..." challenge (403) to httpx.
# Would need browser client to fetch article bodies.
name: Albanian Telegraphic Agency
language: sq
country: albania
base_url: https://ata.gov.al
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: https://ata.gov.al/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title
  json_paths:
    url: link
    title: title.rendered
    date: date
client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0
selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: div.entry-content p
    date: meta[property='article:published_time']::attr(content)
cleaning:
  date: handle_mixed_dates
max_pages: null
max_articles: null
stop_date: '2025-12-01'
