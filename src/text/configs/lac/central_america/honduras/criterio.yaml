name: Criterio.hn
country: honduras
language: es
base_url: https://criterio.hn

# Categories: Opinión(125), Política y Democracia(12743), Datos(13830)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://criterio.hn/wp-json/wp/v2/posts?per_page=100&page={page}&categories=125,12743,13830&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".elementor-widget-theme-post-content p"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
