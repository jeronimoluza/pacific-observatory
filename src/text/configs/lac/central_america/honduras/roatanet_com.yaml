name: Roatanet
language: es
country: honduras
base_url: https://roatanet.com

# Categories: activity-news(63, 75), honduras-news(65, 69), diving-news(62, 55), hotel-news(61, 47), real-estate-news(64, 38)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://roatanet.com/wp-json/wp/v2/posts?per_page=100&categories=63,65,62,61,64&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
