name: Tnh
enabled: false
disabled_reason: "source-health 2026-10-17: not_found on https://tnh.gob.hn/wp-json/wp/v2/posts?per_page=100&categories=105,1&page=1&_fields=id,date,link,title,excerpt,content (HTTP 410; ?rest_route= variant redirect_moved); failing since 2026-10-16T22:54:01Z, probes 2026-10-16T22:54:01Z, 2026-10-16T23:34:25Z, 2026-10-17T05:04:20Z. Homepage still answers 200 (2026-10-17): the outlet lives, its listing is gone; re-onboard with a new listing URL."
language: es
country: honduras
base_url: https://tnh.gob.hn

# Categories: nacionales(105, 357), gobierno(1, 164)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://tnh.gob.hn/wp-json/wp/v2/posts?per_page=100&categories=105,1&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
