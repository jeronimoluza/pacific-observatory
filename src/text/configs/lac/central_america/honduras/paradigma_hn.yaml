name: Paradigma
language: es
country: honduras
base_url: https://paradigma.hn

# Categories: nacionales(19, 17048), nacionales-2(9871, 3964), economia(15, 2868), politica(11, 1476), noticia(10, 20954)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://paradigma.hn/wp-json/wp/v2/posts?per_page=100&categories=19,9871,15,11,10&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
