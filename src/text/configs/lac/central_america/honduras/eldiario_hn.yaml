name: Eldiario
language: es
country: honduras
base_url: https://www.eldiario.hn

# Categories: nacionales(1193, 2649), noticias(1029, 30), actualidad(44, 7495), economia(1107, 384), politica(1106, 293)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.eldiario.hn/wp-json/wp/v2/posts?per_page=100&categories=1193,1029,44,1107,1106&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
