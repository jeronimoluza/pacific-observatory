name: Quepasa
language: es
country: guatemala
base_url: https://quepasa.gt

# Categories: real-estate(9625, 19), art-and-culture(4855, 12), latest-home(5329, 12)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://quepasa.gt/wp-json/wp/v2/posts?per_page=100&categories=9625,4855,5329&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
