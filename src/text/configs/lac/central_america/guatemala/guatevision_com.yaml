name: Guatevision
language: es
country: guatemala
base_url: https://www.guatevision.com

# Categories: nacionales(39733, 16152), forbes-nacionales(39741, 10), finanzas-personales(39734, 166), forbes-finanzas-personales(39770, 31)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.guatevision.com/wp-json/wp/v2/posts?per_page=100&categories=39733,39741,39734,39770&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
