name: Adiariocr
language: es
country: costa_rica
base_url: https://adiariocr.com

# Categories: nacionales(5, 1630), economia(6, 807), negocios(10, 792)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://adiariocr.com/wp-json/wp/v2/posts?per_page=100&categories=5,6,10&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
