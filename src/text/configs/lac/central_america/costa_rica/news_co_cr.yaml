name: News
language: es
country: costa_rica
base_url: http://www.news.co.cr

# Categories: costa-rica(995, 6474), costa_rica_legal_lawyers_attorneys_news(1253, 265), costa-rica-news(1277, 208), business(267, 2140), economy-costa-rica(1205, 713)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.news.co.cr/wp-json/wp/v2/posts?per_page=100&categories=995,1253,1277,267,1205&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
