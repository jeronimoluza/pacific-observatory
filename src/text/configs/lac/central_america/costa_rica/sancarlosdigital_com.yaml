name: Sancarlosdigital
language: es
country: costa_rica
base_url: https://sancarlosdigital.com

# Categories: nacionales(6, 1521), noticias(87, 6740), politica(37, 424), actualidad(5341, 1040), gobierno(1301, 29)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://sancarlosdigital.com/wp-json/wp/v2/posts?per_page=100&categories=6,87,37,5341,1301&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
