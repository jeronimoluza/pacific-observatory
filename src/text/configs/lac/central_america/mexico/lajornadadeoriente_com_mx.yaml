name: Lajornadadeoriente
language: es
country: mexico
base_url: https://www.lajornadadeoriente.com.mx

# Categories: el_pais(26581, 242), articulistas_nacional(26547, 1298), editorial_nacional(26587, 299), dinero_nacional(26566, 198), astillero_nacional(26545, 189)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.lajornadadeoriente.com.mx/wp-json/wp/v2/posts?per_page=100&categories=26581,26547,26587,26566,26545&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
