name: Elnoticieroenlinea
language: es
country: mexico
base_url: https://www.elnoticieroenlinea.com

# Categories: comunidad-portuaria(167, 722), noticias-mexico(7861, 666), noticias-colima(2, 588), noticias-seguridad(4, 421), noticias-tendencias(133, 353)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.elnoticieroenlinea.com/wp-json/wp/v2/posts?per_page=100&categories=167,7861,2,4,133&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
