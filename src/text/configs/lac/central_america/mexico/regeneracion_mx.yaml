name: Regeneracion
language: es
country: mexico
base_url: https://www.regeneracion.mx

# Categories: politicamx(16, 16542), trabajo-economia(26, 1397), economia(90674, 662), politica-exterior(90933, 251), principal(93186, 8268)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.regeneracion.mx/wp-json/wp/v2/posts?per_page=100&categories=16,26,90674,90933,93186&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
