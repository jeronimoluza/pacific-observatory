name: Lavozdemichoacan
language: es
country: mexico
base_url: https://www.lavozdemichoacan.com.mx

# Categories: violencia-de-genero-pais(39664, 152), narcoviolencia-pais(39663, 145), diplomacia-pais(37064, 136), victimas-pais(39254, 135), emergencia-pais(34331, 114)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.lavozdemichoacan.com.mx/wp-json/wp/v2/posts?per_page=100&categories=39664,39663,37064,39254,34331&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
