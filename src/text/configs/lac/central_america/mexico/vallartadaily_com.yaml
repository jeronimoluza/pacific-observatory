name: Vallartadaily
language: es
country: mexico
base_url: http://www.vallartadaily.com

# Categories: puerto-vallarta-news(10, 5047), mexico-news(2, 3729), almost-news(3102, 11)
# 2026-10-16 (panel 20261016T0917Z): article pages are paywalled (pfa-content-preview, 2 p); new posts come whole from the API prefetch, so the 18k HTML backlog only burns the cap
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.vallartadaily.com/wp-json/wp/v2/posts?per_page=100&categories=10,2,3102&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: 0
