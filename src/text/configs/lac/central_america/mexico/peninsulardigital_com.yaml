name: Peninsulardigital
language: es
country: mexico
base_url: http://www.peninsulardigital.com

# Categories: nacional(6, 5391), joel-macias(13490, 115), empresas-economia-finanzas(71, 79), economia-finanzas(32, 160), politica(13637, 145)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.peninsulardigital.com/wp-json/wp/v2/posts?per_page=100&categories=6,13490,71,32,13637&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
