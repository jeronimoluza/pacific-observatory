name: El Independiente SV
country: el_salvador
language: es
base_url: https://www.elindependiente.sv

# Categories: Destacadas(4), Entorno(5), Opinión(7)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.elindependiente.sv/wp-json/wp/v2/posts?per_page=100&page={page}&categories=4,5,7&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
