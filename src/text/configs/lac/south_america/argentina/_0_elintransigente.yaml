name: El Intransigente (DISABLED)
country: argentina
language: es
base_url: https://elintransigente.com

# DISABLED: WordPress REST API responds but returns
# {"code":"rest_login_required","message":"REST API restricted to authenticated users."}
# Site appears to require login for REST access. Body is paywalled or auth-gated.
# Re-enable only if API auth is removed or after providing a logged-in cookie.
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://elintransigente.com/wp-json/wp/v2/posts?per_page=100&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
