name: Bichos de Campo
country: argentina
language: es
base_url: https://bichosdecampo.com

# Categories: Notas(55), Actualidad(19950), Empresas(19954), Mercados(19953)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://bichosdecampo.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=55,19950,19954,19953&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
