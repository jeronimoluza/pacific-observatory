name: Economiaparatodos
language: es
country: argentina
base_url: http://economiaparatodos.net

# Categories: politica-nacional(17, 698), noticias(5844, 106), economia(9, 482), politica(6408, 91), finanzas(51, 97)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://economiaparatodos.net/wp-json/wp/v2/posts?per_page=100&categories=17,5844,9,6408,51&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
