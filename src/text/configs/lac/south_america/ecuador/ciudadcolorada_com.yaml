name: Ciudadcolorada
language: es
country: ecuador
base_url: https://www.ciudadcolorada.com

# Categories: nacional(50, 1665), noticias(33, 168), politica(122, 888), economia(545, 341), actualidad(34, 109)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.ciudadcolorada.com/wp-json/wp/v2/posts?per_page=100&categories=50,33,122,545,34&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
