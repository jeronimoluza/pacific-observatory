name: Notiactual
language: es
country: venezuela_rb
base_url: http://www.notiactual.com

# Categories: nacionales(6, 2223), economia(318, 1276), noticias-de-estados-unidos(17036, 462), noticias-de-europa(17037, 253), negocios-y-empresas(7941, 295)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.notiactual.com/wp-json/wp/v2/posts?per_page=100&categories=6,318,17036,17037,7941&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
