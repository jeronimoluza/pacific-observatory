name: Runrun
language: es
country: venezuela_rb
base_url: https://runrun.es

# Categories: nacional(1012, 21925), noticias(36676, 62764)
# 2026-10-16 (panel 20261016T0917Z): 92 HTTP 503 and 9 s/article at concurrency 8, connect timeouts from a8 on 10-16; slowed and capped
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://runrun.es/wp-json/wp/v2/posts?per_page=100&categories=1012,36676&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 2
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: 100
