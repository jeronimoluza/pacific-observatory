name: Ciudadvalencia
language: es
country: venezuela_rb
base_url: https://www.ciudadvalencia.com.ve

# Categories: noticias-relevantes(150479, 1635), politica(61, 11955), economia(62, 4218), el-arte-de-la-politica(152971, 26), principal(8, 16443)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.ciudadvalencia.com.ve/wp-json/wp/v2/posts?per_page=100&categories=150479,61,62,152971,8&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
