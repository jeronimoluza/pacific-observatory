name: Analitica
language: es
country: venezuela_rb
base_url: http://www.analitica.com

# Categories: especial-pais(59415, 1882), constructores-pais(89114, 81), actualidad-nacional(8, 53652), economia(9, 21771), politica(85322, 3537)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.analitica.com/wp-json/wp/v2/posts?per_page=100&categories=59415,89114,8,9,85322&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
