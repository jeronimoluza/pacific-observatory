name: Versionfinal
language: es
country: venezuela_rb
base_url: http://www.versionfinal.com.ve

# Categories: nacionales(98563, 33), politica-dinero(107, 75981), politica(53646, 253), negocios(68400, 199), economia(61777, 46)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.versionfinal.com.ve/wp-json/wp/v2/posts?per_page=100&categories=98563,107,53646,68400,61777&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
