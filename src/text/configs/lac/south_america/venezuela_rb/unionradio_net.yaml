name: Unionradio
language: es
country: venezuela_rb
base_url: http://www.unionradio.net

# Categories: pais(21, 23324), nacional-baseball(270, 1145), pais-18(11469, 667), finanzas-y-negocios(522, 646), economia(75, 3417)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.unionradio.net/wp-json/wp/v2/posts?per_page=100&categories=21,270,11469,522,75&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
