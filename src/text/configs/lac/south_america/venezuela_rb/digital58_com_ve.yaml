name: Digital58
language: es
country: venezuela_rb
base_url: https://digital58.com.ve

# Categories: talento_nacional(5414, 612), politica(8610, 1130), economia(14499, 978)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://digital58.com.ve/?rest_route=/wp/v2/posts&per_page=100&categories=5414,8610,14499&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
