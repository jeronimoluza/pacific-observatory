name: Diariolavoz
language: es
country: venezuela_rb
base_url: https://diariolavoz.net

# Categories: nacionales(4, 32036), politica(3, 22536), economia(64, 5546), actualidad(199, 3462), titulares(394, 993)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://diariolavoz.net/wp-json/wp/v2/posts?per_page=100&categories=4,3,64,199,394&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
