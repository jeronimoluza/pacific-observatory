name: Minuto30
country: colombia
language: es
base_url: https://www.minuto30.com

# Categories: Colombia(56010), Economía negocios y finanzas(807817), Ciudad(2059)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.minuto30.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=56010,807817,2059&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
