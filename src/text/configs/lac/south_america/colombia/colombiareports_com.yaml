name: Colombiareports
language: es
country: colombia
base_url: http://colombiareports.com

# Categories: news(46, 17319), colombia-news-lite(248, 1108), colombia-news(276, 44), corporate-news(307, 33), economy(34, 2765)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://colombiareports.com/wp-json/wp/v2/posts?per_page=100&categories=46,248,276,307,34&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
