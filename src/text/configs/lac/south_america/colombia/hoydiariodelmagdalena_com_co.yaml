name: Hoydiariodelmagdalena
language: es
country: colombia
base_url: http://www.hoydiariodelmagdalena.com.co

# Categories: judicial-nacional(32030, 17133), noticias-santamarta(245, 27772), politica(248, 15379), economia(337, 3486), disputa-politica-ee-uu-petro(130563, 69)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.hoydiariodelmagdalena.com.co/wp-json/wp/v2/posts?per_page=100&categories=32030,245,248,337,130563&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
