name: Diariodelcauca
language: es
country: colombia
base_url: https://diariodelcauca.com.co

# Categories: nacional(36110, 17023), noticias(18043, 49480), politica(36109, 8524), economia(36102, 8347), publicidad-politica(78859, 13)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://diariodelcauca.com.co/wp-json/wp/v2/posts?per_page=100&categories=36110,18043,36109,36102,78859&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
