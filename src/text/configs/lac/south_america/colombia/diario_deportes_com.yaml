name: Diario Deportes
enabled: false
disabled_reason: "source-health 2026-10-17: dns_dead on http://www.diario-deportes.com/wp-json/wp/v2/posts?per_page=100&categories=1&page=1&_fields=id,date,link,title,excerpt,content (no DNS record for www.diario-deportes.com); failing since 2026-10-16T22:33:37Z, probes 2026-10-16T22:33:37Z, 2026-10-16T23:29:59Z, 2026-10-17T05:00:46Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
language: es
country: colombia
base_url: http://www.diario-deportes.com

# Categories: noticias(1, 48914)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.diario-deportes.com/wp-json/wp/v2/posts?per_page=100&categories=1&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
