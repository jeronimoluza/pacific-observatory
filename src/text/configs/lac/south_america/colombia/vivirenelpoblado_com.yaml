name: Vivirenelpoblado
language: es
country: colombia
base_url: https://vivirenelpoblado.com

# Categories: noticias-del-barrio-el-poblado(20052, 965), despensa-de-noticias(38, 714), noticias-de-envigado(48423, 705), finanzas-personales-invertir-y-aprovechar-mejor-su-dinero(97007, 19)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://vivirenelpoblado.com/wp-json/wp/v2/posts?per_page=100&categories=20052,38,48423,97007&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
