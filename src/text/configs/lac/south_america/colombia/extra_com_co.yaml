name: Extra
language: es
country: colombia
base_url: https://extra.com.co

# Categories: nacional(193774, 30428), noticias(1, 94120), politica-6(193790, 17458), economia-7(193791, 11225), publicidad-politica(261946, 25)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://extra.com.co/wp-json/wp/v2/posts?per_page=100&categories=193774,1,193790,193791,261946&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
