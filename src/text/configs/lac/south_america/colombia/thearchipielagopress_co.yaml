name: Thearchipielagopress
language: es
country: colombia
base_url: https://www.thearchipielagopress.co

# Categories: nacional(103, 1216), politica(25, 2671), economia(91, 144), actualidad(24, 7327)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.thearchipielagopress.co/wp-json/wp/v2/posts?per_page=100&categories=103,25,91,24&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
