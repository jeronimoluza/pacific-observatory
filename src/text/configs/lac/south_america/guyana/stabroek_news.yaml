name: Stabroek News
language: en
country: guyana
base_url: https://www.stabroeknews.com

listing:
  type: pagination
  url_template: "https://www.stabroeknews.com/news/guyana/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article"
    title: "header h2 a::text"
    url: "header h2 a::attr(href)"
  article:
    body: "article p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
