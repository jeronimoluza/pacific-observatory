name: Jornada
language: es
country: peru
base_url: https://jornada.com.pe

# Categories: nacional(21, 1505), policial-nacional(25, 855), electoral-nacional(19406, 285), politica-regional(26, 2293), politica-r(10773, 341)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://jornada.com.pe/wp-json/wp/v2/posts?per_page=100&categories=21,25,19406,26,10773&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
