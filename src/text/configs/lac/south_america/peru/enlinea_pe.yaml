name: Enlinea
language: es
country: peru
base_url: https://enlinea.pe

# Categories: nacional(14589, 1948), noticias(15734, 12682), politica(14569, 3796), negocios(14597, 1848), economia(14577, 422)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://enlinea.pe/wp-json/wp/v2/posts?per_page=100&categories=14589,15734,14569,14597,14577&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.1
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
