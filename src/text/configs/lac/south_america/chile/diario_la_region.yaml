name: Diario La Región
country: chile
language: es
base_url: https://www.diariolaregion.cl

# Categories: Política(21), Nacional(22), Economía(383), Internacional(24)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.diariolaregion.cl/wp-json/wp/v2/posts?per_page=100&page={page}&categories=21,22,383,24&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
