name: El Clarín de Chile
country: chile
language: es
base_url: https://www.elclarin.cl

# Categories: Chile al Día(23), Poder y Política(24), Economía y Mercados(25), Trabajo(35), Política Global(29)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.elclarin.cl/wp-json/wp/v2/posts?per_page=100&page={page}&categories=23,24,25,35,29&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
