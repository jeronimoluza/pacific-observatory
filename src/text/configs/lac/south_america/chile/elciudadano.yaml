name: El Ciudadano
country: chile
language: es
base_url: https://www.elciudadano.com

# Categories: Chile(42), Política(8), Justicia(5), Economía(7) — limit to Chile-relevant only
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.elciudadano.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=42,8,5,7&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
