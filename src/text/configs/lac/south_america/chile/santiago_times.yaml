name: Santiago Times
country: chile
language: en
base_url: https://santiagotimes.com

# Categories: National(186), Business(4), Politics(115), World(118), Latin America(1)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://santiagotimes.com/wp-json/wp/v2/posts?per_page=100&page={page}&categories=186,4,115,118,1&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
