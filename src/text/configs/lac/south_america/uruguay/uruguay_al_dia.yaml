name: Uruguay al Día
country: uruguay
language: es
base_url: https://uruguayaldia.com.uy

# Categories: Nacionales(11), Política(64), Economía y agro(75)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://uruguayaldia.com.uy/wp-json/wp/v2/posts?per_page=100&page={page}&categories=11,64,75&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "div.jl_sp_con p"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
