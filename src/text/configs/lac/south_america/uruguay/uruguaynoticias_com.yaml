name: Uruguaynoticias
language: es
country: uruguay
base_url: https://uruguaynoticias.com

# Categories: noticias-en-uruguay-de-politica(21, 164), noticias-en-uruguay-de-economia(2, 39), noticias-en-uruguay-de-sociedad(20, 141), noticias-en-uruguay-de-organismos(31, 85), noticias-locales-de-uruguay(32, 63)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://uruguaynoticias.com/wp-json/wp/v2/posts?per_page=100&categories=21,2,20,31,32&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
