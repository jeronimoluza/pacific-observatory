name: Avisador
language: es
country: uruguay
base_url: http://www.avisador.com.uy

# Categories: nacionales(99, 2151), otras-noticias(141, 862), politica(119, 1025), economia(146, 86), actualidad(77, 1778)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.avisador.com.uy/wp-json/wp/v2/posts?per_page=100&categories=99,141,119,146,77&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
