name: Grupormultimedio
language: es
country: uruguay
base_url: https://grupormultimedio.com

# Categories: nacionales(10, 15448), defensa-nacional(362, 74), politica(206, 439), economia(246, 157), gobierno(374, 295)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://grupormultimedio.com/wp-json/wp/v2/posts?per_page=100&categories=10,362,206,246,374&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
