name: Poder360
country: brazil
language: portuguese
base_url: https://www.poder360.com.br

# Categories: Governo(9), Brasil(1), Economia(13), Congresso(10), Justiça(11)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.poder360.com.br/wp-json/wp/v2/posts?per_page=100&page={page}&categories=9,1,13,10,11&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
