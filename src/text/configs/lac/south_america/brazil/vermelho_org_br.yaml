name: Vermelho
language: portuguese
country: brazil
base_url: http://vermelho.org.br

# Categories: nacional(5459, 50298), radio-vermelho-noticias(5477, 1004), politica(5461, 48797), economia(5464, 13623), noticia(5525, 76)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://vermelho.org.br/wp-json/wp/v2/posts?per_page=100&categories=5459,5477,5461,5464,5525&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
