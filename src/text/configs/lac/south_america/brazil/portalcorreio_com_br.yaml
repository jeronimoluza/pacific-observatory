name: Portalcorreio
language: portuguese
country: brazil
base_url: https://portalcorreio.com.br

# Categories: executivo-politica(30358, 2213), economia(30298, 2138), concursos-economia(30393, 1094), empregos-economia(30394, 749), empreendedorismo-economia(30382, 132)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://portalcorreio.com.br/wp-json/wp/v2/posts?per_page=100&categories=30358,30298,30393,30394,30382&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
