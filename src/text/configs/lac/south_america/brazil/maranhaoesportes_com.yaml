name: Maranhaoesportes
language: portuguese
country: brazil
base_url: https://www.maranhaoesportes.com

# Categories: plantao-de-noticias(6, 8674), sampaio(1690, 1840), imperatriz(1693, 565), moto-club(1691, 519), giro-de-noticias(35299, 497)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.maranhaoesportes.com/wp-json/wp/v2/posts?per_page=100&categories=6,1690,1693,1691,35299&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
