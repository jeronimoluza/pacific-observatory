name: Brasilemfolhas
language: portuguese
country: brazil
base_url: https://www.brasilemfolhas.com.br

# Categories: ultimas-noticias(11, 247587), politica(7, 57628), economia(4, 40054), agronegocio(2554, 538)
# 2026-10-16 (panel 20261016T0917Z): ~450 posts/day and a 08-11 watermark: the API walk (74 pages in 300s) never finished, and discovery keeps nothing when killed
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.brasilemfolhas.com.br/wp-json/wp/v2/posts?per_page=100&categories=11,7,4,2554&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: 30
max_articles: null
