name: Diário do Centro do Mundo
country: brazil
language: portuguese
base_url: https://www.diariodocentrodomundo.com.br

# Categories: Política(1179), Brasil(165), Economia(1436), Análise(22745)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.diariodocentrodomundo.com.br/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1179,165,1436,22745&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: "filler"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
