name: Itamarajunoticias
language: portuguese
country: brazil
base_url: https://itamarajunoticias.com.br

# Categories: politica-nacional(65, 10), noticias(161, 1537), politica(164, 2622), economia(67, 2953)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://itamarajunoticias.com.br/wp-json/wp/v2/posts?per_page=100&categories=65,161,164,67&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
