name: La Epoca
language: es
country: bolivia
base_url: https://www.la-epoca.com.bo

# Categories: nacionales(20, 17894), politica-nacional(23, 2120), economia(11, 2073), geopolitica(15, 389), economia-mundial(1507, 349)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.la-epoca.com.bo/wp-json/wp/v2/posts?per_page=100&categories=20,23,11,15,1507&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
