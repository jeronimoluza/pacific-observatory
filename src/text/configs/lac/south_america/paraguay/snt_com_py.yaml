name: Snt
language: es
country: paraguay
base_url: https://www.snt.com.py

# Categories: nacional(16, 24088), noticias(12088, 1274), politica(15, 416), actualidad(3, 71081)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.snt.com.py/wp-json/wp/v2/posts?per_page=100&categories=16,12088,15,3&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
