name: Caymanian Times
country: cayman_islands
language: en
base_url: https://www.caymaniantimes.ky

listing:
  type: pagination
  url_template: "https://www.caymaniantimes.ky/news?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: ".news-l-info"
    title: "h2 a::text"
    url: "h2 a::attr(href)"
  article:
    body: ".ds_content p"
    date: ".news_attribute .date"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: 50
max_articles: null
