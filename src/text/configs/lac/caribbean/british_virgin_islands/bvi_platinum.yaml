name: BVI Platinum News
country: british_virgin_islands
language: en
base_url: https://www.bviplatinum.com

# Custom Bootstrap CMS; article cards: article.vipn-cardnews; pagination: ?page=N
listing:
  type: pagination
  url_template: "https://www.bviplatinum.com/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "article.vipn-cardnews"
    title: "h3 a::text"
    url: "h3 a::attr(href)"
  article:
    body: "div.article-content"
    date: "div.small.vipn-muted::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
