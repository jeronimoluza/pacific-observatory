name: Virgin Islands News Online
country: british_virgin_islands
language: en
base_url: https://www.virginislandsnewsonline.com

# DEFERRED: Custom CMS with ordinal date format (Jan 2nd, 2026) that fails parse.
# Body and thumbnail selectors work. Needs custom date cleaner for "Jan. 26, 2025" / "May 2nd, 2026" pattern.
# Custom CMS; article cards: div.post; pagination: /en/news/page/N
listing:
  type: pagination
  url_template: "https://www.virginislandsnewsonline.com/en/news/page/{num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.post"
    title: "h2 a.title::text"
    url: "h2 a.title::attr(href)"
  article:
    body: "p"
    date: "div#meta_tags::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
