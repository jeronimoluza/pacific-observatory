name: Cubaheute
language: es
country: cuba
base_url: https://cubaheute.de

# Categories: auslaendische-investitonen(35, 135), aussenhandel(33, 133), land-und-leute(7, 106)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://cubaheute.de/wp-json/wp/v2/posts?per_page=100&categories=35,33,7&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
