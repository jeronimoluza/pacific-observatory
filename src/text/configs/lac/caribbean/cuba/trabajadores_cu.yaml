name: Trabajadores
language: es
country: cuba
base_url: http://www.trabajadores.cu

# Categories: serie-nacional-de-beisbol(103, 163), noticias-barranquilla-2018(24032, 113), economia(9, 928), politica(17184, 183), noticia-principal-lima(30641, 50)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.trabajadores.cu/wp-json/wp/v2/posts?per_page=100&categories=103,24032,9,17184,30641&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
