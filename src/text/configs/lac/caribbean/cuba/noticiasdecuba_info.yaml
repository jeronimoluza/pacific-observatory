name: Noticiasdecuba
enabled: false
disabled_reason: "source-health 2026-10-17: hijacked on https://www.noticiasdecuba.info/wp-json/wp/v2/posts?per_page=100&categories=6,2&page=1&_fields=id,date,link,title,excerpt,content (redirects to a parked/suspended page https://expireddomains.com/domain/noticiasdecuba.info?utm_source=redi); failing since 2026-10-16T22:40:45Z, probes 2026-10-16T22:40:45Z, 2026-10-16T23:31:29Z, 2026-10-17T05:02:02Z. Re-enable when the URL answers (`po text source-health --source <key>`)."
language: es
country: cuba
base_url: https://www.noticiasdecuba.info

# Categories: economia(6, 25), actualidad(2, 66)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.noticiasdecuba.info/wp-json/wp/v2/posts?per_page=100&categories=6,2&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
