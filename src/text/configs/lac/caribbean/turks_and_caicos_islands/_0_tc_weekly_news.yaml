name: Turks and Caicos Weekly News
country: turks_and_caicos_islands
language: en
base_url: https://tcweeklynews.com

# DEFERRED - Tier 2: bulletlink.com CMS with Cloudflare anti-bot protection.
# Content is JavaScript-rendered via app_server.php; direct HTTP scraping blocked.
# Requires headless browser (Playwright/Selenium) to bypass JS rendering + Cloudflare challenge.
# Same CMS platform as suntci.com.

listing:
  type: pagination
  url_template: "https://tcweeklynews.com/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

