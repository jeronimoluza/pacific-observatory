name: Cnc3
language: en
country: trinidad_and_tobago
base_url: https://www.cnc3.co.tt

# Categories: news(5, 58459), 7-pm-news(86, 2505), business(7, 2758)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.cnc3.co.tt/?rest_route=/wp/v2/posts&per_page=100&categories=5,86,7&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
