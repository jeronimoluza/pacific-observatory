name: Antilliaans Dagblad
country: curacao
language: nl
base_url: https://antilliaansdagblad.com

# Dutch-language daily (founded 1946); Tier 2 — Blazor SPA with GUID-based article URLs
# No WP API; article pages: /article/<guid>; listing: /articlesearch (SPA, requires JS)
# Deferred: needs custom Blazor/API reverse-engineering to fetch article list
listing:
  type: pagination
  url_template: "https://antilliaansdagblad.com/articlesearch?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "STUB"
    title: "STUB"
    url: "STUB"
  article:
    body: "STUB"
    date: "STUB"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
