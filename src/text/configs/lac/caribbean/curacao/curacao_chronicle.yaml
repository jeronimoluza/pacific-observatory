name: Curacao Chronicle
country: curacao
language: en
base_url: https://www.curacaochronicle.com

# English-language daily; Tier 1 — custom CMS with ?page=N pagination
# Container: div.post, date on article page in #post-cat-author-date (format: "Month DD, YYYY")
listing:
  type: pagination
  url_template: "https://www.curacaochronicle.com/category/main-news/?page={num}"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.post"
    title: "div.info h4.title a::text"
    url: "div.info h4.title a::attr(href)"
  article:
    body: "article p"
    date: "#post-cat-author-date"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: null
max_articles: null
