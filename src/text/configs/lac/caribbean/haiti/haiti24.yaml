name: Haiti 24
country: haiti
language: fr
base_url: https://haiti24.net

# Categories: Securite(38), Politique(28), Social(29), Economie(37), Justice(46)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://haiti24.net/wp-json/wp/v2/posts?per_page=100&page={page}&categories=38,28,29,37,46&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
