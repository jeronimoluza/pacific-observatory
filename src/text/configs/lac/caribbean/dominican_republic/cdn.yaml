name: CDN Dominicana
country: dominican_republic
language: es
base_url: https://www.cdn.com.do

# Categories: Nacionales(1000025), Noticias(1000032), Destacados(1000033), Regionales(1000024)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://www.cdn.com.do/wp-json/wp/v2/posts?per_page=100&page={page}&categories=1000025,1000032,1000033,1000024&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: "link"
    title: "title.rendered"
    date: "date"
    body: "content.rendered"

client: http
concurrency: 5
rate_limit: 0.3
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "filler"
    title: "filler"
    url: "filler"
  article:
    body: ".entry-content p"

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
