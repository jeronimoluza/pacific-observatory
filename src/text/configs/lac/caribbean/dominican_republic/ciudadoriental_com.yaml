name: Ciudadoriental
language: es
country: dominican_republic
base_url: https://ciudadoriental.com

# Categories: nacionales(8, 2407), breves(609, 154), politica(14, 4528), economia(3, 1885)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "https://ciudadoriental.com/wp-json/wp/v2/posts?per_page=100&categories=8,609,14,3&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
