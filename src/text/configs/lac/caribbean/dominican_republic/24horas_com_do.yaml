listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.24horas.com.do/wp-json/wp/v2/posts?per_page=100&categories=2,10,5,1,6&page={page}&_fields=id,date,link,title,excerpt,content"
