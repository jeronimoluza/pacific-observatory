name: Antigua News Room
country: antigua_and_barbuda
language: en
base_url: https://antiguanewsroom.com

# Category: Local News — /category/news/
listing:
  type: pagination
  url_template: "https://antiguanewsroom.com/category/news/page/{num}/"
  start_page: 1
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "div.td_module_wrap"
    title: "h3.entry-title a::text"
    url: "h3.entry-title a::attr(href)"
  article:
    body: ".td-post-content p"
    date: "meta[property='article:published_time']::attr(content)"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: 50
max_articles: null
