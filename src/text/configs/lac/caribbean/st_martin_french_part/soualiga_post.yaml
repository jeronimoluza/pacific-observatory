name: Soualiga Post
country: st_martin_french_part
language: fr
base_url: https://www.soualigapost.com

# Categories: Politique + Economie (national news, Drupal taxonomy pages)
# Drupal 7 CMS — no WP API. Category URL: /fr/actualite/politique?page=N (0-based)
listing:
  type: pagination
  url_template: "https://www.soualigapost.com/fr/actualite/politique?page={num}"
  start_page: 0
  step: 1

client: http
concurrency: 3
rate_limit: 1.0
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: "li.views-row"
    title: "span.field-content a::text"
    url: "span.field-content a::attr(href)"
  article:
    body: "div.field-item.even p"
    date: "span.date-display-single::text"

cleaning:
  date: handle_mixed_dates
  url: clean_url

max_pages: 50
max_articles: null
