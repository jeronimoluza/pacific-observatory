name: Thestkittsnevisobserver
language: en
country: st_kitts_and_nevis
base_url: http://www.thestkittsnevisobserver.com

# Categories: local-news(46, 13829), breaking-news(58, 6942), newspaper-cover(43, 702), top-news-stories(37, 122), news-update(71, 63)
listing:
  type: api
  pagination_type: page
  page_start: 1
  page_step: 1
  url_template: "http://www.thestkittsnevisobserver.com/wp-json/wp/v2/posts?per_page=100&categories=46,58,43,37,71&page={page}&_fields=id,date,link,title,excerpt,content"
  json_paths:
    url: link
    title: title.rendered
    date: date
    body: content.rendered

client: http
concurrency: 5
rate_limit: 0.5
retries: 3
retry_seconds: 2.0

selectors:
  thumbnail:
    container: filler
    title: filler
    url: filler
  article:
    body: "div.entry-content p"
    date: meta[property='article:published_time']::attr(content)

cleaning:
  date: handle_mixed_dates
  body: clean_wp_html_body

max_pages: null
max_articles: null
