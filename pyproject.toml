[project]
name = "pacific-observatory"
version = "0.2.0"
description = "Modular data pipelines for the World Bank's Pacific Observatory"
authors = [
    {name = "Pacific Observatory"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "click (>=8.1.0,<9.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "numpy (>=1.18.5)",
    "pyarrow (>=23.0.1,<24.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pydantic (>=2.11.9,<3.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "lxml (>=6.0.1,<7.0.0)",
]

[project.scripts]
po = "cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = true
packages = [
    {include = "cli.py", from = "src"},
    {include = "core", from = "src"},
    {include = "text", from = "src"},
    {include = "fuel", from = "src"},
]

[dependency-groups]
scraping = [
    "httpx (>=0.27)",
    "selenium (>=4.35.0,<5.0.0)",
    "scrapy (>=2.13.4,<3.0.0)",
    "scrapy-playwright (>=0.0.45,<0.0.46)",
]
nlp = [
    "spacy (>=3.8.7,<4.0.0); python_version >= '3.11' and python_version < '3.13'",
    "gensim (>=4.3.3,<5.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "googletrans (>=4.0.2,<5.0.0)",
    "pyahocorasick (>=2.3.0,<3.0.0)",
]
fetching = [
    "openpyxl (>=3.1.5,<4.0.0)",
    "pdfplumber (>=0.11.0,<1.0.0)",
    "xlrd (>=2.0.0,<3.0.0)",
]
ancillary = [
    "sdmx1 (>=2.23.1,<3.0.0)",
    "thefuzz (>=0.22.1,<0.23.0)",
]
classification = [
    "google-generativeai (>=0.8.5,<0.9.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
]
plotting = [
    "matplotlib (>=3.10.6,<4.0.0)",
    "Pillow (>=11.0.0,<12.0.0)",
]
docs = [
    "docutils (==0.17.1)",
    "jupyter-book (==0.15.1)",
    "jupyter-cache (==0.5.0)",
]
testing = [
    "pytest (>=8.4.2,<9.0.0)",
    "anyio (>=4.11.0,<5.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-httpx (>=0.30.0,<0.31.0)",
    "pytest-cov (>=4.1.0,<5.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no network, no external dependencies)",
    "integration: Integration tests (may require network)",
    "slow: Tests that take more than 10 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "build", "dist", "docs"]
