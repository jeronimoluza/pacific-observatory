<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Small Dashboard</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --text: #1e2432;
            --muted: #667085;
            --accent: #1d77b2;
            --border: #e3e7ef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
        }
        .shell {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(30, 36, 50, 0.08);
            overflow: hidden;
        }
        .header {
            padding: 16px 18px 10px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .title { font-size: 1.1em; font-weight: 700; }
        .subtitle { color: var(--muted); font-size: 0.9em; }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tab {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab.is-active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .tab:hover { border-color: var(--accent); }
        .tab-panel { display: none; }
        .tab-panel.is-active { display: block; }
        .frame-wrap {
            height: 80vh;
            min-height: 520px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
        }
        .actions a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed transparent;
        }
        .actions a:hover { border-bottom-color: var(--accent); }
        @media (max-width: 760px) {
            .frame-wrap { height: 75vh; min-height: 420px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="header">
            <div>
                <div class="title">Small Dashboard</div>
                <div class="subtitle">Uncertainty topics and EPU views</div>
            </div>
            <div class="tabs" role="tablist">
                <button class="tab is-active" type="button" data-tab="tab-1">Uncertainty Topics</button>
                <button class="tab" type="button" data-tab="tab-2">Topics EPU</button>
                <button class="tab" type="button" data-tab="tab-3">Actors EPU</button>
            </div>
            <div class="actions">
                <a id="open-tab" href="topic_attribution_pic.html" target="_blank" rel="noopener">Open tab</a>
            </div>
        </div>
        <div class="tab-panel is-active" id="tab-1" data-src="topic_attribution_pic.html">
            <div class="frame-wrap"><iframe src="topic_attribution_pic.html" title="Uncertainty Topics"></iframe></div>
        </div>
        <div class="tab-panel" id="tab-2" data-src="epu_topics_pic.html">
            <div class="frame-wrap"><iframe src="epu_topics_pic.html" title="Topics EPU"></iframe></div>
        </div>
        <div class="tab-panel" id="tab-3" data-src="epu_actors_pic.html">
            <div class="frame-wrap"><iframe src="epu_actors_pic.html" title="Actors EPU"></iframe></div>
        </div>
    </div>
    <script>
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const panels = Array.from(document.querySelectorAll('.tab-panel'));
        const openLink = document.getElementById('open-tab');

        function setActiveTab(tabId) {
            tabs.forEach(t => t.classList.toggle('is-active', t.dataset.tab === tabId));
            panels.forEach(p => p.classList.toggle('is-active', p.id === tabId));
            const panel = document.getElementById(tabId);
            if (panel && openLink) {
                openLink.href = panel.dataset.src || '#';
            }
            if (window.localStorage) {
                window.localStorage.setItem('small-dashboard-tab', tabId);
            }
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => setActiveTab(tab.dataset.tab));
        });

        const saved = window.localStorage ? window.localStorage.getItem('small-dashboard-tab') : null;
        if (saved && document.getElementById(saved)) {
            setActiveTab(saved);
        }
    </script>
</body>
</html>
